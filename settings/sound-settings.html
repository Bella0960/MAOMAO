<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>音效设置</title>
<script src="../shared/js/native-feel.js"></script>
<script src="../shared/js/statusbar-control.js"></script>
<script src="../shared/js/sound-system.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        background-color: #E5E5E5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
        color: #111111;
        user-select: none;
    }
    .phone-mockup {
        position: relative;
        width: min(390px, calc(100vw - 24px));
        height: min(844px, calc(100vh - 24px));
        background-color: #FFFFFF;
        border-radius: 45px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        border: 1px solid rgba(0, 0, 0, 0.06);
        display: flex;
        flex-direction: column;
    }
    .status-bar {
        position: absolute;
        top: 0;
        width: 100%;
        padding: 14px 28px;
        font-size: 0.875rem;
        font-weight: 600;
        color: #000;
        z-index: 50;
        pointer-events: none;
    }
    .topbar {
        position: relative;
        display: flex;
        align-items: flex-end;
        gap: 14px;
        padding: calc(56px + env(safe-area-inset-top, 0px)) 22px 16px 22px;
    }
    .back-btn {
        width: 30px; height: 30px;
        border-radius: 50%;
        border: none;
        background: #F4F4F6;
        display: flex; align-items: center; justify-content: center;
        color: #111; text-decoration: none;
        flex-shrink: 0;
        transition: transform 0.2s ease, background 0.2s ease;
    }
    .back-btn:active { transform: scale(0.97); background: #B0B0B5; }
    .back-btn svg { width: 14px; height: 14px; }
    .topbar-title {
        flex: 1; text-align: left;
        font-size: 24px; font-weight: 800;
        letter-spacing: -0.3px; line-height: 1.1;
        color: #111;
    }
    .stage {
        flex: 1; overflow-y: auto;
        padding: 4px 16px 24px 16px;
        display: flex; flex-direction: column; gap: 12px;
        scrollbar-width: none;
    }
    .stage::-webkit-scrollbar { display: none; }
    .card {
        background: #F8F8FA;
        border-radius: 20px;
        padding: 14px 16px;
        flex-shrink: 0;
    }
    .card-label {
        display: block;
        font-size: 0.75rem;
        color: #8E8E93;
        font-weight: 500;
    }
    .event-title {
        font-size: 0.938rem;
        font-weight: 700;
        color: #111;
        margin-bottom: 10px;
    }
    .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .chip {
        padding: 7px 14px;
        border-radius: 999px;
        background: #FFFFFF;
        border: 0.5px solid #E5E5EA;
        font-size: 0.813rem;
        color: #666;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s ease;
    }
    .chip:active { transform: scale(0.96); }
    .chip.active {
        background: #111111;
        color: #FFFFFF;
        border-color: #111111;
        font-weight: 600;
    }
    .hint-line {
        margin-top: 12px;
        font-size: 0.75rem;
        color: #B0B0B5;
        line-height: 1.5;
    }
</style>
<link rel="stylesheet" href="../shared/css/mobile-fit.css">
</head>
<body>
    <div class="phone-mockup">
        <div class="status-bar"><span>09:41</span></div>

        <header class="topbar">
            <a class="back-btn" href="settings.html" aria-label="返回">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </a>
            <h1 class="topbar-title">Sound</h1>
        </header>

        <main class="stage">
            <section class="card">
                <div class="event-title">收消息</div>
                <div class="chip-row" data-event="receive"></div>
            </section>
            <section class="card">
                <div class="event-title">发消息</div>
                <div class="chip-row" data-event="send"></div>
            </section>
            <section class="card">
                <div class="event-title">推送通知</div>
                <div class="chip-row" data-event="push"></div>
            </section>
            <section class="card">
                <div class="event-title">语音消息</div>
                <div class="chip-row" data-event="voice"></div>
            </section>
            <section class="card">
                <div class="event-title">来电铃声</div>
                <div class="chip-row" data-event="call"></div>
            </section>
            <p class="hint-line">点击音效即可试听，选中自动保存。单独角色的音效可在该角色的对话设置中单独覆盖。</p>
        </main>
    </div>

<script>
    (function () {
        var cfg = SoundSystem.readConfig();
        var rows = document.querySelectorAll('.chip-row');

        Array.prototype.forEach.call(rows, function (row) {
            var event = row.getAttribute('data-event');
            Object.keys(SoundSystem.SOUNDS).forEach(function (key) {
                var btn = document.createElement('button');
                btn.className = 'chip' + (cfg[event] === key ? ' active' : '');
                btn.textContent = SoundSystem.SOUNDS[key];
                btn.setAttribute('data-key', key);
                btn.addEventListener('click', function () {
                    cfg[event] = key;
                    SoundSystem.saveConfig(cfg);
                    Array.prototype.forEach.call(row.querySelectorAll('.chip'), function (c) {
                        c.classList.toggle('active', c.getAttribute('data-key') === key);
                    });
                    SoundSystem.playKey(key);
                });
                row.appendChild(btn);
            });
        });
    })();
</script>
</body>
</html>
