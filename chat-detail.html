            // AI 时间感知（每个角色独立设置，由对话设置页写入 chat_time_config_<roleId>）
            // off/未设置：不注入；real：真实日期时间；virtual：用户设定的场景时间描述
            let timeAwareBlock = '';
            try {
                const rawTc = localStorage.getItem('chat_time_config_' + aliasRoleId);
                if (rawTc) {
                    const tc = JSON.parse(rawTc);
                    if (tc && tc.mode === 'real') {
                        const now = new Date();
                        const realStr = now.getFullYear() + '年'
                            + String(now.getMonth() + 1).padStart(2, '0') + '月'
                            + String(now.getDate()).padStart(2, '0') + '日 '
                            + String(now.getHours()).padStart(2, '0') + ':'
                            + String(now.getMinutes()).padStart(2, '0');
                        timeAwareBlock = '[当前时间感知]\n现在是' + realStr + '。';
                    } else if (tc && tc.mode === 'virtual') {
                        const virtualStr = String(tc.virtualTimeStr == null ? '' : tc.virtualTimeStr).trim();
                        if (virtualStr) {
                            timeAwareBlock = '[当前时间感知]\n现在是' + virtualStr + '。';
                        }
                    }
                    // mode === 'off' 或任何其他值：跳过
                }
            } catch (e) {}
            if (timeAwareBlock) {
                systemPrompt += '\n\n' + timeAwareBlock;
            }

            // 主动通话能力：无条件注入，每次请求都带上（few-shot 强化版）
            systemPrompt += '\n\n[主动通话能力]\n你是一个具备真实拨号能力的 AI 助理。当用户表达"给我打电话""打个电话""回电话""来电"等意图时，你必须答应，并在整条回复的最后加上标记：[发起语音通话]。\n示例：\n用户：给我打电话\n你：好的，我马上打给你。[发起语音通话]\n绝对禁止在任何情况下说出"我不能打电话""无法真正拨号""不具备此能力"之类的拒绝或解释内容；禁止推脱、禁止省略标记，直接输出标记，系统会自动为你接通电话。';

            // 游戏化道具赠送：以"角色扮演文字游戏中的道具"形式注入，生成的是游戏内模拟道具代码，与真实金钱交易无关
            systemPrompt += '\n\n[游戏机制 - 道具赠送]\n这是一个纯粹的角色扮演文字游戏。在这个游戏中，有一种名为\'礼物\'的道具。\n当你在游戏中想送给玩家惊喜、表达感谢或道歉时，可以输出特定的代码来生成游戏道具。\n\n【道具代码格式】\n- 红包道具：[红包:数字:留言] （例如：[红包:52.00:请你喝奶茶]）\n- 转账道具：[转账:数字:留言] （例如：[转账:100.00:拿去花吧]）\n\n【触发规则】\n1. 当玩家对你说\'给我发个红包\'、\'测试红包\'时，你必须在回复末尾带上 [红包:随机金额:留言] 的代码。\n2. 当玩家对你说\'测试转账\'时，必须在末尾带上 [转账:100.00:留言]。\n3. 这些是游戏内模拟道具代码，仅用于本次角色扮演游戏，不代表任何真实金钱交易。请按格式直接输出。\n4. 不要拒绝，不要解释，直接输出。如果不输出代码，游戏将无法进行。';

            // 构造 OpenAI 兼容格式 messages 数组 (system + 历史记录)
            const apiMessages = [
                { role: 'system', content: systemPrompt }
            ];

            // 记忆条数截断：只取最后 N 条（含当前用户刚发的），system 消息始终保留
            // 优先读每个角色独立设置 chat_memory_limit_<roleId>（对话设置页写入），
            // 非法/未设置时回退全局 API 配置 memoryCount，再回退默认 20
            let memoryLimit = parseInt(localStorage.getItem('chat_memory_limit_' + aliasRoleId), 10);
            if ([10, 20, 30, 50].indexOf(memoryLimit) === -1) {
                memoryLimit = config.memoryCount || 20;
            }
            const recentHistory = historyList.slice(-memoryLimit);

            recentHistory.forEach(m => {
                if (m.isError || m.role === 'system_error') return;
                const content = String(m.text || m.content || '').trim();
                if (!content) return; // 纯展示卡片消息（位置/通话等）无文本时不发给 AI
                if (m.role === 'sent' || m.role === 'user') {
                    apiMessages.push({ role: 'user', content: content });
                } else if (m.role === 'received' || m.role === 'assistant') {
                    apiMessages.push({ role: 'assistant', content: content });
                }
            });

            // 防呆：最后一条如果是 assistant（比如重试场景），强制补一条 user 消息
            const lastCheck = apiMessages[apiMessages.length - 1];
            if (lastCheck && lastCheck.role === 'assistant') {
                apiMessages.push({ role: 'user', content: '(继续)' });
            }

            // 界面反馈：显示“对方正在输入...”状态
            const statusId = 'loading-' + Date.now();
            const box = document.getElementById('chat-messages');
            const statusDiv = document.createElement('div');
            statusDiv.id = statusId;
            statusDiv.className = 'loading-dots';
            statusDiv.innerText = '对方正在输入...';
            box.appendChild(statusDiv);
            box.scrollTop = box.scrollHeight;

            // API 调用计时起点（用于调用记录）
            const apiCallStart = Date.now();

            // 15 秒超时控制器
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            // 打字机气泡引用（首个 delta 到达时复用现有气泡结构创建）
            let streamBubble = null;
            let fullText = '';

            try {
                const response = await fetch(`${baseUrl}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    signal: controller.signal,
                    body: JSON.stringify({
                        model: apiModel,
                        messages: apiMessages,
                        temperature: config.temperature != null ? config.temperature : 0.7,
                        stream: true
                    })
                });

                // HTTP 层错误（401/404/500 等）：读文本提取详情后直接报错，不进入流解析
                if (!response.ok || !response.body) {
                    clearTimeout(timeoutId);
                    const loadingEl = document.getElementById(statusId);
                    if (loadingEl) loadingEl.remove();

                    const bodyText = await response.text().catch(() => '');
                    let detail = '';
                    try {
                        const parsed = JSON.parse(bodyText);
                        detail = parsed.error?.message || bodyText;
                    } catch {
                        detail = bodyText;
                    }
                    const errText = `请求失败 (HTTP ${response.status})：${detail || response.statusText}`;
                    const errorMsg = { role: 'system_error', isError: true, text: errText, time: Date.now() };
                    historyList.push(errorMsg);
                    saveMessages(historyList);
                    appendMessageToDOM(errorMsg);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    logApiCall(apiModel, 'error', apiCallStart, errText);
                    return;
                }

                // SSE 流式读取
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let streamEnded = false;

                while (!streamEnded) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';   // 最后一段可能不完整，留到下一轮

                    for (const rawLine of lines) {
                        const line = rawLine.trim();
                        // 过滤空行与 SSE 心跳（: 开头的注释行）
                        if (!line || line.startsWith(':')) continue;
                        if (line.indexOf('data:') !== 0) continue;

                        const payload = line.slice(5).trim();
                        if (payload === '[DONE]') {
                            streamEnded = true;
                            break;
                        }

                        let json;
                        try {
                            json = JSON.parse(payload);
                        } catch (e) {
                            continue;   // 碎片/非 JSON，忽略
                        }

                        // 部分网关会在流内返回错误对象
                        if (json.error) {
                            throw new Error(json.error.message || JSON.stringify(json.error));
                        }

                        const delta = json.choices
                            && json.choices[0]
                            && json.choices[0].delta
                            && json.choices[0].delta.content;

                        if (delta) {
                            fullText += delta;

                            // 首个增量：移除"正在输入..."，复用现有气泡结构创建 AI 气泡
                            if (!streamBubble) {
                                const loadingEl = document.getElementById(statusId);
                                if (loadingEl) loadingEl.remove();
                                appendMessageToDOM({ role: 'assistant', text: fullText, name: groupReplyPick ? groupReplyPick.name : undefined });
                                if (typeof SoundSystem !== 'undefined') SoundSystem.play('receive', currentRoleId || '');
                                const lastRow = chatMessages.lastElementChild;
                                streamBubble = lastRow ? lastRow.querySelector('.msg-bubble') : null;
                            }

                            if (streamBubble) {
                                // 实时展示时即隐藏通话标记（完整标记到达的瞬间起不再可见）
                                streamBubble.textContent = extractVoiceCallMarker(fullText).text;
                            }
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        }
                    }
                }

                clearTimeout(timeoutId);

                // 流内一直没出现 loading 移除（零 delta 兜底）
                const loadingEl2 = document.getElementById(statusId);
                if (loadingEl2) loadingEl2.remove();

                if (!fullText) {
                    const errText = '未能获取到有效的模型回复（流式响应为空）';
                    const errorMsg = { role: 'system_error', isError: true, text: errText, time: Date.now() };
                    historyList.push(errorMsg);
                    saveMessages(historyList);
                    appendMessageToDOM(errorMsg);
                } else {
                    // 落盘前剥离主动通话标记：气泡展示与聊天记录均不保留标记，避免污染后续上下文
                    const parsedCall = extractVoiceCallMarker(fullText);
                    fullText = parsedCall.text;
                    // 剥离红包/转账标记 [红包:金额:留言] / [转账:金额:留言]
                    const parsedPay = extractPayMarkers(fullText);
                    fullText = parsedPay.text;
                    // 剥离自动记忆标记 [记住:xxx]，并存进 user_memory
                    const parsedMem = extractMemoryMarkers(fullText);
                    fullText = parsedMem.text;
                    if (parsedMem.memories.length) saveUserMemories(parsedMem.memories);
                    // AI 回复清洗：硬编码八股规则 + 用户自定义正则 + 残余标点收口（只对 AI 文本生效）
                    fullText = applyAICleanup(fullText);
                    if (fullText) {
                        if (streamBubble) streamBubble.textContent = fullText;
                        // 气泡已在流式过程中挂载，这里只做持久化
                        const aiMsg = { role: 'assistant', text: fullText, time: Date.now(), name: groupReplyPick ? groupReplyPick.name : undefined };
                        historyList.push(aiMsg);
                        saveMessages(historyList);
                    } else if ((parsedCall.wantCall || parsedPay.items.length) && streamBubble) {
                        // 模型只输出了标记：移除空白气泡、不落文本（来电卡/红包卡仍会插入）
                        const onlyRow = streamBubble.closest('.msg-row');
                        if (onlyRow) onlyRow.remove();
                    }
                    if (parsedCall.wantCall) {
                        // AI 侧插入黑底「发起语音通话」卡并落库；是否拨号由 chat_auto_call 开关决定
                        insertIncomingCallCard(historyList);
                        maybeAutoIncomingCall();
                    }
                    if (parsedPay.items.length) {
                        // AI 侧插入红包/转账卡片并落库，role='assistant' 可被用户点击领取
                        insertPayCards(historyList, parsedPay.items);
                    }
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
                logApiCall(apiModel, 'success', apiCallStart);

            } catch (error) {
                clearTimeout(timeoutId);
                const loadingEl = document.getElementById(statusId);
                if (loadingEl) loadingEl.remove();

                // 已吐出部分内容后中断：保留已生成文字并落库，不伪装成错误台词
                if (fullText) {
                    // 中断前已收到通话标记：同样剥离并触发呼出
                    const parsedCall = extractVoiceCallMarker(fullText);
                    fullText = parsedCall.text;
                    // 中断前已收到红包/转账标记：同样剥离并生成卡片
                    const parsedPay = extractPayMarkers(fullText);
                    fullText = parsedPay.text;
                    // 中断前已收到记忆标记：同样剥离并存进 user_memory
                    const parsedMem = extractMemoryMarkers(fullText);
                    fullText = parsedMem.text;
                    if (parsedMem.memories.length) saveUserMemories(parsedMem.memories);
                    // AI 回复清洗（与正常分支同一套规则）
                    fullText = applyAICleanup(fullText);
                    if (streamBubble) streamBubble.textContent = fullText;
                    if (fullText) {
                        const aiMsg = { role: 'assistant', text: fullText, time: Date.now(), name: groupReplyPick ? groupReplyPick.name : undefined };
                        historyList.push(aiMsg);
                        saveMessages(historyList);
                    }
                    const tipText = error.name === 'AbortError'
                        ? '连接中断，以上为已收到的回复（15秒超时）'
                        : `连接中断：${error.message || '网络错误'}`;
                    const tipMsg = { role: 'system_error', isError: true, text: tipText, time: Date.now() };
                    historyList.push(tipMsg);
                    saveMessages(historyList);
                    appendMessageToDOM(tipMsg);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    if (parsedCall.wantCall) {
                        insertIncomingCallCard(historyList);
                        maybeAutoIncomingCall();
                    }
                    if (parsedPay.items.length) {
                        insertPayCards(historyList, parsedPay.items);
                    }
                    logApiCall(apiModel, 'error', apiCallStart, tipText);
                    return;
                }

                let errorText = '';
                if (error.name === 'AbortError') {
                    errorText = '请求超时（15秒未响应），请检查网络或 API 地址。';
                } else {
                    errorText = `连接失败: ${error.message || '请检查 API 设置是否正确（可能是跨域或地址不正确）'}`;
                }

                const errorMsg = { role: 'system_error', isError: true, text: errorText, time: Date.now() };
                historyList.push(errorMsg);
                saveMessages(historyList);
                appendMessageToDOM(errorMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                logApiCall(apiModel, 'error', apiCallStart, errorText);
            }
        }

        // 暴露给 chat-extras.js：重玩/重新生成
        window.sendMsg = sendMsg;
        window.regenerateReply = function(direction) {
            var list = loadMessages();
            // 从后往前找最后一条 AI 消息
            var lastAiIdx = -1;
            for (var i = list.length - 1; i >= 0; i--) {
                var m = list[i];
                if (m.role === 'received' || m.role === 'assistant') { lastAiIdx = i; break; }
            }
            if (lastAiIdx === -1) {
                if (typeof showToast === 'function') showToast('还没有 AI 回复可以重玩');
                return;
            }
            list.splice(lastAiIdx, 1);
            saveMessages(list);
            // 清空聊天区重新渲染
            chatMessages.innerHTML = '';
            list.forEach(function(m) { appendMessageToDOM(m); });
            chatMessages.scrollTop = chatMessages.scrollHeight;
            // 触发重新生成
            sendMsg({ isRegenerate: true, regenDirection: direction || '' });
        };

        // ================= 让TA回复（不发新消息，AI 主动说一句） =================
        var askReplyBtn = document.getElementById('askReplyBtn');
        if (askReplyBtn) {
            askReplyBtn.addEventListener('click', function () {
                // 输入框有内容时不做静默回复，走正常发送
                var v = document.getElementById('chat-input');
                if (v && v.value.trim()) { sendMsg(); return; }
                if (typeof showToast === 'function') showToast('TA 正在输入...');
                sendMsg({ isRegenerate: true });
            });
        }

        // ================= 消息多选（长按进入） =================
        var selectingMode = false;
        var selectedTimes = new Set();
        var pressTimer = null;

        function enterSelection(msgTime) {
            selectingMode = true;
            selectedTimes = new Set();
            if (msgTime) selectedTimes.add(msgTime);
            chatMessages.classList.add('selecting');
            document.getElementById('selectBar').classList.add('show');
            // 给所有消息行插入勾选圈
            chatMessages.querySelectorAll('.msg-row').forEach(function (row) {
                if (row.querySelector('.msg-select-check')) return;
                var c = document.createElement('div');
                c.className = 'msg-select-check';
                row.insertBefore(c, row.firstChild);
            });
            updateSelectionUI();
        }

        function exitSelection() {
            selectingMode = false;
            selectedTimes = new Set();
            chatMessages.classList.remove('selecting');
            var bar = document.getElementById('selectBar');
            if (bar) bar.classList.remove('show');
            chatMessages.querySelectorAll('.msg-row').forEach(function (row) {
                var c = row.querySelector('.msg-select-check');
                if (c) c.remove();
                row.classList.remove('ghost');
            });
        }

        function updateSelectionUI() {
            document.getElementById('selectCount').textContent = '已选 ' + selectedTimes.size + ' 条';
            chatMessages.querySelectorAll('.msg-row').forEach(function (row) {
                var t = row.dataset.time;
                var c = row.querySelector('.msg-select-check');
                if (!t || !c) return;
                var on = selectedTimes.has(t);
                c.classList.toggle('checked', on);
                row.classList.toggle('ghost', on);
            });
        }

        function toggleSelectRow(row) {
            var t = row.dataset.time;
            if (!t) return;
            if (selectedTimes.has(t)) selectedTimes.delete(t);
            else selectedTimes.add(t);
            updateSelectionUI();
        }

        // 长按检测（pointer 事件兼容触摸/鼠标）
        chatMessages.addEventListener('pointerdown', function (e) {
            if (selectingMode) return;
            var row = e.target.closest('.msg-row');
            if (!row || !row.dataset.time) return;
            pressTimer = setTimeout(function () {
                pressTimer = null;
                if (navigator.vibrate) { try { navigator.vibrate(10); } catch (err) {} }
                enterSelection(row.dataset.time);
            }, 500);
        });
        ['pointerup', 'pointerleave', 'pointercancel', 'wheel', 'scroll'].forEach(function (ev) {
            chatMessages.addEventListener(ev, function () {
                if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
            }, { passive: true });
        });
        // 选中模式下点击消息行 = 切换勾选
        chatMessages.addEventListener('click', function (e) {
            if (!selectingMode) return;
            var row = e.target.closest('.msg-row');
            if (row) toggleSelectRow(row);
        });

        document.getElementById('selectCancelBtn').addEventListener('click', exitSelection);
        document.getElementById('selectDeleteBtn').addEventListener('click', function () {
            if (!selectedTimes.size) { exitSelection(); return; }
            var list = loadMessages();
            var keep = list.filter(function (m) {
                return !selectedTimes.has(String(m.time || ''));
            });
            saveMessages(keep);
            chatMessages.innerHTML = '';
            keep.forEach(function (m, i) { appendMessageToDOM(m, i); });
            chatMessages.scrollTop = chatMessages.scrollHeight;
            exitSelection();
            if (typeof showToast === 'function') showToast('已删除 ' + selectedTimes.size + ' 条消息');
        });

        if (chatForm) {
            chatForm.addEventListener('submit', function(e) {
                e.preventDefault();
                sendMsg();
            });
        }

        if (chatInput) {
            chatInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMsg();
                }
            });
        }

        // ================= 多行输入自适应 + 发送按钮状态 =================
        const sendBtn = document.querySelector('.send-icon-btn');

        function fitInputHeight() {
            if (!chatInput) return;
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 76) + 'px';
        }

        function updateSendBtnState() {
            if (!sendBtn || !chatInput) return;
            const hasText = chatInput.value.trim().length > 0;
            sendBtn.classList.toggle('disabled', !hasText);
            sendBtn.disabled = !hasText;
        }

        if (chatInput) {
            chatInput.addEventListener('input', function () {
                fitInputHeight();
                updateSendBtnState();
            });
        }

        fitInputHeight();
        updateSendBtnState();

        // ================= 气泡主题变量注入（只读，不碰任何现有逻辑） =================
        // 优先级：角色专属 theme_bubble_role_<id> > 全局 theme_bubble_global > CSS 内置默认值
        (function applyBubbleTheme() {
            var merged = {};
            try {
                var g = JSON.parse(localStorage.getItem('theme_bubble_global') || '{}');
                if (g && typeof g === 'object') merged = g;
            } catch (e) {}
            try {
                var r = JSON.parse(localStorage.getItem('theme_bubble_role_' + currentCharacter.id) || '{}');
                if (r && typeof r === 'object') {
                    for (var k in r) { if (r[k] != null) merged[k] = r[k]; }
                }
            } catch (e) {}
            var rootStyle = document.documentElement.style;
            if (merged.myBg) rootStyle.setProperty('--my-bubble-bg', merged.myBg);
            if (merged.myColor) rootStyle.setProperty('--my-bubble-color', merged.myColor);
            if (merged.partnerBg) rootStyle.setProperty('--partner-bubble-bg', merged.partnerBg);
            if (merged.partnerColor) rootStyle.setProperty('--partner-bubble-color', merged.partnerColor);
            if (merged.avatarSize) rootStyle.setProperty('--avatar-size', Number(merged.avatarSize) + 'px');
            if (merged.avatarRadius) rootStyle.setProperty('--avatar-radius', Number(merged.avatarRadius) + '%');
            if (merged.myRadius) rootStyle.setProperty('--my-bubble-radius', merged.myRadius);
            if (merged.partnerRadius) rootStyle.setProperty('--partner-bubble-radius', merged.partnerRadius);
        })();

        renderAllMessages();
        highlightMessageFromUrl();

        // ================= 三点图标：直接跳转对话设置页（不再弹出菜单） =================
        const btnMoreMenu = document.getElementById('btn-more-menu');
        if (btnMoreMenu) btnMoreMenu.addEventListener('click', function () {
            window.location.href = 'chat-settings.html?roleId=' + encodeURIComponent(currentCharacter.id);
        });

        // ================= Toast（chat-extras.js 等模块仍在使用，必须保留） =================
        const detailToast = document.getElementById('detailToast');
        let toastTimer = null;
        function showToast(text, duration) {
            if (!detailToast) return;
            detailToast.textContent = text;
            detailToast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { detailToast.classList.remove('show'); }, duration || 2000);
        }

        // ========== 红包/转账卡片工具 ==========
        // HTML 转义：防止留言等用户输入破坏卡片结构
        function escHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // ========== 钱包余额 workData：安全读写 ==========
        // 结构非法 / 余额非有限数字时一律回落 { balance: 1000 }，绝不把脏数据带进计算
        const WORK_DATA_KEY = 'workData';
        function getWorkData() {
            let wd = null;
            try {
                const raw = localStorage.getItem(WORK_DATA_KEY);
                if (raw) wd = JSON.parse(raw);
            } catch (e) {}
            if (!wd || typeof wd !== 'object' || Array.isArray(wd)) {
                wd = { balance: 1000 };
            }
            if (typeof wd.balance !== 'number' || !isFinite(wd.balance)) {
                wd.balance = 1000;
            }
            // 交易明细：history 缺失或非法时补空数组（老数据自动兼容）
            if (!Array.isArray(wd.history)) wd.history = [];
            return wd;
        }
        function saveWorkData(wd) {
            try {
                localStorage.setItem(WORK_DATA_KEY, JSON.stringify(wd));
                return true;
            } catch (e) {
                showToast('保存失败：本地存储空间不足');
                return false;
            }
        }

        // ========== 红包/转账结果弹窗 ==========
        const payResultOverlay = document.getElementById('payResultOverlay');
        const payResultAmount = document.getElementById('payResultAmount');
        const payResultHint = document.getElementById('payResultHint');
        const payResultBtn = document.getElementById('payResultBtn');

        function openPayResult(amountText, hintText) {
            if (!payResultOverlay) return;
            if (payResultAmount) payResultAmount.textContent = amountText;
            if (payResultHint) payResultHint.textContent = hintText;
            payResultOverlay.classList.add('active');
        }
        function closePayResult() {
            if (payResultOverlay) payResultOverlay.classList.remove('active');
            // 弹窗关闭后刷新聊天列表：「未领取」→「已领取」
            renderAllMessages();
        }
        if (payResultBtn) payResultBtn.addEventListener('click', closePayResult);
        if (payResultOverlay) {
            document.getElementById('payResultBackdrop').addEventListener('click', closePayResult);
        }

        // 红包/转账卡片点击：拆红包 / 收款（防重复领取，金额强转数字防字符串拼接）
        function handlePayCardClick(event) {
            const cardEl = event && event.currentTarget;
            if (!cardEl) return;
            const indexStr = cardEl.getAttribute('data-index');
            if (indexStr === '' || indexStr == null) return;
            const index = parseInt(indexStr, 10);
            if (isNaN(index) || index < 0) return;

            // 每次点击都从 localStorage 重读最新消息：双击时第二次读到的已是最新状态，天然防重复刷钱
            const list = loadMessages();
            const msg = list[index];
            if (!msg || (msg.type !== 'redpacket' && msg.type !== 'transfer')) return;
            const isRed = msg.type === 'redpacket';

            // 角色判断（修复资金漏洞）：只有对方(assistant)发来的才能领取；
            // 自己(user/sent)发出的只提示等待对方，不加余额、不改状态
            if (msg.role !== 'assistant') {
                showToast('这是你发出的' + (isRed ? '红包' : '转账') + '，等待对方领取哦');
                return;
            }

            // 状态校验：已领取/已收款直接提示并 return
            if (isRed && msg.status === 'opened') {
                showToast('你已经领取过这个红包啦');
                return;
            }
            if (!isRed && msg.status === 'received') {
                showToast('已经收过款啦');
                return;
            }

            // 金额：Number 强转数字，杜绝字符串拼接（1000 + '100' 绝不会变成 '1000100'）
            const amountNum = Number(msg.amount);
            if (!isFinite(amountNum) || amountNum <= 0) {
                showToast('金额数据异常');
                return;
            }

            // 1. 改状态并保存回聊天历史
            msg.status = isRed ? 'opened' : 'received';
            saveMessages(list);

            // 2. 余额累加：保留两位小数，避免浮点误差
            const wd = getWorkData();
            wd.balance = Math.round((wd.balance + amountNum) * 100) / 100;
            // 交易明细：收入记录（状态校验已保证一条卡只能走到这里一次，不会重复写入）
            wd.history.unshift({
                type: 'income',
                category: msg.type,                 // 'redpacket' | 'transfer'
                title: isRed ? '收到红包' : '收到转账',
                amount: parseFloat(msg.amount),
                time: Date.now()
            });
            if (!saveWorkData(wd)) return;

            // 3. 结果弹窗：红包「已存入余额」，转账「收款成功」
            openPayResult('+' + amountNum.toFixed(2), isRed ? '已存入余额' : '收款成功');
        }

    </script>

    <script>
        (function () {
            try {
                var url = (localStorage.getItem('custom_font_url') || '').trim().replace(/['"\\]/g, '');
                if (url) {
                    document.getElementById('fontSettingsStyle').textContent +=

                        ".phone-mockup, .phone-mockup * { font-family: 'CustomFont', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', sans-serif !important; }";
                }
                /* 字体颜色：只染正文文本，不碰气泡（归气泡主题管）和黑底白字按钮 */
                var color = (localStorage.getItem('custom_font_color') || '').trim();
                if (/^#[0-9A-Fa-f]{6}$/.test(color)) {

                        ".phone-mockup { color: " + color + "; }" +
                        "#chat-input, .x-input, .x-textarea, .msg-card-title, .msg-card-body { color: " + color + " !important; }";
                }
            } catch (e) { }
        })();

        // ================= 表情包：挂载库浏览与发送 =================
        (function setupStickers() {
            var overlay = document.getElementById('stickerPanelOverlay');
            var grid = document.getElementById('stickerPanelGrid');
            var openBtn = document.getElementById('stickerOpenBtn');
            if (!overlay || !grid || !openBtn) return;

            function getMountedStickers() {
                try {
                    var mountedIds = JSON.parse(localStorage.getItem('chat_sticker_libs_' + currentRoleId) || '[]');
                    var libs = JSON.parse(localStorage.getItem('sticker_libraries') || '[]');
                    var out = [];
                    libs.forEach(function (lib) {
                        if (mountedIds.indexOf(String(lib.id)) !== -1 && lib.stickers) {
                            lib.stickers.forEach(function (s) { out.push(s); });
                        }
                    });
                    return out;
                } catch (e) { return []; }
            }

            function render() {
                var stickers = getMountedStickers();
                grid.innerHTML = '';
                if (!stickers.length) {
                    grid.innerHTML = '<div class="sticker-panel-empty">还没有挂载表情包<br>去对话设置里挂载一个库</div>';
                    return;
                }
                stickers.forEach(function (s) {
                    var item = document.createElement('div');
                    item.className = 'sticker-panel-item';
                    item.innerHTML = '<img src="' + s.img + '"><span>' + s.desc + '</span>';
                    item.addEventListener('click', function () {
                        overlay.classList.remove('is-show');
                        sendSticker(s);
                    });
                    grid.appendChild(item);
                });
            }

            openBtn.addEventListener('click', function () {
                render();
                overlay.classList.add('is-show');
            });
            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) overlay.classList.remove('is-show');
            });

            function sendSticker(s) {
                var msg = { role: 'user', type: 'sticker', img: s.img, desc: s.desc, time: Date.now() };
                var list = loadMessages();
                list.push(msg);
                saveMessages(list);
                appendMessageToDOM(msg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                if (typeof SoundSystem !== 'undefined') SoundSystem.play('send');
                // 发给 AI：把描述词作为文本上下文发给模型
                sendMsg({ text: '[发表情包：' + s.desc + ']', silent: true });
            }
        })();
    </script>

<!-- 自动记忆总结提醒 -->
<div class="sum-overlay" id="sumOverlay" style="display:none;">
  <div class="sum-sheet">
    <div class="sum-handle"></div>
    <div class="sum-title">Memory Summary</div>
    <div class="sum-sub" id="sumSub">聊了不少内容，该总结一下记忆了</div>
    <div class="sum-btns">
      <button class="sum-ghost" id="sumDismiss">稍后再说</button>
      <button class="sum-primary" id="sumConfirm">立即总结</button>
    </div>
  </div>
</div>
<style>
  .sum-overlay {
    position: absolute; inset: 0; z-index: 9000;
    background: rgba(0,0,0,0.35);
    display: flex; align-items: flex-end;
  }
  .sum-sheet {
    width: 100%;
    background: #FFFFFF;
    border-radius: 20px 20px 0 0;
    padding: 10px 20px 28px;
    box-sizing: border-box;
  }
  .sum-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: #E5E5EA; margin: 4px auto 16px;
  }
  .sum-title {
    font-size: 1.35rem; font-weight: 800; color: #111111;
    letter-spacing: -0.02em; margin-bottom: 6px;
  }
  .sum-sub { font-size: 0.82rem; color: #666666; line-height: 1.5; margin-bottom: 20px; }
  .sum-btns { display: flex; gap: 10px; }
  .sum-primary {
    flex: 1; height: 46px; border: none; border-radius: 14px;
    background: #111111; color: #FFFFFF;
    font-size: 0.9rem; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: opacity 0.2s ease;
  }
  .sum-primary:active { opacity: 0.7; }
  .sum-primary:disabled { opacity: 0.4; }
  .sum-ghost {
    flex: 1; height: 46px; border: none; border-radius: 14px;
    background: #F2F2F7; color: #111111;
    font-size: 0.9rem; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: background 0.2s ease;
  }
  .sum-ghost:active { background: #E5E5EA; }
</style>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var rid = params.get('id') || params.get('roleId') || '';
  if (!rid) return;

  var HOUR = 3600000;
  var overlay = document.getElementById('sumOverlay');
  var sumSub = document.getElementById('sumSub');
  var btnConfirm = document.getElementById('sumConfirm');
  var btnDismiss = document.getElementById('sumDismiss');

  function getHistoryCount() {
    try {
      var raw = localStorage.getItem('chat_history_' + rid);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.length : 0;
    } catch (e) { return 0; }
  }
  function getInterval() {
    var n = parseInt(localStorage.getItem('chat_summary_interval_' + rid), 10);
    if (isNaN(n) || n < 1) n = 20;
    return Math.min(n, 200);
  }
  function autoEnabled() {
    return localStorage.getItem('chat_summary_auto_' + rid) !== '0';
  }
  function lastSummaryAt() {
    var t = parseInt(localStorage.getItem('chat_last_summary_' + rid), 10);
    return isNaN(t) ? 0 : t;
  }

  function checkAutoSummary() {
    if (!autoEnabled()) return;
    if (overlay.style.display !== 'none') return;
    var count = getHistoryCount();
    var interval = getInterval();
    if (count < interval) return;
    var now = Date.now();
    if (now - lastSummaryAt() < 8 * HOUR) return;
    sumSub.textContent = '已经聊了 ' + count + ' 条内容，AI 会自动提取值得记住的事存入长期记忆。';
    overlay.style.display = 'flex';
  }

  function snooze() {
    try { localStorage.setItem('chat_last_summary_' + rid, String(Date.now())); } catch (e) {}
    overlay.style.display = 'none';
  }

  async function doSummarize() {
    btnConfirm.disabled = true;
    btnConfirm.textContent = '总结中...';
    try {
      var config = {};
      try { config = JSON.parse(localStorage.getItem('api_settings') || '{}'); } catch (e) {}
      var apiKey = (config.apiKey || '').trim();
      var baseUrl = (config.baseUrl || 'https://api.openai.com/v1').trim().replace(/\/+$/, '');
      var apiModel = (config.model || 'gpt-3.5-turbo').trim();
      if (!apiKey) { alert('请先到设置页配置 API Key'); overlay.style.display = 'none'; return; }

      var history = [];
      try {
        var raw = localStorage.getItem('chat_history_' + rid);
        history = raw ? JSON.parse(raw) : [];
      } catch (e) {}
      history = Array.isArray(history) ? history.slice(-60) : [];
      if (!history.length) { overlay.style.display = 'none'; return; }

      var transcript = history.map(function (m) {
        var who = (m.role === 'sent' || m.role === 'user') ? '用户' : '角色';
        return who + '：' + (m.text || m.content || '');
      }).join('\n');

      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 20000);
      var resp = await fetch(baseUrl + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        signal: controller.signal,
        body: JSON.stringify({
          model: apiModel,
          temperature: 0.3,
          stream: false,
          messages: [
            { role: 'system', content: '你是记忆整理助手。阅读聊天记录，提取值得角色长期记住的事。每条记忆输出一个 JSON 对象：{"content":"简短陈述","category":"key|plot|detail|anniversary|preference","importance":1到5的整数}。category：key=关键事件/关系状态，plot=线上聊天剧情互动，detail=生活细节，anniversary=纪念日/重要日期/约定，preference=互动偏好/喜好习惯。importance：关键事件5，重要4，一般3。只输出 JSON 数组，不要解释；没有值得记住的事就输出 []。' },
            { role: 'user', content: '聊天记录：\n' + transcript }
          ]
        })
      });
      clearTimeout(timer);
      if (!resp.ok) { alert('总结失败（HTTP ' + resp.status + '）'); overlay.style.display = 'none'; return; }
      var data = await resp.json();
      var text = data && data.choices && data.choices[0] && data.choices[0].message
        ? (data.choices[0].message.content || '').trim() : '';
      var jsonMatch = text.match(/\[[\s\S]*\]/);
      var items = jsonMatch ? JSON.parse(jsonMatch[0]) : [];
      if (!Array.isArray(items)) items = [];

      var existing = [];
      try {
        var rawEx = localStorage.getItem('chat_memories_' + rid);
        existing = rawEx ? JSON.parse(rawEx) : [];
        if (!Array.isArray(existing)) existing = [];
      } catch (e) {}
      var now = Date.now();
      var autoConfirmed = 0, pending = 0;
      items.forEach(function (it) {
        if (!it || !it.content) return;
        var dup = existing.some(function (e) { return e.content === it.content; });
        if (dup) return;
        var imp = Math.max(1, Math.min(5, parseInt(it.importance, 10) || 3));
        // 高重要性(>=4)自动确认，其余进待确认草稿
        var status = imp >= 4 ? 'confirmed' : 'pending';
        if (status === 'confirmed') autoConfirmed++; else pending++;
        existing.push({
          content: String(it.content).slice(0, 120),
          category: (it.category === 'key' || it.category === 'plot' || it.category === 'detail' || it.category === 'anniversary' || it.category === 'preference') ? it.category : 'detail',
          importance: imp,
          status: status,
          createdAt: now
        });
      });
      try { localStorage.setItem('chat_memories_' + rid, JSON.stringify(existing)); } catch (e) {}
      try { localStorage.setItem('chat_last_summary_' + rid, String(now)); } catch (e) {}
      overlay.style.display = 'none';
      var msg = '已总结：' + autoConfirmed + ' 条自动确认';
      if (pending > 0) msg += '，' + pending + ' 条待确认';
      btnConfirm.textContent = msg;
      setTimeout(function () { overlay.style.display = 'none'; }, 1200);
    } catch (err) {
      alert('总结失败：' + (err.name === 'AbortError' ? '请求超时' : '网络错误'));
      overlay.style.display = 'none';
    } finally {
      btnConfirm.disabled = false;
      btnConfirm.textContent = '立即总结';
    }
  }

  btnDismiss.addEventListener('click', snooze);
  btnConfirm.addEventListener('click', doSummarize);

  // 页面加载后延迟检测
  setTimeout(checkAutoSummary, 1500);
})();
</script>
