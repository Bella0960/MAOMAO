<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="phone-mockup">
        <div class="status-bar"><span>09:41</span></div>
        <header class="header">
            <a class="back-link" href="index.html" aria-label="返回主屏幕">
                <span class="arrow">‹</span>
                <span>返回</span>
            </a>
            <h1 class="header-title">设置</h1>
            <div class="header-placeholder"></div>
        </header>
        <main class="content">
            <!-- 菜单列表：5 张独立卡片 -->
            <section class="card menu-card" onclick="document.getElementById('api-panel').style.display='flex'" role="button" tabindex="0">
                <div class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
                <div class="menu-info">
                    <div class="menu-title">API 设置</div>
                </div>
                <div class="menu-arrow">›</div>
            </section>

            <section class="card menu-card" id="openCustomizeBtn" role="button" tabindex="0">
                <div class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg></div>
                <div class="menu-info">
                    <div class="menu-title">美化设置</div>
                </div>
                <div class="menu-arrow">›</div>
            </section>

            <section class="card menu-card" id="openIconStyleBtn" role="button" tabindex="0">
                <div class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></div>
                <div class="menu-info">
                    <div class="menu-title">图标底色</div>
                </div>
                <div class="menu-meta">
                    <span id="iconStyleStatus">毛玻璃</span>
                    <span class="menu-arrow">›</span>
                </div>
            </section>

            <section class="card menu-card" onclick="document.getElementById('wallpaper-panel').style.display='flex'; initCustomizeUI();" role="button" tabindex="0">
                <div class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></div>
                <div class="menu-info">
                    <div class="menu-title">壁纸设置</div>
                </div>
                <div class="menu-arrow">›</div>
            </section>

            <section class="card menu-card" onclick="document.getElementById('font-panel').style.display='flex'" role="button" tabindex="0">
                <div class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></div>
                <div class="menu-info">
                    <div class="menu-title">字体大小</div>
                </div>
                <div class="menu-arrow">›</div>
            </section>
        </main>

        <!-- ========== API 设置弹窗 ========== -->
        <div id="api-panel" class="customize-panel" style="display: none;">
            <div class="status-bar"><span>09:41</span></div>
            <header class="header">
                <button type="button" class="panel-back-btn" onclick="document.getElementById('api-panel').style.display='none'" aria-label="返回">
                    <span class="arrow">‹</span>
                    <span>返回</span>
                </button>
                <h1 class="header-title">API 设置</h1>
                <div class="header-placeholder"></div>
            </header>
            <main class="content">
                <form id="settingsForm" class="card">
                    <div class="api-row">
                        <label for="api-name">配置名称</label>
                        <input id="api-name" value="默认配置" placeholder="如：默认配置">
                    </div>

                    <div class="api-row">
                        <label for="api-provider">服务商</label>
                        <select id="api-provider">
                            <option value="custom">自定义</option>
                            <option value="openai">OpenAI</option>
                            <option value="deepseek">DeepSeek</option>
                            <option value="moonshot">Moonshot Kimi</option>
                            <option value="zhipu">智谱 GLM</option>
                            <option value="siliconflow">硅基流动</option>
                        </select>
                    </div>

                    <div class="api-row">
                        <label for="api-url">Base URL</label>
                        <input id="api-url" value="https://api.openai.com/v1" placeholder="例如 https://api.openai.com/v1">
                    </div>

                    <div class="api-row">
                        <label for="api-key">API Key</label>
                        <div class="input-with-eye">
                            <input id="api-key" type="password" placeholder="sk-...">
                            <span class="eye-btn" onclick="toggleKeyVisibility()" role="button" aria-label="切换密码可见">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </span>
                        </div>
                    </div>
                    <div id="key-error" class="api-hint">请填写 API Key 后再开始聊天</div>

                    <div class="api-row">
                        <label for="api-model">默认模型</label>
                        <div class="model-input-row">
                            <input id="api-model" value="gpt-3.5-turbo" placeholder="点击选择或手动输入">
                            <button type="button" id="btn-fetch-models" class="btn-fetch-models" onclick="fetchModels()">拉取模型</button>
                        </div>
                        <div id="model-fetch-msg" class="model-fetch-msg">输入 API Key 后点击拉取</div>
                    </div>

                    <h3 class="api-section-title">高级设置</h3>

                    <div class="api-row">
                        <label for="api-memory">记忆条数（历史条数）</label>
                        <input id="api-memory" type="number" min="1" max="100" value="20" placeholder="20">
                    </div>

                    <div class="api-row">
                        <label for="api-temperature">温度 (0 - 2)</label>
                        <input id="api-temperature" type="number" min="0" max="2" step="0.1" value="0.7" placeholder="0.7">
                    </div>

                    <div class="api-row api-row-switch">
                        <label for="api-time-aware">AI 时间感知（注入当前日期）</label>
                        <label class="switch">
                            <input type="checkbox" id="api-time-aware" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="api-row">
                        <label for="api-prompt">系统人设</label>
                        <input id="api-prompt" placeholder="你是一个温柔的助手...">
                    </div>

                    <button type="submit" class="btn-save">保存全部设置</button>
                </form>
                <div class="btn-group">
                    <button type="button" id="btn-test-connection" class="btn-test">测试连接</button>
                </div>
                <div id="test-msg" class="model-fetch-msg"></div>
                <p class="tip-text">配置保存在本地（localStorage），用于大模型对话。</p>
            </main>
        </div>

        <!-- ========== 壁纸设置弹窗 ========== -->
        <div id="wallpaper-panel" class="customize-panel" style="display: none;">
            <div class="status-bar"><span>09:41</span></div>
            <header class="header">
                <button type="button" class="panel-back-btn" onclick="document.getElementById('wallpaper-panel').style.display='none'" aria-label="返回">
                    <span class="arrow">‹</span>
                    <span>返回</span>
                </button>
                <h1 class="header-title">壁纸设置</h1>
                <div class="header-placeholder"></div>
            </header>
            <main class="content">
                <section class="card">
                    <h2 class="section-title">桌面壁纸</h2>
                    <p class="section-subtitle">默认纯白极简，支持自定义图片</p>

                    <div class="wallpaper-preview-box" id="wallpaperPreviewBox">
                        <div class="wallpaper-preview-empty" id="wallpaperEmptyText">当前：纯白默认</div>
                    </div>

                    <div class="wallpaper-actions">
                        <label class="btn-action btn-upload" for="wallpaperInput">
                            <span>上传壁纸</span>
                            <input type="file" id="wallpaperInput" accept="image/*" style="display: none;" />
                        </label>
                        <button type="button" class="btn-action btn-reset" id="resetWallpaperBtn">恢复默认纯白</button>
                    </div>
                </section>
            </main>
        </div>

        <!-- ========== 字体大小弹窗（占位） ========== -->
        <div id="font-panel" class="customize-panel" style="display: none;">
            <div class="status-bar"><span>09:41</span></div>
            <header class="header">
                <button type="button" class="panel-back-btn" onclick="document.getElementById('font-panel').style.display='none'" aria-label="返回">
                    <span class="arrow">‹</span>
                    <span>返回</span>
                </button>
                <h1 class="header-title">字体大小</h1>
                <div class="header-placeholder"></div>
            </header>
            <main class="content">
                <p class="tip-text">功能开发中…</p>
            </main>
        </div>

        <!-- ========== 美化设置面板（只留色卡） ========== -->
        <div class="customize-panel" id="customizePanel" style="display: none;">
            <div class="status-bar"><span>09:41</span></div>
            <header class="header">
                <button type="button" class="panel-back-btn" id="closeCustomizeBtn" aria-label="返回">
                    <span class="arrow">‹</span>
                    <span>返回</span>
                </button>
                <h1 class="header-title">美化设置</h1>
                <div class="header-placeholder"></div>
            </header>
            <main class="content">
                <section class="card">
                    <h2 class="section-title">图标底色</h2>
                    <p class="section-subtitle">选择桌面磨砂玻璃图标背景色</p>

                    <div class="color-palette" id="colorPalette">
                        <div class="color-chip" data-color="rgba(255, 255, 255, 0.6)" title="纯白 (默认)">
                            <div class="color-circle" style="background: rgba(255, 255, 255, 0.9); border: 1px solid #ddd;"></div>
                            <span>纯白</span>
                        </div>
                        <div class="color-chip" data-color="rgba(235, 237, 240, 0.65)" title="浅灰">
                            <div class="color-circle" style="background: #e9ecef;"></div>
                            <span>浅灰</span>
                        </div>
                        <div class="color-chip" data-color="rgba(244, 227, 227, 0.65)" title="莫兰迪粉">
                            <div class="color-circle" style="background: #eecbc9;"></div>
                            <span>柔粉</span>
                        </div>
                        <div class="color-chip" data-color="rgba(224, 234, 242, 0.65)" title="莫兰迪蓝">
                            <div class="color-circle" style="background: #c7d8e6;"></div>
                            <span>雾蓝</span>
                        </div>
                        <div class="color-chip" data-color="rgba(228, 236, 227, 0.65)" title="莫兰迪绿">
                            <div class="color-circle" style="background: #ccdbcc;"></div>
                            <span>灰绿</span>
                        </div>
                        <div class="color-chip" data-color="rgba(247, 238, 224, 0.65)" title="奶油杏">
                            <div class="color-circle" style="background: #faeed9;"></div>
                            <span>奶油</span>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <!-- ========== 图标底色切换弹窗（毛玻璃 / 纯净） ========== -->
        <div class="icon-style-modal" id="iconStyleModal" style="display: none;">
            <div class="icon-style-backdrop" id="iconStyleBackdrop"></div>
            <div class="icon-style-sheet">
                <h3 class="icon-modal-title">图标底色</h3>
                <div class="icon-btn-group">
                    <button type="button" class="icon-btn-choice" id="btnChoiceGlass">毛玻璃</button>
                    <button type="button" class="icon-btn-choice" id="btnChoiceClean">纯净</button>
                </div>
                <button type="button" class="icon-modal-close" id="btnCloseIconModal">取消</button>
            </div>
        </div>

        <!-- ========== 模型选择弹窗 ========== -->
        <div class="model-modal-overlay" id="modelModalOverlay" style="display: none;">
            <div class="model-modal-backdrop" id="modelModalBackdrop"></div>
            <div class="model-modal-sheet">
                <h3 class="model-modal-title">选择模型</h3>
                <div class="model-list-scroll" id="modelListScroll"></div>
                <button type="button" class="model-modal-close" id="modelModalClose">取消</button>
            </div>
        </div>

        <div class="toast-msg" id="toastMsg">已保存设置</div>
    </div>
    <script src="settings.js"></script>
</body>
</html>
