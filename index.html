  <script>
    // ===== 开场加载动画 =====
    (function () {
      var bootShownAt = Date.now();
      function hideBootLoader() {
        var wait = Math.max(0, 400 - (Date.now() - bootShownAt));
        setTimeout(function () {
          var el = document.getElementById('bootLoader');
          if (el) el.classList.add('hide');
          setTimeout(function () { if (el) el.remove(); }, 400);
        }, wait);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', hideBootLoader);
      } else {
        hideBootLoader();
      }
    })();

    // ===== 长按编辑 + 拖拽（支持跨页） =====
    (function () {
      var LS = 'ds_layout_v2';
      var LS_OLD = 'ds_layout_v1';
      var editing = false;
      var dragEl = null;
      var clone = null;
      var edgeScrollTimer = null;

      function load() {
        try {
          var d = JSON.parse(localStorage.getItem(LS));
          if (d) return d;
          // 迁移 v1 → v2
          var old = JSON.parse(localStorage.getItem(LS_OLD)) || {};
          var migrated = { pages: [], dock: old['order_dockBar'] || null };
          if (old['order_desktopGrid']) migrated.pages[0] = old['order_desktopGrid'];
          save(migrated);
          return migrated;
        } catch(e) { return {}; }
      }
      function save(d) { try { localStorage.setItem(LS, JSON.stringify(d)); } catch(e) {} }
      var layout = load();

      // 工具：获取当前可见的 desktop-grid
      function getVisibleGrid() {
        var container = document.getElementById('homeScreen');
        if (!container) return document.querySelector('.desktop-grid');
        var pages = container.querySelectorAll('.home-page');
        var best = null, bestDist = Infinity;
        pages.forEach(function (p) {
          var r = p.getBoundingClientRect();
          var center = r.left + r.width / 2;
          var dist = Math.abs(center - window.innerWidth / 2);
          if (dist < bestDist) { bestDist = dist; best = p; }
        });
        return best ? best.querySelector('.desktop-grid') : document.querySelector('.desktop-grid');
      }

      function enterEdit() {
        editing = true;
        document.body.classList.add('home-editing');
      }
      function exitEdit() {
        editing = false;
        document.body.classList.remove('home-editing');
        if (clone) { clone.remove(); clone = null; }
        if (dragEl) { dragEl.classList.remove('dragging'); dragEl.style.opacity = ''; dragEl = null; }
        if (edgeScrollTimer) { clearInterval(edgeScrollTimer); edgeScrollTimer = null; }
      }

      // 边缘自动滚动
      function startEdgeScroll(cx) {
        if (edgeScrollTimer) return;
        var container = document.getElementById('homeScreen');
        if (!container) return;
        edgeScrollTimer = setInterval(function () {
          var rect = container.getBoundingClientRect();
          if (cx < rect.left + 30) {
            container.scrollLeft -= 60;
          } else if (cx > rect.right - 30) {
            container.scrollLeft += 60;
          }
        }, 80);
      }
      function stopEdgeScroll() {
        if (edgeScrollTimer) { clearInterval(edgeScrollTimer); edgeScrollTimer = null; }
      }

      // 查找最近的兄弟元素（在整个可见区域内）
      function findClosest(targetX, targetY) {
        // 在所有 desktop-grid 的 [data-drag] 里找最近的（排除 dragEl 自身 + dock 栏）
        var all = document.querySelectorAll('.desktop-grid [data-drag]');
        var closest = null, minDist = 99999;
        all.forEach(function (s) {
          if (s === dragEl) return;
          var r = s.getBoundingClientRect();
          var cx = r.left + r.width/2, cy = r.top + r.height/2;
          var d = Math.sqrt((targetX-cx)*(targetX-cx) + (targetY-cy)*(targetY-cy));
          if (d < minDist) { minDist = d; closest = s; }
        });
        return closest;
      }

      function doSwap(targetX, targetY) {
        if (!dragEl) return;
        // dock 栏：只在 dockBar 内交换
        var isDock = dragEl.closest('.dock-bar');
        if (isDock) {
          var dockSiblings = document.querySelectorAll('#dockBar [data-drag]');
          var closest = null, minDist = 99999;
          dockSiblings.forEach(function (s) {
            if (s === dragEl) return;
            var r = s.getBoundingClientRect();
            var cx = r.left + r.width/2, cy = r.top + r.height/2;
            var d = Math.sqrt((targetX-cx)*(targetX-cx) + (targetY-cy)*(targetY-cy));
            if (d < minDist) { minDist = d; closest = s; }
          });
          if (closest && minDist < 80) {
            document.getElementById('dockBar').insertBefore(dragEl, closest.nextSibling);
            var order = [];
            document.querySelectorAll('#dockBar [data-drag]').forEach(function (el) { order.push(el.dataset.drag); });
            layout.dock = order; save(layout);
          }
          return;
        }

        // 桌面：找到最近的桌面元素 + 目标页
        var closestEl = findClosest(targetX, targetY);
        var targetGrid = getVisibleGrid();
        if (!targetGrid) return;

        if (closestEl) {
          var closestGrid = closestEl.closest('.desktop-grid');
          // 如果最近元素和当前可见页不同，用最近元素的页
          if (closestGrid) targetGrid = closestGrid;
          var r = closestEl.getBoundingClientRect();
          var cx = r.left + r.width/2, cy = r.top + r.height/2;
          var d = Math.sqrt((targetX-cx)*(targetX-cx) + (targetY-cy)*(targetY-cy));
          if (d < 80) {
            targetGrid.insertBefore(dragEl, closestEl.nextSibling);
          } else {
            targetGrid.appendChild(dragEl);
          }
        } else {
          targetGrid.appendChild(dragEl);
        }

        // 保存所有页顺序
        var pages = document.querySelectorAll('.home-page');
        layout.pages = [];
        pages.forEach(function (page) {
          var order = [];
          page.querySelectorAll('[data-drag]').forEach(function (el) { order.push(el.dataset.drag); });
          layout.pages.push(order);
        });
        save(layout);
      }

      function startDrag(e) {
        var t = e.target.closest('[data-drag]');
        if (!t) return;
        if (!editing) enterEdit();
        dragEl = t;
        dragEl.classList.add('dragging');
        dragEl.style.opacity = '0.3';
        clone = t.cloneNode(true);
        clone.style.cssText = 'position:fixed;z-index:99999;pointer-events:none;opacity:0.85;transform:translate(-50%,-50%);margin:0;box-shadow:0 4px 16px rgba(0,0,0,0.2);';
        document.body.appendChild(clone);
        var cx, cy;
        if (e.touches && e.touches[0]) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
        else { cx = e.clientX; cy = e.clientY; }
        clone.style.left = cx + 'px'; clone.style.top = cy + 'px';
        startEdgeScroll(cx);
      }

      function moveDrag(e) {
        if (!clone) return;
        var cx, cy;
        if (e.touches && e.touches[0]) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
        else { cx = e.clientX; cy = e.clientY; }
        clone.style.left = cx + 'px'; clone.style.top = cy + 'px';
        // 更新边缘滚动检测位置
        if (dragEl && !dragEl.closest('.dock-bar')) startEdgeScroll(cx);
      }

      function endDrag(e) {
        if (!dragEl) return;
        stopEdgeScroll();
        var cx, cy;
        if (e.changedTouches && e.changedTouches[0]) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
        else if (e.clientX !== undefined) { cx = e.clientX; cy = e.clientY; }
        doSwap(cx, cy);
        dragEl.classList.remove('dragging');
        dragEl.style.opacity = '';
        if (clone) { clone.remove(); clone = null; }
        dragEl = null;
      }

      // 长按检测（触摸 + 鼠标）
      var pressTimer = null;
      document.addEventListener('touchstart', function (e) {
        if (editing) return;
        if (!e.target.closest('[data-drag]')) return;
        pressTimer = setTimeout(function () { pressTimer = null; startDrag(e); }, 300);
      }, { passive: true });
      document.addEventListener('touchmove', function () { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } }, { passive: true });
      document.addEventListener('touchend', function () { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } endDrag(e); });
      document.addEventListener('touchcancel', function () { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });

      var mouseTimer = null;
      document.addEventListener('mousedown', function (e) {
        if (editing) return;
        if (e.button !== 0) return;
        if (!e.target.closest('[data-drag]')) return;
        mouseTimer = setTimeout(function () { mouseTimer = null; startDrag(e); }, 250);
      });
      document.addEventListener('mousemove', function (e) {
        if (mouseTimer) { clearTimeout(mouseTimer); mouseTimer = null; }
        moveDrag(e);
      });
      document.addEventListener('mouseup', function (e) {
        if (mouseTimer) { clearTimeout(mouseTimer); mouseTimer = null; }
        endDrag(e);
      });

      // 编辑模式下：点空白退出；点 × 删除
      document.addEventListener('click', function (e) {
        if (editing) {
          if (e.target.classList.contains('ds-del')) {
            e.stopPropagation();
            var item = e.target.closest('[data-drag]');
            if (item) item.style.display = 'none';
            return;
          }
          if (!e.target.closest('[data-drag]') && !e.target.classList.contains('dot')) {
            exitEdit();
          }
        }
      }, true);

      // 恢复顺序（多页 + dock）
      function restoreLayout() {
        // 桌面：按页恢复
        var pages = document.querySelectorAll('.home-page');
        if (layout.pages && Array.isArray(layout.pages)) {
          layout.pages.forEach(function (order, pi) {
            var page = pages[pi];
            if (!page || !order) return;
            var grid = page.querySelector('.desktop-grid');
            if (!grid) return;
            order.forEach(function (id) {
              var el = document.querySelector('[data-drag="' + id + '"]');
              if (el && !el.closest('.dock-bar')) grid.appendChild(el);
            });
          });
        }
        // Dock 恢复
        if (layout.dock && Array.isArray(layout.dock)) {
          var dock = document.getElementById('dockBar');
          if (dock) {
            layout.dock.forEach(function (id) {
              var el = document.querySelector('#dockBar [data-drag="' + id + '"]');
              if (el) dock.appendChild(el);
            });
          }
        }
      }
      restoreLayout();

      // ===== page-dots 联动 =====
      var container = document.getElementById('homeScreen');
      var dots = document.querySelectorAll('.page-dots .dot');
      var activeIndex = 0;

      function updateDots() {
        if (!container) return;
        var pageWidth = container.clientWidth;
        var idx = Math.round(container.scrollLeft / pageWidth);
        if (idx !== activeIndex && idx >= 0 && idx < dots.length) {
          activeIndex = idx;
          dots.forEach(function (d, i) { d.classList.toggle('active', i === idx); });
        }
      }
      if (container) {
        container.addEventListener('scroll', updateDots, { passive: true });
      }
      // 点 dot 跳页
      dots.forEach(function (dot) {
        dot.addEventListener('click', function () {
          if (!container) return;
          var idx = parseInt(dot.dataset.page, 10) || 0;
          container.scrollTo({ left: idx * container.clientWidth, behavior: 'smooth' });
        });
      });
    })();

    // ===== 四个桌面组件交互 =====
    (function () {
      var POSTCARD_KEY = 'ds_postcard_v1';
      var POLAROID_KEY = 'ds_polaroid_v1';
      var DIALOG_KEY = 'ds_dialog_v1';
      var MUSIC_KEY = 'ds_music_v1';

      function load(k) { try { return JSON.parse(localStorage.getItem(k)) || null; } catch(e) { return null; } }
      function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

      // --- 明信片 ---
      (function () {
        var data = load(POSTCARD_KEY) || {
          bgTop: '', avatar: '', name: '关于我', sign: '保持微笑 每一刻都值得被记录'
        };
        var bgEl = document.getElementById('pcBgTop');
        var avEl = document.getElementById('pcAvatar');
        var nameEl = document.getElementById('pcName');
        var signEl = document.getElementById('pcSign');
        if (bgEl && data.bgTop) bgEl.style.backgroundImage = 'url(' + data.bgTop + ')';
        if (avEl && data.avatar) avEl.style.backgroundImage = 'url(' + data.avatar + ')';
        if (nameEl) nameEl.textContent = data.name;
        if (signEl) signEl.textContent = data.sign;

        // 点击头像区 → 上传头像
        if (avEl) avEl.addEventListener('click', function (e) {
          e.stopPropagation();
          if (document.body.classList.contains('home-editing')) return;
          var fi = document.createElement('input');
          fi.type = 'file'; fi.accept = 'image/*';
          fi.onchange = function () {
            if (!fi.files[0]) return;
            var r = new FileReader();
            r.onload = function () {
              avEl.style.backgroundImage = 'url(' + r.result + ')';
              data.avatar = r.result; save(POSTCARD_KEY, data);
            };
            r.readAsDataURL(fi.files[0]);
          };
          fi.click();
        });

        // 点击上半部分 → 上传背景
        if (bgEl) bgEl.addEventListener('click', function (e) {
          e.stopPropagation();
          if (document.body.classList.contains('home-editing')) return;
          var fi = document.createElement('input');
          fi.type = 'file'; fi.accept = 'image/*';
          fi.onchange = function () {
            if (!fi.files[0]) return;
            var r = new FileReader();
            r.onload = function () {
              bgEl.style.backgroundImage = 'url(' + r.result + ')';
              data.bgTop = r.result; save(POSTCARD_KEY, data);
            };
            r.readAsDataURL(fi.files[0]);
          };
          fi.click();
        });

        // 点击名字/签名 → 编辑
        function makeEditable(el, key, hint) {
          if (!el) return;
          el.addEventListener('click', function (e) {
            e.stopPropagation();
            if (document.body.classList.contains('home-editing')) return;
            if (el.isContentEditable) return;
            el.contentEditable = 'true';
            el.focus();
            document.execCommand('selectAll', false, null);
          });
          el.addEventListener('blur', function () {
            el.contentEditable = 'false';
            data[key] = el.textContent.trim() || hint;
            el.textContent = data[key];
            save(POSTCARD_KEY, data);
          });
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
          });
        }
        makeEditable(nameEl, 'name', '关于我');
        makeEditable(signEl, 'sign', '保持微笑 每一刻都值得被记录');
      })();

      // --- 拍立得 ---
      (function () {
        var data = load(POLAROID_KEY) || { img: '' };
        var imgEl = document.getElementById('poImg');
        if (imgEl && data.img) {
          imgEl.innerHTML = '';
          imgEl.style.backgroundImage = 'url(' + data.img + ')';
        }
        if (imgEl) imgEl.addEventListener('click', function (e) {
          e.stopPropagation();
          if (document.body.classList.contains('home-editing')) return;
          var fi = document.createElement('input');
          fi.type = 'file'; fi.accept = 'image/*';
          fi.onchange = function () {
            if (!fi.files[0]) return;
            var r = new FileReader();
            r.onload = function () {
              imgEl.innerHTML = '';
              imgEl.style.backgroundImage = 'url(' + r.result + ')';
              data.img = r.result; save(POLAROID_KEY, data);
            };
            r.readAsDataURL(fi.files[0]);
          };
          fi.click();
        });
      })();

      // --- 小对话 ---
      (function () {
        var data = load(DIALOG_KEY) || {
          themAvatar: '', meAvatar: '',
          themText: '在吗～', meText: '刚到，找我？'
        };
        var tAv = document.getElementById('dlAvatarThem');
        var mAv = document.getElementById('dlAvatarMe');
        var tBub = document.getElementById('dlBubbleThem');
        var mBub = document.getElementById('dlBubbleMe');
        if (tAv && data.themAvatar) tAv.style.backgroundImage = 'url(' + data.themAvatar + ')';
        if (mAv && data.meAvatar) mAv.style.backgroundImage = 'url(' + data.meAvatar + ')';
        if (tBub) tBub.textContent = data.themText;
        if (mBub) mBub.textContent = data.meText;

        function editAvatar(el, key) {
          if (!el) return;
          el.addEventListener('click', function (e) {
            e.stopPropagation();
            if (document.body.classList.contains('home-editing')) return;
            var fi = document.createElement('input');
            fi.type = 'file'; fi.accept = 'image/*';
            fi.onchange = function () {
              if (!fi.files[0]) return;
              var r = new FileReader();
              r.onload = function () {
                el.style.backgroundImage = 'url(' + r.result + ')';
                data[key] = r.result; save(DIALOG_KEY, data);
              };
              r.readAsDataURL(fi.files[0]);
            };
            fi.click();
          });
        }
        editAvatar(tAv, 'themAvatar');
        editAvatar(mAv, 'meAvatar');

        function editBubble(el, key) {
          if (!el) return;
          el.addEventListener('click', function (e) {
            e.stopPropagation();
            if (document.body.classList.contains('home-editing')) return;
            if (el.isContentEditable) return;
            el.contentEditable = 'true';
            el.focus();
            document.execCommand('selectAll', false, null);
          });
          el.addEventListener('blur', function () {
            el.contentEditable = 'false';
            data[key] = el.textContent.trim(); save(DIALOG_KEY, data);
          });
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
          });
        }
        editBubble(tBub, 'themText');
        editBubble(mBub, 'meText');
      })();

      // --- 音乐箱 ---
      (function () {
        var data = load(MUSIC_KEY) || { song: '未命名歌曲', artist: '点击编辑', duration: 210 };
        var songEl = document.getElementById('msSong');
        var artistEl = document.getElementById('msArtist');
        var playBtn = document.getElementById('msPlayBtn');
        var playIcon = document.getElementById('msPlayIcon');
        var fillEl = document.getElementById('msFill');
        var curEl = document.getElementById('msCur');
        var durEl = document.getElementById('msDur');

        if (songEl) songEl.textContent = data.song;
        if (artistEl) artistEl.textContent = data.artist;
        if (durEl) durEl.textContent = formatTime(data.duration);

        var playing = false, progress = 0, tickTimer = null;

        function formatTime(s) {
          s = Math.max(0, Math.floor(s));
          var m = Math.floor(s/60), ss = s % 60;
          return m + ':' + (ss < 10 ? '0' : '') + ss;
        }
        function setPlaying(p) {
          playing = p;
          if (playing) {
            playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
            tickTimer = setInterval(function () {
              progress += 1;
              if (progress >= data.duration) progress = 0;
              fillEl.style.width = (progress / data.duration * 100) + '%';
              curEl.textContent = formatTime(progress);
            }, 1000);
          } else {
            playIcon.innerHTML = '<path d="M6 4l14 8-14 8z"/>';
            if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
          }
        }
        if (playBtn) playBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (document.body.classList.contains('home-editing')) return;
          setPlaying(!playing);
        });

        function makeEditable(el, key, hint) {
          if (!el) return;
          el.addEventListener('click', function (e) {
            e.stopPropagation();
            if (document.body.classList.contains('home-editing')) return;
            if (el.isContentEditable) return;
            el.contentEditable = 'true';
            el.focus();
            document.execCommand('selectAll', false, null);
          });
          el.addEventListener('blur', function () {
            el.contentEditable = 'false';
            data[key] = el.textContent.trim() || hint;
            el.textContent = data[key]; save(MUSIC_KEY, data);
          });
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
          });
        }
        makeEditable(songEl, 'song', '未命名歌曲');
        makeEditable(artistEl, 'artist', '点击编辑');
      })();
    })();
  </script>
</body>
</html>
