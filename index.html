<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10182f" />
    <title>手机模拟器 · 首页</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="simulator-stage">
      <section class="phone" aria-label="手机模拟器">
        <div class="phone-camera" aria-hidden="true"></div>

        <div class="phone-screen">
          <header class="status-bar">
            <time id="status-time">09:41</time>
            <div class="status-icons" aria-label="设备状态">
              <span class="signal-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
              <span class="wifi-icon" aria-hidden="true"></span>
              <span class="battery-icon" aria-hidden="true"><b></b></span>
            </div>
          </header>

          <section class="home-screen">
            <!-- 二、 透明时钟组件 -->
            <div class="clock-widget">
              <div class="clock-display" id="large-clock">09:41</div>
              <div class="clock-meta">5月11日 MON 晴 24°C</div>
            </div>

            <!-- 四、 桌面挂件区（韩系氛围） -->
            <div class="korean-widgets" aria-label="桌面小挂件">
              <div class="widget-card widget-left" id="widget-left-btn" role="button" tabindex="0" title="点击编辑挂件">
                <span class="widget-kaomoji" id="widget-kaomoji-text">( ˃ ᵕ ˂ )</span>
              </div>
              <div class="widget-card widget-right" id="widget-right-btn" role="button" tabindex="0" title="点击编辑挂件">
                <span class="widget-motto" id="widget-motto-text">행운이🤍</span>
              </div>
            </div>

            <div class="app-grid" aria-label="应用列表">
              <button class="app-card" type="button" data-app="消息">
                <span class="app-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                  </svg>
                </span>
                <span class="app-name">消息</span>
              </button>
              <button class="app-card" type="button" data-app="联系人">
                <span class="app-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                  </svg>
                </span>
                <span class="app-name">联系人</span>
              </button>
              <button class="app-card" type="button" data-app="相机">
                <span class="app-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                  </svg>
                </span>
                <span class="app-name">相机</span>
              </button>
              <button class="app-card" type="button" data-app="图库">
                <span class="app-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                  </svg>
                </span>
                <span class="app-name">图库</span>
              </button>
              <button class="app-card" type="button" data-app="音乐">
                <span class="app-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="18" cy="16" r="3"/>
                  </svg>
                </span>
                <span class="app-name">音乐</span>
              </button>
              <button class="app-card" type="button" data-app="天气">
                <span class="app-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
                  </svg>
                </span>
                <span class="app-name">天气</span>
              </button>
              <button class="app-card" type="button" data-app="备忘录">
                <span class="app-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                  </svg>
                </span>
                <span class="app-name">备忘录</span>
              </button>
              <button class="app-card" type="button" data-app="设置">
                <span class="app-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                  </svg>
                </span>
                <span class="app-name">设置</span>
              </button>
              <button class="app-card" type="button" data-app="记忆">
                <span class="app-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
                    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
                    <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
                  </svg>
                </span>
                <span class="app-name">记忆</span>
              </button>
            </div>
          </section>

          <!-- 五、 底部 Dock 栏（悬浮圆角长方形磨砂玻璃栏，横向排列 3 个常用 App） -->
          <footer class="dock-wrapper">
            <div class="dock-bar" aria-label="快捷应用栏">
              <button class="dock-item" type="button" data-app="消息" title="消息">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
              </button>
              <button class="dock-item" type="button" data-app="角色管理" title="角色管理">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="7" r="4"/>
                  <path d="M5.5 21a6.5 6.5 0 0 1 13 0"/>
                </svg>
              </button>
              <button class="dock-item" type="button" data-app="设置" title="设置">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
              </button>
            </div>
            <div class="gesture-bar" aria-hidden="true"></div>
          </footer>
        </div>
      </section>
      <p class="stage-caption">MOBILE OS <span>•</span> UI CONCEPT</p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- 挂件编辑弹窗 -->
    <div class="modal-backdrop" id="widgetModal" style="display: none;">
      <div class="modal-box">
        <h3 class="modal-title" id="widgetModalTitle">修改挂件文字</h3>
        <input type="text" id="widgetModalInput" class="modal-input" maxlength="20" placeholder="请输入挂件文字" />
        <div class="modal-actions">
          <button type="button" class="modal-btn btn-cancel" id="widgetModalCancel">取消</button>
          <button type="button" class="modal-btn btn-confirm" id="widgetModalSave">保存</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
