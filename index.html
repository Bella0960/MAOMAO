    <script>
      // ===== 优先级最高：强制解除所有 Service Worker 缓存 + 清除旧布局 localStorage =====
      (function () {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
        // 清除所有历史版本的布局键，防止旧脏数据命中
        var keys = Object.keys(localStorage);
        keys.forEach(function (k) { if (/^ds_layout_v/.test(k)) localStorage.removeItem(k); });
        // 兼容 ds_polaroid_v1 / ds_image_v1 等挂件数据保留，只清布局
      })();
    </script>

  <script>
    // ===== 手机桌面拖拽引擎：实时自动让位 + 跨页流转 + Dock 自由布局 =====
    (function () {
      var MAX_PAGES = 4; // 桌面最多页数

      var editing = false;
      var isDragging = false;
      var dragEl = null;
      var dragClone = null;
      var placeholder = null;

      var activePageIndex = 0;
      var edgeTimer = null;
      var edgeCooldown = false;
      var lastEdgeSide = null;

      var pressTimer = null;
      var startX = 0, startY = 0;
      var hasMoved = false;

      var homeScreen = document.getElementById('homeScreen');
      var dockBar = document.getElementById('dockBar');
      var editModeIndicator = document.getElementById('editModeIndicator');
      var editDoneBtn = document.getElementById('editDoneBtn');

      // 震动反馈兼容
      function vibrate(ms) {
        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate(ms); } catch (e) {}
        }
      }

      // ===== 布局数据：统一网格，每一页都可混放应用和挂件 =====
      // v12 格式：{ v: 12, pages: [[id,...], ...], dock: [id,...], removed: [id,...] }
      // removed = 用户从桌面移除的应用/挂件（元素暂存在隐藏仓库里，之后可以重新添加）
      var LS_KEY = 'ds_layout_v12';
      var LS_KEY_OLD = 'ds_layout_v5'; // 旧版本，只读取用于迁移，不会被删除

      function getDefaultLayout() {
        // 默认布局（参考参考图分布）：正上方大幅图片上传组件(4×2整行)；中间左侧4个应用+右侧时钟(2×2)；下方左侧一个组件(2×2)+右侧4个应用
        return {
          v: 12,
          pages: [
            [
              'image',
              'app_worldbook', 'app_memory', 'clock',
              'app_forum', 'app_wallet',
              'polaroid',
              'app_music', 'app_beauty', 'app_characters', 'app_settings'
            ],
            [
              'app_finance', 'app_games', 'app_cafe', 'app_library',
              'app_diary', 'app_dreamtravel', 'app_shopadmin',
              'dialog', 'music'
            ]
          ],
          dock: ['app_chat', 'app_shop'],
          removed: ['postcard']
        };
      }

      function readJSON(key) {
        try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
      }

      // 只检查结构是否可用；不再要求“第一页至少 4 个”，否则用户腾空第一页会导致整份布局被重置
      function isValidLayout(v) {
        return !!(v && Array.isArray(v.pages) && v.pages.length > 0 &&
          v.pages.every(function (p) { return Array.isArray(p); }) &&
          Array.isArray(v.dock));
      }

      function loadLayout() {
        var v = readJSON(LS_KEY);
        if (isValidLayout(v)) {
          if (!Array.isArray(v.removed)) v.removed = [];
          return v;
        }
        // 从旧版 v5 迁移：保留各页应用/挂件的顺序和 Dock
        var old = readJSON(LS_KEY_OLD);
        if (isValidLayout(old)) {
          return { v: 6, pages: old.pages, dock: old.dock, removed: [] };
        }
        return getDefaultLayout();
      }

      function saveLayout(data) {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(data));
        } catch (e) {}
      }

      var currentLayout = loadLayout();

      // 迁移旧桌面布局：通话/通讯录归入聊天应用，不再作为 Dock 独立应用。
      // 仅过滤已经移除的入口 ID，保留其他应用和用户自定义排列，不清空整个布局。
      (function migrateRemovedShortcuts() {
        var valid = {};
        document.querySelectorAll('[data-drag]').forEach(function (el) {
          if (el.dataset.drag) valid[el.dataset.drag] = true;
        });
        currentLayout.pages = (currentLayout.pages || []).map(function (ids) {
          return Array.isArray(ids) ? ids.filter(function (id) { return !!valid[id]; }) : [];
        });
        currentLayout.dock = (currentLayout.dock || []).filter(function (id) {
          return !!valid[id] && id !== 'app_call' && id !== 'app_contacts';
        });
        currentLayout.removed = (currentLayout.removed || []).filter(function (id) {
          return !!valid[id];
        });
        // 若旧布局未把聊天/商店放在 Dock，保留用户选择；默认布局会提供这两个入口。
        saveLayout(currentLayout);
      })();

      // ===== 隐藏仓库：被移除的应用/挂件放这里（保留在页面里，挂件的事件绑定才不会失效，之后可重新添加） =====
      function getShelf() {
        var shelf = document.getElementById('itemShelf');
        if (!shelf) {
          shelf = document.createElement('div');
          shelf.id = 'itemShelf';
          shelf.hidden = true;
          shelf.style.display = 'none';
          shelf.setAttribute('aria-hidden', 'true');
          document.body.appendChild(shelf);
        }
        return shelf;
      }

      function moveToShelf(el) {
        if (!el) return;
        el.classList.remove('is-dragging-source');
        getShelf().appendChild(el);
      }

      // ===== 恢复布局到 DOM =====
      function restoreLayout() {
        if (!homeScreen || !dockBar) return;

        // 页数完全由保存的布局决定（至少 1 页），不再固定为 2 页
        var requiredPages = Math.max(1, currentLayout.pages.length);
        var pages = getPages();

        while (pages.length < requiredPages) {
          var newPageIndex = pages.length;
          var newPage = document.createElement('div');
          newPage.className = 'home-page';
          newPage.dataset.page = String(newPageIndex);
          newPage.innerHTML = '<div class="desktop-grid" id="gridPage' + newPageIndex + '"></div>';
          homeScreen.appendChild(newPage);
          pages.push(newPage);
        }

        // 把现有所有 data-drag 元素建立索引
        var itemMap = {};
        document.querySelectorAll('[data-drag]').forEach(function (el) {
          var id = el.dataset.drag;
          if (id) itemMap[id] = el;
        });

        // 1. 恢复 Dock
        if (Array.isArray(currentLayout.dock)) {
          currentLayout.dock.forEach(function (id) {
            var el = itemMap[id];
            if (el) {
              setElementAsDock(el);
              dockBar.appendChild(el);
              delete itemMap[id];
            }
          });
        }

        // 2. 恢复桌面各页（应用和挂件在任何一页都一视同仁）
        pages = getPages();
        currentLayout.pages.forEach(function (pageIds, pi) {
          var page = pages[pi];
          if (!page) return;
          var grid = page.querySelector('.desktop-grid');
          if (!grid) return;
          pageIds.forEach(function (id) {
            var el = itemMap[id];
            if (el) {
              setElementAsDesktop(el);
              grid.appendChild(el);
              delete itemMap[id];
            }
          });
        });

        // 3. 用户移除过的应用/挂件：放进隐藏仓库，不再显示（重启后也不会“复活”）
        (currentLayout.removed || []).forEach(function (id) {
          var el = itemMap[id];
          if (el) {
            moveToShelf(el);
            delete itemMap[id];
          }
        });

        // 4. 既没被放置、也没被移除的（例如以后新增的应用）：补到布局的最后一页末尾
        var remainingIds = Object.keys(itemMap);
        if (remainingIds.length > 0) {
          pages = getPages();
          var lastPage = pages[requiredPages - 1] || pages[pages.length - 1];
          var lastGrid = lastPage ? lastPage.querySelector('.desktop-grid') : null;
          if (lastGrid) {
            remainingIds.forEach(function (id) {
              var el = itemMap[id];
              setElementAsDesktop(el);
              lastGrid.appendChild(el);
            });
          }
        }

        // 5. 清掉 HTML 里多余的空页（例如布局只有 1 页时，原来写死的第二页）
        pages = getPages();
        for (var i = pages.length - 1; i >= requiredPages; i--) {
          if (pages[i].querySelectorAll('[data-drag]').length === 0) pages[i].remove();
        }

        updateDotsUI();
      }

      // 样式归一化转换
      function setElementAsDock(el) {
        if (!el) return;
        el.classList.remove('app-card');
        el.classList.add('dock-item', 'app-tile');
      }

      function setElementAsDesktop(el) {
        if (!el) return;
        el.classList.remove('dock-item');
        if (!el.classList.contains('ds-widget')) {
          el.classList.add('app-card', 'app-tile');
        }
      }

      // ===== 当前可见页与指示点 =====
      function getPages() {
        return Array.from(homeScreen.querySelectorAll('.home-page'));
      }

      function getCurrentPageFromScroll() {
        if (!homeScreen) return 0;
        var pw = homeScreen.clientWidth || 360;
        return Math.max(0, Math.round(homeScreen.scrollLeft / pw));
      }

      function updateDotsUI() {
        var dotsContainer = document.querySelector('.page-dots');
        if (!dotsContainer) return;
        var pages = getPages();
        dotsContainer.innerHTML = '';
        pages.forEach(function (_, i) {
          var dot = document.createElement('span');
          dot.className = 'dot' + (i === activePageIndex ? ' active' : '');
          dot.dataset.page = String(i);
          dot.addEventListener('click', function () {
            goToPage(i);
          });
          dotsContainer.appendChild(dot);
        });
      }

      function goToPage(index) {
        var pages = getPages();
        if (index < 0 || index >= pages.length) return;
        activePageIndex = index;
        var pw = homeScreen.clientWidth || 360;
        homeScreen.scrollTo({ left: index * pw, behavior: 'smooth' });
        var dots = document.querySelectorAll('.page-dots .dot');
        dots.forEach(function (d, i) {
          d.classList.toggle('active', i === index);
        });
      }

      // 动态新建页面（最多 4 页）
      function createPageIfNeeded() {
        var pages = getPages();
        if (pages.length >= MAX_PAGES) return null;
        var newIdx = pages.length;
        var newPage = document.createElement('div');
        newPage.className = 'home-page';
        newPage.dataset.page = String(newIdx);
        newPage.innerHTML = '<div class="desktop-grid" id="gridPage' + newIdx + '"></div>';
        homeScreen.appendChild(newPage);
        updateDotsUI();
        return newPage;
      }

      // 清理末尾空页（至少保留 1 页）
      function cleanupEmptyTrailingPages() {
        var pages = getPages();
        for (var i = pages.length - 1; i >= 1; i--) {
          var items = pages[i].querySelectorAll('[data-drag]');
          if (items.length === 0) {
            pages[i].remove();
          } else {
            break;
          }
        }
        // 如果当前正停留在被清掉的页，退回到最后一页
        var left = getPages().length;
        if (activePageIndex >= left) {
          activePageIndex = left - 1;
          homeScreen.scrollTo({ left: activePageIndex * (homeScreen.clientWidth || 360) });
        }
        updateDotsUI();
      }

      // ===== 进入与退出编辑模式 =====
      function enterEdit() {
        if (editing) return;
        editing = true;
        document.body.classList.add('home-editing');
        if (editModeIndicator) editModeIndicator.style.display = 'flex';
        vibrate(25);
      }

      function exitEdit() {
        if (!editing) return;
        editing = false;
        document.body.classList.remove('home-editing');
        if (editModeIndicator) editModeIndicator.style.display = 'none';

        if (isDragging) endDrag();
        cleanupEmptyTrailingPages();
        persistCurrentDOM();
      }

      if (editDoneBtn) {
        editDoneBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          exitEdit();
        });
      }

      // ===== 保存当前 DOM 顺序 =====
      function persistCurrentDOM() {
        var pages = getPages();
        var pagesOrder = [];
        pages.forEach(function (p) {
          var ids = [];
          p.querySelectorAll('.desktop-grid > [data-drag]').forEach(function (el) {
            if (el.dataset.drag) ids.push(el.dataset.drag);
          });
          pagesOrder.push(ids);
        });

        var dockOrder = [];
        dockBar.querySelectorAll('#dockBar > [data-drag]').forEach(function (el) {
          if (el.dataset.drag) dockOrder.push(el.dataset.drag);
        });

        var removedOrder = [];
        Array.from(getShelf().children).forEach(function (el) {
          if (el.dataset && el.dataset.drag) removedOrder.push(el.dataset.drag);
        });

        currentLayout = { v: 6, pages: pagesOrder, dock: dockOrder, removed: removedOrder };
        saveLayout(currentLayout);
      }

      // ===== 拖拽系统核心实现 =====
      function startDrag(targetItem, cx, cy) {
        if (!targetItem) return;
        if (!editing) enterEdit();

        isDragging = true;
        dragEl = targetItem;

        var isWidget = dragEl.classList.contains('ds-widget');
        var dragId = dragEl.dataset.drag;

        // 创建占位符（保持尺寸，确保 CSS 网格其他元素自然推移让位）
        placeholder = document.createElement('div');
        placeholder.className = 'drag-placeholder';

        if (isWidget) {
          if (dragId === 'postcard' || dragId === 'image') {
            placeholder.classList.add('span-4');
          } else {
            placeholder.classList.add('span-2');
          }
        }

        // 把占位符插入源位置
        if (dragEl.parentNode) {
          dragEl.parentNode.insertBefore(placeholder, dragEl);
        }

        // 隐藏原元素
        dragEl.classList.add('is-dragging-source');

        // 创建浮动镜像并跟随手势
        dragClone = dragEl.cloneNode(true);
        dragClone.classList.add('drag-avatar');
        dragClone.classList.remove('is-dragging-source');
        var delIcon = dragClone.querySelector('.ds-del');
        if (delIcon) delIcon.remove();

        dragClone.style.left = cx + 'px';
        dragClone.style.top = cy + 'px';
        document.body.appendChild(dragClone);

        vibrate(18);
      }

      function moveDrag(cx, cy) {
        if (!isDragging || !dragClone || !placeholder) return;

        // 1. 跟随手指
        dragClone.style.left = cx + 'px';
        dragClone.style.top = cy + 'px';

        // 2. 跨页边缘触发检测（拖拽至左右边缘停留时滑向上一页/下一页）
        var cRect = homeScreen.getBoundingClientRect();
        var edgeThreshold = 42;
        var pages = getPages();

        if (cx < cRect.left + edgeThreshold) {
          // 左边缘
          if (activePageIndex > 0 && !edgeCooldown) {
            if (lastEdgeSide !== 'left') {
              lastEdgeSide = 'left';
              clearTimeout(edgeTimer);
              edgeTimer = setTimeout(function () {
                if (!isDragging) return;
                var targetIdx = activePageIndex - 1;
                goToPage(targetIdx);
                // 把占位符带到新页
                var newGrid = pages[targetIdx] ? pages[targetIdx].querySelector('.desktop-grid') : null;
                if (newGrid && placeholder.parentNode !== newGrid) {
                  newGrid.appendChild(placeholder);
                }
                vibrate(15);
                edgeCooldown = true;
                setTimeout(function () { edgeCooldown = false; }, 480);
              }, 320);
            }
          }
        } else if (cx > cRect.right - edgeThreshold) {
          // 右边缘
          if (!edgeCooldown) {
            if (lastEdgeSide !== 'right') {
              lastEdgeSide = 'right';
              clearTimeout(edgeTimer);
              edgeTimer = setTimeout(function () {
                if (!isDragging) return;
                var targetIdx = activePageIndex + 1;
                if (targetIdx < pages.length) {
                  goToPage(targetIdx);
                  var newGrid = pages[targetIdx] ? pages[targetIdx].querySelector('.desktop-grid') : null;
                  if (newGrid && placeholder.parentNode !== newGrid) {
                    newGrid.appendChild(placeholder);
                  }
                  vibrate(15);
                } else if (pages.length < MAX_PAGES) {
                  // 在末尾拉出新页
                  createPageIfNeeded();
                  pages = getPages();
                  targetIdx = pages.length - 1;
                  goToPage(targetIdx);
                  var freshGrid = pages[targetIdx] ? pages[targetIdx].querySelector('.desktop-grid') : null;
                  if (freshGrid && placeholder.parentNode !== freshGrid) {
                    freshGrid.appendChild(placeholder);
                  }
                  vibrate(15);
                }
                edgeCooldown = true;
                setTimeout(function () { edgeCooldown = false; }, 480);
              }, 320);
            }
          }
        } else {
          // 离开了边缘区
          lastEdgeSide = null;
          if (edgeTimer) {
            clearTimeout(edgeTimer);
            edgeTimer = null;
          }
        }

        // 3. 实时碰撞检测与自动让位
        var dockRect = dockBar.getBoundingClientRect();
        var isOverDock = (
          cy >= dockRect.top - 16 &&
          cy <= dockRect.bottom + 20 &&
          cx >= dockRect.left - 10 &&
          cx <= dockRect.right + 10
        );

        var isWidget = dragEl.classList.contains('ds-widget');

        if (isOverDock) {
          // 悬停在底部 Dock 栏上方
          if (isWidget) {
            // 组件不可放置到底部 Dock 栏，提示或保持在当前桌面
            return;
          }

          var dockItems = Array.from(dockBar.children).filter(function (child) {
            return child !== placeholder && child !== dragEl;
          });

          // 限制 Dock 最多容纳 5 个应用
          if (dockItems.length >= 5 && placeholder.parentNode !== dockBar) {
            return;
          }

          // 寻找插入位置（水平排列让位）
          var targetDockSibling = null;
          for (var i = 0; i < dockItems.length; i++) {
            var itemRect = dockItems[i].getBoundingClientRect();
            var midX = itemRect.left + itemRect.width / 2;
            if (cx < midX) {
              targetDockSibling = dockItems[i];
              break;
            }
          }

          if (placeholder.parentNode !== dockBar || placeholder.nextSibling !== targetDockSibling) {
            dockBar.insertBefore(placeholder, targetDockSibling);
          }

        } else {
          // 悬停在桌面网格区
          pages = getPages();
          var curPage = pages[activePageIndex] || pages[0];
          if (!curPage) return;
          var curGrid = curPage.querySelector('.desktop-grid');
          if (!curGrid) return;

          var gridItems = Array.from(curGrid.children).filter(function (child) {
            return child !== placeholder && child !== dragEl;
          });

          if (gridItems.length === 0) {
            if (placeholder.parentNode !== curGrid) {
              curGrid.appendChild(placeholder);
            }
            return;
          }

          // 寻找最佳插入网格槽位并进行动态插队让位
          var hitSibling = null;
          var closestSibling = null;
          var minDistance = Infinity;

          for (var j = 0; j < gridItems.length; j++) {
            var el = gridItems[j];
            var r = el.getBoundingClientRect();
            var itemCenterX = r.left + r.width / 2;
            var itemCenterY = r.top + r.height / 2;

            // 1. 直接命中当前元素边界：即刻确定在其前或在其后
            if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) {
              hitSibling = (cx < itemCenterX) ? el : el.nextSibling;
              break;
            }

            // 2. 距离中心最近的元素容差判定
            var dist = Math.hypot(cx - itemCenterX, cy - itemCenterY);
            if (dist < minDistance) {
              minDistance = dist;
              if (cy < itemCenterY - 14 || (Math.abs(cy - itemCenterY) <= 32 && cx < itemCenterX)) {
                closestSibling = el;
              } else {
                closestSibling = el.nextSibling;
              }
            }
          }

          var targetSibling = hitSibling || closestSibling;
          if (placeholder.parentNode !== curGrid || placeholder.nextSibling !== targetSibling) {
            curGrid.insertBefore(placeholder, targetSibling);
          }
        }
      }

      function endDrag() {
        if (!isDragging) return;
        isDragging = false;

        if (edgeTimer) {
          clearTimeout(edgeTimer);
          edgeTimer = null;
        }

        if (dragEl && placeholder && placeholder.parentNode) {
          var targetParent = placeholder.parentNode;

          // 替换占位符
          targetParent.insertBefore(dragEl, placeholder);
          placeholder.remove();
          placeholder = null;

          // 恢复显示
          dragEl.classList.remove('is-dragging-source');
          dragEl.style.display = '';

          // 根据归属地应用对应样式
          if (targetParent.id === 'dockBar') {
            setElementAsDock(dragEl);
          } else {
            setElementAsDesktop(dragEl);
          }

          vibrate(22);
        }

        if (dragClone) {
          dragClone.remove();
          dragClone = null;
        }

        dragEl = null;

        // 清理空页与持久化
        cleanupEmptyTrailingPages();
        persistCurrentDOM();
      }

      // ===== 事件监听：触摸手势与鼠标 =====
      // 1. Touch Events
      document.addEventListener('touchstart', function (e) {
        var t = e.target.closest('[data-drag]');
        if (!t) return;
        if (e.target.classList.contains('ds-del')) return;

        var touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        hasMoved = false;

        if (editing) {
          // 编辑模式下点按直接准备拖拽
          pressTimer = setTimeout(function () {
            pressTimer = null;
            startDrag(t, startX, startY);
          }, 40);
        } else {
          // 常态下长按 280ms 触发编辑模式与拖拽
          pressTimer = setTimeout(function () {
            pressTimer = null;
            startDrag(t, startX, startY);
          }, 280);
        }
      }, { passive: true });

      document.addEventListener('touchmove', function (e) {
        if (!e.touches || !e.touches[0]) return;
        var touch = e.touches[0];
        var cx = touch.clientX, cy = touch.clientY;

        if (pressTimer) {
          if (Math.hypot(cx - startX, cy - startY) > 9) {
            // 手指滑动位移大于阈值，判定为普通页面滑动，取消长按
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        }

        if (isDragging) {
          if (e.cancelable) e.preventDefault();
          moveDrag(cx, cy);
        }
      }, { passive: false });

      document.addEventListener('touchend', function () {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
        if (isDragging) {
          endDrag();
        }
      });

      document.addEventListener('touchcancel', function () {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
        if (isDragging) {
          endDrag();
        }
      });

      // 2. Mouse Events
      document.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        var t = e.target.closest('[data-drag]');
        if (!t) return;
        if (e.target.classList.contains('ds-del')) return;

        startX = e.clientX;
        startY = e.clientY;

        if (editing) {
          pressTimer = setTimeout(function () {
            pressTimer = null;
            startDrag(t, startX, startY);
          }, 30);
        } else {
          pressTimer = setTimeout(function () {
            pressTimer = null;
            startDrag(t, startX, startY);
          }, 260);
        }
      });

      document.addEventListener('mousemove', function (e) {
        if (pressTimer) {
          if (Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        }
        if (isDragging) {
          e.preventDefault();
          moveDrag(e.clientX, e.clientY);
        }
      });

      document.addEventListener('mouseup', function () {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
        if (isDragging) {
          endDrag();
        }
      });

      // 2b. 长按桌面空白处进入编辑模式（进入后点顶部“＋ 挂件”添加挂件）
      var EMPTY_PRESS_MS = 450;
      var emptyPressTimer = null;
      var emptyPressX = 0, emptyPressY = 0;
      var swallowEmptyPressClick = false; // 长按进入编辑后，松手那一下“点击”要忽略，否则会马上退出编辑

      // 是否按在桌面的空白处：在桌面区域内，且不是应用/挂件/页码点
      function isEmptyHomeArea(target) {
        if (!target || !target.closest) return false;
        if (!target.closest('#homeScreen')) return false;
        return !target.closest('[data-drag]') && !target.closest('.dot');
      }

      function cancelEmptyPress() {
        if (emptyPressTimer) {
          clearTimeout(emptyPressTimer);
          emptyPressTimer = null;
        }
      }

      function startEmptyPress(target, x, y) {
        cancelEmptyPress();
        if (editing || isDragging || !isEmptyHomeArea(target)) return;
        emptyPressX = x;
        emptyPressY = y;
        emptyPressTimer = setTimeout(function () {
          emptyPressTimer = null;
          if (editing) return;
          enterEdit();
          swallowEmptyPressClick = true;
        }, EMPTY_PRESS_MS);
      }

      function moveEmptyPress(x, y) {
        // 手指移动超过阈值，说明是在左右滑动翻页，不是长按
        if (emptyPressTimer && Math.hypot(x - emptyPressX, y - emptyPressY) > 9) cancelEmptyPress();
      }

      function endEmptyPress() {
        cancelEmptyPress();
        if (swallowEmptyPressClick) {
          setTimeout(function () { swallowEmptyPressClick = false; }, 350);
        }
      }

      document.addEventListener('touchstart', function (e) {
        var touch = e.touches && e.touches[0];
        if (touch) startEmptyPress(e.target, touch.clientX, touch.clientY);
      }, { passive: true });
      document.addEventListener('touchmove', function (e) {
        var touch = e.touches && e.touches[0];
        if (touch) moveEmptyPress(touch.clientX, touch.clientY);
      }, { passive: true });
      document.addEventListener('touchend', endEmptyPress);
      document.addEventListener('touchcancel', endEmptyPress);

      document.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        startEmptyPress(e.target, e.clientX, e.clientY);
      });
      document.addEventListener('mousemove', function (e) {
        moveEmptyPress(e.clientX, e.clientY);
      });
      document.addEventListener('mouseup', endEmptyPress);

      // 空白处长按时不要弹出浏览器的右键/长按菜单
      if (homeScreen) {
        homeScreen.addEventListener('contextmenu', function (e) {
          if (!e.target.closest('[data-drag]')) e.preventDefault();
        });
      }

      // 3. 点击事件处理：删除组件/退出编辑
      document.addEventListener('click', function (e) {
        if (swallowEmptyPressClick) {
          swallowEmptyPressClick = false;
          e.stopPropagation();
          e.preventDefault();
          return;
        }
        if (!editing) return;

        // 点击红叉删除组件或应用
        if (e.target.classList.contains('ds-del')) {
          e.stopPropagation();
          e.preventDefault();
          var item = e.target.closest('[data-drag]');
          if (item) {
            moveToShelf(item);
            cleanupEmptyTrailingPages();
            persistCurrentDOM();
          }
          return;
        }

        // 点击空白区域退出编辑模式
        if (
          !e.target.closest('[data-drag]') &&
          !e.target.closest('.dot') &&
          !e.target.closest('#editModeIndicator')
        ) {
          exitEdit();
        }
      }, true);

      // 4. 监听桌面横向滑动同步 dot
      if (homeScreen) {
        homeScreen.addEventListener('scroll', function () {
          var cur = getCurrentPageFromScroll();
          if (cur !== activePageIndex) {
            activePageIndex = cur;
            var dots = document.querySelectorAll('.page-dots .dot');
            dots.forEach(function (d, i) {
              d.classList.toggle('active', i === cur);
            });
          }
        }, { passive: true });
      }

      // ===== 添加挂件：跳转独立挂件管理页（desktop/widgets.html） =====
      var addWidgetBtn = document.getElementById('editAddWidgetBtn');
      if (addWidgetBtn) {
        addWidgetBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          location.href = 'desktop/widgets.html';
        });
      }

      // 初始化桌面恢复
      restoreLayout();
    })();

    // ===== 四个桌面组件交互 =====
    (function () {
      var POSTCARD_KEY = 'ds_postcard_v1';
      var POLAROID_KEY = 'ds_polaroid_v1';
      var DIALOG_KEY = 'ds_dialog_v1';
      var MUSIC_KEY = 'ds_music_v1';

      function load(k) { try { return JSON.parse(localStorage.getItem(k)) || null; } catch(e) { return null; } }
      function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

      // --- 明信片 ---
      (function () {
        var data = load(POSTCARD_KEY) || {
          bgTop: '', avatar: '', name: '关于我', sign: '保持微笑 每一刻都值得被记录'
        };
        var bgEl = document.getElementById('pcBgTop');
        var avEl = document.getElementById('pcAvatar');
        var nameEl = document.getElementById('pcName');
        var signEl = document.getElementById('pcSign');
        if (bgEl && data.bgTop) bgEl.style.backgroundImage = 'url(' + data.bgTop + ')';
        if (avEl && data.avatar) avEl.style.backgroundImage = 'url(' + data.avatar + ')';
        if (nameEl) nameEl.textContent = data.name;
        if (signEl) signEl.textContent = data.sign;

        // 点击头像区 → 上传头像
        if (avEl) avEl.addEventListener('click', function (e) {
          e.stopPropagation();
          if (document.body.classList.contains('home-editing')) return;
          var fi = document.createElement('input');
          fi.type = 'file'; fi.accept = 'image/*';
          fi.onchange = function () {
            if (!fi.files[0]) return;
            var r = new FileReader();
            r.onload = function () {
              avEl.style.backgroundImage = 'url(' + r.result + ')';
              data.avatar = r.result; save(POSTCARD_KEY, data);
            };
            r.readAsDataURL(fi.files[0]);
          };
          fi.click();
        });

        // 点击上半部分 → 上传背景
        if (bgEl) bgEl.addEventListener('click', function (e) {
          e.stopPropagation();
          if (document.body.classList.contains('home-editing')) return;
          var fi = document.createElement('input');
          fi.type = 'file'; fi.accept = 'image/*';
          fi.onchange = function () {
            if (!fi.files[0]) return;
            var r = new FileReader();
            r.onload = function () {
              bgEl.style.backgroundImage = 'url(' + r.result + ')';
              data.bgTop = r.result; save(POSTCARD_KEY, data);
            };
            r.readAsDataURL(fi.files[0]);
          };
          fi.click();
        });

        // 点击名字/签名 → 编辑
        function makeEditable(el, key, hint) {
          if (!el) return;
          el.addEventListener('click', function (e) {
            e.stopPropagation();
            if (document.body.classList.contains('home-editing')) return;
            if (el.isContentEditable) return;
            el.contentEditable = 'true';
            el.focus();
            document.execCommand('selectAll', false, null);
          });
          el.addEventListener('blur', function () {
            el.contentEditable = 'false';
            data[key] = el.textContent.trim() || hint;
            el.textContent = data[key];
            save(POSTCARD_KEY, data);
          });
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
          });
        }
        makeEditable(nameEl, 'name', '关于我');
        makeEditable(signEl, 'sign', '保持微笑 每一刻都值得被记录');
      })();

      // --- 拍立得 ---
      (function () {
        var data = load(POLAROID_KEY) || { img: '' };
        var imgEl = document.getElementById('poImg');
        if (imgEl && data.img) {
          imgEl.innerHTML = '';
          imgEl.style.backgroundImage = 'url(' + data.img + ')';
        }
        if (imgEl) imgEl.addEventListener('click', function (e) {
          e.stopPropagation();
          if (document.body.classList.contains('home-editing')) return;
          var fi = document.createElement('input');
          fi.type = 'file'; fi.accept = 'image/*';
          fi.onchange = function () {
            if (!fi.files[0]) return;
            var r = new FileReader();
            r.onload = function () {
              imgEl.innerHTML = '';
              imgEl.style.backgroundImage = 'url(' + r.result + ')';
              data.img = r.result; save(POLAROID_KEY, data);
            };
            r.readAsDataURL(fi.files[0]);
          };
          fi.click();
        });
      })();

      // --- 小对话 ---
      (function () {
        var data = load(DIALOG_KEY) || {
          themAvatar: '', meAvatar: '',
          themText: '在吗～', meText: '刚到，找我？'
        };
        var tAv = document.getElementById('dlAvatarThem');
        var mAv = document.getElementById('dlAvatarMe');
        var tBub = document.getElementById('dlBubbleThem');
        var mBub = document.getElementById('dlBubbleMe');
        if (tAv && data.themAvatar) tAv.style.backgroundImage = 'url(' + data.themAvatar + ')';
        if (mAv && data.meAvatar) mAv.style.backgroundImage = 'url(' + data.meAvatar + ')';
        if (tBub) tBub.textContent = data.themText;
        if (mBub) mBub.textContent = data.meText;

        function editAvatar(el, key) {
          if (!el) return;
          el.addEventListener('click', function (e) {
            e.stopPropagation();
            if (document.body.classList.contains('home-editing')) return;
            var fi = document.createElement('input');
            fi.type = 'file'; fi.accept = 'image/*';
            fi.onchange = function () {
              if (!fi.files[0]) return;
              var r = new FileReader();
              r.onload = function () {
                el.style.backgroundImage = 'url(' + r.result + ')';
                data[key] = r.result; save(DIALOG_KEY, data);
              };
              r.readAsDataURL(fi.files[0]);
            };
            fi.click();
          });
        }
        editAvatar(tAv, 'themAvatar');
        editAvatar(mAv, 'meAvatar');

        function editBubble(el, key) {
          if (!el) return;
          el.addEventListener('click', function (e) {
            e.stopPropagation();
            if (document.body.classList.contains('home-editing')) return;
            if (el.isContentEditable) return;
            el.contentEditable = 'true';
            el.focus();
            document.execCommand('selectAll', false, null);
          });
          el.addEventListener('blur', function () {
            el.contentEditable = 'false';
            data[key] = el.textContent.trim(); save(DIALOG_KEY, data);
          });
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
          });
        }
        editBubble(tBub, 'themText');
        editBubble(mBub, 'meText');
      })();

      // --- 音乐箱 ---
      (function () {
        var data = load(MUSIC_KEY) || { song: '未命名歌曲', artist: '点击编辑', duration: 210 };
        var songEl = document.getElementById('msSong');
        var artistEl = document.getElementById('msArtist');
        var playBtn = document.getElementById('msPlayBtn');
        var playIcon = document.getElementById('msPlayIcon');
        var fillEl = document.getElementById('msFill');
        var curEl = document.getElementById('msCur');
        var durEl = document.getElementById('msDur');

        if (songEl) songEl.textContent = data.song;
        if (artistEl) artistEl.textContent = data.artist;
        if (durEl) durEl.textContent = formatTime(data.duration);

        var playing = false, progress = 0, tickTimer = null;

        function formatTime(s) {
          s = Math.max(0, Math.floor(s));
          var m = Math.floor(s/60), ss = s % 60;
          return m + ':' + (ss < 10 ? '0' : '') + ss;
        }
        function setPlaying(p) {
          playing = p;
          if (playing) {
            playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
            tickTimer = setInterval(function () {
              progress += 1;
              if (progress >= data.duration) progress = 0;
              fillEl.style.width = (progress / data.duration * 100) + '%';
              curEl.textContent = formatTime(progress);
            }, 1000);
          } else {
            playIcon.innerHTML = '<path d="M6 4l14 8-14 8z"/>';
            if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
          }
        }
        if (playBtn) playBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (document.body.classList.contains('home-editing')) return;
          setPlaying(!playing);
        });

        function makeEditable(el, key, hint) {
          if (!el) return;
          el.addEventListener('click', function (e) {
            e.stopPropagation();
            if (document.body.classList.contains('home-editing')) return;
            if (el.isContentEditable) return;
            el.contentEditable = 'true';
            el.focus();
            document.execCommand('selectAll', false, null);
          });
          el.addEventListener('blur', function () {
            el.contentEditable = 'false';
            data[key] = el.textContent.trim() || hint;
            el.textContent = data[key]; save(MUSIC_KEY, data);
          });
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
          });
        }
        makeEditable(songEl, 'song', '未命名歌曲');
        makeEditable(artistEl, 'artist', '点击编辑');
      })();
    })();

    // ===== 时钟组件：实时时间与日期 =====
    (function () {
      var timeEl = document.getElementById('clTime');
      var weekEl = document.getElementById('clWeek');
      var dateEl = document.getElementById('clDate');
      if (!timeEl) return;

      var DAYS = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      var MONTHS = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];

      function pad(n) { return (n < 10 ? '0' : '') + n; }

      function tick() {
        var d = new Date();
        timeEl.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
        weekEl.textContent = DAYS[d.getDay()];
        dateEl.textContent = MONTHS[d.getMonth()] + ' ' + d.getDate();
      }

      tick();
      setInterval(tick, 1000);
    })();

    // ===== 图片组件：点击上传图片（Canvas 压缩，最长边 900px，JPEG 0.7） =====
    (function () {
      var KEY = 'ds_image_v1';
      var data = null;
      try { data = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) {}
      var el = document.querySelector('[data-drag="image"]');
      var ph = document.getElementById('imPlaceholder');
      if (!el) return;

      function applyImg(src) {
        el.style.backgroundImage = 'url(' + src + ')';
        el.style.backgroundSize = 'cover';
        el.style.backgroundPosition = 'center';
        if (ph) ph.style.display = 'none';
      }
      if (data && data.img) applyImg(data.img);

      el.addEventListener('click', function (e) {
        e.stopPropagation();
        if (document.body.classList.contains('home-editing')) return;
        var fi = document.createElement('input');
        fi.type = 'file';
        fi.accept = 'image/*';
        fi.onchange = function () {
          if (!fi.files[0]) return;
          var reader = new FileReader();
          reader.onload = function () {
            var img = new Image();
            img.onload = function () {
              var scale = Math.min(1, 900 / Math.max(img.width, img.height));
              var w = Math.round(img.width * scale);
              var h = Math.round(img.height * scale);
              var canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              var ctx = canvas.getContext('2d');
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);
              var out = canvas.toDataURL('image/jpeg', 0.7);
              applyImg(out);
              try {
                localStorage.setItem(KEY, JSON.stringify({ img: out }));
              } catch (err) {}
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(fi.files[0]);
        };
        fi.click();
      });
    })();
  </script>
