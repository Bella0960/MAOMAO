<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>私人藏书室 · MAOMAO</title>
<script src="../js/native-feel.js"></script>
<style>
/* ============================================================
   MAOMAO — Editorial Library
   风格规范：超大衬线标题 / 眉题 kicker / 侧栏编号 / 细线上下框
   / 渐变灰度图版 / 斜体衬线文字按钮 / 极小节距标注 / 大量留白
   红线：无 Emoji、隐藏滚动条、封面无阴影无圆角
   ============================================================ */
:root{
  --paper:#ffffff;
  --ink:#171717;
  --muted:#777;
  --soft:#bdbdbd;
  --line:#d8d8d8;
  --serif:"Bodoni MT","Didot","Times New Roman","Songti SC","Noto Serif CJK SC","STSong",serif;
  --sans:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}

/* ===== 红线：隐藏所有滚动条 ===== */
::-webkit-scrollbar{display:none;width:0;height:0}
*{scrollbar-width:none;-ms-overflow-style:none}

/* ===== 手机外框 ===== */
.phone-mockup{position:relative;width:min(410px,calc(100vw - 24px));height:min(890px,calc(100dvh - 24px));min-height:620px;margin:12px auto;background:#fff;overflow:hidden}
@media(max-width:500px){
  html,body{background:#fff}
  .phone-mockup{width:100%;height:100dvh;min-height:0;margin:0}
}

/* ===== 视图容器 + 平滑切换 ===== */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);
  transition:opacity .34s cubic-bezier(.32,.72,0,1),transform .34s cubic-bezier(.32,.72,0,1);will-change:opacity,transform}
.view.is-hidden{opacity:0;pointer-events:none;transform:translateX(26px)}
#shelfView.is-hidden{transform:translateX(-26px)}

/* ===== 顶部细黑线 + 页眉 ===== */
.topline{flex:0 0 auto;height:1px;background:var(--ink);margin:0 22px}
.site-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 22px 12px}
.back-line{position:relative;padding:3px 0 7px;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.back-line svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.back-line:after{content:"";position:absolute;left:0;bottom:1px;width:100%;height:1px;background:currentColor;transform:scaleX(.5);transform-origin:left;transition:transform .25s ease}
.back-line:active:after{transform:scaleX(1)}
.head-brand{text-align:right}
.wordmark{font-family:var(--serif);font-size:15px;letter-spacing:.06em;line-height:1}
.wordmark span{font-size:9px;letter-spacing:.12em;color:var(--muted);font-family:var(--sans)}
.head-note{font-size:8px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:6px}

/* ===== 可滚动主体 ===== */
.scroll{flex:1;min-height:0;overflow:auto;padding:0 22px;scrollbar-width:none}

/* ===== 海报式标题区 ===== */
.hero{padding:18px 0 22px;border-bottom:1px solid var(--line)}
.poster-meta{display:flex;justify-content:space-between;align-items:center;font-size:8px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.kicker{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:#777;margin:26px 0 12px}
.hero-title{font-family:var(--serif);font-weight:400;font-size:clamp(46px,15vw,62px);line-height:.84;letter-spacing:-.055em;margin:0;color:var(--ink)}
.hero-title em{display:block;font-style:normal;margin-left:14%;letter-spacing:-.07em}
.cn-title{font-size:12px;letter-spacing:.24em;color:#333;margin:18px 0 0}
.description{font-size:10px;line-height:1.95;letter-spacing:.035em;color:#555;max-width:270px;margin:12px 0 0}
.hero-row{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:14px;align-items:start}
.side-index{border-left:1px solid var(--line);padding:4px 0 0 14px;margin-top:6px}
.index-no{font-family:var(--serif);font-size:34px;line-height:1;letter-spacing:-.03em}
.index-label{font-size:8px;color:var(--muted);letter-spacing:.16em;margin-top:12px;line-height:1.9}

/* ===== 书架区 ===== */
.shelf-block{padding:22px 0 4px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:18px}
.section-title{font-family:var(--serif);font-size:16px;letter-spacing:.02em;font-weight:400}
.section-count{font-size:8px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.shelf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 14px}

/* 书籍图版：渐变灰度占位 + 1px 细边框，无阴影无圆角 */
.book-card{display:block;padding:0;text-align:left;min-width:0}
.book-cover{position:relative;width:100%;aspect-ratio:3/4;background:#e8e8e8;border:1px solid var(--line);overflow:hidden;transition:border-color .22s}
.book-cover:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#d6d6d6 0%,#f7f7f7 40%,#bcbcbc 100%)}
.book-cover:after{content:"";position:absolute;width:46%;height:58%;left:27%;bottom:7%;background:linear-gradient(110deg,#b0b0b0,#f4f4f4 48%,#8f8f8f);opacity:.82;transition:opacity .22s}
.book-card:active .book-cover{border-color:#b5b5b5}
.book-card:active .book-cover:after{opacity:.62}
.plate-no{position:absolute;z-index:2;top:6px;right:7px;font-family:var(--serif);font-size:12px;color:#4a4a4a;letter-spacing:.02em}
.plate-label{position:absolute;z-index:2;left:7px;bottom:6px;font-size:7px;letter-spacing:.16em;color:#444;text-transform:uppercase}
.book-meta{margin-top:11px;line-height:1.35}
.book-name{display:block;font-family:var(--serif);font-size:12px;letter-spacing:.01em;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-author{display:block;font-size:8px;color:var(--muted);letter-spacing:.08em;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== 海报页脚（细线 + 期刊号） ===== */
.poster-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;padding:13px 0 0;border-top:1px solid var(--line)}
.foot-copy{font-size:8px;letter-spacing:.14em;color:#777;line-height:1.9;text-transform:uppercase}
.foot-num{font-family:var(--serif);font-size:20px;letter-spacing:-.02em}

/* ===== 底部操作区：斜体衬线文字按钮 ===== */
.shelf-foot{flex:0 0 auto;padding:16px 22px calc(16px + env(safe-area-inset-bottom))}
.action-row{display:flex;align-items:center;gap:26px}
.text-action{position:relative;padding:4px 0 9px;font-family:var(--serif);font-size:16px;font-style:italic;letter-spacing:.02em;color:var(--ink)}
.text-action:after{content:"";position:absolute;left:0;bottom:2px;width:100%;height:1px;background:currentColor;transform:scaleX(.55);transform-origin:left;transition:transform .28s ease}
.text-action:active:after{transform:scaleX(1)}
.text-action.subtle{color:#666}
.bottom-note{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:16px;padding-top:13px;font-size:8px;letter-spacing:.16em;color:#8c8c8c;text-transform:uppercase}

/* ===== 轻提示（黑白灰，无圆角） ===== */
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,10px);opacity:0;pointer-events:none;z-index:20;
  background:var(--ink);color:#fff;padding:10px 16px;font-size:11px;letter-spacing:.05em;white-space:nowrap;
  transition:opacity .24s ease,transform .24s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== 阅读器视图 ===== */
.reader-head{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:15px 22px 12px;border-bottom:1px solid var(--line)}
.reader-title{flex:1;min-width:0;font-family:var(--serif);font-weight:400;font-size:17px;letter-spacing:.02em;color:var(--ink);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-body{flex:1;min-height:0;overflow:auto;padding:26px 26px 72px;scrollbar-width:none}
.reader-content{max-width:330px;margin:0 auto}
.reader-meta{display:flex;justify-content:space-between;align-items:center;font-size:8px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;padding-bottom:14px;border-bottom:1px solid var(--line)}
.reader-chapter{margin:30px 0 24px}
.chapter-no{font-size:8px;letter-spacing:.28em;color:#8c8c8c;text-transform:uppercase}
.chapter-title{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.08;letter-spacing:-.04em;margin:9px 0 0}
.reader-content p{font-family:var(--serif);font-size:15px;line-height:1.8;color:#2c2c2c;margin:0 0 1.5em;text-indent:2em;text-align:justify}
.reader-divider{width:26px;height:1px;background:var(--ink);opacity:.5;margin:34px auto}
.reader-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px;padding-top:13px;border-top:1px solid var(--line)}
.reader-foot .foot-num{font-size:18px}

/* ===== 动效 / 可访问性 ===== */
@media(prefers-reduced-motion:reduce){
  .view,.text-action:after,.back-line:after{transition:none!important}
  .view.is-hidden{transform:none!important}
}
</style>
</head>
<body>
<div class="phone-mockup">

  <!-- ==================== 书架视图 ==================== -->
  <section class="view" id="shelfView" aria-label="私人藏书室">

    <div class="topline"></div>
    <header class="site-head">
      <button class="back-line" id="backHome" aria-label="返回桌面" title="返回桌面">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h11"/></svg>
        <span style="font-size:11px">返回桌面</span>
      </button>
      <div class="head-brand">
        <div class="wordmark">MAOMAO <span>/ READING</span></div>
        <div class="head-note">Private library</div>
      </div>
    </header>

    <div class="scroll" id="shelfScroll">

      <!-- 海报式标题 -->
      <section class="hero">
        <div class="poster-meta">
          <span>Collection / 001</span>
          <span>Edition 2026</span>
        </div>
        <div class="kicker">My Library</div>
        <div class="hero-row">
          <div>
            <h1 class="hero-title">私人<em>藏书室</em></h1>
            <p class="cn-title">一个只属于自己的安静角落</p>
            <p class="description">在这里收集纸页、光线与短暂的停顿。<br>让翻书的声音留在耳边，让故事慢慢发生。</p>
          </div>
          <aside class="side-index">
            <div class="index-no">01</div>
            <div class="index-label" id="indexLabel">THREE<br>VOLUMES<br>ON SHELF</div>
          </aside>
        </div>
      </section>

      <!-- 书架 -->
      <section class="shelf-block">
        <div class="section-head">
          <span class="section-title">架上藏书</span>
          <span class="section-count" id="shelfCount">03 Volumes</span>
        </div>
        <div class="shelf-grid" id="shelfGrid"><!-- 书籍由 JS 渲染 --></div>
      </section>

      <div class="poster-foot">
        <div class="foot-copy">A small collection<br>black / white / grey</div>
        <div class="foot-num">MM—01</div>
      </div>

    </div>

    <footer class="shelf-foot">
      <div class="action-row">
        <button class="text-action" type="button" id="importBtn">导入本地书籍</button>
        <button class="text-action subtle" type="button" id="writeBtn">让 TA 写一本</button>
      </div>
      <div class="bottom-note">
        <span>Maomao / Reading Room</span>
        <span>Fine lines &amp; type</span>
      </div>
    </footer>

    <!-- 隐藏的本地文件选择器：仅接受 .txt -->
    <input type="file" id="importFile" accept=".txt,text/plain" hidden>
  </section>

  <!-- 轻提示 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ==================== 阅读器视图 ==================== -->
  <section class="view is-hidden" id="readerView" aria-label="阅读器" aria-hidden="true">
    <header class="reader-head">
      <button class="back-line" id="backToShelf" aria-label="返回书架" title="返回书架">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h11"/></svg>
        <span style="font-size:11px">返回书架</span>
      </button>
      <h2 class="reader-title" id="readerTitle">书名</h2>
    </header>
    <main class="reader-body" id="readerBody">
      <article class="reader-content" id="readerContent"><!-- 正文由 JS 渲染 --></article>
    </main>
  </section>

</div>

<script>
(function () {
  'use strict';

  /* ===== 假数据：3 本书 ===== */
  var books = [
    {
      id: 'b1', name: '月光与回声', author: '林远舟', chapter: '第一章',
      content: [
        '夜色把整座城市收进一只旧木匣，街灯像被遗忘的纽扣，一颗一颗亮在潮湿的空气里。她推开窗，风带着远处江水的气息，轻轻擦过耳侧。',
        '很多年以后，她仍然记得那个夜晚的温度。不是因为发生了什么惊天动地的事，而是因为那是她第一次意识到，原来告别可以安静得像一片叶子落在水面。',
        '楼下的便利店还开着，日光灯把门口一小块地方照得发白。她忽然很想下去走一走，不为买什么，只是想让脚底碰到真实的地面。',
        '第二天清晨，她在枕边发现一张纸条，上面只有一行字：我把回声寄给你了。字是他的笔迹，瘦而长，像他说话时总带着的那点犹豫。'
      ]
    },
    {
      id: 'b2', name: '纸鹤集', author: '苏微', chapter: '序',
      content: [
        '小时候她以为，只要把愿望写在纸上，再折成一只鹤，愿望就会顺着风飞走，飞到某个能听见它的地方。',
        '长大以后她才明白，纸鹤飞不远，它们大多落在屋顶、树梢，或者某条无人经过的小巷里。但写愿望的那个瞬间，是真的。',
        '她把这些年折过的鹤都收在一只玻璃瓶里。搬家的时候瓶子碎了，纸鹤散落一地，像一场迟来的雪。她蹲下来一只一只捡，忽然觉得自己好像也被重新拼凑了一遍。',
        '如果你也有一只纸鹤，请别急着放飞它。先把它握在手心一会儿，让它知道你是认真的。'
      ]
    },
    {
      id: 'b3', name: '海边的旧信', author: '陈屿', chapter: '第一封信',
      content: [
        '潮水退去的时候，沙滩上会留下一些奇怪的东西。半只贝壳，一段绳子，有时候是一封信。',
        '他捡到那封信的时候，信纸已经被海水泡得发软，字迹模糊得像一场没做完的梦。但他还是看出来了，那是一封写给某个名字的信，开头写着：见字如面。',
        '他把信带回家，夹在一本旧书里。后来他搬了很多次家，丢了很多东西，但那封信一直都在。他不知道写信的人是谁，也不知道收信的人有没有等到它。',
        '只是偶尔，在下雨的傍晚，他会把信拿出来看一眼。那些洇开的字，像海面上最后一点光。'
      ]
    }
  ];

  var PLATE_LABELS = ['Plate 01 / Form', 'Plate 02 / Light', 'Plate 03 / Tide'];

  var grid = document.getElementById('shelfGrid');
  var shelfCount = document.getElementById('shelfCount');
  var indexLabel = document.getElementById('indexLabel');
  var toastEl = document.getElementById('toast');
  var importInput = document.getElementById('importFile');

  /* 转义：避免文件内容里的尖括号等破坏结构 */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* 轻提示 */
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /* ===== 渲染书架图版（初始 / 导入后复用） ===== */
  function renderShelf() {
    grid.innerHTML = books.map(function (b, i) {
      var no = String(i + 1).padStart(2, '0');
      var label = PLATE_LABELS[i] || ('Plate ' + no + ' / Local');
      return '<button class="book-card" type="button" data-book-id="' + esc(b.id) + '" aria-label="打开 ' + esc(b.name) + '">' +
        '<div class="book-cover">' +
          '<span class="plate-no">' + no + '</span>' +
          '<span class="plate-label">' + esc(label) + '</span>' +
        '</div>' +
        '<div class="book-meta">' +
          '<span class="book-name">' + esc(b.name) + '</span>' +
          '<span class="book-author">' + esc(b.author) + '</span>' +
        '</div>' +
      '</button>';
    }).join('');

    var total = String(books.length).padStart(2, '0');
    shelfCount.textContent = total + ' Volumes';
    indexLabel.innerHTML = total + '<br>VOLUMES<br>ON SHELF';
  }

  renderShelf();

  /* ===== 视图切换 ===== */
  var shelfView = document.getElementById('shelfView');
  var readerView = document.getElementById('readerView');
  var readerTitle = document.getElementById('readerTitle');
  var readerContent = document.getElementById('readerContent');
  var readerBody = document.getElementById('readerBody');

  function openReader(book) {
    readerTitle.textContent = book.name;

    var paragraphs = book.content.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    readerContent.innerHTML =
      '<div class="reader-meta"><span>' + esc(book.meta || 'Chapter 001') + '</span><span>' + esc(book.author) + '</span></div>' +
      '<div class="reader-chapter">' +
        '<div class="chapter-no">' + esc(book.chapter) + '</div>' +
        '<h3 class="chapter-title">' + esc(book.name) + '</h3>' +
      '</div>' +
      paragraphs +
      '<div class="reader-divider"></div>' +
      '<div class="reader-foot">' +
        '<div class="foot-copy">Maomao / Reading<br>one quiet evening</div>' +
        '<div class="foot-num">MM—01</div>' +
      '</div>';

    shelfView.classList.add('is-hidden');
    shelfView.setAttribute('aria-hidden', 'true');
    readerView.classList.remove('is-hidden');
    readerView.setAttribute('aria-hidden', 'false');
    readerBody.scrollTop = 0;
  }

  function closeReader() {
    readerView.classList.add('is-hidden');
    readerView.setAttribute('aria-hidden', 'true');
    shelfView.classList.remove('is-hidden');
    shelfView.setAttribute('aria-hidden', 'false');
  }

  /* ===== 事件绑定 ===== */
  grid.addEventListener('click', function (e) {
    var card = e.target.closest('.book-card');
    if (!card) return;
    var id = card.dataset.bookId;
    var book = books.filter(function (b) { return b.id === id; })[0];
    if (book) openReader(book);
  });

  document.getElementById('backToShelf').addEventListener('click', closeReader);
  document.getElementById('backHome').addEventListener('click', function () {
    location.href = '../index.html';
  });

  /* ===== 导入本地 .txt ===== */
  document.getElementById('importBtn').addEventListener('click', function () {
    importInput.value = '';          // 允许重复选择同一个文件
    importInput.click();             // 触发隐藏的文件选择器
  });

  importInput.addEventListener('change', function () {
    var file = importInput.files && importInput.files[0];
    if (!file) return;

    var reader = new FileReader();

    reader.onload = function () {
      var buf = reader.result;
      var text = new TextDecoder('utf-8').decode(buf);
      /* 中文 txt 常见 GBK 编码，出现替换字符时回退解码 */
      if (text.indexOf('\uFFFD') !== -1) {
        try { text = new TextDecoder('gbk').decode(buf); } catch (e) { /* 保持 utf-8 */ }
      }

      var paragraphs = text.replace(/\r\n?/g, '\n').split('\n')
        .map(function (l) { return l.trim(); })
        .filter(function (l) { return l.length > 0; });

      if (paragraphs.length === 0) {
        showToast('文件内容为空');
        return;
      }

      var name = file.name.replace(/\.txt$/i, '').trim() || '未命名';
      books.push({
        id: 'local_' + Date.now(),
        name: name,
        author: '本地导入',
        chapter: '本地文本',
        meta: 'Imported text',
        content: paragraphs
      });

      renderShelf();
      showToast('已导入《' + name + '》');
    };

    reader.onerror = function () { showToast('文件读取失败'); };

    reader.readAsArrayBuffer(file);
  });

  document.getElementById('writeBtn').addEventListener('click', function () {
    // 后续接入：调用 AI 生成新书
  });
})();
</script>
</body>
</html>
