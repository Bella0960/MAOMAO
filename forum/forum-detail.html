<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>讨论档案 — 帖子详情</title>
<script src="../js/font-loader.js"></script>
<script src="../js/native-feel.js"></script>
<script src="../js/phone/phone_storage.js"></script>
<link rel="stylesheet" href="../css/mobile-fit.css">
<style>
  :root{
    color-scheme:light;
    --ink:#181818;--body:#454545;--muted:#969696;--faint:#b9b9b9;
    --line:#e7e7e7;--paper:#fff;--wash:#f7f7f6;
    --serif:Georgia,"Times New Roman","Songti SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    font-family: var(--sans);
    background: repeating-linear-gradient(0deg,rgba(0,0,0,.008) 0,rgba(0,0,0,.008) 1px,transparent 1px,transparent 5px),#fff;
    color: var(--ink);
    min-height: 100vh; max-width: 390px; margin: 0 auto;
    padding-bottom: 90px; -webkit-font-smoothing: antialiased;
  }
  .topbar {
    height: 59px; padding: 0 22px;
    padding-top: calc(env(safe-area-inset-top,0px) + 12px);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid rgba(0,0,0,.055);
    background: rgba(255,255,255,.93);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .brand-rule { height: 24px; width: 1px; background: #dedede; flex-shrink: 0; }
  .brand-copy { min-width: 0; display: flex; flex-direction: column; }
  .brand-name { font: 400 15px/1 var(--serif); letter-spacing: .04em; color: var(--ink); }
  .brand-copy small { font-size: 8px; font-weight: 400; letter-spacing: .16em; color: #a0a0a0; margin-top: 5px; display: block; }
  .back-btn { border:0; background:transparent; padding:6px 8px 6px 0; color:#444; display:grid; place-items:center; }
  .back-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.45; stroke-linecap:round; stroke-linejoin:round; }

  #postCover { background: transparent; }
  #postCover img { filter: grayscale(1) contrast(1.03); display: block; width: 100%; border: 1px solid #eee; }

  .post-body { padding: 26px 22px 8px; position: relative; background: transparent; }
  .post-body::after { display: none; }

  .p-head { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; position: relative; }
  .p-head::before {
    content: "FORUM · DISCUSSION";
    position: absolute; top: -22px; left: 0;
    font-size: 8px; font-weight: 650; letter-spacing: .19em; color: #9a9a9a;
  }
  .p-avatar {
    width: 27px; height: 27px; border-radius: 50%;
    background: #ececec; color: #505050;
    display: grid; place-items: center;
    font: 11px var(--serif); font-weight: 400;
    box-shadow: none; flex-shrink: 0;
  }
  .p-name { font-size: 9px; font-weight: 600; color: #444; display: flex; align-items: center; gap: 6px; }
  .p-time { font-size: 8px; color: #aaa; margin-top: 3px; letter-spacing: .04em; }
  .p-tag {
    display: inline-block; font-size: 7px; color: #888;
    padding: 3px 4px; border: 1px solid #e6e6e6;
    margin-left: 0; vertical-align: 1px; letter-spacing: .04em;
    border-radius: 0; background: transparent;
  }
  .p-tag.ai { border-color: #444; color: #444; background: transparent; }
  .p-tag.me { border-color: #ddd; color: #888; background: transparent; }

  /* 正文：参考 post-title 版式 */
  .p-content {
    font-size: 15px; line-height: 1.55; font-weight: 650; letter-spacing: -.025em;
    color: var(--ink); margin-bottom: 14px; overflow-wrap: anywhere;
  }

  .p-actions {
    display: flex; gap: 13px; color: #999; font-size: 9px;
    padding-top: 13px; border-top: 1px solid #e8e8e8;
  }
  .p-act { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .p-act svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .p-act.liked { color: #171717; }
  .p-act.liked svg { fill: #171717; stroke: #171717; }

  /* 评论区：参考 feed-header + post 行 */
  .comments { padding: 0 22px; }
  .c-title {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    margin: 12px 0 0; padding-bottom: 11px; border-bottom: 1px solid #202020;
    font-size: 15px; font-weight: 650; letter-spacing: -.045em; color: var(--ink);
  }
  .c-title::after {
    content: "COMMENTS / " attr(data-count) "";
    font-size: 7px; letter-spacing: .17em; color: #aaa; font-weight: 400;
    font-family: var(--sans); font-style: normal;
  }
  .comment { display: grid; grid-template-columns: 27px minmax(0,1fr); gap: 11px; padding: 17px 0 16px; border-bottom: 1px solid #e8e8e8; }
  .comment:last-child { border-bottom: none; }
  .c-avatar {
    width: 27px; height: 27px; border-radius: 50%;
    background: #ececec; color: #505050;
    display: grid; place-items: center;
    font: 11px var(--serif); font-weight: 400;
    flex-shrink: 0; box-shadow: none;
  }
  .c-body { min-width: 0; }
  .c-name { font-size: 9px; font-weight: 600; color: #444; }
  .c-text { font-size: 11px; line-height: 1.95; color: #656565; margin-top: 3px; overflow-wrap: anywhere; }
  .c-time { font-size: 8px; color: #aaa; margin-top: 4px; letter-spacing: .04em; }
  .c-reply { font-size: 8px; color: #999; margin-top: 4px; margin-left: 10px; cursor: pointer; }
  .c-reply:hover { color: #171717; }
  .c-like { font-size: 8px; color: #999; margin-top: 4px; margin-left: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
  .c-like svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.4; }
  .c-like.liked { color: #171717; }
  .c-follow { font-size: 8px; color: #999; background: transparent; border: 1px solid #ddd; padding: 3px 6px; border-radius: 0; margin-left: 10px; cursor: pointer; }
  .c-follow.followed { background: transparent; color: #aaa; border-color: #eee; }
  .c-actions { display: flex; align-items: center; margin-top: 4px; }
  .c-replies { margin-left: 4px; margin-right: 30px; margin-top: 10px; padding-left: 0; border-left: 0; }
  .c-replies .comment { grid-template-columns: 22px minmax(0,1fr); gap: 9px; padding: 9px 0; border-bottom: 1px solid #ededed; }
  .c-replies .comment:last-child { border-bottom: none; }
  .c-replies .c-avatar { width: 22px; height: 22px; font: 9px var(--serif); }
  .c-replies .c-time { margin-top: 3px; }

  /* 评论输入栏：毛玻璃 + 下划线字段 */
  .comment-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 390px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border-top: 1px solid #e8e8e8;
    display: flex; gap: 12px; align-items: center;
    padding: 10px 22px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
  .comment-bar input {
    flex: 1; height: auto; background: transparent;
    border: 0; border-bottom: 1px solid #ddd;
    outline: none; padding: 6px 0; font-size: 12px;
    border-radius: 0; font-family: var(--sans); color: #252525;
  }
  .comment-bar input::placeholder { color: #b8b8b8; }
  .send-btn {
    width: auto; height: auto; border-radius: 2px;
    background: #181818; color: #fff; border: none;
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 10px 14px; font-size: 10px; letter-spacing: .05em; font-family: var(--sans);
  }
  .send-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.45; stroke-linecap: round; }
  /* 正文两段式：粗标题在上、细正文在下（编辑式） */
  .p-title { font-size: 15px; line-height: 1.55; font-weight: 650; letter-spacing: -.025em; color: var(--ink); overflow-wrap: anywhere; }
  .p-body { font-size: 11px; line-height: 1.95; color: #656565; margin: 9px 0 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  /* 回复提示条：清晰显示回复对象 */
  .reply-hint {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 390px;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 22px;
    background: rgba(255,255,255,.97);
    border-top: 1px solid #e8e8e8;
    font-size: 8px; color: #999; letter-spacing: .04em; z-index: 15;
  }
  .reply-hint .rh-label { color: #444; font-weight: 600; }
  .reply-hint button {
    border: 0; background: transparent; cursor: pointer; margin-left: auto;
    font-family: var(--serif); font-style: italic; font-size: 10px; color: #888;
    border-bottom: 1px solid #ccc; padding: 0 0 2px; letter-spacing: .03em;
  }
  /* 删除自己的评论 */
  .c-del { font-size: 8px; color: #999; margin-top: 4px; margin-left: 10px; cursor: pointer; }
  .c-del:hover { color: #171717; }
  .c-replies .c-del { margin-left: 8px; }
  /* 回复对象标注 */
  .c-at { font-size: 8px; color: #999; font-weight: 400; letter-spacing: .03em; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <button class="back-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand-rule"></div>
      <div class="brand-copy">
        <span class="brand-name">The Forum</span>
        <small>一个认真说话的地方</small>
      </div>
    </div>
  </div>

  <div id="postCover" style="display:none"></div>
  <div class="post-body">
    <div class="p-head">
      <div class="p-avatar" id="pAvatar"></div>
      <div>
        <div class="p-name" id="pName"></div>
        <div class="p-time" id="pTime"></div>
      </div>
    </div>
    <div class="p-content" id="pContent"></div>
    <div class="p-actions">
      <div class="p-act" id="likeBtn" onclick="toggleLike()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span id="likeCount">0</span>
      </div>
      <div class="p-act">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span id="commentCount">0</span>
      </div>
      <div class="p-act" onclick="aiReply()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.5 7.7H23l-6.2 4.5 2.4 7.3L12 16.8l-7.2 4.7 2.4-7.3L1 9.7h8.5z"/></svg>
        AI
      </div>
      <div class="p-act" onclick="sharePost()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3M7 8l5-5 5 5M5 13v7h14v-7"/></svg>
        分享
      </div>
    </div>
  </div>

  <div class="comments">
    <div class="c-title" data-count="0">评论与回复</div>
    <div id="commentList"></div>
  </div>

  <div class="reply-hint" id="replyHint" style="display:none">
    <span>回复</span><span class="rh-label" id="replyTargetName"></span>
    <button onclick="cancelReply()">取消</button>
  </div>

  <div class="comment-bar">
    <input type="text" id="commentInput" placeholder="给这段表达留一句回应…">
    <button class="send-btn" onclick="sendComment()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

<script>
  const RANDOM_NAMES = ['晚风', '橘子海', '七号公园', '北岛', '半糖', '青柠', '山顶洞人', '猫不语', '夏目', '木苏里', '阿柴', '远山', '七海', '星野', '落雨', '拾光'];
  const REPLIES = [
    '说得太对了！', '同感同感', '哈哈哈哈', '真的假的？',
    '我也这么觉得', '好有道理', '蹲一个后续', '前排围观',
    '太真实了', '笑死我了', '确实', '学到了学到了',
    '我也经历过', '这也太绝了', '码住', '👍👍👍'
  ];

  async function callAI(prompt) {
    try {
      const config = JSON.parse(localStorage.getItem('api_settings') || '{}');
      if (!config.apiKey) return null;
      const res = await fetch((config.baseUrl || 'https://api.openai.com/v1') + '/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + config.apiKey
        },
        body: JSON.stringify({
          model: config.model || 'gpt-3.5-turbo',
          messages: [{ role: 'user', content: prompt }],
          max_tokens: 100,
          temperature: 0.9
        })
      });
      const data = await res.json();
      return data.choices[0].message.content.trim();
    } catch(e) { return null; }
  }

  function getPostId() {
    return new URLSearchParams(location.search).get('id');
  }
  function loadPosts() {
    return JSON.parse(localStorage.getItem('forum_posts') || '[]');
  }
  function savePosts(arr) {
    localStorage.setItem('forum_posts', JSON.stringify(arr));
  }
  function timeAgo(ts) {
    const h = Math.floor((Date.now() - ts) / 3600000);
    if (h < 1) return '刚刚';
    if (h < 24) return h + '小时前';
    return Math.floor(h/24) + '天前';
  }
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function safeTime(t){ return (typeof t==='number') ? timeAgo(t) : (t || '刚刚'); }
  function postTitle(){ return post.title || ''; }
  function postBody(){ return post.body || post.content || ''; }

  let post = null;
  function loadPost() {
    const id = getPostId();
    const posts = loadPosts();
    post = posts.find(p => p.id === id);
    if (!post) { document.body.innerHTML = '<div style="padding:40px;text-align:center;">帖子不存在</div>'; return; }
    const rawComments = post.comments;
    if (!Array.isArray(post.comments)) post.comments = [];
    // 兼容旧数据结构：comments 为数字时保留其展示计数
    post._seedCount = (typeof rawComments === 'number' && rawComments > 0) ? rawComments : 0;
    renderPost();
    renderComments();
    if (new URLSearchParams(location.search).get('focus') === 'comment') {
      setTimeout(() => {
        const el = document.getElementById('commentInput');
        if (el) { el.scrollIntoView({ behavior:'smooth', block:'center' }); el.focus(); }
      }, 180);
    }
  }

  function renderPost() {
    const cover = document.getElementById('postCover');
    if (post.img && cover) {
      cover.style.display = 'block';
      cover.innerHTML = `<img src="${post.img}" style="width:100%;display:block">`;
    } else if (cover) cover.style.display = 'none';
    const avatarEl = document.getElementById('pAvatar');
    const av = post.avatar || '';
    if (av.indexOf('#') === 0) { avatarEl.style.background = av; avatarEl.textContent = (post.name || '?')[0]; }
    else { avatarEl.style.background = '#ececec'; avatarEl.textContent = (av && av.length === 1) ? av : (post.name || '?')[0]; }
    const tagHtml = post.tag === 'ai' ? '<span class="p-tag">AI</span>' : post.tag === 'me' ? '<span class="p-tag">ME</span>' : (post.role ? '<span class="p-tag">' + esc(post.role) + '</span>' : '');
    document.getElementById('pName').innerHTML = esc(post.name) + tagHtml;
    document.getElementById('pTime').textContent = safeTime(post.time);
    const title = postTitle(), body = postBody();
    document.getElementById('pContent').innerHTML =
      (title ? '<div class="p-title">' + esc(title) + '</div>' : '') +
      (body ? '<p class="p-body">' + esc(body) + '</p>' : '');
    document.getElementById('likeCount').textContent = post.likes || 0;
    const shownCount = (post._seedCount || 0) + post.comments.length;
    document.getElementById('commentCount').textContent = shownCount;
    const ct = document.querySelector('.c-title'); if (ct) ct.setAttribute('data-count', shownCount);
    document.getElementById('likeBtn').classList.toggle('liked', !!post.liked);
  }

  function isOwn(c) { return c.name === '我' || c.owner === 'me'; }

  function renderComments() {
    const list = document.getElementById('commentList');
    if (!post.comments.length) {
      list.innerHTML = '<div style="color:#b8b8b8;font-size:11px;padding:20px 0;text-align:center;">还没有回应——做第一个说点什么的人</div>';
      return;
    }
    list.innerHTML = post.comments.map((c, i) => `
      <div class="comment">
        <div class="c-avatar" style="background:${(c.avatar||'').indexOf('#')===0 ? c.avatar : '#ececec'}">${esc((c.avatar && c.avatar.length === 1) ? c.avatar : (c.name||'?')[0])}</div>
        <div class="c-body">
          <div class="c-name">${esc(c.name)}</div>
          <div class="c-text">${esc(c.text)}</div>
          <div class="c-actions">
            <span class="c-time">${safeTime(c.time)}</span>
            <span class="c-reply" onclick="replyTo(${i})">回复</span>
            <span class="c-like ${c.liked ? 'liked' : ''}" onclick="likeComment(${i})">
              <svg viewBox="0 0 24 24" fill="${c.liked ? '#171717' : 'none'}" stroke="${c.liked ? '#171717' : 'currentColor'}" stroke-width="1.4"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              ${c.likes || 0}
            </span>
            ${isOwn(c) ? '<span class="c-del" onclick="deleteComment(' + i + ')">删除</span>' : ''}
          </div>
          ${c.replies && c.replies.length ? `<div class="c-replies">${c.replies.map((r, j) => `
            <div class="comment">
              <div class="c-avatar" style="background:${(r.avatar||'').indexOf('#')===0 ? r.avatar : '#ececec'}">${esc((r.avatar && r.avatar.length === 1) ? r.avatar : (r.name||'?')[0])}</div>
              <div class="c-body">
                <div class="c-name">${esc(r.name)}${r.replyTo ? ' <span class="c-at">回复 ' + esc(r.replyTo) + '</span>' : ''}</div>
                <div class="c-text">${esc(r.text)}</div>
                <div class="c-actions">
                  <span class="c-time">${safeTime(r.time)}</span>
                  <span class="c-like ${r.liked ? 'liked' : ''}" onclick="likeReply(${i},${j})">
                    <svg viewBox="0 0 24 24" fill="${r.liked ? '#171717' : 'none'}" stroke="${r.liked ? '#171717' : 'currentColor'}" stroke-width="1.4"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    ${r.likes || 0}
                  </span>
                  ${isOwn(r) ? '<span class="c-del" onclick="deleteReply(' + i + ',' + j + ')">删除</span>' : ''}
                </div>
              </div>
            </div>
          `).join('')}</div>` : ''}
        </div>
      </div>
    `).join('');
  }

  function likeComment(i) {
    const c = post.comments[i];
    c.liked = !c.liked;
    c.likes = (c.likes || 0) + (c.liked ? 1 : -1);
    const posts = loadPosts();
    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) { posts[idx] = post; savePosts(posts); }
    renderComments();
  }

  function likeReply(i, j) {
    const r = post.comments[i].replies[j];
    r.liked = !r.liked;
    r.likes = (r.likes || 0) + (r.liked ? 1 : -1);
    const posts = loadPosts();
    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) { posts[idx] = post; savePosts(posts); }
    renderComments();
  }

  let replyToIdx = -1;
  function replyTo(idx) {
    replyToIdx = idx;
    document.getElementById('replyTargetName').textContent = '@' + (post.comments[idx].name || '匿名');
    document.getElementById('replyHint').style.display = 'flex';
    const input = document.getElementById('commentInput');
    input.placeholder = '回复 @' + (post.comments[idx].name || '匿名') + '…';
    input.focus();
  }
  function cancelReply() {
    replyToIdx = -1;
    document.getElementById('replyHint').style.display = 'none';
    document.getElementById('commentInput').placeholder = '给这段表达留一句回应…';
  }

  function saveNow() {
    try {
      const posts = loadPosts();
      const idx = posts.findIndex(p => p.id === post.id);
      if (idx >= 0) { posts[idx] = post; savePosts(posts); return true; }
    } catch(e) {}
    toast('保存失败，请重试');
    return false;
  }
  function toast(msg) {
    let t = document.getElementById('pageToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'pageToast';
      t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;background:rgba(22,22,22,.92);color:#fff;padding:9px 13px;font-size:10px;border-radius:2px;letter-spacing:.02em;pointer-events:none;opacity:0;transition:opacity .2s;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.style.opacity = '0'; }, 1600);
  }

  function deleteComment(i) {
    if (!isOwn(post.comments[i])) return;
    post.comments.splice(i, 1);
    if (replyToIdx >= i) { replyToIdx = -1; cancelReply(); }
    saveNow();
    renderComments();
    renderPost();
    toast('评论已删除');
  }
  function deleteReply(i, j) {
    const c = post.comments[i];
    if (!c || !c.replies || !isOwn(c.replies[j])) return;
    c.replies.splice(j, 1);
    saveNow();
    renderComments();
    renderPost();
    toast('回复已删除');
  }

  function toggleLike() {
    post.liked = !post.liked;
    post.likes += post.liked ? 1 : -1;
    const posts = loadPosts();
    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) { posts[idx] = post; savePosts(posts); }
    renderPost();
  }

  function sendComment() {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text) { toast('先写下一点内容吧'); input.focus(); return; }
    const replying = replyToIdx;
    if (replying >= 0) {
      const target = post.comments[replying];
      if (!target.replies) target.replies = [];
      target.replies.push({ name: '我', avatar: '#222', owner: 'me', text: text, time: Date.now(), replyTo: target.name });
    } else {
      post.comments.push({ name: '我', avatar: '#222', owner: 'me', text: text, time: Date.now() });
    }
    input.value = '';
    cancelReply();
    saveNow();
    renderComments();
    renderPost();

    setTimeout(async () => {
      const reply = REPLIES[Math.floor(Math.random() * REPLIES.length)];
      const colors = ['#222','#333','#444','#555','#666'];
      let replyText = reply;
      const ctx = postBody() || postTitle();
      const aiText = await callAI('你是论坛网友，楼主说："' + ctx + '"，我（' + (replying >= 0 ? post.comments[replying].name : RANDOM_NAMES[Math.floor(Math.random()*RANDOM_NAMES.length)]) + '）看到有人评论："' + text + '"，请用网友口吻写一条短回复，不超过20字，口语化。直接输出内容。');
      if (aiText) replyText = aiText.replace(/^[""]|[""]$/g, '');
      if (replying >= 0 && post.comments[replying] && post.comments[replying].replies) {
        post.comments[replying].replies.push({ name: post.comments[replying].name, avatar: post.comments[replying].avatar, text: replyText, time: Date.now(), replyTo: post.comments[replying].name });
      } else {
        post.comments.push({ name: RANDOM_NAMES[Math.floor(Math.random()*RANDOM_NAMES.length)], avatar: colors[Math.floor(Math.random()*colors.length)], text: replyText, time: Date.now() });
      }
      saveNow();
      renderComments();
      renderPost();
    }, 1000);
  }

  function sharePost() {
    let roles = [];
    try { roles = JSON.parse(localStorage.getItem('ai_custom_characters') || '[]'); } catch(e){}
    if (!roles.length) { alert('还没有联系人，先去加好友吧'); return; }
    const name = roles[0].name;
    const msg = '【分享帖子】' + (postBody() || postTitle()).substring(0, 50);
    let history = JSON.parse(localStorage.getItem('chat_history_' + roles[0].id) || '[]');
    history.push({ role: 'user', text: msg, time: Date.now(), type: 'text' });
    localStorage.setItem('chat_history_' + roles[0].id, JSON.stringify(history));
    alert('已分享给 ' + name);
  }

  function getFollows() { return JSON.parse(localStorage.getItem('forum_follows') || '[]'); }
  function isFollowing(name) { return getFollows().indexOf(name) >= 0; }
  function toggleFollow(name) {
    let f = getFollows();
    if (isFollowing(name)) f = f.filter(x => x !== name);
    else f.push(name);
    localStorage.setItem('forum_follows', JSON.stringify(f));
    renderComments();
  }

  async function aiReply() {
    const name = RANDOM_NAMES[Math.floor(Math.random() * RANDOM_NAMES.length)];
    const colors = ['#222','#333','#444','#555','#666'];
    let text = REPLIES[Math.floor(Math.random() * REPLIES.length)];
    const aiText = await callAI('你是论坛网友，看到这个帖子："' + (postBody() || postTitle()) + '"，请用' + name + '的口吻写一条短评论，不要超过20字，自然口语化，不要说"作为AI"。直接输出评论内容，不要加引号。');
    if (aiText) text = aiText.replace(/^[""]|[""]$/g, '');
    post.comments.push({ name: name, avatar: colors[Math.floor(Math.random()*colors.length)], text: text, time: Date.now() });
    const posts = loadPosts();
    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) { posts[idx] = post; savePosts(posts); }
    renderComments();
    renderPost();
  }

  loadPost();
</script>
</body>
</html>
