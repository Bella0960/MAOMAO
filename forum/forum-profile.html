<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>我的主页</title>
<script src="../js/font-loader.js"></script>
<script src="../js/native-feel.js"></script>
<script src="../js/phone/phone_storage.js"></script>
<link rel="stylesheet" href="../css/mobile-fit.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
    background: #F7F7F9; color: #111;
    min-height: 100vh; max-width: 390px; margin: 0 auto;
    padding-bottom: 40px;
  }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    position: sticky; top: 0; background: #fff; z-index: 10;
    border-bottom: 1px solid #F0F0F0;
  }
  .back-btn {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .title { font-size: 1rem; font-weight: 700; flex: 1; text-align: center; margin-right: 32px; }
  .profile { padding: 24px 16px; text-align: center; background: #fff; position: relative; }
  .settings-btn {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .big-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: #E8E8EC; margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 700; color: #666;
  }
  .nickname { font-size: 1.125rem; font-weight: 700; }
  .bio { font-size: 0.813rem; color: #999; margin-top: 4px; }
  .stats { display: flex; justify-content: center; gap: 32px; margin-top: 16px; }
  .stat-num { font-size: 1.125rem; font-weight: 700; }
  .stat-label { font-size: 0.625rem; color: #999; margin-top: 2px; }
  .section-label { padding: 16px 16px 10px; font-size: 0.75rem; font-weight: 700; color: #999; }
  .my-posts { padding: 0 16px; }
  .my-post {
    background: #fff; border-radius: 14px; padding: 14px;
    margin-bottom: 10px; cursor: pointer;
  }
  .my-post img { width: 100%; border-radius: 10px; margin-bottom: 8px; }
  .mp-content { font-size: 0.875rem; line-height: 1.5; }
  .mp-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.75rem; color: #999; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="back-btn" onclick="location.href='forum.html'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="title">我的主页</div>
  </div>

  <div class="profile">
    <div class="settings-btn" onclick="location.href='forum-settings.html'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>
    <div class="big-avatar" id="bigAvatar"></div>
    <div class="nickname" id="nickname"></div>
    <div class="bio" id="bio"></div>
    <div class="stats">
      <div><div class="stat-num" id="postCount">0</div><div class="stat-label">帖子</div></div>
      <div><div class="stat-num" id="likeCount">0</div><div class="stat-label">获赞</div></div>
      <div><div class="stat-num" id="followCount">0</div><div class="stat-label">关注</div></div>
    </div>
  </div>

  <div class="section-label">我的帖子</div>
  <div class="my-posts" id="myPosts"></div>

<script>
  try {
    const me = JSON.parse(localStorage.getItem('myProfile') || '{}');
    document.getElementById('bigAvatar').textContent = (me.nickname || '我')[0];
    document.getElementById('nickname').textContent = me.nickname || '我';
    document.getElementById('bio').textContent = me.sign || '这个人很懒，什么都没写';
  } catch(e){}

  const posts = JSON.parse(localStorage.getItem('forum_posts') || '[]');
  const myPosts = posts.filter(p => p.name === '我').sort((a,b) => b.time - a.time);
  document.getElementById('postCount').textContent = myPosts.length;
  document.getElementById('likeCount').textContent = myPosts.reduce((s, p) => s + (p.likes || 0), 0);
  document.getElementById('followCount').textContent = JSON.parse(localStorage.getItem('forum_follows') || '[]').length;

  document.getElementById('myPosts').innerHTML = myPosts.length ? myPosts.map(p => `
    <div class="my-post" onclick="location.href='forum-detail.html?id=${p.id}'">
      ${p.img ? `<img src="${p.img}">` : ''}
      <div class="mp-content">${p.content}</div>
      <div class="mp-foot">
        <span>${new Date(p.time).toLocaleDateString()}</span>
        <span>♥ ${p.likes || 0}</span>
      </div>
    </div>
  `).join('') : '<div style="text-align:center;color:#999;padding:40px 0;font-size:0.813rem;">还没发过帖子</div>';
</script>
</body>
</html>
