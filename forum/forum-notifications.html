<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>消息通知</title>
<script src="../js/font-loader.js"></script>
<script src="../js/native-feel.js"></script>
<script src="../js/phone/phone_storage.js"></script>
<link rel="stylesheet" href="../css/mobile-fit.css">
<style>
  :root{
    color-scheme:light;
    --ink:#181818;--body:#454545;--muted:#969696;--faint:#b9b9b9;
    --line:#e7e7e7;--paper:#fff;--wash:#f7f7f6;
    --serif:Georgia,"Times New Roman","Songti SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    font-family: var(--sans);
    background: repeating-linear-gradient(0deg,rgba(0,0,0,.008) 0,rgba(0,0,0,.008) 1px,transparent 1px,transparent 5px),#fff;
    color: var(--ink);
    min-height: 100vh; max-width: 390px; margin: 0 auto;
    padding-bottom: 40px; -webkit-font-smoothing: antialiased;
  }
  .topbar {
    height: 59px; padding: 0 22px;
    padding-top: calc(env(safe-area-inset-top,0px) + 12px);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid rgba(0,0,0,.055);
    background: rgba(255,255,255,.93);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .brand-rule { height: 24px; width: 1px; background: #dedede; flex-shrink: 0; }
  .brand-copy { min-width: 0; display: flex; flex-direction: column; }
  .brand-name { font: 400 15px/1 var(--serif); letter-spacing: .04em; color: var(--ink); }
  .brand-copy small { font-size: 8px; font-weight: 400; letter-spacing: .16em; color: #a0a0a0; margin-top: 5px; display: block; }
  .back-btn { border:0; background:transparent; padding:6px 8px 6px 0; color:#444; display:grid; place-items:center; }
  .back-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.45; stroke-linecap:round; stroke-linejoin:round; }
  .head-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .clear-btn {
    border: 0; background: transparent; cursor: pointer; padding: 4px 0;
    font-family: var(--serif); font-style: italic; font-size: 10px;
    color: #888; letter-spacing: .03em; border-bottom: 1px solid #ccc;
  }
  /* 参考 profile-head：刊头 */
  .profile-head { padding: 26px 22px 24px; border-bottom: 1px solid #ddd; }
  .overline { display:flex; align-items:center; justify-content:space-between; gap:8px; color:#9a9a9a; font-size:8px; letter-spacing:.19em; font-weight:650; }
  .edition { font-family: var(--serif); letter-spacing: .09em; color: #b1b1b1; white-space: nowrap; }
  .profile-title { font: 44px/.98 var(--serif); letter-spacing: -.07em; margin: 15px 0; color: var(--ink); }
  .profile-title span { color: #aaa; }
  .profile-copy { font-size: 11px; color: #777; line-height: 1.9; max-width: 290px; margin: 0; }
  /* 参考 feed-header */
  .feed-header { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:21px 22px 0; padding-bottom:11px; border-bottom:1px solid #202020; }
  .feed-header h2 { font-size: 15px; font-weight: 650; letter-spacing: -.045em; margin: 0; color: var(--ink); }
  .feed-header p { font-size: 7px; letter-spacing: .17em; color: #aaa; margin: 0; }
  /* 通知列表：参考 post 行 */
  #notifList { padding: 0 22px; }
  .notif { display: grid; grid-template-columns: 27px minmax(0,1fr); gap: 11px; padding: 17px 0 16px; border-bottom: 1px solid #e8e8e8; cursor: pointer; }
  .n-avatar-wrap { position: relative; flex-shrink: 0; }
  .n-avatar { width: 27px; height: 27px; border-radius: 50%; background: #ececec; color: #505050; display: grid; place-items: center; font: 11px var(--serif); overflow: hidden; box-shadow: none; }
  .n-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) contrast(1.03); }
  .n-icon-badge { display: none; }
  .n-text { font-size: 11px; line-height: 1.95; color: #656565; min-width: 0; }
  .n-text b { font-size: 9px; font-weight: 600; color: #444; }
  .n-content-snippet {
    font-size: 15px; line-height: 1.55; font-weight: 650; letter-spacing: -.025em; color: var(--ink);
    margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .n-time { font-size: 8px; color: #aaa; margin-top: 6px; letter-spacing: .04em; }
  /* 空状态：参考 empty-state */
  .empty { text-align: center; padding: 35px 20px 31px; border-top: 1px solid #e7e7e7; border-bottom: 1px solid #e7e7e7; font: 30px var(--serif); color: #b5b5b5; letter-spacing: .02em; line-height: 1.5; }
  .empty small { display: block; font-family: var(--sans); font-size: 10px; color: #999; margin-top: 12px; line-height: 1.8; letter-spacing: 0; font-weight: 400; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <button class="back-btn" onclick="location.href='forum.html'">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand-rule"></div>
      <div class="brand-copy">
        <span class="brand-name">The Forum</span>
        <small>一个认真说话的地方</small>
      </div>
    </div>
    <div class="head-actions">
      <button class="clear-btn" id="btnClearNotifs" type="button">全部清空</button>
    </div>
  </div>

  <section class="profile-head">
    <div class="overline"><span>COMMUNITY / INBOX</span><span class="edition">MESSAGES 01</span></div>
    <h1 class="profile-title">消息<span>.</span></h1>
    <p class="profile-copy">这里留给新的回应、被喜欢的文字，以及讨论里那些细小的连接。</p>
  </section>

  <div class="feed-header"><h2>最近的互动</h2><p>YOUR ACTIVITY</p></div>
  <div id="notifList"></div>

<script>
  function timeAgo(ts) {
    if (!ts) return '';
    var m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return '刚刚';
    if (m < 60) return m + '分钟前';
    var h = Math.floor(m / 60);
    if (h < 24) return h + '小时前';
    return Math.floor(h / 24) + '天前';
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var _storage = window.PhoneStorage;

  // 合并两个通知源
  function loadAllNotifs() {
    var arr = [];
    if (_storage) {
      arr = arr.concat(_storage.getForumNotifications());
      arr = arr.concat(_storage.getMomentsNotifications());
    } else {
      try { arr = arr.concat(JSON.parse(localStorage.getItem('forum_notifications') || '[]')); } catch (e) {}
      try { arr = arr.concat(JSON.parse(localStorage.getItem('moments_notifications') || '[]')); } catch (e) {}
    }
    // 按时间倒序
    arr.sort(function (a, b) { return (b.time || 0) - (a.time || 0); });
    return arr;
  }

  function clearAllNotifs() {
    if (_storage) {
      _storage.saveForumNotifications([]);
      _storage.saveMomentsNotifications([]);
      return;
    }
    localStorage.removeItem('forum_notifications');
    localStorage.removeItem('moments_notifications');
    render();
  }

  // 类型对应的图标和标签
  var TYPE_META = {
    like:     { cls: 'like',     icon: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>', badgeText: '赞了' },
    comment:  { cls: 'comment',  icon: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>', badgeText: '评论了' },
    mention_reply: { cls: 'mention', icon: '<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/>', badgeText: '回复了你' },
    new_post: { cls: 'post',     icon: '<path d="M12 5v14M5 12h14"/>', badgeText: '发布了' }
  };

  function renderAvatarHtml(n) {
    if (n.actorAvatar) {
      return '<div class="n-avatar"><img src="' + escapeHtml(n.actorAvatar) + '" alt=""></div>';
    }
    // 旧 forum 通知可能只给了 n.avatar（颜色）和 n.name
    if (n.avatar && typeof n.avatar === 'string' && n.avatar.indexOf('#') === 0) {
      return '<div class="n-avatar" style="background:' + escapeHtml(n.avatar) + '">' + escapeHtml((n.name || 'U')[0]) + '</div>';
    }
    // 兜底：按名字首字 + 固定灰色
    var firstChar = (n.actorName || n.name || 'U')[0];
    return '<div class="n-avatar" style="background:#C7C7CC;">' + escapeHtml(firstChar) + '</div>';
  }

  function render() {
    var arr = loadAllNotifs();
    var list = document.getElementById('notifList');
    if (!arr.length) {
      list.innerHTML = '<div class="empty">还没有通知<br><small>有人赞你、评论你、@你会在这里显示</small></div>';
      return;
    }
    list.innerHTML = arr.map(function (n) {
      var typeMeta = TYPE_META[n.type] || null;
      var badgeHtml = typeMeta ?
        '<div class="n-icon-badge ' + typeMeta.cls + '"><svg viewBox="0 0 24 24">' + typeMeta.icon + '</svg></div>' : '';
      var snippetHtml = n.postContent ?
        '<div class="n-content-snippet">' + escapeHtml(n.postContent) + '</div>' : '';
      var text = n.text || (typeMeta ? typeMeta.badgeText + '动态' : '');
      return '<div class="notif">' +
        '<div class="n-avatar-wrap">' +
          renderAvatarHtml(n) +
          badgeHtml +
        '</div>' +
        '<div class="n-text">' +
          '<b>' + escapeHtml(n.actorName || n.name || '匿名') + '</b> ' + escapeHtml(text) +
          snippetHtml +
          '<div class="n-time">' + escapeHtml(timeAgo(n.time)) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('btnClearNotifs').addEventListener('click', function () {
    if (confirm('确定清空全部通知？')) clearAllNotifs();
  });

  render();
  // 每次打开页面时刷新（可能 moments.html 刚刚写入了新通知）
  window.addEventListener('pageshow', render);
</script>
</body>
</html>
