.pull-refresh{display:flex;align-items:center;justify-content:center;gap:7px;height:0;padding:0;overflow:hidden;font-size:8px;color:#aaa;letter-spacing:.18em;transition:height .3s cubic-bezier(.34,1.2,.64,1)}
.pull-refresh.show{height:44px}

.pr-spinner{width:11px;height:11px;flex:0 0 11px;border:2px solid #ddd;border-top-color:#181818;border-radius:50%;opacity:0}
.pull-refresh.show .pr-spinner{opacity:1}

<body>
<div class="forum-app">
  <header class="topbar">
    <div class="brand"><button class="back-button" id="backButton" aria-label="返回"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="brand-rule"></div><div class="brand-copy"><div class="brand-name">The Forum</div><div class="brand-caption">一个认真说话的地方</div></div></div>

  </main>

    <button class="nav-item" data-page="discover"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span>发现</span></button>
    <button class="nav-item" data-page="notice"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span>消息</span><i class="nav-dot" id="noticeDot" hidden></i></button>
    <button class="nav-item" data-page="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>我的</span></button>

    <section class="sheet"><div class="grabber"></div><div class="sheet-head"><div><div class="sheet-title" id="composeTitle">写点什么。</div><div class="sheet-subtitle">A NOTE TO THE COMMUNITY</div></div><button class="sheet-close" id="closeCompose" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <label class="field-label" for="draftTitle">标题 · 可留空</label><input class="field" id="draftTitle" maxlength="80" placeholder="给这段话一个名字">
      <label class="field-label" for="draftBody">正文</label><textarea class="field-area" id="draftBody" maxlength="3000" placeholder="你可以从一个小发现、一句疑问，或者今天的某个瞬间开始……"></textarea>

    </section>
  </div>

</div>

let posts=loadPosts(),page='home',topicFilter='全部',sortMode='最新',searchText='',searchOpen=false,notificationsRead=false;
const $=id=>document.getElementById(id);const root=$('viewRoot'),scroll=$('scrollArea');
function loadPosts(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(Array.isArray(s)&&s.length){let list=s.map(x=>({...x}));const isUser=p=>p.owner==='me'||p.tag==='me'||String(p.id).indexOf('user_')===0;const isLegacySeed=p=>String(p.id).indexOf('seed_')===0;const isRefSeed=p=>p.title&&p.body&&String(p.id).indexOf('user_')!==0;const keep=list.filter(p=>isUser(p)||(isRefSeed(p)&&!isLegacySeed(p)));const merged=seeded.map(x=>({...x}));keep.forEach(u=>{if(!merged.some(m=>m.id===u.id))merged.unshift(u)});return merged}return seeded.map(x=>({...x}))}catch(e){return seeded.map(x=>({...x}))}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(posts));return true}catch(e){toast('本机存储空间不足，暂时无法保存');return false}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(name){const paths={heart:'<path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6l1.2 1.2L12 21l7.6-7.6 1.2-1.2a5.4 5.4 0 0 0 0-7.6Z"/>',comment:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.7 8.7 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8v.5Z"/>',share:'<path d="M12 16V3M7 8l5-5 5 5M5 13v7h14v-7"/>'};return '<svg viewBox="0 0 24 24">'+(paths[name]||'')+'</svg>'}
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
function timeAgo(ts){const h=Math.floor((Date.now()-ts)/3600000);if(h<1)return '刚刚';if(h<24)return h+'小时前';return Math.floor(h/24)+'天前'}
function countComments(p){return Array.isArray(p.comments)?p.comments.length:Number(p.comments||0)}
/* 视图模型：兼容旧数据（content 单文本）与新数据（title+body） */
function vm(p){
  return {id:p.id,name:p.name,
    avatar:(p.avatar&&typeof p.avatar==='string'&&p.avatar.length===1)?p.avatar:p.name.slice(0,1),
    role:(p.tag==='ai'?'AI':p.tag==='me'?'ME':(p.role||'')),
    topic:p.topic||'碎碎念',
    time:(typeof p.time==='number')?timeAgo(p.time):(p.time||'刚刚'),
    title:p.title||(p.body?'':(p.content||'')),body:p.body||(p.title?(p.content||''):''),
    likes:Number(p.likes||0),comments:Array.isArray(p.comments)?p.comments.length:Number(p.comments||0),
    liked:!!p.liked,featured:!!p.featured,owner:p.owner||(p.tag==='me'?'me':''),
    created:p.created||(typeof p.time==='number'?p.time:0)}
}
function filteredPosts(){let list=posts.map(vm);if(topicFilter!=='全部')list=list.filter(p=>p.topic===topicFilter);if(searchText.trim()){const q=searchText.toLowerCase();list=list.filter(p=>[p.name,p.title,p.body,p.topic].join(' ').toLowerCase().includes(q))}if(page==='hot')list.sort((a,b)=>Number(b.likes||0)-Number(a.likes||0));else if(sortMode==='回应最多')list.sort((a,b)=>Number(b.comments||0)-Number(a.comments||0));else list.sort((a,b)=>Number(b.created||0)-Number(a.created||0));return list}
function getThemeTopics(){let cfg={};try{cfg=JSON.parse(localStorage.getItem('forum_config')||'{}')}catch(e){}const t=cfg.theme||'';if(typeof t==='string'&&t.indexOf('custom_')===0){const c=(cfg.customThemes||[]).find(x=>x.id===t);if(c&&Array.isArray(c.topics)&&c.topics.length)return ['全部'].concat(c.topics)}return ['全部','今日话题','深夜食堂','碎碎念','生活观察','随手分享']}
function renderPost(p,index){const isFeatured=!!p.featured&&page==='home'&&topicFilter==='全部'&&!searchText;return '<article class="post" data-post="'+esc(p.id)+'"><div class="post-avatar '+(index%3===0?'gray':'')+'">'+esc(p.avatar||p.name.slice(0,1))+'</div><div class="post-main"><div class="post-meta"><div class="post-user">'+esc(p.name)+(p.role?'<span class="author-tag">'+esc(p.role)+'</span>':'')+'</div><span class="post-time">'+esc(p.time||'刚刚')+'</span></div>'+(p.title?'<h3 class="post-title">'+esc(p.title)+'</h3>':'')+'<p class="post-body">'+esc(p.body||'')+'</p><span class="post-topic"># '+esc(p.topic||'碎碎念')+'</span><div class="post-bottom"><div class="post-actions"><button class="quiet-action '+(p.liked?'liked':'')+'" data-like="'+esc(p.id)+'" aria-label="点赞">'+icon('heart')+'<span>'+Number(p.likes||0)+'</span></button><button class="quiet-action" data-comment="'+esc(p.id)+'" aria-label="评论">'+icon('comment')+'<span>'+Number(p.comments||0)+'</span></button><button class="quiet-action" data-share="'+esc(p.id)+'" aria-label="分享">'+icon('share')+'</button></div><span class="post-endmark">Nº '+String(index+1).padStart(2,'0')+'</span></div></div></article>'}
function renderHome(){const list=filteredPosts();const featured=page==='hot'?null:(list.find(p=>p.featured)||list[0]);const topics=getThemeTopics();return '<section class="masthead"><div class="overline"><span>MAOMAO COMMUNITY</span><span class="edition">FIELD NOTES · 2026</span></div><h1>FORUM<span>.</span></h1><div class="masthead-subrow"><p>讨论档案 / 不赶时间的公共客厅。<br>这里有问题，也有慢慢展开的生活。</p><div class="issue-number"><strong>001—026</strong><small>OPEN DISCUSSIONS</small></div></div><div class="masthead-rule">A PLACE FOR THOUGHTS</div></section>'+(searchOpen?'<div class="search-panel show"><div class="search-input-wrap">'+icon('search')+'<input id="searchInput" type="search" placeholder="搜索帖子、话题或昵称" value="'+esc(searchText)+'"><button id="clearSearch">清除</button></div></div>':'')+'<section class="topic-section"><div class="section-label"><h2>正在发生的话题</h2><span>TOPICS / 06</span></div><div class="topics">'+topics.map(t=>'<button class="topic '+(topicFilter===t?'active':'')+'" data-topic="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div></section>'+(featured&&topicFilter==='全部'&&!searchText?'<section class="featured" data-post="'+esc(featured.id)+'"><div class="feature-meta"><span>QUESTION OF THE DAY · 01</span><span class="stamp">TODAY / OPEN</span></div><h2 class="feature-heading">今天的你，<em>有没有一件</em><br>很小但很开心的事？</h2><p class="feature-deck">不必是什么大事。路上刚好吹来的风、买到了喜欢的东西，或者忙完之后终于坐下来发了会儿呆。</p><div class="feature-byline"><div class="author-inline"><span class="avatar">宝</span><span class="author-name">宝宝<small>发起今日话题 · 刚刚</small></span></div><div class="feature-actions"><button class="quiet-action '+(featured.liked?'liked':'')+'" data-like="'+esc(featured.id)+'">'+icon('heart')+'<span>'+Number(featured.likes||0)+'</span></button><button class="quiet-action" data-comment="'+esc(featured.id)+'">'+icon('comment')+'<span>'+Number(featured.comments||0)+'</span></button></div></div></section>':'')+'<div class="feed-header"><h2>'+(page==='hot'?'正在升温':'最近在聊')+'</h2><p>'+(page==='hot'?'MOST TALKED ABOUT':'LATEST / NOTES')+'</p></div><div class="sort-tabs"><button class="sort-tab '+(sortMode==='最新'?'active':'')+'" data-sort="最新">最新</button><button class="sort-tab '+(sortMode==='回应最多'?'active':'')+'" data-sort="回应最多">回应最多</button></div>'+(list.length?'<div class="post-list">'+list.filter(p=>!(p.featured&&page==='home'&&topicFilter==='全部'&&!searchText)).map((p,i)=>renderPost(p,i+1)).join('')+'</div>':'<div class="empty-state"><strong>— 01 —</strong><h3>这里暂时还没有内容</h3><p>换个话题看看，或写下你的第一段话。</p><button class="text-button" data-compose="1">写一篇帖子 ↗</button></div>')}
function renderNotice(){const mine=posts.filter(p=>p.liked);return '<section class="profile-head"><div class="overline"><span>COMMUNITY / INBOX</span><span class="edition">MESSAGES 01</span></div><h1 class="profile-title">消息<span style="color:#aaa">.</span></h1><p class="profile-copy">这里留给新的回应、被喜欢的文字，以及讨论里那些细小的连接。</p></section><div class="feed-header"><h2>最近的互动</h2><p>YOUR ACTIVITY</p></div>'+(mine.length?'<div class="post-list">'+mine.map((p,i)=>'<article class="post"><div class="post-avatar gray">♡</div><div class="post-main"><div class="post-meta"><div class="post-user">你喜欢了这段表达</div><span class="post-time">刚刚</span></div><h3 class="post-title">'+esc(p.title||p.body.slice(0,36))+'</h3><p class="post-body">来自 '+esc(p.name)+' · # '+esc(p.topic)+'</p><div class="post-bottom"><span class="post-endmark">SAVED TO YOUR ACTIVITY</span></div></div></article>').join('')+'</div>':'<div class="empty-state"><strong>inbox / 0</strong><h3>一切安静</h3><p>当你点赞或参与讨论，这里会留下你的互动记录。</p><button class="text-button" data-gohome="1">回到讨论 ↗</button></div>')}
function renderMe(){const mine=posts.filter(p=>p.owner==='me');return '<section class="profile-head"><div class="overline"><span>YOUR LITTLE CORNER</span><span class="edition">PROFILE / 001</span></div><h1 class="profile-title">我的<span style="color:#aaa">.</span></h1><p class="profile-copy">一个不必时时在线的角落。你写下的内容保存在当前浏览器里，可以随时回来继续说。</p><div class="profile-stats"><div class="profile-stat"><strong>'+mine.length+'</strong><span>我的帖子</span></div><div class="profile-stat"><strong>'+posts.filter(p=>p.liked).length+'</strong><span>我喜欢的</span></div><div class="profile-stat"><strong>'+posts.length+'</strong><span>社区记录</span></div></div></section><div class="feed-header"><h2>我的表达</h2><p>YOUR NOTES</p></div>'+(mine.length?'<div class="post-list">'+mine.map((p,i)=>renderPost(vm(p),i)).join('')+'</div>':'<div class="empty-state"><strong>Dear, you.</strong><h3>先写下第一段话</h3><p>不需要很正式。一个念头、一件小事，都可以成为开始。</p><button class="text-button" data-compose="1">写一篇帖子 ↗</button></div>')}
function renderDiscover(){const vms=posts.map(vm);const tCount={};vms.forEach(p=>{const t=p.topic||'碎碎念';tCount[t]=(tCount[t]||0)+1});const hotRows=Object.keys(tCount).sort((a,b)=>tCount[b]-tCount[a]).slice(0,5);const rec=vms.slice().sort((a,b)=>((b.likes||0)+Number(b.comments||0))-((a.likes||0)+Number(a.comments||0))).slice(0,4);const cols=getThemeTopics();return '<section class="masthead"><div class="overline"><span>DISCOVER</span><span class="edition">CURATED / 01</span></div><h1>发现<span>.</span></h1><div class="masthead-subrow"><p>栏目、热门话题与值得推荐的内容。<br>在这里，慢慢逛。</p><div class="issue-number"><strong>'+String(posts.length).padStart(3,'0')+'</strong><small>OPEN DISCUSSIONS</small></div></div><div class="masthead-rule">A PLACE FOR THOUGHTS</div></section>'+(searchOpen?'<div class="search-panel show"><div class="search-input-wrap">'+icon('search')+'<input id="searchInput" type="search" placeholder="搜索帖子、话题或昵称" value="'+esc(searchText)+'"><button id="clearSearch">清除</button></div></div>':'')+'<section class="topic-section"><div class="section-label"><h2>栏目</h2><span>COLUMNS / '+cols.length+'</span></div><div class="topics">'+cols.map(t=>'<button class="topic '+(topicFilter===t?'active':'')+'" data-topic="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div></section>'+(hotRows.length?'<div class="feed-header"><h2>热门话题</h2><p>TOP TALKING</p></div><div class="post-list">'+hotRows.map((t,i)=>'<a class="rank-row" data-topic="'+esc(t)+'" href="javascript:void(0)"><span class="rank-no">'+String(i+1).padStart(2,'0')+'</span><span class="rank-main">'+esc(t)+'<small>'+tCount[t]+' 篇讨论</small></span></a>').join('')+'</div>':'')+(rec.length?'<div class="feed-header"><h2>推荐内容</h2><p>RECOMMENDED</p></div><div class="post-list">'+rec.map((p,i)=>renderPost(p,i+1)).join('')+'</div>':'<div class="empty-state"><strong>— 01 —</strong><h3>这里暂时还没有内容</h3><p>写下你的第一段话，让更多人来发现。</p><button class="text-button" data-compose="1">写一篇帖子 ↗</button></div>')}
function render(){document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));root.innerHTML=page==='discover'?renderDiscover():page==='notice'?renderNotice():page==='me'?renderMe():renderHome();$('noticeDot').hidden=notificationsRead||!posts.some(p=>p.owner==='me');if(searchOpen&&$('searchInput')){$('searchInput').focus();$('searchInput').addEventListener('input',function(){const pos=this.selectionStart;searchText=this.value;render();const i=$('searchInput');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}});$('clearSearch').addEventListener('click',()=>{searchText='';render()})}}
function openCompose(){ $('draftTitle').value='';$('draftBody').value='';$('draftTopic').value=topicFilter!=='全部'?topicFilter:'今日话题';$('draftAlias').value='路过的人';$('composeOverlay').classList.add('show');setTimeout(()=>$('draftBody').focus({preventScroll:true}),140)}function closeCompose(){$('composeOverlay').classList.remove('show')}
function submitPost(){const title=$('draftTitle').value.trim(),body=$('draftBody').value.trim(),name=$('draftAlias').value.trim()||'我';if(!title&&!body){toast('先写下一点内容吧');$('draftBody').focus();return}const p={id:'user_'+Date.now().toString(36),name:name,avatar:name.slice(0,1),role:'user',topic:$('draftTopic').value,time:'刚刚',title:title,body:body,likes:0,comments:[],liked:false,owner:'me',created:Date.now(),tag:'me',content:(title?title+'\n':'')+body};posts.unshift(p);if(!save()){posts.shift();return}page='home';searchText='';searchOpen=false;topicFilter='全部';closeCompose();render();scroll.scrollTop=0;toast('帖子已发布')}
function likePost(id){const p=posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes=Math.max(0,Number(p.likes||0)+(p.liked?1:-1));save();render()}
function commentPost(id){location.href='forum-detail.html?id='+id+'&focus=comment'}
function sharePost(id){const p=posts.find(x=>x.id===id);if(!p)return;const txt=(p.title?p.title+'\n':'')+(p.body||p.content||'')+'\n\n— '+p.name+' / #'+(p.topic||'碎碎念');if(navigator.share){navigator.share({title:p.title||'论坛帖子',text:txt}).catch(()=>{})}else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);toast('帖子内容已复制')}}
root.addEventListener('click',function(e){const t=e.target.closest('[data-topic]');if(t){topicFilter=t.dataset.topic;page='home';render();return}const s=e.target.closest('[data-sort]');if(s){sortMode=s.dataset.sort;if(sortMode==='回应最多')posts.sort((a,b)=>Number(countComments(b))-Number(countComments(a)));render();return}const l=e.target.closest('[data-like]');if(l){likePost(l.dataset.like);return}const c=e.target.closest('[data-comment]');if(c){location.href='forum-detail.html?id='+c.dataset.comment+'&focus=comment';return}const sh=e.target.closest('[data-share]');if(sh){sharePost(sh.dataset.share);return}const card=e.target.closest('.post[data-post]');if(card){location.href='forum-detail.html?id='+card.dataset.post;return}const feat=e.target.closest('.featured[data-post]');if(feat){location.href='forum-detail.html?id='+feat.dataset.post;return}if(e.target.closest('[data-compose]')){openCompose();return}if(e.target.closest('[data-gohome]')){page='home';render();return}});
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.page;if(p==='notice'){location.href='forum-notifications.html';return}if(p==='me'){location.href='forum-profile.html';return}page=p;render();scroll.scrollTop=0}));$('composeTop').addEventListener('click',openCompose);$('closeCompose').addEventListener('click',closeCompose);$('composeOverlay').addEventListener('click',e=>{if(e.target===$('composeOverlay'))closeCompose()});$('submitPost').addEventListener('click',submitPost);$('searchToggle').addEventListener('click',()=>{if(page!=='home')page='home';searchOpen=!searchOpen;render();scroll.scrollTop=0});$('backButton').addEventListener('click',()=>{if(history.length>1)history.back();else toast('这是独立页面预览')});
/* ===== 下拉刷新：适配内部滚动容器 ===== */
let prStartY=0,prPulling=false,prReady=false;
const prEl=()=>document.getElementById('pullRefresh');
const prText=()=>document.getElementById('pullRefreshText');
const prSpinner=()=>document.getElementById('pullRefreshSpinner');
scroll.addEventListener('touchstart',e=>{if(scroll.scrollTop<=0){prStartY=e.touches[0].clientY;prPulling=true;prReady=false}},{passive:true});
scroll.addEventListener('touchmove',e=>{
  if(!prPulling)return;
  const dy=e.touches[0].clientY-prStartY;
  const el=prEl();
  if(dy<=0){prReady=false;el.classList.remove('show','pulling');el.style.height='';return}
  prReady=dy>70;
  el.classList.add('show','pulling');
  el.style.height=Math.min(dy*0.6,58)+'px';
  prSpinner().style.transform='rotate('+Math.min(dy*3,300)+'deg)';
  prText().textContent=prReady?'松开刷新':'下拉刷新';
},{passive:true});
scroll.addEventListener('touchend',()=>{
  const el=prEl();
  el.classList.remove('pulling');
  if(prPulling&&prReady){
    el.classList.add('show','loading');
    el.style.height='';
    prSpinner().style.transform='';
    prText().textContent='正在刷新';
    refreshFeed();
    setTimeout(()=>{
      el.classList.remove('loading');
      el.classList.add('done');
      prText().textContent='已更新';
      setTimeout(()=>{el.classList.remove('show','done');prText().textContent='下拉刷新'},420);
    },520);
  }else if(el.classList.contains('show')){el.classList.remove('show');el.style.height=''}
  prPulling=false;prReady=false;
},{passive:true});
function refreshFeed(){
  const cur=posts.slice();
  const mine=cur.filter(p=>p.owner==='me');
  const others=cur.filter(p=>p.owner!=='me'&&String(p.id).indexOf('seed_')!==0);
  const keepSeeds=cur.filter(p=>p.owner!=='me'&&String(p.id).indexOf('seed_')===0);
  const seeds=seeded.map(s=>({...s}));
  posts=mine.concat(others).concat(keepSeeds);
  seeds.forEach(s=>{if(!posts.some(p=>p.id===s.id))posts.push({...s})});
  save();render();
}
save();render();
})();
</script>
