<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色管理</title>
    <script src="../js/font-loader.js"></script>
    <script src="../js/native-feel.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            color: #111111;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .phone-mockup {
            position: relative;
            width: min(390px, calc(100vw - 24px));
            height: min(844px, calc(100vh - 24px));
            background-color: #FFFFFF;
            border-radius: 45px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 8px solid #ffffff;
            display: flex;
            flex-direction: column;
        }
        .status-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 14px 28px;
            font-size: 0.813rem;
            font-weight: 500;
            color: #111111;
            z-index: 50;
            pointer-events: none;
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            letter-spacing: .03em;
        }

        /* 顶部：圆形返回 + 大英文标题靠左 + 右侧小按钮 */
        .header {
            padding: calc(56px + env(safe-area-inset-top, 0px)) 22px 16px;
            background-color: #FFFFFF;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #editorView .header {
            background-color: #FFFFFF;
        }
        .back-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #F8F8FA;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111111;
            text-decoration: none;
            font-size: 1.25rem;
            line-height: 1;
            flex-shrink: 0;
            transition: transform .2s ease, background .2s ease;
        }
        .back-circle:active {
            transform: scale(0.95);
            background: #EEEEF0;
        }
        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #111111;
            letter-spacing: -0.02em;
            flex: 1;
            margin-left: 14px;
        }
        .btn-header {
            background: #111111;
            color: #FFFFFF;
            font-size: 0.75rem;
            font-weight: 600;
            border: none;
            padding: 8px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: none;
            flex-shrink: 0;
            transition: transform .2s ease;
        }
        .btn-header:active { transform: scale(0.95); }
        .btn-header svg { display: block; }

        /* 列表视图 */
        .view-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .role-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 24px !important;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: none;
        }
        .role-list::-webkit-scrollbar { display: none; }

        /* 列表卡片：纯净灰底，无玻璃拟态 */
        .role-slim-bar {
            background: #F8F8FA;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-radius: 16px;
            padding: 12px 14px;
            border: none;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .role-slim-bar:active {
            background: #EEEEF0;
            transform: scale(0.98);
        }
        .role-slim-bar.active-role {
            background: #F0F0F2;
        }

        .bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            flex: 1;
        }

        .slim-avatar {
            width: 40px;
            height: 40px;
            background: #EEEEF0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            flex-shrink: 0;
            object-fit: cover;
        }

        .slim-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .slim-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .slim-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: #111111;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .slim-tag {
            font-size: 0.625rem;
            font-weight: 500;
            color: #999999;
            background: #EEEEF0;
            padding: 2px 6px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .slim-desc {
            font-size: 0.75rem;
            color: #999999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.688rem;
            font-weight: 500;
            color: #666666;
            flex-shrink: 0;
        }

        .bar-right .act-opt {
            background: none;
            border: none;
            padding: 4px 6px;
            font: inherit;
            color: #666666;
            cursor: pointer;
            transition: color 0.2s;
        }

        /* 删除按钮改灰阶，不用红色 */
        .bar-right .act-opt.del {
            color: #999999;
        }
        .bar-right .act-opt.del:active {
            color: #666666;
        }

        .empty-tip { text-align: center; color: #999999; font-size: 0.875rem; padding: 40px 0; }

        /* 编辑页面表单视图 */
        .editor-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: none;
            background-color: #FFFFFF;
        }
        .editor-container::-webkit-scrollbar { display: none; }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0 0;
        }
        .avatar-bubble-wrapper {
            position: relative;
            cursor: pointer;
            width: 80px;
            height: 80px;
        }
        .editor-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 1.875rem;
            transition: transform 0.2s ease;
            user-select: none;
            object-fit: cover;
        }
        .avatar-bubble-wrapper:active .editor-avatar {
            transform: scale(0.96);
        }
        .avatar-badge-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 26px;
            height: 26px;
            background: #FFFFFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            font-size: 0.75rem;
            color: #666666;
            border: 1px solid #EEEEF0;
        }

        .editor-field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .field-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #999999;
            padding-left: 2px;
            letter-spacing: 0.02em;
        }

        .form-input {
            width: 100%;
            height: 48px;
            background-color: #F8F8FA;
            border: none;
            border-radius: 16px;
            padding: 0 16px;
            font-size: 0.938rem;
            color: #111111;
            outline: none;
            font-family: inherit;
            transition: background 0.2s ease;
        }
        .form-input:focus {
            background-color: #FFFFFF;
            box-shadow: inset 0 0 0 1px #E5E5EA;
        }

        .form-textarea {
            width: 100%;
            min-height: 120px;
            background-color: #F8F8FA;
            border: none;
            border-radius: 16px;
            padding: 14px 16px;
            font-size: 0.875rem;
            line-height: 1.6;
            color: #111111;
            outline: none;
            font-family: inherit;
            resize: none;
            transition: background 0.2s ease;
        }
        .form-textarea.tone {
            min-height: 100px;
        }
        .form-textarea:focus {
            background-color: #FFFFFF;
            box-shadow: inset 0 0 0 1px #E5E5EA;
        }
        .form-textarea::placeholder {
            color: #B0B0B5;
            font-size: 0.813rem;
        }

        .btn-save-fixed {
            height: 52px;
            background-color: #111111;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: auto;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .btn-save-fixed:active {
            opacity: 0.85;
            transform: scale(0.98);
        }

        .btn-header-cancel {
            color: #111111;
            font-size: 1.25rem;
            background: #F8F8FA;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            flex-shrink: 0;
            transition: transform .2s ease, background .2s ease;
        }
        .btn-header-cancel:active {
            transform: scale(0.95);
            background: #EEEEF0;
        }

        .hidden {
            display: none !important;
        }

        .floating-nav {
            display: none !important;
        }

        .editor-container,
        .editor-container input,
        .editor-container textarea {
            user-select: text;
            -webkit-user-select: text;
        }

        /* 绑定世界书：极简多选列表 */
        .wb-bind-list {
            display: flex;
            flex-direction: column;
            max-height: 200px;
            overflow-y: auto;
            scrollbar-width: none;
            border-radius: 16px;
        }
        .wb-bind-list::-webkit-scrollbar { display: none; }
        .wb-bind-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 48px;
            padding: 0 16px;
            background: #F8F8FA;
            border-radius: 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .wb-bind-item:last-child { margin-bottom: 0; }
        .wb-bind-item:active { background: #EEEEF0; }
        .wb-bind-name {
            font-size: 0.875rem;
            color: #111111;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 12px;
        }
        .wb-bind-circle {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1.5px solid #E5E5EA;
            background: transparent;
            position: relative;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .wb-bind-item.is-checked { background: #F0F0F2; }
        .wb-bind-item.is-checked .wb-bind-circle {
            background: #111111;
            border-color: #111111;
        }
        .wb-bind-item.is-checked .wb-bind-circle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #FFFFFF;
        }
        .wb-bind-empty {
            font-size: 0.75rem;
            color: #999999;
            padding: 12px 4px;
        }
    </style>
<link rel="stylesheet" href="../css/mobile-fit.css">
</head>
<body>
    <div class="phone-mockup">
        <div class="status-bar"><span>09:41</span></div>
        
        <!-- 角色列表界面 -->
        <div class="view-section" id="listView">
            <header class="header">
                <a class="back-circle" href="../index.html" aria-label="返回主屏幕">‹</a>
                <h1 class="header-title">Contacts</h1>
                <button class="btn-header" id="btnAddRole" type="button"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg><span>添加</span></button>
            </header>
            <main class="role-list" id="roleListContainer"></main>
        </div>

        <!-- 角色卡编辑/新增界面 -->
        <div class="view-section hidden" id="editorView">
            <header class="header">
                <button class="btn-header-cancel" id="btnCancelEdit" type="button" aria-label="取消并返回">‹</button>
                <h1 class="header-title" id="editorTitle">Character</h1>
                <span style="width: 36px;"></span>
            </header>
            <main class="editor-container">
                <input type="hidden" id="editRoleId" value="">

                <!-- 1. 头像上传区 -->
                <div class="avatar-section">
                    <div class="avatar-bubble-wrapper" id="avatarBubbleWrapper" title="点击上传头像">
                        <div class="editor-avatar" id="editAvatarPreview">角</div>
                        <div class="avatar-badge-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
                    </div>
                    <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
                </div>

                <!-- 2. 姓名 -->
                <div class="editor-field-group">
                    <label class="field-label" for="editRoleName">姓名</label>
                    <input class="form-input" id="editRoleName" type="text" placeholder="输入角色名字" maxlength="30" />
                </div>

                <!-- 3. 人设设定 -->
                <div class="editor-field-group">
                    <label class="field-label" for="editRolePersona">人设设定</label>
                    <textarea
                        class="form-textarea"
                        id="editRolePersona"
                        placeholder="请详细描述TA的身份、性格、背景等"
                    ></textarea>
                </div>

                <!-- 4. 聊天语气 -->
                <div class="editor-field-group">
                    <label class="field-label" for="editRoleTone">聊天语气</label>
                    <textarea
                        class="form-textarea tone"
                        id="editRoleTone"
                        placeholder="例如：说话简短、经常使用句号、高冷、偶尔傲娇"
                    ></textarea>
                </div>

                <!-- 5. 绑定世界书（多选） -->
                <div class="editor-field-group">
                    <label class="field-label" style="color: #8E8E93;">绑定世界书</label>
                    <div class="wb-bind-list" id="worldBookBindList"></div>
                </div>

                <!-- 6. 保存按钮 -->
                <button class="btn-save-fixed" id="btnSaveRole" type="button">保存设定</button>
            </main>
        </div>
    </div>
    <script src="../js/characters-manager.js"></script>
    <script src="../js/nav.js"></script>
<script src="../js/statusbar-control.js"></script>
</body>
</html>
