/* ===== 多彩日记增强层 ===== */
/* 主题切换器 */
.theme-switch{display:flex;gap:6px;padding:10px 12px;background:var(--soft);border-radius:14px;margin-bottom:16px}.theme-dot{flex:1;height:30px;border-radius:10px;border:2px solid transparent;cursor:pointer;position:relative;transition:transform .18s,border-color .18s}.theme-dot:active{transform:scale(.94)}.theme-dot.active{border-color:var(--accent)}.theme-dot[data-theme="default"]{background:linear-gradient(135deg,#fff,#ededed)}.theme-dot[data-theme="vintage"]{background:linear-gradient(135deg,#f4ead8,#d9c9a8)}.theme-dot[data-theme="paper"]{background:linear-gradient(135deg,#fdfcf7,#efe9d8)}.theme-dot[data-theme="cute"]{background:linear-gradient(135deg,#fdf6ff,#f0e0f5)}.theme-dot[data-theme="mono"]{background:linear-gradient(135deg,#fff,#e8e8e8)}
/* 多图网格 */
.photo-grid{display:grid;gap:5px;margin-top:11px;border-radius:10px;overflow:hidden}.photo-grid.count-1{grid-template-columns:1fr}.photo-grid.count-2{grid-template-columns:1fr 1fr}.photo-grid.count-3{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}.photo-grid.count-3 .pg-item:first-child{grid-column:1/3}.photo-grid.count-4{grid-template-columns:1fr 1fr}.pg-item{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--soft2)}.pg-item.count-1{aspect-ratio:16/10;max-height:180px}.pg-item img{width:100%;height:100%;object-fit:cover;filter:var(--photo-filter);display:block}.pg-remove{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center}

.entry-type-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--accent-ink);background:var(--accent);padding:3px 8px;border-radius:6px;font-weight:650;letter-spacing:.03em;margin-bottom:9px}
/* 摘抄卡片样式 */
.entry-card.type-quote{background:var(--card-bg);border-left:3px solid var(--accent)}.entry-card.type-quote .entry-text{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;line-height:2;color:var(--ink)}.quote-source{font-size:10px;color:var(--muted);margin-top:6px;font-style:normal}
/* 饮食记录样式 */
.entry-card.type-meal .entry-text{color:var(--text)}
/* 待办清单样式 */
.todo-list{margin:9px 0 0;padding:0;list-style:none}.todo-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);padding:4px 0;border-bottom:1px dashed var(--line)}.todo-item:last-child{border-bottom:0}.todo-check{width:14px;height:14px;border:1.5px solid var(--muted);border-radius:4px;flex-shrink:0;display:grid;place-items:center}.todo-item.done .todo-check{background:var(--accent);border-color:var(--accent)}.todo-item.done .todo-check:after{content:"";width:7px;height:4px;border-left:1.5px solid var(--accent-ink);border-bottom:1.5px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}.todo-item.done .todo-text{text-decoration:line-through;color:var(--muted)}
/* 贴纸装饰 */
.entry-stickers{position:absolute;top:-8px;right:10px;display:flex;gap:4px;z-index:2}.sticker-emoji{font-size:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.12));transform:rotate(-8deg)}.sticker-emoji:nth-child(2){transform:rotate(6deg)}.sticker-emoji:nth-child(3){transform:rotate(-3deg)}
/* 纸张背景（每篇日记可选） */
.entry-card.paper-yellow{background:linear-gradient(135deg,#fffbea,#fff8d6)}.entry-card.paper-pink{background:linear-gradient(135deg,#fff5f7,#ffe8ed)}.entry-card.paper-blue{background:linear-gradient(135deg,#f0f7ff,#e0eefc)}.entry-card.paper-green{background:linear-gradient(135deg,#f3faf0,#e6f5df)}.entry-card.paper-lined{background-image:repeating-linear-gradient(0deg,transparent 0,transparent 23px,rgba(0,0,0,.04) 24px)}
/* 天气地点行 */
.entry-meta-row{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-top:2px}.entry-meta-row span{display:inline-flex;align-items:center;gap:3px}
/* 编辑器：类型选择、贴纸、纸张、天气地点 */
.type-choices{display:flex;gap:6px;flex-wrap:wrap}.type-choice{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px 10px;font-size:10px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;transition:all .18s}.type-choice .tc-icon{font-size:16px}.type-choice.active{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.sticker-picker{display:flex;gap:6px;flex-wrap:wrap}.sticker-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:16px;display:grid;place-items:center;transition:all .15s}.sticker-btn.active{border-color:var(--accent);background:var(--soft);transform:scale(1.08)}
.paper-picker{display:flex;gap:7px;flex-wrap:wrap}.paper-swatch{width:28px;height:28px;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .15s}.paper-swatch.active{border-color:var(--accent);transform:scale(1.1)}.paper-swatch.p-default{background:var(--paper)}.paper-swatch.p-yellow{background:linear-gradient(135deg,#fffbea,#fff8d6)}.paper-swatch.p-pink{background:linear-gradient(135deg,#fff5f7,#ffe8ed)}.paper-swatch.p-blue{background:linear-gradient(135deg,#f0f7ff,#e0eefc)}.paper-swatch.p-green{background:linear-gradient(135deg,#f3faf0,#e6f5df)}.paper-swatch.p-lined{background-image:repeating-linear-gradient(0deg,transparent 0,transparent 5px,rgba(0,0,0,.06) 6px),linear-gradient(135deg,#fdfcf7,#f6f4ec)}
.weather-row{display:flex;gap:6px;flex-wrap:wrap}.weather-btn{border:1px solid var(--line);border-radius:99px;background:var(--paper);padding:6px 10px;font-size:13px;display:grid;place-items:center;transition:all .15s}.weather-btn.active{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.editor-inline-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.collapse-section{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.collapse-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--soft);cursor:pointer;font-size:11px;font-weight:650;color:var(--text)}.collapse-body{padding:13px;display:none}.collapse-section.open .collapse-body{display:block}
/* 编辑器照片网格预览 */
.editor-photos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.editor-photo-item{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--soft2)}.editor-photo-item img{width:100%;height:100%;object-fit:cover;filter:var(--photo-filter)}.editor-photo-item .pg-remove{top:3px;right:3px;width:20px;height:20px;font-size:12px}

/* ===== 导出为图片 · 手帐风渲染 ===== */
.export-stage{position:fixed;left:-9999px;top:0;width:720px;padding:0;z-index:-1}
.export-card{width:720px;padding:46px 50px 50px;border-radius:0;font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;color:#2c2c2c;position:relative;overflow:hidden}
.export-card .exp-stickers{position:absolute;top:18px;right:28px;display:flex;gap:6px}
.export-card .exp-stickers span{font-size:30px;display:inline-block}
.export-card .exp-stickers span:nth-child(1){transform:rotate(-8deg)}
.export-card .exp-stickers span:nth-child(2){transform:rotate(6deg)}
.export-card .exp-stickers span:nth-child(3){transform:rotate(-3deg)}
.export-card .exp-date{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.export-card .exp-date strong{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.export-card .exp-date span{font-size:15px;color:#888}
.export-card .exp-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#888;margin-bottom:18px}
.export-card .exp-meta span{display:inline-flex;align-items:center;gap:4px}
.export-card .exp-type{display:inline-block;font-size:12px;color:#fff;background:#444;padding:4px 12px;border-radius:6px;margin-bottom:14px;font-weight:600}
.export-card .exp-title{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:0 0 16px;line-height:1.4}
.export-card .exp-body{font-size:16px;line-height:2;color:#444;white-space:pre-wrap;margin:0 0 16px}
.export-card .exp-quote{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:17px;line-height:2.1;color:#333;border-left:3px solid #444;padding-left:16px;margin:0 0 16px}
.export-card .exp-quote-src{font-size:13px;color:#888;font-style:normal;margin-top:8px}
.export-card .exp-todo{list-style:none;padding:0;margin:0 0 16px}
.export-card .exp-todo li{display:flex;align-items:center;gap:10px;font-size:15px;padding:8px 0;border-bottom:1px dashed #ddd}
.export-card .exp-todo li:last-child{border-bottom:0}
.export-card .exp-todo .check{width:18px;height:18px;border:1.5px solid #aaa;border-radius:4px;flex-shrink:0}
.export-card .exp-todo li.done .check{background:#444;border-color:#444}
.export-card .exp-todo li.done .check:after{content:"";display:block;width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(2px,2px)}
.export-card .exp-todo li.done .txt{text-decoration:line-through;color:#aaa}
.export-card .exp-photos{display:grid;gap:8px;margin-bottom:16px;border-radius:8px;overflow:hidden}
.export-card .exp-photos.c1{grid-template-columns:1fr}
.export-card .exp-photos.c2{grid-template-columns:1fr 1fr}
.export-card .exp-photos.c3{grid-template-columns:1fr 1fr}
.export-card .exp-photos.c3 .exp-ph:first-child{grid-column:1/3}
.export-card .exp-photos.c4{grid-template-columns:1fr 1fr}
.export-card .exp-ph{aspect-ratio:1/1;overflow:hidden}
.export-card .exp-photos.c1 .exp-ph{aspect-ratio:16/10}
.export-card .exp-ph img{width:100%;height:100%;object-fit:cover;display:block}
.export-card .exp-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.export-card .exp-tags span{font-size:12px;color:#666;background:rgba(0,0,0,.05);padding:4px 10px;border-radius:5px}
.export-card .exp-footer{margin-top:22px;padding-top:14px;border-top:1px solid rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#aaa;letter-spacing:.05em}


/* Editorial polish · paper, hierarchy and intentional whitespace */
.editorial-hero{padding:22px 0 17px;margin-bottom:17px;border-bottom:1px solid var(--line);background:var(--hero-bg);isolation:isolate}
.editorial-hero:before{content:"";position:absolute;z-index:-1;left:-22px;right:-22px;top:0;bottom:0;background:radial-gradient(ellipse at 86% 5%,rgba(0,0,0,.035),transparent 34%),repeating-linear-gradient(90deg,rgba(0,0,0,.012) 0px,transparent 1px,transparent 7px);pointer-events:none}
.editorial-hero .eyebrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:8px;letter-spacing:.18em;color:#737373}
.hero-issue{font-size:7px;letter-spacing:.12em;color:#b0b0b0;white-space:nowrap}
.editorial-hero h1{margin:18px 0 10px;line-height:1;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.hero-english{font-family:Georgia,"Times New Roman",serif;font-size:51px;font-weight:400;letter-spacing:-.075em;color:#151515}
.hero-period{color:#a2a2a2}
.hero-cn{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:11px;letter-spacing:.08em;font-weight:550;color:#555}
.editorial-hero p{font-size:11px;line-height:1.9;letter-spacing:.015em;color:#777;margin-top:12px}
.editorial-hero .hero-date{top:84px;right:1px}
.editorial-hero .hero-date strong{font-family:Georgia,"Times New Roman",serif;font-size:35px;font-weight:400}
.editorial-hero .hero-date span{display:block;max-width:82px;font-size:7px;line-height:1.7;letter-spacing:.11em;color:#999}
.hero-rule{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:7px;letter-spacing:.17em;color:#aaa}
.hero-rule i{height:1px;flex:1;background:linear-gradient(90deg,#d5d5d5,transparent)}
.stats-row{gap:0;margin:0 0 24px;padding:14px 0;border-top:1px solid #ededed;border-bottom:1px solid #ededed;background:linear-gradient(95deg,rgba(247,247,247,.64),rgba(255,255,255,.28))}
.stat{background:transparent;border-radius:0;min-height:64px;padding:5px 15px 5px 2px}
.stat+.stat{border-left:1px solid #e7e7e7;padding-left:17px}
.stat-label{font-size:9px;letter-spacing:.1em;color:#9b9b9b}
.stat-main{margin-top:9px}
.stat-main strong{font-family:Georgia,"Times New Roman",serif;font-size:28px;font-weight:400;letter-spacing:-.06em}
.prompt{position:relative;overflow:hidden;border-radius:2px;border:0;border-left:2px solid #202020;padding:15px 12px 15px 14px;margin-bottom:28px;background:linear-gradient(112deg,#f6f6f6,#fff 75%);box-shadow:none}
.prompt:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.38;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0px,transparent 1px,transparent 3px)}
.prompt>*{position:relative;z-index:1}
.prompt-mark{font-family:Georgia,serif;font-size:27px;color:#aaa}
.prompt-copy .label{font-size:8px;letter-spacing:.18em}
.prompt-copy p{font-size:11px;line-height:1.9;color:#4d4d4d}
.section-head{margin-bottom:14px}
.section-head h2{font-size:17px;font-weight:650;letter-spacing:-.055em}
.section-meta{font-family:Georgia,"Times New Roman",serif;letter-spacing:.13em;font-size:9px;color:#999}
.search-wrap{height:39px;background:transparent;border:0;border-top:1px solid #e9e9e9;border-bottom:1px solid #e9e9e9;border-radius:0;padding:0 4px;margin:0 0 13px}
.search-wrap:focus-within{border-color:#bdbdbd;background:rgba(250,250,250,.6)}
.filter-row{gap:12px;margin-bottom:19px}
.filter-chip{border:0;border-bottom:1px solid transparent;border-radius:0;padding:6px 1px;color:#999;background:transparent;font-size:10px}
.filter-chip.active{background:transparent;border-color:#171717;color:#171717;font-weight:700}
.entries{gap:0}
.entry-card{border:0;border-top:1px solid #e7e7e7;border-radius:0;padding:17px 2px 16px;background:transparent;box-shadow:none}
.entry-card:first-child{padding:20px 13px 17px;margin:0 0 2px;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0px,transparent 1px,transparent 4px),linear-gradient(120deg,#f8f8f8,#fff 78%);border-top:1.5px solid #282828;border-bottom:1px solid #e5e5e5}
.entry-card:first-child .entry-date strong{font-size:30px;font-weight:620}
.entry-card:first-child .entry-title{font-size:19px;font-weight:650;letter-spacing:-.045em;margin-top:5px}
.entry-card:first-child .entry-text{-webkit-line-clamp:5;font-size:12px;line-height:1.9}
.entry-card:not(:first-child) .entry-title{font-size:14px;font-weight:650}
.entry-card:not(:first-child) .entry-bottom{margin-top:10px}
.entry-bottom{border-top:1px solid #ececec}
.tiny-tag{background:transparent;border:1px solid #ececec;border-radius:2px;padding:4px 6px}
/* 卡片错落入场动画：仅在首次渲染与切换标签时播放（守卫见 JS 中的 cardAnimQueued） */
.entries.anim .entry-card{animation:cardFadeUp .4s cubic-bezier(.16,1,.3,1) backwards}
.entries.anim .entry-card:nth-child(1){animation-delay:.04s}
.entries.anim .entry-card:nth-child(2){animation-delay:.08s}
.entries.anim .entry-card:nth-child(3){animation-delay:.12s}
.entries.anim .entry-card:nth-child(n+4){animation-delay:.16s}
@keyframes cardFadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.empty-state{border-radius:2px;border-style:solid;border-color:#e6e6e6;background:linear-gradient(140deg,#fff,#f8f8f8)}

/* ===== 动效增强层 · 整体删除此块即可回退到素版 ===== */
:root{--ease-apple:cubic-bezier(.16,1,.3,1)}
#viewRoot.anim{animation:viewFadeIn .35s var(--ease-apple)}
@keyframes viewFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 按压微反馈：只改 transform / opacity，走合成层 */
.round-btn{transition:background .18s,transform .2s var(--ease-apple)}
.round-btn:active{transform:scale(.92)}
.filter-chip{transition:all .2s var(--ease-apple)}
.filter-chip:active{transform:scale(.95)}
.entry-card{transition:transform .22s var(--ease-apple),border-color .2s}
.entry-card:active{transform:scale(.985)}
.mini-action{transition:transform .2s var(--ease-apple),color .2s}
.mini-action:active{transform:scale(1.18)}
.prompt-refresh{transition:opacity .2s}
.prompt-refresh:active{opacity:.6}
.calendar-actions button{transition:background .2s,transform .2s var(--ease-apple)}
.calendar-actions button:active{transform:scale(.9);background:#f0f0f0}
.date-cell{transition:background .2s,color .2s,transform .2s var(--ease-apple)}
.date-cell:active{transform:scale(.9)}
/* ===== 全屏编辑器 ===== */
.editor-full{display:flex;flex-direction:column;min-height:100%;background:var(--soft)}
.ef-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--line);flex-shrink:0;position:sticky;top:0;z-index:10}
.ef-back{border:0;background:transparent;color:var(--text);font-size:13px;padding:6px 10px;border-radius:8px}
.ef-back:active{background:var(--soft)}
.ef-title{font-size:15px;font-weight:650;color:var(--ink)}
.ef-save{border:0;background:var(--accent);color:var(--accent-ink);padding:7px 18px;border-radius:9px;font-size:13px;font-weight:600}
.ef-save:active{transform:scale(.95)}
.ef-body{flex:1;padding:14px;display:flex;flex-direction:column;gap:14px}
.ef-canvas-wrap{background:var(--paper);border-radius:14px;padding:12px;border:1px solid var(--line)}
.ef-canvas{position:relative;width:100%;height:260px;border-radius:10px;overflow:hidden;border:1px dashed var(--line)}
.ef-canvas-tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ct-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--soft);color:var(--text);padding:7px 12px;border-radius:9px;font-size:12px}
.ct-btn:active{background:var(--soft2)}
.ct-btn:disabled{opacity:.4}
/* 拼贴项 */
.collage-item{position:absolute;cursor:grab;user-select:none;touch-action:none}
.collage-item:active{cursor:grabbing}
.collage-item img{width:100%;height:auto;display:block;pointer-events:none;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.collage-del{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:#ff4d4f;color:#fff;font-size:13px;line-height:18px;text-align:center;cursor:pointer;border:2px solid #fff}
.collage-resize{position:absolute;bottom:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:nwse-resize}
.collage-rotate{position:absolute;top:-8px;left:-8px;width:18px;height:18px;border-radius:50%;background:#1890ff;color:#fff;font-size:11px;line-height:16px;text-align:center;cursor:grab;border:2px solid #fff}
.collage-rotate:before{content:"↻"}
.ef-fields{display:flex;flex-direction:column;gap:12px}
.ef-row{display:flex;flex-direction:column;gap:6px}
.ef-row .field-label{font-size:11px;color:var(--muted)}
.ef-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ef-col{display:flex;flex-direction:column;gap:6px}
@media(max-width:500px){.ef-meta{grid-template-columns:1fr}}
/* 拼贴预览 */
.collage-preview img{border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tab-btn{transition:color .2s,transform .2s var(--ease-apple)}
.tab-btn:active{transform:scale(.92)}
.tab-add{transition:transform .25s var(--ease-apple),box-shadow .2s}
.tab-add:active{transform:scale(.88);box-shadow:0 3px 7px rgba(0,0,0,.13)}
.sheet-link{transition:opacity .2s}
.sheet-link:active{opacity:.5}
.mood-choice{transition:background .2s,color .2s,transform .2s var(--ease-apple)}
.mood-choice:active{transform:scale(.92)}
.photo-pick{transition:transform .2s var(--ease-apple)}
.photo-pick:active{transform:scale(.95)}
.btn-secondary,.btn-primary{transition:transform .2s var(--ease-apple)}
.btn-secondary:active{transform:scale(.96)}
.btn-primary:active{transform:scale(.97)}
.menu-item{transition:background .18s,transform .15s}
.menu-item:active{background:#f0f0f0;transform:scale(.98)}

/* 弹层与提示曲线 */
.editor-backdrop.show,.menu-backdrop.show{animation:backdropFade .28s var(--ease-apple)}
@keyframes backdropFade{from{opacity:0}to{opacity:1}}
.editor-sheet{animation:sheetUp .35s var(--ease-apple)}
.menu-sheet{animation:sheetUp .3s var(--ease-apple)}
@keyframes sheetUp{from{transform:translateY(35px);opacity:.4}to{transform:translateY(0);opacity:1}}
.toast{transform:translate(-50%,15px) scale(.96);transition:opacity .26s var(--ease-apple),transform .26s var(--ease-apple)}
@media(max-width:500px){
 .editorial-hero{padding-top:17px}
 .hero-english{font-size:48px}
 .editorial-hero .hero-date{top:77px}
 .stats-row{margin-bottom:21px}
}

@media(max-width:500px){html,body{background:#fff}.phone-mockup{width:100%;height:100dvh;min-height:0;margin:0;border:0;border-radius:0;box-shadow:none}.app-head{padding-top:calc(7px + env(safe-area-inset-top,0px))}.hero h1{font-size:41px}.editor-backdrop,.menu-backdrop{position:fixed}.editor-sheet{max-height:94dvh;padding-bottom:calc(15px + env(safe-area-inset-bottom,0px))}.app-scroll{padding-bottom:18px}}
@media(min-width:501px){.phone-mockup{height:min(890px,calc(100vh - 28px))}.app-scroll{padding-bottom:26px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.entries.anim .entry-card{animation-delay:0s!important}}
</style>
</head>
<body>
<div class="phone-mockup">
  <header class="app-head">
    <div class="head-left">
      <button class="round-btn" id="backHome" aria-label="返回桌面" title="返回桌面"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h11"/></svg></button>
      <div><div class="brand-mark">PERSONAL JOURNAL</div></div>
    </div>
    <div class="head-actions">
      <button class="round-btn" id="searchToggle" aria-label="搜索日记" title="搜索"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.5 4.5"/></svg></button>
      <button class="round-btn" id="moreBtn" aria-label="更多选项" title="更多"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </div>
  </header>
  <main class="app-scroll" id="appScroll"><div id="viewRoot"></div></main>
  <nav class="bottom-tabs" aria-label="日记导航">
    <button class="tab-btn active" data-view="home"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v15H4z"/><path d="M8 3.5v4M16 3.5v4M4 10h16M8 14h4M8 17h7"/></svg><span>记录</span></button>
    <button class="tab-btn" data-view="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg><span>日历</span></button>
    <button class="tab-add" id="newEntryBtn" aria-label="写日记" title="写一篇日记"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab-btn" data-view="favorites"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg><span>收藏</span></button>
    <button class="tab-btn" data-view="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>关于</span></button>
  </nav>

  <input type="file" id="entryPhoto" accept="image/*" hidden>
  <div class="menu-backdrop" id="menuBackdrop" role="dialog" aria-modal="true">
    <section class="menu-sheet">
      <div class="menu-head"><span>日记空间</span><button class="sheet-link" id="closeMenu">关闭</button></div>
      <div class="menu-theme-row"><span class="menu-theme-label">主题风格</span><div class="menu-theme-dots" id="menuThemeDots"></div></div>
      <button class="menu-item" id="exportBtn"><span>导出备份<small>将日记保存为 JSON 文件</small></span><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg></button>
      <button class="menu-item" id="importBtn"><span>导入备份<small>从以前导出的 JSON 恢复记录</small></span><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="menu-item" id="clearSearchBtn"><span>清除搜索与筛选<small>回到全部日记</small></span><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>
(function(){
  'use strict';
  var STORAGE_KEY='maomao_diary_entries_v1';
  var THEME_KEY='maomao_diary_theme_v1';
  var entries=loadEntries();
  var currentView='home', query='', moodFilter='全部', selectedMood='平静';
  var editId=null, activePhotos=[], calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1), selectedCalendarDate=todayKey();
  var cardAnimQueued=true;
  var selectedType='normal', selectedWeather='', selectedLocation='', selectedStickers=[], selectedPaper='default';
  var selectedEditorDate='';
  // 拼贴状态
  var collageItems=[]; // {id, src, x, y, w, rot}
  var draggingItem=null, dragMode=null, dragStartX=0, dragStartY=0, dragOrig=null;
  var prompts=[
    '今天有没有一个很小的瞬间，让你觉得生活还不错？',
    '如果把今天拍成一张照片，你会留下哪个画面？',
    '今天有什么事情，你想对未来的自己说？',
    '现在的你，最想好好记住什么？',
    '不用总结整天，只写下一件真实发生的事就好。',
    '今天有没有某个瞬间，让你比昨天更了解自己？',
    '最近有什么小小的期待，正在慢慢靠近？'
  ];
  var promptIndex=Math.floor(Date.now()/86400000)%prompts.length;
  var root=document.getElementById('viewRoot'), scroll=document.getElementById('appScroll');
  var menu=document.getElementById('menuBackdrop');
  var $=function(id){return document.getElementById(id)};
  function loadEntries(){
    try{var v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(!Array.isArray(v))return [];return v.filter(function(x){return x&&x.id&&x.date}).map(function(x){
      if(!Array.isArray(x.photos)){x.photos=typeof x.photo==='string'&&x.photo?[x.photo]:[]}
      if(!x.type)x.type='normal';
      if(!x.paper)x.paper='default';
      if(!Array.isArray(x.stickers))x.stickers=[];
      return x;
    })}
    catch(e){return []}
  }
  function persist(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(entries));return true}
    catch(e){showToast('本机存储空间不足，请移除较大的照片后再试');return false}
  }
  function loadTheme(){
    var t=localStorage.getItem(THEME_KEY)||'default';
    applyTheme(t);
    return t;
  }
  function applyTheme(t){
    var body=document.body;
    ['theme-vintage','theme-paper','theme-cute','theme-mono'].forEach(function(c){body.classList.remove(c)});
    if(t==='vintage')body.classList.add('theme-vintage');
    else if(t==='paper')body.classList.add('theme-paper');
    else if(t==='cute')body.classList.add('theme-cute');
    else if(t==='mono')body.classList.add('theme-mono');
  }
  function saveTheme(t){localStorage.setItem(THEME_KEY,t);applyTheme(t)}
  function todayKey(d){
    d=d||new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function shortDate(key){var p=String(key).split('-');return p[1]+'/'+p[2]}
  function weekday(key){var d=new Date(key+'T12:00:00');return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}
  function friendlyDate(key){var p=String(key).split('-');return p[0]+'年'+Number(p[1])+'月'+Number(p[2])+'日 · '+weekday(key)}
  function monthLabel(d){return d.getFullYear()+'年 '+String(d.getMonth()+1).padStart(2,'0')+'月'}
  function sorted(list){return list.slice().sort(function(a,b){return (b.date+' '+(b.updatedAt||b.createdAt||'' )).localeCompare(a.date+' '+(a.updatedAt||a.createdAt||''))})}
  function filteredEntries(){
    var list=entries.slice();
    if(currentView==='favorites')list=list.filter(function(e){return !!e.favorite});
    if(currentView==='calendar')list=list.filter(function(e){return e.date===selectedCalendarDate});
    if(moodFilter!=='全部')list=list.filter(function(e){return e.mood===moodFilter});
    if(query.trim()){
      var q=query.trim().toLowerCase();
      list=list.filter(function(e){return [e.title,e.content,e.date,e.mood,e.location,e.type,(e.tags||[]).join(' ')].join(' ').toLowerCase().indexOf(q)!==-1});
    }
    return sorted(list);
  }
  function showToast(message){
    var el=$('toast');el.textContent=message;el.classList.add('show');
    clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){el.classList.remove('show')},2300);
  }
  function svg(name){
    var paths={
      search:'<circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.5 4.5"/>',
      edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',
      arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'
    };
    return '<svg viewBox="0 0 24 24">'+(paths[name]||'')+'</svg>';
  }
  var TYPE_LABELS={normal:'日记',quote:'摘抄',meal:'饮食',todo:'待办'};
  var TYPE_ICONS={normal:'',quote:'',meal:'',todo:''};
  function renderPhotos(photos){
    if(!photos||!photos.length)return '';
    var list=photos.slice(0,6);
    var hasPos=list.some(function(p){return p&&typeof p==='object'&&p.src});
    if(hasPos){
      // 拼贴预览：按位置渲染
      var maxW=0,maxH=0;
      list.forEach(function(p){if(p&&typeof p==='object'){maxW=Math.max(maxW,(p.x||0)+(p.w||100));maxH=Math.max(maxH,(p.y||0)+(p.w||100))}});
      var scale=maxW>0?Math.min(1,300/maxW):1;
      var html='<div class="collage-preview" style="position:relative;width:100%;height:'+(maxH*scale+10)+'px">';
      list.forEach(function(p){
        if(p&&typeof p==='object'&&p.src){
          html+='<img src="'+esc(p.src)+'" style="position:absolute;left:'+((p.x||0)*scale)+'px;top:'+((p.y||0)*scale)+'px;width:'+((p.w||100)*scale)+'px;transform:rotate('+(p.rot||0)+'deg)" alt="日记照片" loading="lazy">';
        }
      });
      html+='</div>';
      return html;
    }
    // 旧格式：字符串数组，网格展示
    var count=list.length;
    var html='<div class="photo-grid count-'+count+'">';
    list.forEach(function(src){
      html+='<div class="pg-item'+(count===1?' count-1':'')+'"><img src="'+esc(src)+'" alt="日记照片" loading="lazy"></div>';
    });
    html+='</div>';
    return html;
  }
  function renderTodoList(content){
    var lines=String(content||'').split('\n').filter(function(l){return l.trim()});
    if(!lines.length)return '';
    var html='<ul class="todo-list">';
    lines.forEach(function(line){
      var done=/^[\-x✓]/.test(line.trim());
      var text=line.replace(/^[\-x✓\.\s]+/,'').trim();
      html+='<li class="todo-item'+(done?' done':'')+'"><span class="todo-check"></span><span class="todo-text">'+esc(text)+'</span></li>';
    });
    html+='</ul>';
    return html;
  }
  function renderStickers(stickers){
    if(!stickers||!stickers.length)return '';
    return '<div class="entry-stickers">'+stickers.slice(0,3).map(function(s){return '<span class="sticker-emoji">'+esc(s)+'</span>'}).join('')+'</div>';
  }
  function renderEntryCard(e){
    var tags=(e.tags||[]).slice(0,4).map(function(t){return '<span class="tiny-tag"># '+esc(t)+'</span>'}).join('');
    var type=e.type||'normal';
    var paper=e.paper||'default';
    var paperClass=paper!=='default'?' paper-'+paper:'';
    var text=(e.content||'').trim();
    var metaRow='';
    if(e.weather||e.location){
      metaRow='<div class="entry-meta-row">';
      if(e.weather)metaRow+='<span>'+esc(e.weather)+'</span>';
      if(e.location)metaRow+='<span>'+esc(e.location)+'</span>';
      metaRow+='</div>';
    }
    var body='';
    if(type==='quote'){
      var src=(e.title||'')+' '+(e.source||'');
      body='<p class="entry-text">'+esc(text||'这一天，留下一点空白。')+'</p>'+(e.source?'<div class="quote-source">— '+esc(e.source)+'</div>':'');
    }else if(type==='todo'){
      body=renderTodoList(text);
    }else{
      if(!text)text='这一天，留下一点空白。';
      body='<p class="entry-text">'+esc(text)+'</p>';
    }
    var typeBadge=type!=='normal'?'<span class="entry-type-badge">'+TYPE_ICONS[type]+' '+TYPE_LABELS[type]+'</span>':'';
    return '<article class="entry-card type-'+type+paperClass+'" data-open-entry="'+esc(e.id)+'">'+
      renderStickers(e.stickers)+
      '<div class="entry-top"><div class="entry-date"><strong>'+esc(shortDate(e.date))+'</strong><span>'+esc(weekday(e.date))+'</span></div><span class="entry-mood">'+esc(e.mood||'平静')+'</span></div>'+
      typeBadge+
      (e.title?'<h3 class="entry-title">'+esc(e.title)+'</h3>':'')+
      body+
      renderPhotos(e.photos)+
      metaRow+
      '<div class="entry-bottom"><div class="entry-tags">'+tags+'</div><div class="entry-actions"><button class="mini-action" data-export-img="'+esc(e.id)+'" aria-label="导出为图片" title="导出为图片"><svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:middle"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button></div></div></article>';
  }
  function renderCards(list,emptyTitle,emptyText){
    if(!list.length)return '<div class="empty-state"><div class="empty-mark">01 / —</div><h3>'+esc(emptyTitle)+'</h3><p>'+esc(emptyText)+'</p><button class="text-btn" data-create="1">写下第一篇</button></div>';
    return '<div class="entries">'+list.map(renderEntryCard).join('')+'</div>';
  }
  function renderHome(){
    var d=new Date(), key=todayKey();
    var list=filteredEntries();
    var todayCount=entries.filter(function(e){return e.date===key}).length;
    var savedDays={};entries.forEach(function(e){savedDays[e.date]=1});
    var days=Object.keys(savedDays).length;
    var filters=['全部','平静','开心','疲惫','低落','期待'];
    return '<section class="hero editorial-hero"><div class="eyebrow">THE PERSONAL JOURNAL <span class="hero-issue">VOL.01 — DAILY NOTES</span></div><h1><span class="hero-english">Today<span class="hero-period">.</span></span><span class="hero-cn">日记 / 留给自己的空白</span></h1><p>不必把每一天都写得完整。<br>把真正发生过的细小瞬间留下来。</p><div class="hero-date"><strong>'+String(d.getDate()).padStart(2,'0')+'</strong><span>'+d.getFullYear()+' / '+String(d.getMonth()+1).padStart(2,'0')+' · DAYBOOK</span></div><div class="hero-rule"><span>NOTES ON ORDINARY DAYS</span><i></i></div></section>'+
      '<div class="stats-row"><div class="stat"><div class="stat-label">已写下的片段</div><div class="stat-main"><strong>'+entries.length+'</strong><span>篇记录</span></div></div><div class="stat"><div class="stat-label">留下印记的日子</div><div class="stat-main"><strong>'+days+'</strong><span>天 · 今天 '+todayCount+' 篇</span></div></div></div>'+
      '<aside class="prompt"><div class="prompt-mark">“</div><div class="prompt-copy"><div class="label">A SMALL PROMPT FOR TODAY</div><p>'+esc(prompts[promptIndex])+'</p></div><button class="prompt-refresh" id="refreshPrompt">换一句</button></aside>'+
      '<div class="section-head"><h2>最近记录</h2><span class="section-meta">'+(query?'搜索结果 '+list.length+' 篇':list.length+' ENTRIES')+'</span></div>'+
      '<div class="search-wrap" id="searchWrap">'+svg('search')+'<input id="diarySearch" type="search" value="'+esc(query)+'" placeholder="搜索标题、文字或标签" aria-label="搜索日记"><button class="mini-action" id="clearSearch" style="'+(query?'':'display:none')+'" aria-label="清除搜索">×</button></div>'+
      '<div class="filter-row">'+filters.map(function(f){return '<button class="filter-chip '+(moodFilter===f?'active':'')+'" data-mood-filter="'+esc(f)+'">'+esc(f)+'</button>'}).join('')+'</div>'+
      renderCards(list,'这一页还是空白','给今天留下一点文字、一个心情，或者一张照片。');
  }
  function renderCalendar(){
    var first=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),1);
    var start=new Date(first);start.setDate(first.getDate()-first.getDay());
    var marked={};entries.forEach(function(e){marked[e.date]=true});
    var cells='';
    for(var i=0;i<42;i++){
      var d=new Date(start);d.setDate(start.getDate()+i);
      var k=todayKey(d),inMonth=d.getMonth()===calendarMonth.getMonth();
      cells+='<button class="date-cell '+(!inMonth?'muted ':'')+(k===todayKey()?'today ':'')+(k===selectedCalendarDate?'selected':'')+'" data-date="'+k+'">'+d.getDate()+(marked[k]?'<i class="date-dot"></i>':'')+'</button>';
    }
    var list=entries.filter(function(e){return e.date===selectedCalendarDate}).sort(function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'')});
    return '<section class="hero"><div class="eyebrow">YOUR DAYS, AT A GLANCE</div><h1>日历<span style="font-weight:350;color:#aaa">。</span></h1><p>每一个留下记录的日子，<br>都在这里有一个小小的标记。</p></section>'+
      '<div class="calendar-top"><div class="calendar-title">'+esc(monthLabel(calendarMonth))+'</div><div class="calendar-actions"><button id="prevMonth" aria-label="上个月">‹</button><button id="todayMonth" aria-label="回到本月">·</button><button id="nextMonth" aria-label="下个月">›</button></div></div>'+
      '<div class="calendar-grid">'+['日','一','二','三','四','五','六'].map(function(x){return '<div class="weekday">'+x+'</div>'}).join('')+cells+'</div>'+
      '<div class="calendar-day"><h3 class="calendar-day-title">'+esc(friendlyDate(selectedCalendarDate))+'<span>'+list.length+' 篇记录</span></h3>'+
      (list.length?renderCards(list,'',''):'<div class="empty-state"><div class="empty-mark">'+esc(shortDate(selectedCalendarDate))+'</div><h3>这一天还没有记录</h3><p>留一个小小的标记吧，不需要写很多。</p><button class="text-btn" data-create-date="'+selectedCalendarDate+'">写下这一天</button></div>')+'</div>';
  }
  function renderFavorites(){
    var list=filteredEntries();
    return '<section class="hero"><div class="eyebrow">THE MOMENTS YOU KEEP</div><h1>收藏<span style="font-weight:350;color:#aaa">。</span></h1><p>把不想忘记的片段，<br>放在一个容易找到的地方。</p></section>'+
      '<div class="section-head"><h2>珍藏的记录</h2><span class="section-meta">'+list.length+' SAVED</span></div>'+
      renderCards(list,'还没有收藏','在日记右下角点一下星星，喜欢的片段就会出现在这里。');
  }
  function renderAbout(){
    return '<section class="hero"><div class="eyebrow">A QUIET PLACE, ON YOUR DEVICE</div><h1>关于<span style="font-weight:350;color:#aaa">。</span></h1><p>简单记录，不急着整理人生。<br>先把此刻的自己留下来。</p></section>'+
      '<div class="prompt"><div class="prompt-mark">01</div><div class="prompt-copy"><div class="label">YOUR PRIVACY</div><p>日记保存在当前浏览器的本地存储中，不会主动上传到服务器。清理浏览器数据或更换设备前，请先导出备份。</p></div></div>'+
      '<div class="stat" style="margin-bottom:10px"><div class="stat-label">本机记录数量</div><div class="stat-main"><strong>'+entries.length+'</strong><span>篇</span></div></div>'+
      '<div class="stat" style="margin-bottom:10px"><div class="stat-label">保存方式</div><div class="stat-main"><strong style="font-size:17px">仅本机</strong><span>Local Storage</span></div></div>'+
      '<div class="section-head" style="margin-top:24px"><h2>备份与迁移</h2><span class="section-meta">YOUR DATA</span></div>'+
      '<div class="entry-card"><h3 class="entry-title">留一份自己的副本</h3><p class="entry-text">导出的文件包含日记文字、日期、心情、标签和照片数据。请妥善保管备份文件。</p><div class="entry-actions" style="justify-content:flex-start;margin-top:14px"><button class="btn-secondary" id="aboutExport">导出备份</button><button class="btn-secondary" id="aboutImport">导入备份</button></div></div>';
  }
  function render(){
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b.dataset.view===currentView)});
    root.innerHTML=currentView==='calendar'?renderCalendar():currentView==='favorites'?renderFavorites():currentView==='about'?renderAbout():currentView==='editor'?renderEditor():renderHome();
    if(cardAnimQueued){
      root.classList.remove('anim');
      void root.offsetWidth;
      root.classList.add('anim');
      var entriesEl=root.querySelector('.entries');
      if(entriesEl)entriesEl.classList.add('anim');
    }
    cardAnimQueued=false;
    if(currentView==='home'){
      var inp=$('diarySearch');
      if(inp){
        inp.addEventListener('input',function(){var pos=inp.selectionStart;query=inp.value;var y=scroll.scrollTop;render();scroll.scrollTop=y;var next=$('diarySearch');if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch(e){}}});
      }
      var clear=$('clearSearch');if(clear)clear.addEventListener('click',function(e){e.stopPropagation();query='';render();});
      var refresh=$('refreshPrompt');if(refresh)refresh.addEventListener('click',function(){promptIndex=(promptIndex+1)%prompts.length;render()});
    }
    if(currentView==='calendar'){
      $('prevMonth').addEventListener('click',function(){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);render()});
      $('nextMonth').addEventListener('click',function(){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);render()});
      $('todayMonth').addEventListener('click',function(){calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);selectedCalendarDate=todayKey();render()});
    }
    if(currentView==='editor'){
      bindEditorEvents();
    }
    var aboutExport=$('aboutExport');if(aboutExport)aboutExport.addEventListener('click',exportBackup);
    var aboutImport=$('aboutImport');if(aboutImport)aboutImport.addEventListener('click',function(){$('importFile').click()});
    scroll.scrollTop=0;
  }
  function bindEditorEvents(){
    var saveBtn=$('saveEntry');if(saveBtn)saveBtn.addEventListener('click',saveEntry);
    var cancelBtn=$('cancelEditor');if(cancelBtn)cancelBtn.addEventListener('click',closeEditor);
    var delBtn=$('deleteEntry');if(delBtn)delBtn.addEventListener('click',deleteCurrent);
    var addPhoto=$('addPhotoBtn');if(addPhoto)addPhoto.addEventListener('click',function(){var inp=$('entryPhoto');if(inp)inp.click()});
    var clearCol=$('clearCollageBtn');if(clearCol)clearCol.addEventListener('click',function(){collageItems=[];renderCollage()});
    var mc=$('moodChoices');if(mc)mc.addEventListener('click',function(e){var b=e.target.closest('[data-mood]');if(!b)return;selectedMood=b.dataset.mood;document.querySelectorAll('.mood-choice').forEach(function(x){x.classList.toggle('active',x===b)})});
    var tc=$('typeChoices');if(tc)tc.addEventListener('click',function(e){var b=e.target.closest('[data-type]');if(!b)return;selectedType=b.dataset.type;document.querySelectorAll('.type-choice').forEach(function(x){x.classList.toggle('active',x===b)});updateContentLabel()});
    var wc=$('weatherChoices');if(wc)wc.addEventListener('click',function(e){var b=e.target.closest('[data-weather]');if(!b)return;selectedWeather=b.dataset.weather;document.querySelectorAll('.weather-btn').forEach(function(x){x.classList.toggle('active',x===b)})});

  function bindCollage(){
    var canvas=$('efCanvas');

    canvas.querySelectorAll('.collage-item').forEach(function(item){
      var cid=item.dataset.cid;

    });
  }
  function getPoint(e){
    if(e.touches&&e.touches.length)return {x:e.touches[0].clientX,y:e.touches[0].clientY};
    if(e.changedTouches&&e.changedTouches.length)return {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
    return {x:e.clientX,y:e.clientY};
  }
  function startDrag(e){
    var item=e.currentTarget;
    var cid=item.dataset.cid;
    var it=collageItems.find(function(x){return x.id===cid});
    if(!it)return;
    var target=e.target;
    if(target.classList.contains('collage-del')){
      e.preventDefault();
      collageItems=collageItems.filter(function(x){return x.id!==cid});
      renderCollage();
      return;
    }
    e.preventDefault();
    var p=getPoint(e);
    draggingItem=it;
    dragOrig={x:it.x,y:it.y,w:it.w,rot:it.rot};
    dragStartX=p.x;dragStartY=p.y;
    if(target.classList.contains('collage-rotate')){
      dragMode='rotate';
    }else if(target.classList.contains('collage-resize')){
      dragMode='resize';
    }else{
      dragMode='move';
    }
    document.addEventListener('mousemove',onDrag);
    document.addEventListener('mouseup',endDrag);
    document.addEventListener('touchmove',onDrag,{passive:false});
    document.addEventListener('touchend',endDrag);
  }
  function onDrag(e){
    if(!draggingItem)return;
    e.preventDefault();
    var p=getPoint(e);
    var dx=p.x-dragStartX,dy=p.y-dragStartY;
    if(dragMode==='move'){
      draggingItem.x=Math.max(0,dragOrig.x+dx);
      draggingItem.y=Math.max(0,dragOrig.y+dy);
    }else if(dragMode==='resize'){
      draggingItem.w=Math.max(40,dragOrig.w+dx);
    }else if(dragMode==='rotate'){
      draggingItem.rot=dragOrig.rot+dx*0.5;
    }
    var el=document.querySelector('.collage-item[data-cid="'+draggingItem.id+'"]');
    if(el){
      el.style.left=draggingItem.x+'px';
      el.style.top=draggingItem.y+'px';
      el.style.width=draggingItem.w+'px';
      el.style.transform='rotate('+draggingItem.rot+'deg)';
    }
  }
  function endDrag(){
    draggingItem=null;
    document.removeEventListener('mousemove',onDrag);
    document.removeEventListener('mouseup',endDrag);
    document.removeEventListener('touchmove',onDrag);
    document.removeEventListener('touchend',endDrag);
  }

  function processImage(file){
    if(!file){showToast('未选择文件');return}
    if(!file.type||file.type.indexOf('image/')!==0){showToast('请选择图片文件');return}
    if(file.size>15*1024*1024){showToast('图片太大，请选15MB以内的');return}
    var reader=new FileReader();
    reader.onload=function(){
      var raw=reader.result;
      var img=new Image();
      img.onload=function(){
        try{
          var max=1000;
          var scale=Math.min(1,max/Math.max(img.width,img.height));
          var w=Math.max(1,Math.round(img.width*scale));
          var h=Math.max(1,Math.round(img.height*scale));
          var canvas=document.createElement('canvas');
          canvas.width=w;canvas.height=h;
          var ctx=canvas.getContext('2d');
          ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          var data=canvas.toDataURL('image/jpeg',.72);
          if(!data||data.length<100)throw new Error('canvas empty');
          addCollageItem(data);
        }catch(err){
          try{addCollageItem(raw)}catch(e2){showToast('图片处理失败，请换一张')}
        }
      };
      img.onerror=function(){showToast('图片读取失败，请换一张试试')};
      img.src=raw;
    };
    reader.onerror=function(){showToast('图片读取失败')};
    try{reader.readAsDataURL(file)}catch(e){showToast('无法读取该图片')}
  }

  function exportEntryAsImage(id){
    var e=entries.find(function(x){return x.id===id});
    if(!e){showToast('找不到这篇日记');return}
    if(typeof html2canvas==='undefined'){showToast('图片库加载中，请稍后再试');return}
    showToast('正在生成图片…');
    var stage=document.createElement('div');
    stage.className='export-stage';
    stage.innerHTML=buildExportHTML(e);
    document.body.appendChild(stage);
    var card=stage.querySelector('.export-card');
    // 等待图片加载
    var imgs=card.querySelectorAll('img');
    var loaded=0;
    function onImgLoad(){
      loaded++;
      if(loaded>=imgs.length)doCapture();
    }
    if(imgs.length===0){setTimeout(doCapture,100)}
    else{
      imgs.forEach(function(img){
        if(img.complete)onImgLoad();
        else{img.onload=onImgLoad;img.onerror=onImgLoad}
      });
    }
    function doCapture(){
      try{
        html2canvas(card,{backgroundColor:null,scale:2,useCORS:true,logging:false}).then(function(canvas){
          try{
            var dataUrl=canvas.toDataURL('image/png');
            var a=document.createElement('a');
            a.href=dataUrl;
            a.download='diary-'+e.date+'-'+(e.id||'').slice(-4)+'.png';
            document.body.appendChild(a);a.click();a.remove();
            showToast('图片已保存到下载');
          }catch(err){showToast('保存图片失败')}
          stage.remove();
        }).catch(function(){showToast('生成图片失败');stage.remove()});
      }catch(err){showToast('生成图片失败');stage.remove()}
    }
  }
  function importBackup(file){
    if(!file)return;
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var data=JSON.parse(reader.result),list=Array.isArray(data)?data:data.entries;
        if(!Array.isArray(list))throw new Error('invalid');
        if(!window.confirm('文件包含 '+list.length+' 篇记录。选择“确定”后将与本机日记合并，重复编号会保留本机版本。'))return;
        var seen={};entries.forEach(function(e){seen[e.id]=1});
        var added=0;
        list.forEach(function(e){
          if(!e||!e.id||!e.date||seen[e.id])return;
          var clean={id:String(e.id),date:String(e.date),title:String(e.title||''),content:String(e.content||''),mood:String(e.mood||'平静'),tags:Array.isArray(e.tags)?e.tags.map(String).slice(0,12):[],type:String(e.type||'normal'),weather:String(e.weather||''),location:String(e.location||''),stickers:Array.isArray(e.stickers)?e.stickers.map(String).slice(0,3):[],paper:String(e.paper||'default'),photos:Array.isArray(e.photos)?e.photos.slice(0,4):(typeof e.photo==='string'?[e.photo]:[]),favorite:!!e.favorite,createdAt:e.createdAt||new Date().toISOString(),updatedAt:e.updatedAt||new Date().toISOString()};
          entries.push(clean);seen[e.id]=1;added++;
        });
        if(persist()){currentView='home';query='';render();menu.classList.remove('show');showToast('已导入 '+added+' 篇新记录')}
      }catch(e){showToast('备份文件格式不正确')}
    };
    reader.onerror=function(){showToast('读取备份失败')};reader.readAsText(file);
  }
  function openMenu(){
    var cur=loadTheme();
    var dots=['default','vintage','paper','cute','mono'].map(function(t){
      return '<button class="menu-theme-dot '+(cur===t?'active':'')+'" data-theme="'+t+'" title="'+({'default':'默认','vintage':'复古','paper':'手帐纸','cute':'可爱','mono':'极简'}[t])+'"></button>';
    }).join('');
    var wrap=$('menuThemeDots');if(wrap){
      wrap.innerHTML=dots;
      wrap.querySelectorAll('.menu-theme-dot').forEach(function(d){
        d.addEventListener('click',function(){
          saveTheme(d.dataset.theme);
          wrap.querySelectorAll('.menu-theme-dot').forEach(function(x){x.classList.toggle('active',x===d)});
        });
      });
    }
    menu.classList.add('show');
  }
  function closeMenu(){menu.classList.remove('show')}
  root.addEventListener('click',function(e){
    var filter=e.target.closest('[data-mood-filter]');
    if(filter){moodFilter=filter.dataset.moodFilter;render();return}
    var create=e.target.closest('[data-create]');
    if(create){openEditor();return}
    var createDate=e.target.closest('[data-create-date]');
    if(createDate){openEditor(null,createDate.dataset.createDate);return}
    var date=e.target.closest('[data-date]');
    if(date){selectedCalendarDate=date.dataset.date;var dt=new Date(selectedCalendarDate+'T12:00:00');calendarMonth=new Date(dt.getFullYear(),dt.getMonth(),1);render();return}
    var exp=e.target.closest('[data-export-img]');
    if(exp){e.stopPropagation();exportEntryAsImage(exp.dataset.exportImg);return}
    var edit=e.target.closest('[data-edit]');
    if(edit){e.stopPropagation();openEditor(edit.dataset.edit);return}
    var card=e.target.closest('[data-open-entry]');
    if(card){openEditor(card.dataset.openEntry);return}
  });
  document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){currentView=b.dataset.view;cardAnimQueued=true;render()})});
  $('backHome').addEventListener('click',function(){location.href='../index.html'});
  $('newEntryBtn').addEventListener('click',function(){openEditor()});
  $('searchToggle').addEventListener('click',function(){if(currentView!=='home'){currentView='home';render()}var inp=$('diarySearch');if(inp){inp.focus();inp.scrollIntoView({block:'nearest',behavior:'smooth'})}});
  $('moreBtn').addEventListener('click',openMenu);$('closeMenu').addEventListener('click',closeMenu);
  menu.addEventListener('click',function(e){if(e.target===menu)closeMenu()});
  $('exportBtn').addEventListener('click',exportBackup);$('importBtn').addEventListener('click',function(){$('importFile').click()});
  $('importFile').addEventListener('change',function(){importBackup(this.files&&this.files[0]);this.value=''});
  $('clearSearchBtn').addEventListener('click',function(){query='';moodFilter='全部';currentView='home';closeMenu();render();showToast('已清除筛选')});
  $('entryPhoto').addEventListener('change',function(){processImage(this.files&&this.files[0]);this.value=''});
  $('aboutExport')&&$('aboutExport').addEventListener('click',exportBackup);
  $('aboutImport')&&$('aboutImport').addEventListener('click',function(){$('importFile').click()});
  function updateTime(){var el=$('statusTime');if(!el)return;var d=new Date();el.textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}
  updateTime();setInterval(updateTime,30000);
  loadTheme();
  render();
})();
</script>
</body>
