<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>气泡设置 · 小手机</title>
<script src="js/font-loader.js"></script>
<script src="js/native-feel.js"></script>
<script src="js/statusbar-control.js"></script>
<style>
  /* ===== 主题变量（聊天页同款变量名，预览区实时消费） ===== */
  :root {
    --my-bubble-bg: #111111;
    --my-bubble-color: #FFFFFF;
    --partner-bubble-bg: #FFFFFF;
    --partner-bubble-color: #111111;
    --my-bubble-radius: 18px 18px 4px 18px;
    --partner-bubble-radius: 18px 18px 18px 4px;
    --avatar-size: 32px;
    --avatar-radius: 50%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: #e5e5e5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #111111;
  }

  /* 项目统一手机外壳 */
  .phone-mockup {
    position: relative;
    width: min(390px, calc(100vw - 24px));
    height: min(844px, calc(100vh - 24px));
    background-color: #FFFFFF;
    border-radius: 45px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    position: absolute;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 14px 28px;
    font-size: 0.875rem;
    font-weight: 600;
    color: #000;
    z-index: 50;
    pointer-events: none !important;
  }
  .floating-nav { display: none !important; }

  /* 可滚动内容区 */
  .bt-stage-outer {
    flex: 1;
    overflow-y: auto;
    padding: 0 18px;
    display: flex;
    flex-direction: column;
    scrollbar-width: none;
    background: #FFFFFF;
  }
  .bt-stage-outer::-webkit-scrollbar { display: none; }

  /* ===== 顶部导航：圆形返回 + 大英文标题左对齐 ===== */
  .bt-topbar {
    position: relative;
    z-index: 30;
    display: flex !important;
    align-items: flex-end !important;
    justify-content: flex-start !important;
    gap: 14px;
    margin: 0 -18px;
    padding: calc(56px + env(safe-area-inset-top, 0px)) 22px 16px 22px;
  }
  .bt-top-left, .bt-top-right {
    width: 30px; height: 30px;
    display: flex; align-items: center;
    flex-shrink: 0;
  }
  .bt-top-left { justify-content: flex-start; }
  .bt-top-right { justify-content: flex-end; display: none; }
  .bt-circle-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: #F4F4F6;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .bt-circle-btn:active { transform: scale(0.97); background: #B0B0B5; }
  .bt-circle-btn svg { width: 14px; height: 14px; stroke: #111111; }
  .bt-title {
    flex: 1;
    text-align: left;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: #111111;
    line-height: 1.1;
  }

  /* ===== 实时预览区：复用聊天页 .msg-row / .msg-bubble / .msg-avatar 结构 ===== */
  .bt-preview-wrap {
    margin-top: 16px !important;
    background: #F8F8FA !important;
    border-radius: 20px !important;
    padding: 14px !important;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 0.5px solid #E5E5EA;
  }
  .bt-preview-label {
    font-size: 0.563rem !important;
    color: #C7C7CC !important;
    letter-spacing: 2px !important;
    text-align: center;
    margin-bottom: 2px;
  }
  /* 微缩聊天：预览区内气泡强制迷你化（不影响聊天页） */
  .bt-preview-wrap .msg-bubble {
    font-size: 0.625rem !important;
    padding: 6px 10px !important;
  }
  .msg-row {
    display: flex;
    gap: 8px;
    max-width: 86%;
    align-items: flex-start;
  }
  .msg-row.received, .msg-row.left { align-self: flex-start; }
  .msg-row.sent, .msg-row.right { align-self: flex-end; }
  .msg-avatar {
    width: var(--avatar-size);
    height: var(--avatar-size);
    border-radius: var(--avatar-radius);
    background: linear-gradient(135deg, #EFEFEF 0%, #DCDCDC 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1.5px solid #FFFFFF;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    font-size: 0.688rem;
    font-weight: 700;
    color: #444444;
    overflow: hidden;
  }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg-avatar svg { width: 62%; height: 62%; stroke: #8E8E93; }
  .msg-bubble {
    padding: 9.5px 13px;
    font-size: 0.75rem;
    line-height: 1.5;
    letter-spacing: -0.1px;
    word-break: break-word;
    font-weight: 500;
    max-width: 100%;
    min-width: 0;
  }
  .msg-row.received .msg-bubble, .msg-row.left .msg-bubble {
    background: var(--partner-bubble-bg);
    color: var(--partner-bubble-color);
    border-radius: var(--partner-bubble-radius) !important;
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.02);
  }
  .msg-row.sent .msg-bubble, .msg-row.right .msg-bubble {
    background: var(--my-bubble-bg);
    color: var(--my-bubble-color);
    border-radius: var(--my-bubble-radius) !important;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
  }

  /* ===== 分组标题（英文小字，与 settings 页一致） ===== */
  .bt-group-title {
    font-size: 0.688rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #B0B0B5;
    padding: 18px 6px 6px;
  }

  /* ===== 通用卡片 ===== */
  .bt-panel {
    margin-top: 4px;
    background: #F8F8FA !important;
    border-radius: 20px !important;
    padding: 14px 16px !important;
    display: flex;
    flex-direction: column;
  }

  /* ===== 颜色分组：2x2 色块网格 ===== */
  .bt-color-grid {
    display: grid !important;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px !important;
  }
  .bt-color-cell {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 14px 10px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .bt-color-cell:active { transform: scale(0.96); }
  .bt-swatch {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #111111;
    border: 1px solid #E5E5EA;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .bt-color-input {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    padding: 0;
    border: none;
    cursor: pointer;
  }
  .bt-cell-label {
    font-size: 0.75rem;
    color: #666666;
  }
  .bt-cell-val {
    font-size: 0.625rem;
    color: #B0B0B5;
    font-family: monospace;
  }

  /* ===== 头像滑块：标签在上，滑块在下 ===== */
  .bt-slider-panel { gap: 18px; padding: 16px !important; }
  .bt-slider-block { display: flex; flex-direction: column; gap: 8px; }
  .bt-slider-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .bt-slider-label { font-size: 0.813rem; color: #111111; font-weight: 500; }
  .bt-range {
    -webkit-appearance: none !important;
    appearance: none !important;
    width: 100%;
    height: 4px !important;
    background: #E5E5EA !important;
    border-radius: 999px !important;
    cursor: pointer;
  }
  .bt-range::-webkit-slider-thumb {
    -webkit-appearance: none !important;
    width: 20px !important;
    height: 20px !important;
    border-radius: 50% !important;
    background: #111111 !important;
    border: none !important;
    box-shadow: none !important;
    cursor: pointer;
  }
  .bt-range::-moz-range-thumb {
    width: 20px !important;
    height: 20px !important;
    border-radius: 50% !important;
    background: #111111 !important;
    border: none !important;
    box-shadow: none !important;
    cursor: pointer;
  }
  .bt-range::-moz-range-track {
    height: 4px !important;
    background: #E5E5EA !important;
    border-radius: 999px !important;
  }
  .bt-range-val {
    font-size: 0.813rem !important;
    font-weight: 700 !important;
    color: #111111 !important;
    font-family: inherit !important;
  }

  /* ===== 气泡形态：2x2 大按钮 ===== */
  .bt-shape-panel { padding: 12px !important; }
  .bt-shape-presets {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .bt-shape-btn {
    height: 44px;
    border: none !important;
    border-radius: 14px;
    background: #FFFFFF !important;
    color: #666666 !important;
    font-size: 0.813rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  .bt-shape-btn:active { transform: scale(0.97); }
  .bt-shape-btn.active { background: #111111 !important; color: #FFFFFF !important; }

  /* ===== 操作按钮：2x3 网格 ===== */
  .bt-action-grid {
    display: grid !important;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    padding: 10px !important;
  }
  .bt-action-btn {
    height: 40px !important;
    border: none !important;
    border-radius: 12px !important;
    background: #FFFFFF !important;
    color: #111111 !important;
    font-size: 0.75rem !important;
    font-weight: 600 !important;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
    box-shadow: none !important;
  }
  .bt-action-btn:active { opacity: 0.75; transform: scale(0.96); }

  /* ===== 恢复默认气泡卡片 ===== */
  .bt-reset-card {
    margin-top: 12px;
    background: #F8F8FA !important;
    border-radius: 20px !important;
    padding: 14px 16px !important;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    border: none !important;
    box-shadow: none !important;
    transition: opacity 0.15s ease;
  }
  .bt-reset-card:active { opacity: 0.8; }
  .bt-reset-text { font-size: 0.813rem; color: #8E8E93; }
  .bt-reset-icon { width: 16px; height: 16px; display: block; }

  /* ===== Toast ===== */
  .bt-toast {
    position: absolute;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%) translateY(8px);
    background: rgba(17, 17, 17, 0.88);
    color: #FFFFFF;
    font-size: 0.75rem;
    padding: 8px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 99;
    white-space: nowrap;
  }
  .bt-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 导入CSS 弹窗：遮罩 + 居中卡片（中央渐显 + 微放大） ===== */
  .bt-modal-mask {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.32);
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bt-modal {
    width: 80%;
    max-width: 320px;
    background: #FFFFFF;
    border-radius: 16px;
    padding: 16px 14px 14px 14px;
    box-sizing: border-box;
    animation: btModalIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes btModalIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .bt-modal-title {
    font-size: 0.875rem;
    font-weight: 700;
    color: #111111;
    text-align: center;
    margin-bottom: 6px;
  }
  .bt-modal-desc {
    font-size: 0.625rem;
    color: #C7C7CC;
    line-height: 1.5;
    text-align: center;
    margin-bottom: 10px;
  }
  .bt-modal-input {
    width: 100%;
    min-height: 96px;
    resize: none;
    background: #F2F2F7 !important;
    border: none !important;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 0.75rem;
    color: #111111;
    font-family: monospace;
    line-height: 1.5;
    outline: none;
    box-sizing: border-box;
    display: block;
    margin-bottom: 12px;
  }
  .bt-modal-input::placeholder { color: #C7C7CC; }
  .bt-modal-btns {
    display: flex;
    gap: 8px;
  }
  .bt-modal-btn {
    flex: 1;
    height: 38px;
    border: none !important;
    border-radius: 10px;
    font-size: 0.813rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .bt-modal-btn:active { opacity: 0.8; }
  .bt-modal-cancel {
    background: #F2F2F7 !important;
    color: #666666 !important;
  }
  .bt-modal-ok {
    background: #111111 !important;
    color: #FFFFFF !important;
  }
  /* 导入CSS 大框变体 */
  .bt-modal-lg {
    width: 90%;
    max-width: 340px;
    border-radius: 20px;
    padding: 18px 16px 16px 16px;
  }
  .bt-modal-input-lg {
    min-height: 220px;
  }
  /* 导出CSS 只读大框 */
  .bt-modal-input-ro {
    min-height: 200px;
    background: #F7F7F9 !important;
    border-radius: 12px !important;
    padding: 14px !important;
    color: #333333 !important;
  }
  /* 实时应用复选框行 */
  .bt-modal-check-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: -4px 0 12px 0;
    cursor: pointer;
  }
  .bt-modal-check-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #111111;
    margin: 0;
    cursor: pointer;
  }
  .bt-modal-check-row span {
    font-size: 0.75rem;
    color: #666666;
  }
  /* 保存预设单行输入框 */
  .bt-modal-field {
    width: 100%;
    height: 44px;
    background: #F2F2F7 !important;
    border: none !important;
    border-radius: 10px;
    padding: 0 12px;
    font-size: 0.813rem;
    color: #111111;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;
    display: block;
    margin-bottom: 12px;
  }
  .bt-modal-field::placeholder { color: #C7C7CC; }
  /* 预设选择列表 */
  .bt-preset-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
    margin-top: 4px;
  }
  .bt-preset-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 48px;
    padding: 0 14px;
    background: #F7F7F9;
    border-radius: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .bt-preset-item:active { background: #EFEFF4; }
  .bt-preset-name {
    font-size: 0.813rem;
    color: #333333;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bt-preset-arrow {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    margin-left: 10px;
    stroke: #C7C7CC;
  }
  .bt-preset-empty {
    font-size: 0.688rem;
    color: #C7C7CC;
    text-align: center;
    padding: 18px 0 8px 0;
  }
</style>
<link rel="stylesheet" href="css/mobile-fit.css">
</head>
<body>

  <div class="phone-mockup">

    <div class="status-bar"><span>4:41</span></div>

    <main class="bt-stage-outer">

      <!-- 顶部导航：返回键固定跳回设置页（file:// 下 history.back() 不可靠） -->
      <div class="bt-topbar">
        <div class="bt-top-left">
          <button class="bt-circle-btn" type="button" aria-label="返回" onclick="location.href='settings.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
        </div>
        <span class="bt-title">BUBBLE THEME</span>
        <div class="bt-top-right"></div>
      </div>

      <!-- 实时预览区：结构与聊天页完全一致 -->
      <div class="bt-preview-wrap">
        <div class="bt-preview-label">PREVIEW</div>
        <div class="msg-row received">
          <div class="msg-avatar" id="previewPartnerAvatar"></div>
          <div class="msg-bubble">嗨，今天过得怎么样？</div>
        </div>
        <div class="msg-row sent">
          <div class="msg-bubble">还不错，刚忙完～</div>
          <div class="msg-avatar" id="previewMyAvatar"></div>
        </div>
      </div>

      <!-- 颜色分组：2x2 色块网格 -->
      <div class="bt-group-title">BUBBLE COLOR</div>
      <div class="bt-panel bt-color-grid">
        <label class="bt-color-cell">
          <span class="bt-swatch" id="myBgSwatch"><input class="bt-color-input" type="color" id="myBg" value="#111111"></span>
          <span class="bt-cell-label">我方背景</span>
          <span class="bt-cell-val" id="myBgVal">#111111</span>
        </label>
        <label class="bt-color-cell">
          <span class="bt-swatch" id="myColorSwatch"><input class="bt-color-input" type="color" id="myColor" value="#FFFFFF"></span>
          <span class="bt-cell-label">我方文字</span>
          <span class="bt-cell-val" id="myColorVal">#FFFFFF</span>
        </label>
        <label class="bt-color-cell">
          <span class="bt-swatch" id="partnerBgSwatch"><input class="bt-color-input" type="color" id="partnerBg" value="#FFFFFF"></span>
          <span class="bt-cell-label">对方背景</span>
          <span class="bt-cell-val" id="partnerBgVal">#FFFFFF</span>
        </label>
        <label class="bt-color-cell">
          <span class="bt-swatch" id="partnerColorSwatch"><input class="bt-color-input" type="color" id="partnerColor" value="#111111"></span>
          <span class="bt-cell-label">对方文字</span>
          <span class="bt-cell-val" id="partnerColorVal">#111111</span>
        </label>
      </div>

      <!-- 头像分组：两个滑块各占一行，标签在上滑块在下 -->
      <div class="bt-group-title">AVATAR</div>
      <div class="bt-panel bt-slider-panel">
        <div class="bt-slider-block">
          <div class="bt-slider-head">
            <span class="bt-slider-label">头像大小</span>
            <span class="bt-range-val" id="avatarSizeVal">32px</span>
          </div>
          <input class="bt-range" type="range" id="avatarSize" min="24" max="48" step="1" value="32">
        </div>
        <div class="bt-slider-block">
          <div class="bt-slider-head">
            <span class="bt-slider-label">头像圆角</span>
            <span class="bt-range-val" id="avatarRadiusVal">50%</span>
          </div>
          <input class="bt-range" type="range" id="avatarRadius" min="0" max="50" step="1" value="50">
        </div>
      </div>

      <!-- 气泡形态：2x2 大按钮 -->
      <div class="bt-group-title">BUBBLE SHAPE</div>
      <div class="bt-panel bt-shape-panel">
        <div class="bt-shape-presets" id="shapePresets">
          <button class="bt-shape-btn active" type="button" data-my="18px 18px 4px 18px" data-partner="18px 18px 18px 4px">圆润</button>
          <button class="bt-shape-btn" type="button" data-my="22px 22px 22px 2px" data-partner="22px 22px 2px 22px">iMessage</button>
          <button class="bt-shape-btn" type="button" data-my="10px 10px 0px 10px" data-partner="10px 10px 10px 0px">QQ 风格</button>
          <button class="bt-shape-btn" type="button" data-my="0px" data-partner="0px">极简直角</button>
        </div>
      </div>

      <!-- 预设与代码：2x3 小按钮网格 -->
      <div class="bt-group-title">PRESETS &amp; CODE</div>
      <div class="bt-panel bt-action-grid">
        <button class="bt-action-btn" type="button" data-act="保存当前预设">保存预设</button>
        <button class="bt-action-btn" type="button" data-act="选择预设">选择预设</button>
        <button class="bt-action-btn" type="button" data-act="导入CSS">导入 CSS</button>
        <button class="bt-action-btn" type="button" data-act="导出CSS">导出 CSS</button>
        <button class="bt-action-btn" type="button" data-act="复制气泡格式">复制气泡</button>
        <button class="bt-action-btn" type="button" data-act="复制头像格式">复制头像</button>
      </div>

      <!-- 恢复默认气泡 -->
      <div class="bt-reset-card" id="resetCard" role="button">
        <span class="bt-reset-text">恢复默认气泡</span>
        <svg class="bt-reset-icon" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </div>

    </main>

    <div class="bt-toast" id="btToast"></div>

    <!-- 导入CSS 弹窗：纯白大框 + 实时应用复选框 -->
    <div class="bt-modal-mask" id="importMask" style="display:none;">
      <div class="bt-modal bt-modal-lg">
        <div class="bt-modal-title">导入 CSS</div>
        <div class="bt-modal-desc">支持 border-radius / background / color；两段声明将分别应用于我方与对方气泡</div>
        <textarea class="bt-modal-input bt-modal-input-lg" id="importInput" rows="8" placeholder=".msg-bubble {&#10;  border-radius: 20px 20px 4px 20px;&#10;  background: #333333;&#10;  color: #ffffff;&#10;}"></textarea>
        <label class="bt-modal-check-row">
          <input type="checkbox" id="importLive" checked>
          <span>实时应用（输入时立即在预览区生效）</span>
        </label>
        <div class="bt-modal-btns">
          <button class="bt-modal-btn bt-modal-cancel" id="importCancel" type="button">取消</button>
          <button class="bt-modal-btn bt-modal-ok" id="importOk" type="button">保存并应用</button>
        </div>
      </div>
    </div>

    <!-- 保存预设弹窗 -->
    <div class="bt-modal-mask" id="presetSaveMask" style="display:none;">
      <div class="bt-modal">
        <div class="bt-modal-title">保存预设</div>
        <div class="bt-modal-desc">将当前的气泡颜色、圆角与头像样式保存为可复用的预设</div>
        <input class="bt-modal-field" id="presetNameInput" type="text" maxlength="20" placeholder="给这个气泡起个名字，例如：苹果气泡">
        <div class="bt-modal-btns">
          <button class="bt-modal-btn bt-modal-cancel" id="presetSaveCancel" type="button">取消</button>
          <button class="bt-modal-btn bt-modal-ok" id="presetSaveOk" type="button">确定保存</button>
        </div>
      </div>
    </div>

    <!-- 选择预设弹窗 -->
    <div class="bt-modal-mask" id="presetListMask" style="display:none;">
      <div class="bt-modal">
        <div class="bt-modal-title">选择预设</div>
        <div class="bt-preset-list" id="presetList"></div>
      </div>
    </div>

    <!-- 恢复默认确认弹窗 -->
    <div class="bt-modal-mask" id="resetMask" style="display:none;">
      <div class="bt-modal">
        <div class="bt-modal-title">恢复默认</div>
        <div class="bt-modal-desc">确定要恢复默认气泡设置吗？</div>
        <div class="bt-modal-btns">
          <button class="bt-modal-btn bt-modal-cancel" id="resetCancel" type="button">取消</button>
          <button class="bt-modal-btn bt-modal-ok" id="resetOk" type="button">确认重置</button>
        </div>
      </div>
    </div>

    <!-- 导出CSS 弹窗 -->
    <div class="bt-modal-mask" id="exportMask" style="display:none;">
      <div class="bt-modal bt-modal-lg">
        <div class="bt-modal-title">导出 CSS</div>
        <div class="bt-modal-desc">当前气泡主题的完整 CSS 变量，可粘贴到任意支持的地方</div>
        <textarea class="bt-modal-input bt-modal-input-ro" id="exportInput" rows="9" readonly></textarea>
        <div class="bt-modal-btns">
          <button class="bt-modal-btn bt-modal-cancel" id="exportCancel" type="button">关闭</button>
          <button class="bt-modal-btn bt-modal-ok" id="exportCopy" type="button">复制代码</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ================= 基础数据 =================
    var DEFAULTS = {
      myBg: '#111111', myColor: '#FFFFFF',
      partnerBg: '#FFFFFF', partnerColor: '#111111',
      myRadius: '18px 18px 4px 18px',
      partnerRadius: '18px 18px 18px 4px',
      avatarSize: 32, avatarRadius: 50
    };
    var GLOBAL_KEY = 'theme_bubble_global';
    var ROLE_KEY_PREFIX = 'theme_bubble_role_';

    // URL 的 ?roleId=xxx 仅用于预览区渲染对应角色头像，不影响存储
    var params = new URLSearchParams(location.search);
    var roleId = params.get('roleId') || '';
    var conf = {};          // 当前编辑中的值（即写入存储的值）

    // ================= 工具 =================
    function readKey(key) {
      try {
        var v = JSON.parse(localStorage.getItem(key) || '{}');
        return (v && typeof v === 'object') ? v : {};
      } catch (e) { return {}; }
    }
    // 读取优先级：全局 > 内置默认（用于回显）
    function mergedConf() {
      var out = {};
      var gc = readKey(GLOBAL_KEY);
      Object.keys(DEFAULTS).forEach(function (k) {
        out[k] = (gc[k] != null) ? gc[k] : DEFAULTS[k];
      });
      return out;
    }
    function getRole() {
      try {
        var arr = JSON.parse(localStorage.getItem('ai_custom_characters') || '[]');
        if (!Array.isArray(arr)) return null;
        for (var i = 0; i < arr.length; i++) {
          if (String(arr[i].id) === String(roleId)) return arr[i];
        }
      } catch (e) {}
      return null;
    }
    var toastEl = document.getElementById('btToast');
    var toastTimer = null;
    function showToast(text, duration) {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, duration || 2000);
    }

    // ================= 应用与回显 =================
    var rootEl = document.documentElement;
    function applyConf(c) {
      conf = {};
      Object.keys(DEFAULTS).forEach(function (k) { conf[k] = c[k]; });
      rootEl.style.setProperty('--my-bubble-bg', conf.myBg);
      rootEl.style.setProperty('--my-bubble-color', conf.myColor);
      rootEl.style.setProperty('--partner-bubble-bg', conf.partnerBg);
      rootEl.style.setProperty('--partner-bubble-color', conf.partnerColor);
      rootEl.style.setProperty('--avatar-size', Number(conf.avatarSize) + 'px');
      rootEl.style.setProperty('--avatar-radius', Number(conf.avatarRadius) + '%');
      rootEl.style.setProperty('--my-bubble-radius', conf.myRadius);
      rootEl.style.setProperty('--partner-bubble-radius', conf.partnerRadius);
      // 控件回显
      document.getElementById('myBg').value = conf.myBg;
      document.getElementById('myColor').value = conf.myColor;
      document.getElementById('partnerBg').value = conf.partnerBg;
      document.getElementById('partnerColor').value = conf.partnerColor;
      document.getElementById('avatarSize').value = conf.avatarSize;
      document.getElementById('avatarRadius').value = conf.avatarRadius;
      document.getElementById('myBgVal').textContent = conf.myBg;
      document.getElementById('myColorVal').textContent = conf.myColor;
      document.getElementById('partnerBgVal').textContent = conf.partnerBg;
      document.getElementById('partnerColorVal').textContent = conf.partnerColor;
      ['myBg','myColor','partnerBg','partnerColor'].forEach(function (k) {
        var sw = document.getElementById(k + 'Swatch');
        if (sw) sw.style.background = conf[k];
      });
      document.getElementById('avatarSizeVal').textContent = conf.avatarSize + 'px';
      document.getElementById('avatarRadiusVal').textContent = conf.avatarRadius + '%';
      highlightShapePreset(conf.myRadius, conf.partnerRadius);
    }
    function saveConf() {
      try { localStorage.setItem(GLOBAL_KEY, JSON.stringify(conf)); } catch (e) {}
    }

    // ================= 控件事件：变动即写存储 =================
    var COLOR_KEYS = {
      myBg: '--my-bubble-bg',
      myColor: '--my-bubble-color',
      partnerBg: '--partner-bubble-bg',
      partnerColor: '--partner-bubble-color'
    };
    function syncSwatch(key, val) {
      var sw = document.getElementById(key + 'Swatch');
      if (sw) sw.style.background = val;
    }
    Object.keys(COLOR_KEYS).forEach(function (key) {
      var input = document.getElementById(key);
      var valEl = document.getElementById(key + 'Val');
      input.addEventListener('input', function () {
        conf[key] = input.value;
        valEl.textContent = input.value;
        syncSwatch(key, input.value);
        rootEl.style.setProperty(COLOR_KEYS[key], input.value);
        saveConf();
      });
    });
    document.getElementById('avatarSize').addEventListener('input', function () {
      conf.avatarSize = Number(this.value);
      document.getElementById('avatarSizeVal').textContent = conf.avatarSize + 'px';
      rootEl.style.setProperty('--avatar-size', conf.avatarSize + 'px');
      saveConf();
    });
    document.getElementById('avatarRadius').addEventListener('input', function () {
      conf.avatarRadius = Number(this.value);
      document.getElementById('avatarRadiusVal').textContent = conf.avatarRadius + '%';
      rootEl.style.setProperty('--avatar-radius', conf.avatarRadius + '%');
      saveConf();
    });

    // ================= 预览头像 =================
    var USER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
    function fillAvatar(el, avatar) {
      el.innerHTML = avatar ? '<img src="' + avatar + '" alt="">' : USER_SVG;
    }
    (function renderPreviewAvatars() {
      var role = getRole();
      fillAvatar(document.getElementById('previewPartnerAvatar'), role ? (role.avatar || '') : '');
      var my = {};
      try { my = JSON.parse(localStorage.getItem('myProfile') || '{}') || {}; } catch (e) {}
      fillAvatar(document.getElementById('previewMyAvatar'), my.avatar || '');
    })();

    // ================= 气泡形态：预设与自定义圆角 =================
    var shapePresetsEl = document.getElementById('shapePresets');
    function highlightShapePreset(myVal, partnerVal) {
      var matched = null;
      Array.prototype.forEach.call(shapePresetsEl.querySelectorAll('.bt-shape-btn'), function (btn) {
        btn.classList.remove('active');
        if (btn.dataset.my === myVal && btn.dataset.partner === partnerVal) matched = btn;
      });
      if (matched) matched.classList.add('active');
    }
    shapePresetsEl.addEventListener('click', function (e) {
      var btn = e.target.closest('.bt-shape-btn');
      if (!btn) return;
      conf.myRadius = btn.dataset.my;
      conf.partnerRadius = btn.dataset.partner;
      try {
        rootEl.style.setProperty('--my-bubble-radius', conf.myRadius);
        rootEl.style.setProperty('--partner-bubble-radius', conf.partnerRadius);
      } catch (err) {}
      Array.prototype.forEach.call(shapePresetsEl.querySelectorAll('.bt-shape-btn'), function (b) {
        b.classList.toggle('active', b === btn);
      });
      saveConf();
    });

    // ================= 恢复默认 =================
    document.getElementById('resetCard').addEventListener('click', function () {
      document.getElementById('resetMask').style.display = 'flex';
    });
    document.getElementById('resetCancel').addEventListener('click', function () {
      document.getElementById('resetMask').style.display = 'none';
    });
    document.getElementById('resetOk').addEventListener('click', function () {
      // 清除全局键 + 所有角色专属键（含当前 roleId），彻底恢复默认
      try { localStorage.removeItem(GLOBAL_KEY); } catch (e) {}
      try {
        Object.keys(localStorage).forEach(function (k) {
          if (k.indexOf(ROLE_KEY_PREFIX) === 0) localStorage.removeItem(k);
        });
      } catch (e) {}
      conf = {};
      Object.keys(DEFAULTS).forEach(function (k) { conf[k] = DEFAULTS[k]; });
      applyConf(conf);
      document.getElementById('resetMask').style.display = 'none';
      showToast('已恢复默认');
    });

    // ================= 导出CSS =================
    function buildExportCss() {
      var m = mergedConf();
      return ':root {\n'
        + '  --my-bubble-bg: ' + m.myBg + ';\n'
        + '  --my-bubble-color: ' + m.myColor + ';\n'
        + '  --partner-bubble-bg: ' + m.partnerBg + ';\n'
        + '  --partner-bubble-color: ' + m.partnerColor + ';\n'
        + '  --my-bubble-radius: ' + m.myRadius + ';\n'
        + '  --partner-bubble-radius: ' + m.partnerRadius + ';\n'
        + '  --avatar-size: ' + m.avatarSize + 'px;\n'
        + '  --avatar-radius: ' + m.avatarRadius + '%;\n'
        + '}';
    }
    function openExportModal() {
      document.getElementById('exportInput').value = buildExportCss();
      document.getElementById('exportMask').style.display = 'flex';
    }
    document.getElementById('exportCancel').addEventListener('click', function () {
      document.getElementById('exportMask').style.display = 'none';
    });
    document.getElementById('exportMask').addEventListener('click', function (e) {
      if (e.target === document.getElementById('exportMask')) {
        document.getElementById('exportMask').style.display = 'none';
      }
    });
    document.getElementById('exportCopy').addEventListener('click', function () {
      var text = document.getElementById('exportInput').value;
      var fallback = function () {
        try {
          var ta = document.getElementById('exportInput');
          ta.removeAttribute('readonly');
          ta.select();
          ta.setSelectionRange(0, text.length);
          var ok = document.execCommand('copy');
          ta.setAttribute('readonly', 'readonly');
          if (ok) {
            showToast('已复制到剪贴板');
            document.getElementById('exportMask').style.display = 'none';
          } else {
            showToast('复制失败，请手动长按选择复制');
          }
        } catch (e) {
          showToast('复制失败，请手动长按选择复制');
        }
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showToast('已复制到剪贴板');
            document.getElementById('exportMask').style.display = 'none';
          }, fallback);
        } else {
          fallback();
        }
      } catch (e) { fallback(); }
    });

    // ================= 底部功能按钮 =================
    Array.prototype.forEach.call(document.querySelectorAll('.bt-action-btn'), function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.dataset.act;
        if (act === '导入CSS') { openImportModal(); return; }
        if (act === '导出CSS') { openExportModal(); return; }
        if (act === '保存当前预设') { openPresetSaveModal(); return; }
        if (act === '选择预设') { openPresetListModal(); return; }
        showToast('「' + act + '」功能即将上线');
      });
    });

    // ================= 导入CSS 弹窗：解析 border-radius / background / color =================
    var importMask = document.getElementById('importMask');
    var importInput = document.getElementById('importInput');
    var importLive = document.getElementById('importLive');
    var importTimer = null;

    // 提取声明：返回 {radius:[], bg:[], color:[]}，异常时返回空结构
    function parseBubbleCss(text) {
      var decls = { radius: [], bg: [], color: [] };
      try {
        var re = /(?:^|[;{\s])(border-radius|background(?:-color)?|color)\s*:\s*([^;}]+)/gi;
        var m;
        while ((m = re.exec(text)) !== null) {
          var prop = m[1].toLowerCase();
          var val = m[2].trim();
          if (!val) continue;
          if (prop === 'border-radius') decls.radius.push(val);
          else if (prop.indexOf('background') === 0) decls.bg.push(val);
          else if (prop === 'color') decls.color.push(val);
        }
      } catch (err) {}
      return decls;
    }

    // 圆角合法性：仅放行数字/px/%/空格等合法字符且须含数字
    function isRadiusValid(val) {
      return !!val && /^[0-9a-z\s.%/()-]+$/i.test(val) && /\d/.test(val);
    }

    // 任意颜色值转 #rrggbb（非法返回 null）；透明度忽略取实色
    function colorToHex(val) {
      try {
        if (!window.CSS || !CSS.supports('color', val)) return null;
        var probe = document.createElement('span');
        probe.style.color = val;
        document.body.appendChild(probe);
        var rgb = getComputedStyle(probe).color;
        document.body.removeChild(probe);
        var m = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
        if (!m) return null;
        return '#' + [m[1], m[2], m[3]].map(function (n) {
          return ('0' + Number(n).toString(16)).slice(-2);
        }).join('');
      } catch (e) { return null; }
    }

    // 实时预览：只临时覆盖页面 CSS 变量，不碰 conf 与 localStorage
    function previewParsed(decls) {
      try {
        if (decls.radius.length && isRadiusValid(decls.radius[0])) {
          rootEl.style.setProperty('--my-bubble-radius', decls.radius[0]);
          rootEl.style.setProperty('--partner-bubble-radius', decls.radius[1] || decls.radius[0]);
        }
        if (decls.bg.length) {
          var myBg = colorToHex(decls.bg[0]);
          if (myBg) rootEl.style.setProperty('--my-bubble-bg', myBg);
          if (decls.bg[1]) {
            var pBg = colorToHex(decls.bg[1]);
            if (pBg) rootEl.style.setProperty('--partner-bubble-bg', pBg);
          }
        }
        if (decls.color.length) {
          var myColor = colorToHex(decls.color[0]);
          if (myColor) rootEl.style.setProperty('--my-bubble-color', myColor);
          if (decls.color[1]) {
            var pColor = colorToHex(decls.color[1]);
            if (pColor) rootEl.style.setProperty('--partner-bubble-color', pColor);
          }
        }
      } catch (err) {}
    }

    function openImportModal() {
      importInput.value = '';
      importMask.style.display = 'flex';
    }
    // restore 为 true 时把预览恢复为 conf 当前状态（实时预览未污染 conf，直接回显即可）
    function closeImportModal(restore) {
      importMask.style.display = 'none';
      if (restore) applyConf(conf);
    }
    document.getElementById('importCancel').addEventListener('click', function () { closeImportModal(true); });
    importMask.addEventListener('click', function (e) {
      if (e.target === importMask) closeImportModal(true);
    });
    // 实时预览：150ms 防抖 + try-catch 双重防护，不完整 CSS 静默保持上次状态
    importInput.addEventListener('input', function () {
      if (!importLive.checked) return;
      if (importTimer) clearTimeout(importTimer);
      importTimer = setTimeout(function () {
        try {
          previewParsed(parseBubbleCss(importInput.value));
        } catch (err) {}
      }, 150);
    });
    // 保存并应用：解析结果合入 conf → 写当前作用域 → 全量回显
    document.getElementById('importOk').addEventListener('click', function () {
      var text = importInput.value;
      if (!text.trim()) { showToast('请粘贴 CSS 内容'); return; }
      var decls = parseBubbleCss(text);
      var changed = 0;
      try {
        // 圆角：1 段两侧同值；2 段分别应用于我方/对方
        if (decls.radius.length && isRadiusValid(decls.radius[0])) {
          conf.myRadius = decls.radius[0];
          conf.partnerRadius = decls.radius[1] || decls.radius[0];
          changed++;
        }
        // 颜色：1 段仅应用我方；2 段分别应用于我方/对方
        if (decls.bg.length) {
          var myBgHex = colorToHex(decls.bg[0]);
          if (myBgHex) { conf.myBg = myBgHex; changed++; }
          if (decls.bg[1]) {
            var pBgHex = colorToHex(decls.bg[1]);
            if (pBgHex) conf.partnerBg = pBgHex;
          }
        }
        if (decls.color.length) {
          var myColorHex = colorToHex(decls.color[0]);
          if (myColorHex) { conf.myColor = myColorHex; changed++; }
          if (decls.color[1]) {
            var pColorHex = colorToHex(decls.color[1]);
            if (pColorHex) conf.partnerColor = pColorHex;
          }
        }
      } catch (err) {}
      if (!changed) { showToast('未解析到有效的 border-radius / background / color'); return; }
      saveConf();
      applyConf(conf);
      closeImportModal(false);
      showToast('CSS 导入成功');
    });

    // ================= 保存预设：当前 8 项样式快照 + 名字存入 bubble_presets =================
    var presetSaveMask = document.getElementById('presetSaveMask');
    var presetNameInput = document.getElementById('presetNameInput');
    function openPresetSaveModal() {
      presetNameInput.value = '';
      presetSaveMask.style.display = 'flex';
    }
    document.getElementById('presetSaveCancel').addEventListener('click', function () {
      presetSaveMask.style.display = 'none';
    });
    presetSaveMask.addEventListener('click', function (e) {
      if (e.target === presetSaveMask) presetSaveMask.style.display = 'none';
    });
    document.getElementById('presetSaveOk').addEventListener('click', function () {
      var name = presetNameInput.value.trim();
      if (!name) { showToast('请输入预设名称'); return; }
      try {
        var list = [];
        try { list = JSON.parse(localStorage.getItem('bubble_presets')) || []; } catch (err) { list = []; }
        if (!Array.isArray(list)) list = [];
        var snapshot = {};
        Object.keys(DEFAULTS).forEach(function (k) { snapshot[k] = conf[k]; });
        list.unshift({ id: Date.now().toString(36), name: name, time: Date.now(), data: snapshot });
        if (list.length > 20) list = list.slice(0, 20);
        localStorage.setItem('bubble_presets', JSON.stringify(list));
        presetSaveMask.style.display = 'none';
        showToast('预设保存成功');
      } catch (err) {
        showToast('保存失败，请重试');
      }
    });

    // ================= 选择预设：渲染 bubble_presets 列表，点击即应用 =================
    var presetListMask = document.getElementById('presetListMask');
    var presetListEl = document.getElementById('presetList');
    function openPresetListModal() {
      var list = [];
      try { list = JSON.parse(localStorage.getItem('bubble_presets')) || []; } catch (err) { list = []; }
      if (!Array.isArray(list)) list = [];
      presetListEl.innerHTML = '';
      if (!list.length) {
        var empty = document.createElement('div');
        empty.className = 'bt-preset-empty';
        empty.textContent = '暂无保存的预设';
        presetListEl.appendChild(empty);
      } else {
        list.forEach(function (p) {
          var row = document.createElement('div');
          row.className = 'bt-preset-item';
          var nameSpan = document.createElement('span');
          nameSpan.className = 'bt-preset-name';
          nameSpan.textContent = p.name || '未命名预设';
          row.appendChild(nameSpan);
          row.insertAdjacentHTML('beforeend',
            '<svg class="bt-preset-arrow" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>');
          row.addEventListener('click', function () {
            try {
              Object.keys(DEFAULTS).forEach(function (k) {
                if (p.data && p.data[k] !== undefined && p.data[k] !== null) conf[k] = p.data[k];
              });
              saveConf();
              applyConf(conf);
              presetListMask.style.display = 'none';
              showToast('已应用预设：' + (p.name || '未命名预设'));
            } catch (err) {
              showToast('预设数据异常');
            }
          });
          presetListEl.appendChild(row);
        });
      }
      presetListMask.style.display = 'flex';
    }
    presetListMask.addEventListener('click', function (e) {
      if (e.target === presetListMask) presetListMask.style.display = 'none';
    });

    // ================= 初始化 =================
    applyConf(mergedConf());
  </script>
</body>
</html>
