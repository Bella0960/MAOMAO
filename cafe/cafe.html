function chooseStory(which){
 var s=currentStory();if(!s)return;var key=String(s.idx);if(st.storyChoices[key]!==undefined)return;

 if(st.cash+Number(ef.cash||0)<0){toast('现金不够，先积累一点资金再做这个决定。');return;}

}

function updateRegulars(report){
 var day=report.day,eligible=report.served>=7;
 if(!eligible)return;
 var known=st.regulars.slice(),returning=known.length&&Math.random()<Math.min(.78,.25+known.length*.1);
 if(returning){
  var r=known[rand(known.length)];r.visits=(r.visits||1)+1;r.lastSeen=day;r.favorite=r.favorite||((REGULAR_POOL.find(function(p){return p.id===r.id;})||REGULAR_POOL[0]).favorite);
  report.regularNote=(REGULAR_POOL.find(function(p){return p.id===r.id;})||REGULAR_POOL[0]).name+' 又来店里了，带来熟悉的安心感。';report.regularBonus=1;
  stat('sat',1);stat('rep',1);
 }else if(st.regulars.length<REGULAR_POOL.length&&day>=2){
  var pool=REGULAR_POOL.filter(function(p){return !st.regulars.some(function(r){return r.id===p.id;});}),p=pool[rand(pool.length)];
  if(p){st.regulars.push({id:p.id,visits:1,lastSeen:day,favorite:p.favorite});report.regularNote=p.name+' 第一次把这里列进了常来清单。';report.regularBonus=0;}
 }
 if(st.regulars.length>4)st.regulars=st.regulars.slice(-4);
}

function goalForDay(day){var g=DAILY_GOALS[(Math.max(1,day)-1)%DAILY_GOALS.length];return {id:g.id,day:day,status:'active',reward:g.reward};}
function currentGoal(){if(!st.dailyGoal||st.dailyGoal.day!==st.day){st.dailyGoal=goalForDay(st.day);save();}return st.dailyGoal;}
function goalDef(id){return DAILY_GOALS.find(function(g){return g.id===id;})||DAILY_GOALS[0];}
function goalProgress(g){if(g.id==='market-day')return '当前预算 '+money(st.ad)+' / ¥20';if(g.id==='menu-variety')return '当前在售 '+st.menu.length+' / 4 款';if(g.id==='listen-partner')return st.partnerEpisodeDay===st.day?'搭档专属事件已完成':(st.partnerDecision&&st.partnerDecision.day===st.day?'今天已和搭档讨论':'等待今日决策');if(g.id==='serve-ten')return '营业结算目标 · 10 位客人';if(g.id==='profit-day')return '营业结算目标 · ¥120 利润';if(g.id==='no-lost-orders')return '营业结算目标 · 8 单且无缺货';return '营业结算后检查目标';}
function evaluateGoal(r){var g=currentGoal(),ok=false;if(g.status!=='active')return;if(g.id==='serve-ten')ok=r.served>=10;else if(g.id==='profit-day')ok=r.profit>=120;else if(g.id==='no-lost-orders')ok=r.served>=8&&r.lost===0;else if(g.id==='market-day')ok=r.ad>=20;else if(g.id==='listen-partner')ok=st.partnerEpisodeDay===r.day||!!(st.partnerDecision&&st.partnerDecision.day===r.day);else if(g.id==='menu-variety')ok=st.menu.length>=4;g.status=ok?'complete':'missed';g.completedDay=r.day;g.payout=ok?goalDef(g.id).reward:0;r.goalComplete=ok;r.goalName=goalDef(g.id).title;r.goalReward=g.payout;if(ok){st.cash+=g.payout;r.note+=' 今日目标达成，额外奖励 '+money(g.payout)+'。';}st.dailyGoal=g;}

 var html='<div class="head-row"><div><div class="kicker">PANTRY / SUPPLY</div><div class="section-title">原料库存</div></div><span class="aside">'+money(st.cash)+'</span></div><div class="shelf-note">补货会立即扣除经营资金。每份订单会消耗菜单对应原料；库存不足会导致订单流失。建议开店前根据主推商品备货。</div><div class="stock-list">'+ING.map(function(x){var q=st.stock[x.id]||0,c=x.cost*x.pack;return '<div class="ingredient"><div class="ing-icon">'+x.symbol+'</div><div><div class="ing-name">'+esc(x.name)+(q<8?' <span style="font-size:9px;color:#777;font-weight:400">· 库存偏低</span>':'')+'</div><div class="ing-detail">'+esc(x.desc)+'<br>补货 '+x.pack+' '+x.unit+' · '+money(c)+'</div><button class="buy" data-buy="'+x.id+'" '+(st.cash<c?'disabled':'')+'>进货 +'+x.pack+'</button></div><div style="text-align:right"><div class="qty">'+q+'</div><div class="unit">'+x.unit+'</div></div></div>';}).join('')+'</div><div class="module"><div class="module-head"><div><div class="kicker">STOCK CHECK</div><div class="section-title">目前能做多少份？</div></div></div><div class="report-card">'+st.menu.map(function(id){var p=item(id),n=Infinity;Object.keys(p.req).forEach(function(k){n=Math.min(n,Math.floor((st.stock[k]||0)/p.req[k]));});return '<div class="history-row"><div><strong>'+esc(p.name)+'</strong><span>按现有库存约可制作 '+Math.max(0,n)+' 份</span></div><div class="history-value">'+Math.max(0,n)+' 份</div></div>';}).join('')+'</div></div>';
 $('view-stock').innerHTML=html;
 document.querySelectorAll('[data-buy]').forEach(function(b){b.addEventListener('click',function(){var x=ing(b.getAttribute('data-buy')),total=x.cost*x.pack;if(st.cash<total){toast('资金不足，先营业赚一点吧。');return;}st.cash-=total;st.stock[x.id]=(st.stock[x.id]||0)+x.pack;save();renderStock();toast('已补货：'+x.name+' +'+x.pack);});});
}
function decorSvg(i){var base='<svg viewBox="0 0 120 80"><path d="M10 69H110M18 69V14H102V69" stroke="#777"/>';var a=['<rect x="24" y="24" width="72" height="29"/><path d="M25 57H95M30 33H90"/>','<rect x="27" y="24" width="25" height="35"/><rect x="60" y="24" width="34" height="21"/><path d="M60 50H94M34 31H45M34 37H45"/>','<rect x="23" y="25" width="74" height="33"/><path d="M60 25V58M23 41H97M32 64V70M88 64V70"/>','<path d="M25 28H95V60H25zM31 34H48V54H31zM55 34H89V44H55zM55 48H89V54H55z"/>','<rect x="28" y="29" width="64" height="29"/><path d="M20 20H100M20 64H100M36 20V29M60 20V29M84 20V29"/>','<path d="M31 69V29M60 69V20M89 69V29M25 29H37M54 20H66M83 29H95M26 16H94"/>'];return base+a[i]+'</svg>';}
function renderShop(){
 var d=DECORS.find(function(x){return x.id===st.decor;})||DECORS[0],html='<div class="head-row"><div><div class="kicker">STORE / PERSONALITY</div><div class="section-title">把店铺变成自己的样子</div></div><span class="aside">LV.'+st.level+'</span></div><div class="box-card"><div class="shop-preview">'+decorSvg(DECORS.indexOf(d))+'</div><div class="preview-cap"><strong>'+esc(d.name)+'</strong><span>当前使用的空间设计</span></div><div class="progress"><span style="width:'+Math.round(st.xp/needed()*100)+'%"></span></div><div class="notice">升级进度 '+st.xp+' / '+needed()+' EXP · 经营越稳定，越能提升店铺等级。</div></div><div class="module"><div class="module-head"><div><div class="kicker">DECOR COLLECTION</div><div class="section-title">装修与氛围</div></div><span class="tag">'+st.decorUnlocked.length+' / '+DECORS.length+' 已解锁</span></div><div class="decor-list">'+DECORS.map(function(x){var on=st.decorUnlocked.indexOf(x.id)>=0,cur=st.decor===x.id,lev=st.level>=x.level,cash=st.cash>=x.price,label=cur?'正在使用':on?'换上装饰':lev?money(x.price):'LV.'+x.level+' 解锁';return '<div class="decor"><div class="decor-thumb">'+decorSvg(DECORS.indexOf(x))+'</div><div><div class="decor-name">'+esc(x.name)+'</div><div class="decor-desc">'+esc(x.desc)+'</div><div class="decor-desc">需要 LV.'+x.level+' · '+(on?'已拥有':money(x.price))+'</div></div><button class="decor-btn '+(cur?'current':'')+'" data-decor="'+x.id+'" '+(cur||(!on&&(!lev||!cash))?'disabled':'')+'>'+label+'</button></div>';}).join('')+'</div></div><div class="module"><div class="module-head"><div><div class="kicker">SHOP LEDGER</div><div class="section-title">经营里程</div></div></div><div class="report-card"><div class="history-row"><div><strong>累计营业天数</strong><span>每天只能结算一次</span></div><div class="history-value">'+Math.max(0,st.day-1)+' 天</div></div><div class="history-row"><div><strong>累计服务顾客</strong><span>每位顾客都会影响口碑</span></div><div class="history-value">'+st.totalCustomers+' 位</div></div><div class="history-row"><div><strong>累计营业收入</strong><span>不含未售出的库存价值</span></div><div class="history-value">'+money(st.totalRevenue)+'</div></div></div></div>';
 $('view-shop').innerHTML=html;
 document.querySelectorAll('[data-decor]').forEach(function(b){b.addEventListener('click',function(){var x=DECORS.find(function(z){return z.id===b.getAttribute('data-decor');});if(!x)return;if(st.decorUnlocked.indexOf(x.id)>=0){st.decor=x.id;save();renderShop();toast('已经换上：'+x.name);return;}if(st.level<x.level||st.cash<x.price)return;st.cash-=x.price;st.decorUnlocked.push(x.id);st.decor=x.id;save();renderShop();toast('新装修已解锁：'+x.name);});});
}
function canMake(p){return Object.keys(p.req).every(function(k){return Number(st.stock[k]||0)>=p.req[k];});}
function consume(p){Object.keys(p.req).forEach(function(k){st.stock[k]=Math.max(0,(st.stock[k]||0)-p.req[k]);});}
function addXP(n){st.xp+=n;var notices=[];while(st.xp>=needed()&&st.level<6){st.xp-=needed();st.level++;st.cash+=100;stat('rep',4);stat('sat',2);notices.push('店铺升到 LV.'+st.level+'，奖励 ¥100。');}if(st.level>=6)st.xp=Math.min(st.xp,needed());return notices;}
function runDay(){
 if(st.eventChoice===null||st.eventChoice===undefined){toast('先处理今日事件。');return;}
 if(!st.menu.length){toast('先选择至少一款在售商品。');return;}
 var ad=Math.min(st.ad,Math.floor(st.cash/20)*20);st.cash-=ad;
 var mode=st.service,serviceName={warm:'温柔待客',standard:'标准服务',fast:'快速出杯'}[mode]||'标准服务',modeDemand=mode==='fast'?3:mode==='warm'?1:0;
 var partnerBonus=partnerBusinessBonus();
 var demand=Math.max(0,Math.round(8+st.level+st.rep*.09+st.sat*.045+ad/20+modeDemand+partnerBonus.demand+Math.min(3,st.regulars.length)+(st.eventFx.customers||0)+rand(5)-1));
 var menu=st.menu.map(function(id){return item(id);}).filter(Boolean),revenue=0,cost=0,served=0,lost=0,sold={},factor=Number(st.eventFx.priceFactor||1);
 for(var i=0;i<demand;i++){var avail=menu.filter(canMake);if(!avail.length){lost=demand-i;break;}var p=avail[rand(avail.length)];consume(p);served++;sold[p.id]=(sold[p.id]||0)+1;revenue+=Math.round(price(p)*factor);cost+=p.cost;}
 var profit=revenue-cost-ad;st.cash+=revenue;st.totalRevenue+=revenue;st.totalCustomers+=served;
 stat('sat',(mode==='warm'?4:mode==='fast'?-1:1)+(served>=12?2:served>=7?1:0)-Math.min(8,lost*2)+partnerBonus.sat);if(lost)stat('rep',-Math.min(3,lost));if(served>=demand&&served>=10)stat('rep',2);else if(served<6)stat('rep',-1);if(partnerBonus.rep&&served>=5)stat('rep',partnerBonus.rep);
 var best=menu.slice().sort(function(a,b){return (sold[b.id]||0)-(sold[a.id]||0);})[0],note='主推出品：'+(best&&sold[best.id]?best.name:'暂未形成明显爆款')+'。 '+partnerBonus.note,lvl=addXP(10+Math.floor(served/2)+Math.max(0,Math.floor(profit/100))+partnerBonus.xp);if(lvl.length)note+=' '+lvl.join(' ');
 var report={day:st.day,eventTitle:eventNow().title,revenue:revenue,cost:cost,ad:ad,profit:profit,served:served,lost:lost,serviceName:serviceName,note:note,sold:sold,partnerBonus:partnerBonus};
 updateRegulars(report);if(report.regularNote)report.note+=' '+report.regularNote;
 var wp=getPartnerProfile(role),decision=st.partnerDecision&&st.partnerDecision.day===report.day&&st.partnerDecision.roleId===String(role&&role.id||'default-partner')?st.partnerDecision:null;
 wp.daysTogether++;report.partnerName=nameOf(role);report.partnerStyle=(PARTNER_STYLES[wp.style]||PARTNER_STYLES.balanced).label;report.partnerLine=partnerResultLine(wp.style,report,decision?decision.followedAdvice:null);wp.lastLine=report.partnerLine;wp.lastResult=report.profit>=0?'positive':'tight';
 var prev=wp.history.find(function(h){return h.day===report.day&&h.eventId===eventNow().id;});if(prev){prev.profit=report.profit;prev.served=report.served;prev.line=report.partnerLine;}else{wp.history.unshift({day:report.day,eventId:eventNow().id,eventTitle:report.eventTitle,choice:decision?decision.choiceTitle:'自主经营',followed:decision?decision.followedAdvice:null,profit:report.profit,served:report.served,line:report.partnerLine});}wp.history=wp.history.slice(0,8);
 st.report=report;st.history.unshift(report);st.history=st.history.slice(0,8);st.day++;st.event=rand(EVENTS.length);st.eventChoice=null;st.eventFx={};st.ad=20;st.service='warm';save();advisorPlan=null;TAB='overview';renderAll();toast('今日结算完成：净利润 '+(profit>=0?'+':'−')+money(Math.abs(profit)));
}

 document.querySelectorAll('[data-tab]').forEach(function(b){b.addEventListener('click',function(){setTab(b.getAttribute('data-tab'));});});
 $('partnerSelect').addEventListener('change',function(){var r=roles.find(function(x){return String(x.id)===String($('partnerSelect').value);});if(!r)return;partnerOpinionToken++;partnerOpinionBusy=false;partnerOpinionTarget='';role=r;localStorage.setItem('maomao_cafe_partner',String(r.id));advisorPlan=null;renderPartner();if(TAB==='overview')renderOverview();toast('经营搭档已切换。');});
