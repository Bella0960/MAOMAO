<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>帖子详情</title>
<script src="js/font-loader.js"></script>
<script src="js/native-feel.js"></script>
<script src="js/phone/phone_storage.js"></script>
<link rel="stylesheet" href="css/mobile-fit.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
    background: #F7F7F9; color: #111;
    min-height: 100vh; max-width: 390px; margin: 0 auto;
    padding-bottom: 80px;
  }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    position: sticky; top: 0; background: #fff; z-index: 10;
    border-bottom: 1px solid #F0F0F0;
  }
  .back-btn {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .post-cover {
    width: 100%; aspect-ratio: 4/3;
    background: linear-gradient(135deg, #E8E8EC 0%, #F0F0F4 100%);
  }
  .post-body { padding: 16px; }
  .p-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .p-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 0.875rem; font-weight: 700;
  }
  .p-name { font-size: 0.938rem; font-weight: 700; }
  .p-time { font-size: 0.688rem; color: #999; margin-top: 2px; }
  .p-tag {
    display: inline-block; font-size: 0.563rem;
    padding: 1px 6px; border-radius: 4px;
    margin-left: 6px; vertical-align: 2px;
  }
  .p-tag.ai { background: #111; color: #fff; }
  .p-tag.me { background: #ECECEF; color: #666; }
  .p-content { font-size: 1rem; line-height: 1.7; margin-bottom: 16px; }
  .p-actions { display: flex; gap: 24px; color: #999; font-size: 0.813rem; padding-top: 12px; border-top: 1px solid #F0F0F0; }
  .p-act { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .p-act.liked { color: #111; }

  /* 评论区 */
  .comments { padding: 16px; }
  .c-title { font-size: 0.875rem; font-weight: 700; margin-bottom: 16px; }
  .comment { display: flex; gap: 10px; margin-bottom: 16px; }
  .c-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 0.688rem; font-weight: 700;
    flex-shrink: 0;
  }
  .c-body { flex: 1; }
  .c-name { font-size: 0.75rem; font-weight: 700; color: #333; }
  .c-text { font-size: 0.875rem; line-height: 1.5; margin-top: 2px; }
  .c-time { font-size: 0.625rem; color: #999; margin-top: 4px; }
  .c-reply { font-size: 0.625rem; color: #999; margin-top: 4px; margin-left: 8px; cursor: pointer; }
  .c-reply:hover { color: #111; }
  .c-like { font-size: 0.625rem; color: #999; margin-top: 4px; margin-left: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
  .c-like.liked { color: #111; }
  .c-follow { font-size: 0.625rem; color: #111; background: #111; color: #fff; padding: 2px 8px; border-radius: 999px; margin-left: 8px; cursor: pointer; }
  .c-follow.followed { background: #ECECEF; color: #999; }
  .c-actions { display: flex; align-items: center; margin-top: 4px; }
  .c-replies { margin-left: 20px; margin-top: 8px; padding-left: 10px; border-left: 2px solid #F0F0F0; }
  .c-replies .comment { margin-bottom: 8px; }

  /* 评论输入栏 */
  .comment-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 390px;
    background: #fff; border-top: 1px solid #ECECEF;
    display: flex; gap: 10px; align-items: center;
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
  .comment-bar input {
    flex: 1; height: 38px; background: #F4F4F6;
    border-radius: 999px; border: none; outline: none;
    padding: 0 14px; font-size: 0.875rem;
  }
  .send-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: #111; color: #fff; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="back-btn" onclick="history.back()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
  </div>

  <div id="postCover" style="display:none !important"></div>
  <div class="post-body">
    <div class="p-head">
      <div class="p-avatar" id="pAvatar"></div>
      <div>
        <div class="p-name" id="pName"></div>
        <div class="p-time" id="pTime"></div>
      </div>
    </div>
    <div class="p-content" id="pContent"></div>
    <div class="p-actions">
      <div class="p-act" id="likeBtn" onclick="toggleLike()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span id="likeCount">0</span>
      </div>
      <div class="p-act">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span id="commentCount">0</span>
      </div>
      <div class="p-act" onclick="aiReply()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        生成
      </div>
      <div class="p-act" onclick="sharePost()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        分享
      </div>
    </div>
  </div>

  <div class="comments">
    <div class="c-title">评论</div>
    <div id="commentList"></div>
  </div>

  <div class="comment-bar">
    <input type="text" id="commentInput" placeholder="说点什么...">
    <button class="send-btn" onclick="sendComment()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

<script>
  const RANDOM_NAMES = ['晚风', '橘子海', '七号公园', '北岛', '半糖', '青柠', '山顶洞人', '猫不语', '夏目', '木苏里', '阿柴', '远山', '七海', '星野', '落雨', '拾光'];
  const REPLIES = [
    '说得太对了！', '同感同感', '哈哈哈哈', '真的假的？',
    '我也这么觉得', '好有道理', '蹲一个后续', '前排围观',
    '太真实了', '笑死我了', '确实', '学到了学到了',
    '我也经历过', '这也太绝了', '码住', '👍👍👍'
  ];

  // 通用API调用
  async function callAI(prompt) {
    try {
      const config = JSON.parse(localStorage.getItem('api_settings') || '{}');
      if (!config.apiKey) return null;
      const res = await fetch((config.baseUrl || 'https://api.openai.com/v1') + '/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + config.apiKey
        },
        body: JSON.stringify({
          model: config.model || 'gpt-3.5-turbo',
          messages: [{ role: 'user', content: prompt }],
          max_tokens: 100,
          temperature: 0.9
        })
      });
      const data = await res.json();
      return data.choices[0].message.content.trim();
    } catch(e) { return null; }
  }

  function getPostId() {
    return new URLSearchParams(location.search).get('id');
  }
  function loadPosts() {
    return JSON.parse(localStorage.getItem('forum_posts') || '[]');
  }
  function savePosts(arr) {
    localStorage.setItem('forum_posts', JSON.stringify(arr));
  }
  function timeAgo(ts) {
    const h = Math.floor((Date.now() - ts) / 3600000);
    if (h < 1) return '刚刚';
    if (h < 24) return h + '小时前';
    return Math.floor(h/24) + '天前';
  }

  let post = null;
  function loadPost() {
    const id = getPostId();
    const posts = loadPosts();
    post = posts.find(p => p.id === id);
    if (!post) { document.body.innerHTML = '<div style="padding:40px;text-align:center;">帖子不存在</div>'; return; }
    if (!post.comments) post.comments = [];
    renderPost();
    renderComments();
  }

  function renderPost() {
    // 有图就显示图，没图就不显示
    const cover = document.getElementById('postCover');
    if (post.img && cover) {
      cover.style.display = 'block';
      cover.innerHTML = `<img src="${post.img}" style="width:100%;display:block">`;
    } else if (cover) cover.style.display = 'none';
    document.getElementById('pAvatar').textContent = post.name[0];
    document.getElementById('pAvatar').style.background = post.avatar;
    document.getElementById('pName').innerHTML = post.name + (post.tag === 'ai' ? '<span class="p-tag ai">AI</span>' : post.tag === 'me' ? '<span class="p-tag me">我</span>' : '');
    document.getElementById('pTime').textContent = timeAgo(post.time);
    document.getElementById('pContent').textContent = post.content;
    document.getElementById('likeCount').textContent = post.likes;
    document.getElementById('commentCount').textContent = post.comments.length;
    document.getElementById('likeBtn').classList.toggle('liked', post.liked);
  }

  function renderComments() {
    const list = document.getElementById('commentList');
    if (!post.comments.length) {
      list.innerHTML = '<div style="color:#999;font-size:0.813rem;">还没有评论，来抢沙发</div>';
      return;
    }
    list.innerHTML = post.comments.map((c, i) => `
      <div class="comment">
        <div class="c-avatar" style="background:${c.avatar}">${c.name[0]}</div>
        <div class="c-body">
          <div class="c-name">${c.name}</div>
          <div class="c-text">${c.text}</div>
          <div class="c-actions">
            <span class="c-time">${timeAgo(c.time)}</span>
            <span class="c-reply" onclick="replyTo(${i})">回复</span>
            <span class="c-like ${c.liked ? 'liked' : ''}" onclick="likeComment(${i})">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="${c.liked ? '#111' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              ${c.likes || 0}
            </span>
          </div>
          ${c.replies ? `<div class="c-replies">${c.replies.map((r, j) => `
            <div class="comment">
              <div class="c-avatar" style="background:${r.avatar}">${r.name[0]}</div>
              <div class="c-body">
                <div class="c-name">${r.name}</div>
                <div class="c-text">${r.text}</div>
                <div class="c-actions">
                  <span class="c-time">${timeAgo(r.time)}</span>
                  <span class="c-like ${r.liked ? 'liked' : ''}" onclick="likeReply(${i},${j})">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="${r.liked ? '#111' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    ${r.likes || 0}
                  </span>
                </div>
              </div>
            </div>
          `).join('')}</div>` : ''}
        </div>
      </div>
    `).join('');
  }

  function likeComment(i) {
    const c = post.comments[i];
    c.liked = !c.liked;
    c.likes = (c.likes || 0) + (c.liked ? 1 : -1);
    const posts = loadPosts();
    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) { posts[idx] = post; savePosts(posts); }
    renderComments();
  }

  function likeReply(i, j) {
    const r = post.comments[i].replies[j];
    r.liked = !r.liked;
    r.likes = (r.likes || 0) + (r.liked ? 1 : -1);
    const posts = loadPosts();
    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) { posts[idx] = post; savePosts(posts); }
    renderComments();
  }

  let replyToIdx = -1;
  function replyTo(idx) {
    replyToIdx = idx;
    const input = document.getElementById('commentInput');
    input.placeholder = '回复 @' + post.comments[idx].name + '...';
    input.focus();
  }

  function toggleLike() {
    post.liked = !post.liked;
    post.likes += post.liked ? 1 : -1;
    const posts = loadPosts();
    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) { posts[idx] = post; savePosts(posts); }
    renderPost();
  }

  function sendComment() {
    const text = document.getElementById('commentInput').value.trim();
    if (!text) return;

    if (replyToIdx >= 0) {
      // 回复某条评论
      if (!post.comments[replyToIdx].replies) post.comments[replyToIdx].replies = [];
      post.comments[replyToIdx].replies.push({ name: '我', avatar: '#111', text: text, time: Date.now() });
      const repliedName = post.comments[replyToIdx].name;
      replyToIdx = -1;
    } else {
      post.comments.push({ name: '我', avatar: '#111', text: text, time: Date.now() });
    }

    document.getElementById('commentInput').value = '';
    document.getElementById('commentInput').placeholder = '说点什么...';
    const posts = loadPosts();
    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) { posts[idx] = post; savePosts(posts); }
    renderComments();
    document.getElementById('commentCount').textContent = post.comments.length;

    // 1秒后对方自动回复
    setTimeout(async () => {
      const reply = REPLIES[Math.floor(Math.random() * REPLIES.length)];
      const colors = ['#333','#555','#888','#666','#444'];
      let replyText = reply;
      // 用API生成
      const aiText = await callAI('你是论坛网友，楼主说："' + post.content + '"，我（' + (replyToIdx >= 0 ? post.comments[replyToIdx].name : RANDOM_NAMES[Math.floor(Math.random()*RANDOM_NAMES.length)]) + '）看到有人评论："' + text + '"，请用网友口吻写一条短回复，不超过20字，口语化。直接输出内容。');
      if (aiText) replyText = aiText.replace(/^[""]|[""]$/g, '');
      if (replyToIdx >= 0 && post.comments[replyToIdx].replies) {
        post.comments[replyToIdx].replies.push({ name: post.comments[replyToIdx].name, avatar: post.comments[replyToIdx].avatar, text: replyText, time: Date.now() });
      } else {
        post.comments.push({ name: RANDOM_NAMES[Math.floor(Math.random()*RANDOM_NAMES.length)], avatar: colors[Math.floor(Math.random()*colors.length)], text: replyText, time: Date.now() });
      }
      const posts2 = loadPosts();
      const idx2 = posts2.findIndex(p => p.id === post.id);
      if (idx2 >= 0) { posts2[idx2] = post; savePosts(posts2); }
      renderComments();
      document.getElementById('commentCount').textContent = post.comments.length;
      replyToIdx = -1;
    }, 1000);
  }

  function sharePost() {
    // 分享到聊天列表，选一个角色发过去
    let roles = [];
    try { roles = JSON.parse(localStorage.getItem('ai_custom_characters') || '[]'); } catch(e){}
    if (!roles.length) { alert('还没有联系人，先去加好友吧'); return; }
    const name = roles[0].name;
    const msg = '【分享帖子】' + post.content.substring(0, 50);
    let history = JSON.parse(localStorage.getItem('chat_history_' + roles[0].id) || '[]');
    history.push({ role: 'user', text: msg, time: Date.now(), type: 'text' });
    localStorage.setItem('chat_history_' + roles[0].id, JSON.stringify(history));
    alert('已分享给 ' + name);
  }

  function getFollows() {
    return JSON.parse(localStorage.getItem('forum_follows') || '[]');
  }
  function isFollowing(name) {
    return getFollows().indexOf(name) >= 0;
  }
  function toggleFollow(name) {
    let f = getFollows();
    if (isFollowing(name)) f = f.filter(x => x !== name);
    else f.push(name);
    localStorage.setItem('forum_follows', JSON.stringify(f));
    renderComments();
  }

  async function aiReply() {
    const name = RANDOM_NAMES[Math.floor(Math.random() * RANDOM_NAMES.length)];
    const colors = ['#333','#555','#888','#666','#444'];
    let text = REPLIES[Math.floor(Math.random() * REPLIES.length)];
    // 尝试用API生成更自然的评论
    const aiText = await callAI('你是论坛网友，看到这个帖子："' + post.content + '"，请用' + name + '的口吻写一条短评论，不要超过20字，自然口语化，不要说"作为AI"。直接输出评论内容，不要加引号。');
    if (aiText) text = aiText.replace(/^[""]|[""]$/g, '');
    post.comments.push({ name: name, avatar: colors[Math.floor(Math.random()*colors.length)], text: text, time: Date.now() });
    const posts = loadPosts();
    const idx = posts.findIndex(p => p.id === post.id);
    if (idx >= 0) { posts[idx] = post; savePosts(posts); }
    renderComments();
    document.getElementById('commentCount').textContent = post.comments.length;
  }

  loadPost();
</script>
</body>
</html>
