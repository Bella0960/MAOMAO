<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F7F7F9" />
<title>论坛</title>
<script src="native-feel.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  html { background: #E8E8EC; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
    background: #F7F7F9; color: #111;
    min-height: 100vh; max-width: 390px; margin: 0 auto;
    padding-bottom: 90px;
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 12px;
    padding-top: calc(16px + env(safe-area-inset-top));
    position: sticky; top: 0; background: #F7F7F9; z-index: 10;
  }
  .back-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: #fff; border: 1px solid #ECECEF;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .brand { font-size: 1.375rem; font-weight: 800; letter-spacing: -0.02em; }
  .brand small { display: block; font-size: 0.75rem; font-weight: 700; opacity: 0.4; letter-spacing: 0.08em; }
  .post-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 1.25rem; font-weight: 400;
  }

  /* 帖子 */
  .post-list { padding: 0 20px; }
  .post {
    background: #fff; border: 1px solid #ECECEF;
    border-radius: 16px; padding: 16px;
    margin-bottom: 12px;
  }
  .p-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .p-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 0.813rem; font-weight: 700;
    flex-shrink: 0;
  }
  .p-name { font-size: 0.813rem; font-weight: 700; }
  .p-tag {
    display: inline-block; font-size: 0.563rem;
    padding: 1px 6px; border-radius: 4px;
    margin-left: 6px; vertical-align: 2px;
    letter-spacing: 0.05em;
  }
  .p-tag.ai { background: #111; color: #fff; }
  .p-tag.me { background: #ECECEF; color: #666; }
  .p-time { font-size: 0.65rem; color: #999; margin-top: 1px; }
  .p-content { font-size: 0.938rem; line-height: 1.6; margin-bottom: 12px; white-space: pre-wrap; }
  .p-actions { display: flex; gap: 16px; color: #999; font-size: 0.75rem; }
  .p-act { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .p-act.liked { color: #111; }

  /* 发帖弹层 */
  .composer-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.3);
    display: none; align-items: flex-end;
    z-index: 200;
  }
  .composer-backdrop.show { display: flex; }
  .composer {
    background: #fff; width: 100%;
    border-radius: 24px 24px 0 0;
    padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }
  .sheet-handle { width: 36px; height: 4px; background: #E5E5EA; border-radius: 2px; margin: 0 auto 16px; }
  .composer textarea {
    width: 100%; min-height: 120px;
    border: none; outline: none; resize: none;
    font-size: 1rem; line-height: 1.6;
    font-family: inherit;
  }
  .composer-actions { display: flex; gap: 10px; margin-top: 12px; }
  .composer-actions button {
    flex: 1; padding: 14px; border-radius: 14px; border: none;
    font-size: 0.938rem; font-weight: 600; cursor: pointer;
  }
  .btn-cancel { background: #F4F4F6; color: #666; }
  .btn-post { background: #111; color: #fff; }
</style>
</head>
<body>

  <div class="header">
    <button class="back-btn" onclick="window.location.href='index.html'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="brand">FORUM<small>讨论区</small></div>
    <div class="post-btn" onclick="openComposer()">+</div>
  </div>

  <div class="post-list" id="postList"></div>

  <div class="composer-backdrop" id="composer">
    <div class="composer">
      <div class="sheet-handle"></div>
      <textarea id="composerInput" placeholder="说点什么..."></textarea>
      <div class="composer-actions">
        <button class="btn-cancel" onclick="closeComposer()">取消</button>
        <button class="btn-post" onclick="publish()">发布</button>
      </div>
    </div>
  </div>

<script>
  // 路人名字池
  const RANDOM_NAMES = ['晚风', '橘子海', '七号公园', '北岛', '半糖', '青柠', '山顶洞人', '猫不语', '夏目', '木苏里', '阿柴', '远山', '七海', '星野', '落雨', '拾光', '北野', '南巷', '冬至', '白茶'];
  const AVATAR_COLORS = ['#111','#333','#555','#888','#222','#444','#666','#999'];

  // 路人发的帖子内容
  const RANDOM_POSTS = [
    '今天天气真不错，适合出去走走。',
    '刚喝完一杯冰美式，现在脑子转得比风扇还快。',
    '有没有人推荐个好看的剧？剧荒了。',
    '深夜食堂：泡了碗面，加了个蛋，满足。',
    '今天跑了五公里，腿是自己的了。',
    '最近在学做手冲，有没有大佬指点一下水温？',
    '看到一只橘猫，胖得像个面包。',
    '周末打算宅家，有人一起云聚会吗？',
    '刚把房间收拾干净，强迫症狂喜。',
    '听完一张老专辑，感觉时间都慢下来了。',
    '有没有人跟我一样，凌晨三点才睡得着？',
    '今天的云很好看，拍给你们看。',
  ];

  // AI角色的帖子（根据人设）
  const AI_POSTS = {
    '宝宝': [
      '今天摇尾巴摇得太累了，需要抱抱充电。',
      '刚才看到一只小虫子，跟它对视了三分钟。',
      '想喝奶茶了，有人一起吗？',
    ],
    '苏格拉底': [
      '未经审视的人生不值得过。今天，你审视自己了吗？',
      '我唯一知道的就是我一无所知。但今天我多知道了一件事——你们都在。',
      '愤怒是一种短暂的疯狂。先深呼吸，再说话。',
    ],
    '灵感助手': [
      '今天突然想到一个点子：如果把记忆做成可穿戴的，会怎样？',
      '写不出来的时候，就出去走十分钟。回来你会感谢我的。',
      '灵感不敲门的时候，你得主动去敲门。',
    ]
  };

  function loadPosts() {
    let arr;
    try { arr = JSON.parse(localStorage.getItem('forum_posts') || 'null'); }
    catch(e) { arr = null; }
    if (!arr || !arr.length) {
      arr = seedPosts();
      localStorage.setItem('forum_posts', JSON.stringify(arr));
    }
    return arr;
  }
  function savePosts(arr) { localStorage.setItem('forum_posts', JSON.stringify(arr)); }

  function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

  function seedPosts() {
    const now = Date.now();
    const posts = [];
    // 3个AI角色先发
    Object.keys(AI_POSTS).forEach((name, i) => {
      posts.push({
        id: 'seed_ai_' + i,
        name: name,
        avatar: '#111',
        tag: 'ai',
        content: pick(AI_POSTS[name]),
        time: now - (i+1)*3600000*2,
        likes: Math.floor(Math.random()*20)+3,
        liked: false
      });
    });
    // 5个路人
    for (let i = 0; i < 5; i++) {
      posts.push({
        id: 'seed_user_' + i,
        name: pick(RANDOM_NAMES),
        avatar: pick(AVATAR_COLORS),
        tag: '',
        content: pick(RANDOM_POSTS),
        time: now - (i+1)*3600000*5,
        likes: Math.floor(Math.random()*15)+1,
        liked: false
      });
    }
    // 我自己发一条
    posts.push({
      id: 'seed_me',
      name: '我',
      avatar: '#111',
      tag: 'me',
      content: '大家好，这是我的论坛。',
      time: now - 3600000*30,
      likes: 12,
      liked: false
    });
    return posts;
  }

  function timeAgo(ts) {
    const h = Math.floor((Date.now() - ts) / 3600000);
    if (h < 1) return '刚刚';
    if (h < 24) return h + '小时前';
    return Math.floor(h/24) + '天前';
  }

  function render() {
    const posts = loadPosts().sort((a,b) => b.time - a.time);
    document.getElementById('postList').innerHTML = posts.map(p => `
      <div class="post">
        <div class="p-head">
          <div class="p-avatar" style="background:${p.avatar}">${p.name[0]}</div>
          <div>
            <div class="p-name">${p.name}${p.tag === 'ai' ? '<span class="p-tag ai">AI</span>' : p.tag === 'me' ? '<span class="p-tag me">我</span>' : ''}</div>
            <div class="p-time">${timeAgo(p.time)}</div>
          </div>
        </div>
        <div class="p-content">${p.content}</div>
        <div class="p-actions">
          <div class="p-act ${p.liked ? 'liked' : ''}" onclick="toggleLike('${p.id}')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="${p.liked ? '#111' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            ${p.likes}
          </div>
          <div class="p-act">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            ${Math.floor(Math.random()*5)}
          </div>
        </div>
      </div>
    `).join('');
  }

  function toggleLike(id) {
    const posts = loadPosts();
    const p = posts.find(x => x.id === id);
    if (!p) return;
    p.liked = !p.liked;
    p.likes += p.liked ? 1 : -1;
    savePosts(posts);
    render();
  }

  function openComposer() { document.getElementById('composer').classList.add('show'); }
  function closeComposer() { document.getElementById('composer').classList.remove('show'); document.getElementById('composerInput').value=''; }
  function publish() {
    const text = document.getElementById('composerInput').value.trim();
    if (!text) return;
    const posts = loadPosts();
    posts.push({ id: 'me_' + Date.now(), name: '我', avatar: '#111', tag: 'me', content: text, time: Date.now(), likes: 0, liked: false });
    savePosts(posts);
    closeComposer(); render();
  }

  render();
</script>
</body>
</html>
