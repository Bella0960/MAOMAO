<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 · 小手机</title>
    <script src="font-loader.js"></script>
    <script src="native-feel.js"></script>
    <style>
        /* 全局重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 手机外壳 */
        .phone-mockup {
            position: relative;
            width: min(390px, calc(100vw - 24px));
            height: min(844px, calc(100vh - 24px));
            min-height: 0;
            background-color: #F7F7F9;
            border-radius: 45px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 8px solid #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* 状态栏 */
        .status-bar {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 14px 28px;
            font-size: 0.875rem;
            font-weight: 600;
            color: #000;
            z-index: 50;
        }

        /* 主滚动容器（底部 100px 防导航遮挡） */
        .profile-content {
            flex: 1;
            overflow-y: auto;
            padding: 64px 16px 100px;
            background-color: #F7F7F9;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
        }
        .profile-content::-webkit-scrollbar { display: none; }

        /* ===== 顶部封面图（全宽贴边） ===== */
        .profile-cover {
            height: 190px !important;
            flex-shrink: 0;
            width: calc(100% + 32px);
            margin-left: -16px;
            margin-right: -16px;
            margin-top: -64px;
            background: linear-gradient(135deg, #F2F2F7 0%, #E5E5EA 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s ease;
        }
        .profile-cover:active { opacity: 0.85; }
        .profile-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .profile-cover .cover-placeholder {
            width: 28px;
            height: 28px;
            color: #C7C7CC;
        }

        /* ===== 顶部个人信息区（居中，紧凑版） ===== */
        .profile-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 12px !important;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #F2F2F7;
            border: 3px solid #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            flex-shrink: 0;
            margin-top: -40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .profile-avatar svg {
            width: 34px;
            height: 34px;
        }
        .profile-name {
            margin-top: 6px !important;
            margin-bottom: 0 !important;
            font-size: 1.25rem;
            line-height: 1.2;
            font-weight: 600;
            color: #333333;
            letter-spacing: 0.2px;
        }
        .profile-sign {
            margin-top: 4px !important;
            margin-bottom: 0 !important;
            line-height: 1.3;
            font-size: 0.75rem !important;
            color: #8E8E93;
            max-width: 240px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .profile-stats {
            margin-top: 4px !important;
            margin-bottom: 0 !important;
            line-height: 1.3;
            font-size: 0.75rem;
            color: #8E8E93;
        }
        .profile-edit-btn {
            margin-top: 6px !important;
            margin-bottom: 0 !important;
            background: #F2F2F7;
            color: #333333;
            border: none;
            border-radius: 20px;
            padding: 6px 16px !important;
            font-size: 0.813rem;
            line-height: 1.4;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s ease;
        }
        .profile-edit-btn:hover { background-color: #E5E5EA; }
        .profile-edit-btn:active { transform: scale(0.97); }

        /* ===== 菜单卡片 ===== */
        .menu-card {
            background-color: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            margin-bottom: 12px;
            overflow: hidden;
        }
        .menu-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            font-size: 0.875rem;
            color: #333333;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.15s ease;
        }
        .menu-row:active { background-color: #F7F7F9; }
        .menu-row .menu-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: #8E8E93;
        }
        .menu-row .menu-icon svg {
            width: 18px;
            height: 18px;
            display: block;
        }
        .menu-row .menu-text {
            flex: 1;
            min-width: 0;
        }
        .menu-row .menu-arrow {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: #C7C7CC;
        }
        .menu-divider {
            height: 1px;
            background-color: #F2F2F7;
            margin-left: 46px;
        }

        /* ===== 轻提示 Toast ===== */
        .profile-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 700;
            background: rgba(28, 28, 30, 0.9);
            color: #FFFFFF;
            font-size: 0.813rem;
            padding: 12px 20px;
            border-radius: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .profile-toast.show { opacity: 1; }
    </style>
<link rel="stylesheet" href="mobile-fit.css">
</head>
<body>

    <div class="phone-mockup">

        <!-- 状态栏 -->
        <div class="status-bar">
            <span>4:41</span>
        </div>

        <main class="profile-content">

            <!-- 封面图（点击可上传） -->
            <div class="profile-cover" id="profileCover" title="点击更换封面">
                <svg class="cover-placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </div>
            <input type="file" id="coverInput" accept="image/*" style="display:none;">

            <!-- 顶部个人信息区 -->
            <section class="profile-hero">
                <div class="profile-avatar" id="profileAvatar" onclick="location.href='edit-profile.html'" style="cursor: pointer;" title="编辑资料">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <h1 class="profile-name" id="profileName">未设置昵称</h1>
                <p class="profile-sign" id="profileSign">这个人很懒，什么都没有留下</p>
                <p class="profile-stats" id="profileStats">0 位好友 · 12 篇帖子</p>
                <a class="profile-edit-btn" href="edit-profile.html">编辑资料</a>
            </section>

            <!-- 菜单卡片 -->
            <section class="menu-card">
                <a class="menu-row" href="my-moments.html">
                    <span class="menu-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
                    </span>
                    <span class="menu-text">我的主页</span>
                    <svg class="menu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </a>
                <div class="menu-divider"></div>
                <div class="menu-row" id="menuWallet">
                    <span class="menu-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/><path d="M16 15h2"/></svg>
                    </span>
                    <span class="menu-text">钱包</span>
                    <svg class="menu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </div>
                <div class="menu-divider"></div>
                <div class="menu-row" id="menuFavorites">
                    <span class="menu-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17.75l-6.17 3.24 1.18-6.88-5-4.87 6.9-1 3.09-6.25 3.09 6.25 6.9 1-5 4.87 1.18 6.88z"/></svg>
                    </span>
                    <span class="menu-text">我的收藏</span>
                    <svg class="menu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </div>
                <div class="menu-divider"></div>
                <a class="menu-row" href="sticker-manager.html">
                    <span class="menu-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                    </span>
                    <span class="menu-text">表情包</span>
                    <svg class="menu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </a>
                <div class="menu-divider"></div>
                <a class="menu-row" href="settings.html">
                    <span class="menu-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </span>
                    <span class="menu-text">设置</span>
                    <svg class="menu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </a>
            </section>

        </main>

        <!-- 轻提示 -->
        <div class="profile-toast" id="profileToast"></div>

        <!-- 底部导航由 nav.js 动态注入（未改动导航代码） -->

    </div>

    <script src="nav.js"></script>
    <script>
        /* ===== 从 myProfile 读取并渲染（页面重新显示时刷新，保证编辑返回后最新） ===== */
        var DEFAULT_SIGN = '这个人很懒，什么都没有留下';

        function renderProfile() {
            var profile = {};
            try {
                var raw = localStorage.getItem('myProfile');
                if (raw) profile = JSON.parse(raw) || {};
            } catch (e) {}

            // 昵称
            document.getElementById('profileName').textContent = profile.nickname || '未设置昵称';

            // 签名 / ID：优先签名，其次微信号
            var sign = profile.sign || (profile.wechatId ? 'ID: ' + profile.wechatId : '');
            document.getElementById('profileSign').textContent = sign || DEFAULT_SIGN;

            // 封面图：有值优先显示用户图片（渐变是 CSS 默认背景，无图时自动露出）
            var coverBox = document.getElementById('profileCover');
            if (profile.cover) {
                coverBox.innerHTML = '<img src="' + profile.cover + '" alt="封面">';
            } else {
                coverBox.innerHTML = '<svg class="cover-placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
            }

            // 头像：无图显示 SVG 小人（绝不使用文字或 Emoji）
            var avatarBox = document.getElementById('profileAvatar');
            if (profile.avatar) {
                avatarBox.innerHTML = '<img src="' + profile.avatar + '" alt="头像">';
            } else {
                avatarBox.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
            }

            // 好友数实时读取角色数组，帖子写死演示
            var friendCount = 0;
            try {
                var roles = JSON.parse(localStorage.getItem('ai_custom_characters') || '[]');
                if (Array.isArray(roles)) friendCount = roles.length;
            } catch (e) {}
            document.getElementById('profileStats').textContent = friendCount + ' 位好友 · 12 篇帖子';
        }

        // 钱包 / 收藏占位提示（不接业务逻辑）
        var toast = document.getElementById('profileToast');
        var toastTimer = null;
        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1500);
        }
        document.getElementById('menuWallet').addEventListener('click', function () { window.location.href = 'wallet.html'; });
        document.getElementById('menuFavorites').addEventListener('click', function () { showToast('功能开发中'); });

        /* ===== 封面图点击上传（Canvas 压缩，与编辑页同规格：最大 600x400 / JPEG 0.7） ===== */
        function compressCover(file, cb) {
            var reader = new FileReader();
            reader.onload = function (ev) {
                var img = new Image();
                img.onload = function () {
                    try {
                        var maxW = 600, maxH = 400;
                        var scale = Math.min(1, maxW / img.width, maxH / img.height);
                        var canvas = document.createElement('canvas');
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        cb(canvas.toDataURL('image/jpeg', 0.7));
                    } catch (err) {
                        alert('图片处理失败，请更换图片重试');
                        cb('');
                    }
                };
                img.onerror = function () { cb(''); };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }
        document.getElementById('profileCover').addEventListener('click', function () {
            document.getElementById('coverInput').click();
        });
        document.getElementById('coverInput').addEventListener('change', function (e) {
            var file = e.target.files[0];
            if (!file) return;
            compressCover(file, function (dataUrl) {
                if (!dataUrl) return;
                // 读-改-写 myProfile，保留其他字段
                var profile = {};
                try {
                    var raw = localStorage.getItem('myProfile');
                    if (raw) profile = JSON.parse(raw) || {};
                } catch (err) {}
                profile.cover = dataUrl;
                try {
                    localStorage.setItem('myProfile', JSON.stringify(profile));
                    renderProfile();
                } catch (err) {
                    alert('存储空间不足，请压缩图片');
                }
            });
            e.target.value = '';
        });

        renderProfile();
        // 从编辑页 history.back() 返回时刷新数据
        window.addEventListener('pageshow', renderProfile);
    </script>
<script src="statusbar-control.js"></script>
</body>
</html>
