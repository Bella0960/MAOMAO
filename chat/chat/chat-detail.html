<!DOCTYPE html>
<html lang="zh" class="trae-edit-mode-dragging"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天详情</title>
    <script src="../../shared/js/font-loader.js?v=20261022v1"></script>
    <script src="../../shared/js/native-feel.js"></script>
    <script src="../../shared/js/custom-css.js"></script>
    <script src="../../shared/js/chat-beauty.js"></script>
    <script src="../../shared/js/phone/phone_storage.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #D6D6D6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
            color: #111111;
            user-select: none;
        }
        .phone-mockup {
            position: relative;
            width: min(390px, calc(100vw - 24px));
            height: min(844px, calc(100vh - 24px));
            min-height: 0;
            background-color: #F4F4F6;
            border-radius: 45px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
            overflow: hidden;
            border: 8px solid #ffffff;
            display: flex;
            flex-direction: column;
        }
        .status-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 14px 28px;
            font-size: 0.875rem;
            font-weight: 600;
            color: #111;
            z-index: 50;
            pointer-events: none;
        }

        /* ========== 顶部导航（圆形按钮 + 名字 + ONLINE） ========== */
        .chat-header {
            padding: 48px 14px 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(244, 244, 246, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            z-index: 40;
        }
        /* 顶部返回与更多：保留点击区域，不再用圆圈包裹图标 */
        .nav-circle-btn {
            width: 32px;
            height: 32px;
            background: transparent;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: none;
            border: 0;
            transition: opacity 0.15s ease;
            color: #111;
            text-decoration: none;
            flex-shrink: 0;
            padding: 0;
            font: inherit;
        }
        .nav-circle-btn:active { opacity: 0.55; }
        .nav-circle-btn svg {
            width: 19px;
            height: 19px;
            display: block;
        }
        .chat-title-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }
        .chat-user-name {
            font-size: 0.844rem;
            font-weight: 800;
            color: #111111;
            letter-spacing: -0.2px;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-status-sub {
            font-size: 0.5rem;
            color: #888888;
            font-family: monospace;
            letter-spacing: 0.5px;
            margin-top: 1px;
        }
        .chat-notice-bar {
            font-size: 0.438rem;
            color: #999999;
            margin-top: 2px;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ========== 聊天舞台 ========== */
        .chat-stage {
            flex: 1;
            overflow-y: auto;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(180deg, #F4F4F6 0%, #EBEBEF 100%);
            scrollbar-width: none;
        }
        .chat-stage::-webkit-scrollbar {
            display: none;
        }
        .message-time {
            align-self: center;
            font-size: 0.531rem;
            color: #999999;
            font-family: monospace;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.03);
            margin: 2px 0 4px 0;
        }
        .msg-row {
            display: flex;
            gap: 8px;
            max-width: var(--chat-bubble-max-width, 86%);
            align-items: flex-start;
        }
        .msg-row.received, .msg-row.left {
            align-self: flex-start;
        }
        .msg-row.sent, .msg-row.right {
            align-self: flex-end;
        }
        /* 群聊成员名标签：独占一行，与头像左缘对齐 */
        .msg-sender {
            flex-basis: 100%;
            font-size: 0.563rem;
            color: #999999;
            font-weight: 500;
            margin: 0 0 2px 40px;
            line-height: 1.2;
        }
        .msg-avatar {
            width: var(--avatar-size, 32px);
            height: var(--avatar-size, 32px);
            border-radius: var(--avatar-radius, 50%);
            background: linear-gradient(135deg, #EFEFEF 0%, #DCDCDC 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1.5px solid #FFFFFF;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            font-size: 0.688rem;
            font-weight: 700;
            color: #444444;
            overflow: hidden;
        }
        .msg-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .msg-bubble {
            padding: var(--chat-bubble-padding, 9.5px 13px);
            margin-left: var(--chat-bubble-gap-x, 0px);
            margin-right: var(--chat-bubble-gap-x, 0px);
            font-size: 0.75rem;
            line-height: 1.5;
            letter-spacing: -0.1px;
            word-break: break-word;
            font-weight: 500;
            max-width: 100%;
            min-width: 0;
        }
        .msg-row.received .msg-bubble, .msg-row.left .msg-bubble {
            background: var(--partner-bubble-bg, #FFFFFF);
            color: var(--partner-bubble-color, #111111);
            border-radius: var(--partner-bubble-radius, 18px 18px 18px 4px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.02);
        }
        .msg-row.sent .msg-bubble, .msg-row.right .msg-bubble {
            background: var(--my-bubble-bg, #111111);
            color: var(--my-bubble-color, #FFFFFF);
            border-radius: var(--my-bubble-radius, 18px 18px 4px 18px);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }
        .loading-dots {
            color: #888888;
            font-size: 0.75rem;
            padding: 4px 15px;
            font-style: italic;
            align-self: flex-start;
        }
        /* 搜索跳转定位：灰色光环脉冲（黑白气泡上均可见），1.9s 后自动移除 */
        .msg-bubble.hl-flash {
            animation: hlFlash 1.9s ease;
        }
        @keyframes hlFlash {
            0% { box-shadow: 0 0 0 0 rgba(142,142,147,0); }
            25% { box-shadow: 0 0 0 3px rgba(142,142,147,0.95); }
            100% { box-shadow: 0 0 0 4px rgba(142,142,147,0); }
        }

        /* ========== 底部输入舱 ========== */
        .input-dock {
            padding: 9px 12px calc(9px + env(safe-area-inset-bottom)) 12px;
            background: #F4F4F6;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-top: 1px solid #E7E7EA;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 45;
        }
        .input-capsule {
            flex: 1;
            min-width: 0;
            background: #FFFFFF;
            border: 1px solid #E3E3E7;
            border-radius: 7px;
            min-height: 38px;
            padding: 5px 6px 5px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: none;
            transform-origin: center;
            transition: border-color 160ms ease;
        }
        .input-capsule:focus-within {
            transform: none;
            border-color: #C9C9CF;
            box-shadow: none;
        }
        .real-input {
            flex: 1;
            min-width: 0;
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.719rem;
            line-height: 1.5;
            color: #111111;
            font-family: inherit;
            user-select: text;
            -webkit-user-select: text;
            resize: none;
            overflow-y: auto;
            scrollbar-width: none;
            max-height: 76px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .real-input::-webkit-scrollbar { display: none; }
        .real-input::placeholder {
            color: #AAAAAA;
        }
        .send-icon-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            border: none;
            padding: 0;
            transition: transform 0.15s ease;
        }
        .send-icon-btn:active {
            transform: scale(0.92);
        }
        .send-icon-btn.disabled {
            opacity: 1;
        }
        .send-icon-btn svg {
            display: block;
        }
        .plus-action-btn {
            width: 30px;
            height: 30px;
            background: transparent;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: none;
            border: 0;
            transition: opacity 0.15s ease;
            padding: 0;
            margin: 0;
        }
        .plus-action-btn:active { opacity: 0.55; }
        /* ===== 消息多选模式 ===== */
        .chat-messages.selecting .msg-row { cursor: pointer; }
        .msg-select-check {
            width: 20px; height: 20px;
            border-radius: 50%;
            border: 1.5px solid #D8D8DD;
            background: #FFFFFF;
            display: none;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            align-self: center;
            margin: 0 4px;
        }
        .chat-messages.selecting .msg-select-check { display: flex; }
        .msg-select-check.checked {
            background: #111111;
            border-color: #111111;
        }
        .msg-select-check.checked::after {
            content: '';
            width: 9px; height: 5px;
            border-left: 1.5px solid #fff;
            border-bottom: 1.5px solid #fff;
            transform: rotate(-45deg) translateY(-1px);
        }
        .msg-row.ghost .msg-bubble { opacity: 0.35; }

        /* 多选底部栏 */
        .select-bar {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            background: #FFFFFF;
            border-top: 0.5px solid rgba(0,0,0,0.08);
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
            z-index: 60;
        }
        .select-bar.show { display: flex; }
        .select-bar-btn {
            font-size: 14px;
            color: #111111;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 4px;
        }
        .select-bar-btn.danger { color: #D32F2F; font-weight: 500; }
        .select-bar-count { font-size: 13px; color: #666666; }

        /* 表情按钮（输入框左侧） */
        .sticker-open-btn {
            width: 30px; height: 30px;
            background: transparent;
            border-radius: 0; border: 0;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0; margin: 0; padding: 0;
            transition: opacity 0.15s ease;
        }
        .sticker-open-btn:active { opacity: 0.55; }

        /* 图片消息气泡 */
        .sticker-msg-img {
            width: 140px; height: 140px;
            object-fit: cover; border-radius: 16px; display: block;
        }
        /* 贴纸消息：不带气泡底色，直接浮在聊天流上 */
        .bubble-sticker {
            background: transparent !important;
            padding: 0 !important;
            box-shadow: none !important;
        }
        .sticker-fallback {
            width: 140px; min-height: 60px;
            background: #F2F2F7;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            padding: 16px 12px;
            font-size: 0.813rem; color: #666666;
            text-align: center; line-height: 1.4;
        }

        /* 表情选择底部面板 */
        .sticker-panel-overlay {
            position: absolute; inset: 0; z-index: 300;
            background: rgba(0,0,0,0.3); opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .sticker-panel-overlay.is-show { opacity: 1; pointer-events: auto; }
        .sticker-panel {
            position: absolute; left: 0; right: 0; bottom: 0;
            background: #FFF; border-radius: 24px 24px 0 0;
            padding: 10px 14px 24px;
            transform: translateY(100%); transition: transform 0.28s ease;
            max-height: 60%;
        }
        .sticker-panel-overlay.is-show .sticker-panel { transform: translateY(0); }
        .sticker-panel-handle { width: 36px; height: 4px; border-radius: 999px; background: #E5E5EA; margin: 0 auto 12px; }
        .sticker-panel-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            max-height: 340px; overflow-y: auto; scrollbar-width: none;
        }
        .sticker-panel-grid::-webkit-scrollbar { display: none; }
        .sticker-panel-item {
            background: #F8F8FA; border-radius: 14px; padding: 8px;
            cursor: pointer; display: flex; flex-direction: column; gap: 4px;
        }
        .sticker-panel-item:active { background: #EFEFF2; }
        .sticker-panel-item img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
        .sticker-panel-item span { font-size: 0.65rem; color: #888; text-align: center; }
        .sticker-panel-empty { text-align: center; color: #B0B0B5; padding: 40px 0; font-size: 0.875rem; }

        /* 重玩弹窗（居中卡片，非抽屉） */
        .regen-overlay { position: absolute; inset: 0; z-index: 400; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
        .regen-mask { position: absolute; inset: 0; background: rgba(0,0,0,0.25); }
        .regen-sheet {
            position: relative;
            width: 100%;
            max-width: 320px;
            background: #FFFFFF;
            border-radius: 18px;
            padding: 22px 20px 20px;
            box-sizing: border-box;
        }
        @keyframes regenPop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .regen-title { font-size: 1.063rem; font-weight: 700; margin-bottom: 14px; color: #111111; text-align: center; }
        .regen-input {
            width: 100%;
            border: 0.5px solid #E5E5EA;
            background: #F7F7F9;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.875rem;
            font-family: inherit;
            color: #111111;
            outline: none;
            resize: none;
            box-sizing: border-box;
        }
        .regen-input:focus { border-color: #111111; }
        .regen-input::placeholder { color: #B0B0B5; }
        .regen-actions { display: flex; gap: 10px; margin-top: 16px; }
        .regen-cancel, .regen-confirm {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 0.938rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        .regen-cancel { background: #F2F2F7; color: #666666; }
        .regen-confirm { background: #111111; color: #FFFFFF; }

        /* ========== 消息操作：锚定气泡旁的深色浮动菜单（不再是底部抽屉） ========== */
        .ctx-overlay { position: absolute; inset: 0; z-index: 420; display: none; }
        .ctx-overlay.active { display: block; }
        @keyframes ctxPop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .msg-menu {
            position: absolute; min-width: 172px; max-width: 232px;
            max-height: 62vh; overflow-y: auto;
            background: #FFFFFF;
            border-radius: 14px; padding: 6px 0;
            box-shadow: 0 10px 28px rgba(0,0,0,0.12);
            animation: ctxPop 0.15s ease-out;
        }
        .msg-menu::after {
            content: ''; position: absolute; left: var(--arrow-x, 22px);
            width: 10px; height: 10px; background: #FFFFFF;
            transform: rotate(45deg); border-radius: 2px;
        }
        .msg-menu.below::after { top: -5px; }
        .msg-menu.above::after { bottom: -5px; }
        .msg-sheet-item {
            display: flex; align-items: center; gap: 10px;
            width: 100%; height: 38px; padding: 0 16px;
            background: none; border: none; cursor: pointer; text-align: left;
            font-size: 0.813rem; font-family: inherit; color: #111111; white-space: nowrap;
        }
        .msg-sheet-item:active { background: #F0F0F3; }
        .msg-sheet-item.danger { color: #FF3B30; }
        .msg-sheet-item svg { width: 16px; height: 16px; flex-shrink: 0; }

        /* ========== 转发：居中紧凑列表卡（与重玩弹窗同一范式） ========== */
        .fw-overlay {
            position: absolute; inset: 0; z-index: 420; display: none;
            align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        }
        .fw-overlay.active { display: flex; }
        .fw-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.25); }
        .fw-sheet {
            position: relative; width: 100%; max-width: 320px; max-height: 70vh;
            display: flex; flex-direction: column; box-sizing: border-box;
            background: #FFFFFF; border-radius: 18px; padding: 20px 0 12px;
            animation: ctxPop 0.18s ease-out;
        }
        .fw-title { font-size: 1.063rem; font-weight: 700; color: #111111; text-align: center; padding: 0 0 12px; margin: 0; }
        .fw-list { flex: 1; overflow-y: auto; padding: 0 6px; }
        .fw-item {
            display: flex; align-items: center; gap: 12px;
            width: 100%; height: 56px; padding: 0 14px;
            background: none; border: none; border-radius: 12px;
            cursor: pointer; text-align: left; font-family: inherit;
        }
        .fw-item:active { background: #F7F7F9; }
        .fw-avatar {
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
            background: #F2F2F7; color: #8E8E93; font-size: 0.875rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .fw-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .fw-name { flex: 1; font-size: 0.938rem; color: #111111; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fw-empty { text-align: center; color: #B0B0B5; font-size: 0.875rem; padding: 36px 0; }
        .fw-cancel {
            display: block; width: calc(100% - 36px); margin: 10px 18px 0; height: 44px;
            background: #F2F2F7; border: none; border-radius: 12px;
            font-size: 0.875rem; font-family: inherit; color: #666666; cursor: pointer;
        }

        /* ========== 编辑消息：居中卡片 ========== */
        .edit-overlay {
            position: absolute; inset: 0; z-index: 420; display: none;
            align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        }
        .edit-overlay.active { display: flex; }
        .edit-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.25); }
        .edit-sheet {
            position: relative; width: 100%; max-width: 320px; box-sizing: border-box;
            background: #FFFFFF; border-radius: 18px; padding: 22px 20px 20px;
            animation: ctxPop 0.18s ease-out;
        }
        .edit-title { font-size: 1.063rem; font-weight: 700; color: #111111; text-align: center; margin: 0 0 14px; padding: 0; }
        .edit-input {
            display: block; width: 100%; margin: 0; box-sizing: border-box;
            min-height: 88px; max-height: 40vh;
            background: #F7F7F9; border: 0.5px solid #E5E5EA; border-radius: 12px;
            padding: 12px 14px; font-size: 0.875rem; font-family: inherit;
            color: #111111; outline: none; resize: none;
        }
        .edit-input:focus { border-color: #111111; }
        .edit-actions { display: flex; gap: 10px; padding: 16px 0 0; }
        .edit-cancel, .edit-confirm {
            flex: 1; border: none; border-radius: 12px; padding: 13px;
            font-size: 0.938rem; font-family: inherit; font-weight: 600; cursor: pointer;
        }
        .edit-cancel { background: #F2F2F7; color: #666666; }
        .edit-confirm { background: #111111; color: #FFFFFF; }

        /* 译文小字 / 已编辑标记 */
        .msg-translation { font-size: 0.688rem; line-height: 1.45; color: #8E8E93; margin-top: 6px; padding-top: 6px; border-top: 0.5px solid rgba(0,0,0,0.08); }
        .msg-edited { font-size: 0.625rem; color: #C7C7CC; margin-top: 4px; }

        /* 语音气泡 / 图片气泡 / 拉黑输入态 */
        .bubble-voice { min-width: 108px; padding: 8px 12px; }
        .voice-row { display: flex; align-items: center; gap: 8px; }
        .voice-wave { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
        .voice-wave i { width: 2px; border-radius: 1px; background: currentColor; opacity: 0.4; }
        .voice-wave i.on { opacity: 1; }
        .voice-dur { font-size: 0.688rem; opacity: 0.7; }
        .voice-transcript { font-size: 0.688rem; opacity: 0.75; margin-top: 6px; line-height: 1.4; }
        .bubble-media { padding: 0 !important; background: transparent !important; border: none !important; }
        .msg-media-img { width: 180px; max-width: 100%; border-radius: 16px; display: block; }
        .msg-media-desc { font-size: 0.688rem; color: #8E8E93; margin-top: 6px; }
        /* 虚拟图片：AI 描述 + 灰底占位图 */
        .vimg-box {
            width: 180px; max-width: 100%; min-height: 118px; box-sizing: border-box;
            background: #F2F2F7; border-radius: 16px; padding: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        }
        .vimg-icon { width: 26px; height: 26px; color: #C7C7CC; display: block; }
        .vimg-icon svg { width: 26px; height: 26px; display: block; }

        /* ========== 心声卡：iOS 备忘录风格（方案 B · 严守黑白灰） ========== */

        /* 名片消息 */

        /* ========== 加号互动面板 ========== */

        /* ========== 通用弹窗（功能编辑） ========== */
        .x-modal-overlay {
            position: absolute;
            inset: 0;
            z-index: 400;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .x-modal-overlay.active { display: flex; }
        .x-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
        }
        .x-modal {
            position: relative;
            width: 100%;
            max-width: 340px;
            max-height: 80%;
            background: #FFFFFF;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: popIn 0.22s ease-out;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }

        }
        .x-modal-header {
            padding: 16px 18px 10px;
            font-size: 0.938rem;
            font-weight: 700;
            color: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;

            background: none; border: none; cursor: pointer;

        .x-input, .x-textarea {

            outline: none;

        }

        .x-input:focus, .x-textarea:focus { border-color: #111; background: #fff; }
        .x-row { display: flex; gap: 8px; }
        .x-btn {
            flex: 1;
            height: 38px;

            font-family: inherit;

        }
        .x-btn:active { opacity: 0.8; }
        .x-btn-primary { background: #111; color: #fff; }
        .x-btn-ghost { background: #F2F2F7; color: #333; }
        .x-btn-danger { background: transparent; color: #FF453A; }
        .x-chips { display: flex; gap: 8px; }
        .x-chip {
            flex: 1; height: 40px; border-radius: 10px; border: none;
            background: #F2F2F7; color: #666666; font-size: 0.813rem;
            font-family: inherit; cursor: pointer;
        }
        .x-chip.active { background: #111111; color: #FFFFFF; font-weight: 600; }
        .x-list { display: flex; flex-direction: column; gap: 8px; }
        .x-list-item {

        .x-list-item .x-sub { font-size: 0.688rem; color: #888; margin-top: 2px; }

        /* ========== 特殊消息卡片 ========== */
        .msg-card {

            max-width: 240px;

        /* ========== 红包 / 转账卡片（韩系极简：紧凑小黑卡，无 Emoji，无高饱和彩色） ========== */
        /* 剥掉气泡自身外观，让卡片自己控制背景与圆角（仅作用于 redpacket/transfer 分支） */
        .msg-bubble.bubble-pay {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            padding: 0 !important;
        }
        .pay-card {
            width: 150px !important;
            border-radius: 10px !important;
            padding: 8px 12px !important;
            display: flex;
            align-items: center;
            gap: 8px !important;
            position: relative;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.15s ease;
        }
        .pay-card:active { transform: scale(0.97); }
        /* 左侧图标：统一 16x16 极细线条 */
        .pay-card svg.pay-ico {

            display: block;
            width: 16px !important;
            height: 16px !important;
        }
        /* 红包：纯黑底白字（不用任何红色/黄色） */
        .pay-card-red {
            background: #111111;
            color: #FFFFFF;
        }
        /* 转账：纯白底 + 极淡灰边框 */
        .pay-card-transfer {

            border: 1px solid #E5E5EA;
            color: #111111;
        }
        .pay-card-main {
            display: flex;

        .pay-card-amount {

        /* 红包留言右侧留白（适配 150px 窄卡），避免与右下角状态字重叠 */
        .pay-card-red .pay-card-msg { padding-right: 32px !important; }

        /* ========== 红包/转账结果弹窗（黑白灰极简） ========== */
        .pay-result-overlay {

            z-index: 600;

            padding: 24px;

            position: absolute;

        /* ========== 思维链（<think>）：可折叠，默认收起，黑白灰极简 ========== */
        .think-chain {

        /* ===== 聊天输入区：轻薄、留白、编辑式排版 ===== */

        /* ===== 页面整体收束：去掉手机套壳感，聊天内容更轻 ===== */
        body { background: #F7F7F8; }
        .chat-header {
            background: rgba(247,247,249,.94);

    <script src="../../shared/js/memory.js"></script>

    <script>
        const STORAGE_KEY = 'ai_custom_characters';
        const DEFAULT_ROLES = [];

        function getRoleById(roleId) {
            if (!roleId) return null;
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const roles = JSON.parse(raw);
                    if (Array.isArray(roles)) {
                        const target = roles.find(r => String(r.id) === String(roleId));
                        if (target) return target;
                    }
                }
            } catch (e) {
                console.error('获取角色失败:', e);
            }
            return null;
        }

        const params = new URLSearchParams(window.location.search);
        const currentRoleId = params.get('id');
        const isGroupChat = !!currentRoleId && String(currentRoleId).indexOf('g') === 0;

        function loadGroupById(gid) {
            if (!gid) return null;
            try {
                const raw = localStorage.getItem('phone_groups');
                if (raw) {
                    const groups = JSON.parse(raw);
                    if (Array.isArray(groups)) {
                        const target = groups.find(g => String(g.id) === String(gid));
                        if (target) return target;
                    }
                }
            } catch (e) {}
            return null;
        }

        let currentGroup = null;
        if (isGroupChat) {
            currentGroup = loadGroupById(currentRoleId);
        }

        const currentCharacter = isGroupChat
            ? { id: currentRoleId, name: (currentGroup && currentGroup.name) || '群聊', avatarBg: '#3B9EFF' }
            : (getRoleById(currentRoleId) || { id: currentRoleId || 'default', name: '聊天', avatarBg: '#3B9EFF' });
        const contactName = currentCharacter.name || '聊天';

        const chatTitle = document.getElementById('chat-title');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const chatForm = document.getElementById('chat-form');

        // ================= 双方备注（只读应用：chat_alias_<roleId>） =================
        // 与 chat-settings.html 的 roleId（URL 的 id 参数）保持一致
        const aliasRoleId = currentRoleId || currentCharacter.id;
        function loadAlias() {
            try {
                const raw = localStorage.getItem('chat_alias_' + aliasRoleId);
                if (raw) {
                    const o = JSON.parse(raw);
                    if (o && typeof o === 'object') {
                        return {
                            myAlias: String(o.myAlias == null ? '' : o.myAlias).trim(),
                            roleAlias: String(o.roleAlias == null ? '' : o.roleAlias).trim()
                        };
                    }
                }
            } catch (e) {}
            return { myAlias: '', roleAlias: '' };
        }
        const chatAlias = loadAlias();
        // 群聊：优先显示群备注（chat_group_alias_<gid>），无备注回退群名
        let groupAliasName = '';
        if (isGroupChat) {
            try {
                groupAliasName = localStorage.getItem('chat_group_alias_' + aliasRoleId) || '';
            } catch (e) {}
        }
        const roleDisplayName = (isGroupChat && groupAliasName) ? groupAliasName : (chatAlias.roleAlias || contactName);

        if (chatTitle) {
            chatTitle.textContent = roleDisplayName;
        }
        // 群聊：副标题显示成员名单；普通聊天保持 ONLINE
        const chatStatusSub = document.getElementById('chat-status-sub');
        if (isGroupChat && chatStatusSub) {
            const names = (currentGroup && currentGroup.members || []).map(function (m) { return m.name; }).filter(Boolean);
            chatStatusSub.textContent = names.length ? names.join(' · ') : '群聊';
            // 群聊：显示群公告横条（chat_group_notice_<gid>）
            const chatNoticeBar = document.getElementById('chat-notice-bar');
            if (chatNoticeBar) {
                let notice = '';
                try { notice = localStorage.getItem('chat_group_notice_' + aliasRoleId) || ''; } catch (e) {}
                if (notice) {
                    chatNoticeBar.textContent = '公告：' + notice;
                    chatNoticeBar.style.display = '';
                }
            }
        }

        // ================= 拉黑态（键 chat_blocked_ids：会话仍在列表，但不能聊） =================
        function isBlocked(id) {
            try {
                var arr = JSON.parse(localStorage.getItem('chat_blocked_ids') || '[]');
                if (!Array.isArray(arr)) return false;
                return arr.map(String).indexOf(String(id)) !== -1;
            } catch (e) { return false; }
        }

        function applyBlockUI() {
            var blocked = isBlocked(aliasRoleId);
            var bar = document.getElementById('chat-notice-bar');
            if (bar) {
                if (blocked) {
                    bar.textContent = '你已把 TA 拉黑，TA 不会再回复你（可在对话设置里解除）';
                    bar.style.display = '';
                } else if (!isGroupChat) {
                    bar.style.display = 'none';
                }
            }
            var cap = document.querySelector('.input-capsule');
            if (cap) cap.classList.toggle('is-blocked', blocked);
            if (chatInput) chatInput.disabled = blocked;
        }
        applyBlockUI();

        // ================= 聊天背景 =================
        // 原 applyChatBackground（chat_bg_<roleId> + 72% 白遮罩）已并入 ChatBeauty（shared/js/chat-beauty.js）：
        // 美化配置 chatBg 优先；未配置时自动回落旧 chat_bg_<id> 并保持白遮罩观感，见下方统一应用点。

        const storageKey = `chat_history_${currentCharacter.id}`;

        function getInitialMessages() {
            if (isGroupChat) {
                return [
                    { role: 'received', text: `欢迎来到「${contactName}」群聊，一起聊聊吧。` }
                ];
            }
            return [
                { role: 'received', text: `你好，我是${contactName}！很高兴和你聊天。` }
            ];
        }

        function loadMessages() {
            if (_storage) {
                var arr = _storage.getChatHistory(currentCharacter.id);
                if (arr && arr.length) return arr;
            }
            try {
                const raw = localStorage.getItem(storageKey);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        return parsed;
                    }
                }
            } catch (err) {
                console.warn('读取历史聊天记录失败:', err);
            }

            const initial = getInitialMessages();
            saveMessages(initial);
            return initial;
        }

        function saveMessages(list) {
            if (_storage) { _storage.saveChatHistory(currentCharacter.id, list); return; }
            try {
                localStorage.setItem(storageKey, JSON.stringify(list));
            } catch (err) {
                console.warn('保存聊天记录失败:', err);
            }
        }

        // 头像占位：极细线条 SVG 小人（黑白灰规范，无 Emoji）
        const USER_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';

        // 我的头像：从 myProfile.avatar 实时读取
        function getMyAvatar() {
            try {
                const raw = localStorage.getItem('myProfile');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.avatar) return parsed.avatar;
                }
            } catch (e) {}
            return '';
        }

        // ================= 消息稳定标识：单条操作（复制/转发/翻译/编辑/删除）都依赖 mid =================
        function ensureMid(msg) {
            if (!msg || typeof msg !== 'object') return '';
            // 老数据（含欢迎消息）可能没有 time：补一个，使长按/多选/删除都能正常工作
            if (!msg.time) msg.time = Date.now();
            if (!msg.mid) {
                msg.mid = 'm' + (msg.time || Date.now()) + Math.random().toString(36).slice(2, 5);
            }
            return msg.mid;
        }

        function findByMid(mid) {
            var list = loadMessages();
            for (var i = 0; i < list.length; i++) {
                if (ensureMid(list[i]) === mid) return list[i];
            }
            return null;
        }

        // AI 回复清洗（保护 think/narratage 标签不被 cleanup 破坏）
        function cleanupAiReply(raw) {
            // 1) 提取 think 和 narratage 块，替换成占位符
            var THINK_PH = '\u0000THINK_BLOCK\u0000';
            var NARR_PH = '\u0000NARR_BLOCK\u0000';
            var thinks = [];
            var narrations = [];
            var text = String(raw || '');
            var m;
            var thinkRegex = /<think>[\s\S]*?<\/think>/gi;
            while ((m = thinkRegex.exec(text)) !== null) {
                thinks.push(m[0]);
            }
            text = text.replace(thinkRegex, THINK_PH);
            var narrRegex = /<narratage>[\s\S]*?<\/narratage>/gi;
            while ((m = narrRegex.exec(text)) !== null) {
                narrations.push(m[0]);
            }
            text = text.replace(narrRegex, NARR_PH);
            // 2) 对不含标签的安全文本做 cleanup
            text = applyAICleanup(text);
            // 3) 还原占位符
            var idx = 0;
            text = text.replace(new RegExp(THINK_PH.replace(/\u0000/g, '\\u0000'), 'g'), function () {
                return thinks[idx++] || '';
            });
            idx = 0;
            text = text.replace(new RegExp(NARR_PH.replace(/\u0000/g, '\\u0000'), 'g'), function () {
                return narrations[idx++] || '';
            });
            return text;
        }

        // ===== 解析 AI 回复：拆分 <think>思维链</think>、<narratage>旁白</narratage>、双回车多气泡 =====
        function parseReplyContent(raw) {
            var text = String(raw || '');
            // 1) 提取思维链块
            var thinkRegex = /<think>([\s\S]*?)<\/think>/g;
            var thinks = [];
            var m;
            thinkRegex.lastIndex = 0;
            while ((m = thinkRegex.exec(text)) !== null) {
                var tc = String(m[1] || '').trim();
                if (tc) thinks.push(tc);
            }
            // 从正文中移除 <think>...</think>
            text = text.replace(/<think>[\s\S]*?<\/think>/g, '');

            // 2) 提取旁白块
            var narrRegex = /<narratage>([\s\S]*?)<\/narratage>/g;
            var narrations = [];
            narrRegex.lastIndex = 0;
            while ((m = narrRegex.exec(text)) !== null) {
                var nc = String(m[1] || '').trim();
                if (nc) narrations.push(nc);
            }
            // 从正文中移除 <narratage>...</narratage>
            text = text.replace(/<narratage>[\s\S]*?<\/narratage>/g, '');

            // 3) 双回车拆分成多段正文，每段一个气泡
            // 先清理多余空行，再按 \n\n 分段
            var segments = text.replace(/\n{3,}/g, '\n\n').split(/\n\n+/);
            var bubbles = [];
            segments.forEach(function (seg) {
                var s = seg.trim();
                if (s) bubbles.push(s);
            });

            return { thinks: thinks, narrations: narrations, bubbles: bubbles };
        }

        // 渲染思维链块（可折叠）
        function renderThinkChainBlock(content) {
            var wrap = document.createElement('div');
            wrap.className = 'think-chain';
            wrap.innerHTML = '' +
                '<div class="think-chain-head">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' +
                    '<span>思维链</span>' +
                '</div>' +
                '<div class="think-chain-body">' + escHtml(content) + '</div>';
            wrap.querySelector('.think-chain-head').addEventListener('click', function () {
                wrap.classList.toggle('open');
            });
            return wrap;
        }

        // 渲染旁白块（居中淡化，无气泡）
        function renderNarratageBlock(content) {
            var el = document.createElement('div');
            el.className = 'narratage-block';
            el.textContent = content;
            return el;
        }

        function appendMessageToDOM(msg, idx) {
            const row = document.createElement('div');
            const isSent = msg.role === 'sent' || msg.role === 'user';
            const isError = msg.isError || msg.role === 'system_error';

            row.className = `msg-row ${isSent ? 'sent' : 'received'}`;
            // 搜索页跳转定位用：记录该消息在渲染序列中的序号（实时新发的消息无 idx）
            if (typeof idx === 'number') row.dataset.idx = idx;
            // 多选删除用：消息唯一标识
            row.dataset.time = String(msg.time || '');
            // 单条操作用：稳定标识（不存在时自动补齐）
            row.dataset.mid = ensureMid(msg);

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';

            // 特殊类型消息渲染为卡片，复用同一套气泡与左右对齐
            if (msg.type === 'image' && msg.img) {
                bubble.classList.add('bubble-media');
                var imgDesc = String(msg.desc || '');
                bubble.innerHTML = '<img class="msg-media-img" src="' + String(msg.img) + '" alt="' + imgDesc + '">' +
                    (imgDesc ? '<div class="msg-media-desc">' + imgDesc + '</div>' : '');
            } else if (msg.type === 'image') {
                // 虚拟图片：AI 只给了文字描述，前端渲染灰底占位图 + 描述
                bubble.classList.add('bubble-media');
                var vDesc = String(msg.desc || msg.text || '');
                bubble.innerHTML = '<div class="vimg-box">' +

            } else if (msg.type === 'heart') {
                // 心声卡：iOS 备忘录风格卡片（方案 B · 黑白灰）
                bubble.classList.add('bubble-heart');

            } else if (msg.type === 'voice') {
                bubble.classList.add('bubble-voice');

                } else {

            } else if (msg.type === 'location') {

            } else if (msg.type === 'anniversary') {

                    <div class="msg-card-title">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

            } else if (msg.type === 'todo') {

                bubble.innerHTML = `<div class="msg-card">
                    <div class="msg-card-title">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>

            } else if (msg.type === 'moment') {

                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>

            } else if (msg.type === 'call') {
                const c = msg.call || {};
                if (c.theme === 'dark') bubble.classList.add('bubble-call-in');
                const cardTitle = c.title || (c.type === 'video' ? '视频通话' : '语音通话');
                bubble.innerHTML = `<div class="msg-card">
                    <div class="msg-card-title">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        <span>${cardTitle}</span>
                    </div>
                    ${c.text ? `<div class="msg-card-body">${c.text}</div>` : ''}

            } else if (msg.type === 'redpacket') {
                // 红包卡：纯黑底圆角卡 + 白色细线条金币图标（黑白灰极简，无红黄配色）
                bubble.classList.add('bubble-pay');
                const payLabel = msg.isVoice === true ? '语音红包' : '红包';

                    <svg class="pay-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 8.5 12 11.6 14.5 8.5"/><line x1="10.6" y1="12.5" x2="13.4" y2="12.5"/><line x1="12" y1="12" x2="12" y2="16"/></svg>
                    <div class="pay-card-main">
                        <span class="pay-card-label">${payLabel}</span>

            } else if (msg.type === 'transfer') {
                // 转账卡：纯白底 + 浅灰边框 + 黑色细线条双向箭头 + 右侧灰色细箭头
                bubble.classList.add('bubble-pay');
                bubble.innerHTML = `<div class="pay-card pay-card-transfer" data-index="${typeof idx === 'number' ? idx : ''}" data-type="transfer" onclick="handlePayCardClick(event)">
                    <svg class="pay-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    <div class="pay-card-main">
                        <span class="pay-card-label">转账</span>
                        <span class="pay-card-amount">¥${escHtml(String(msg.amount == null ? '0.00' : msg.amount))}</span>
                    </div>
                    <svg class="pay-card-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </div>`;
            } else if (msg.type === 'gift') {
                // 礼物卡：黑底白字极简，礼物图标 + 商品名 + 物流状态
                bubble.classList.add('bubble-pay');
                const g = msg.gift || {};
                const status = g.status || '正在派送中';
                bubble.innerHTML = `<div class="pay-card pay-card-red" style="cursor:default;">
                    <svg class="pay-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
                    <div class="pay-card-main">
                        <span class="pay-card-label">TA 送你的礼物</span>
                        <span class="pay-card-amount">${escHtml(String(g.name || '神秘商品'))}</span>
                        <span class="pay-card-msg">${escHtml(String(status))}</span>
                    </div>
                </div>`;
            } else if (msg.type === 'card' && msg.card) {
                const cd = msg.card;
                const cdAv = cd.avatar && String(cd.avatar).length > 20
                    ? '<img src="' + String(cd.avatar) + '" alt="">'
                    : String(cd.name || '?').slice(0, 1);
                bubble.innerHTML = '<div class="msg-card card-share">' +
                    '<div class="card-avatar">' + cdAv + '</div>' +
                    '<div class="card-info"><div class="card-name">' + String(cd.name || '') + '</div>' +
                    '<div class="card-label">个人名片</div></div>' +
                    '</div>';
            } else {
                var rawText = msg.text || msg.content || '';
                // AI 消息：解析思维链、旁白、双回车多气泡
                var isAiMsg = !isSent && !isError &&
                    (msg.role === 'assistant' || msg.role === 'received');
                var _pendingExtras = []; // 收集 think/narration/extra rows，主 row 之后再 append
                if (isAiMsg && rawText) {
                    var parsed = parseReplyContent(rawText);
                    // 思维链块（折叠）
                    parsed.thinks.forEach(function (tc) {
                        _pendingExtras.push(renderThinkChainBlock(tc));
                    });
                    // 旁白块（居中淡化）
                    parsed.narrations.forEach(function (nc) {
                        _pendingExtras.push(renderNarratageBlock(nc));
                    });
                    if (parsed.bubbles.length > 0) {
                        // 第一个气泡走正常 row 流程（含 avatar / group name / mid / 译文）
                        bubble.textContent = parsed.bubbles[0];
                        // 后续气泡：只保留 bubble + avatar，不带 extra 装饰
                        for (var bi = 1; bi < parsed.bubbles.length; bi++) {
                            var extraRow = document.createElement('div');
                            extraRow.className = 'msg-row received';
                            extraRow.dataset.mid = ensureMid(msg);
                            extraRow.dataset.time = String(msg.time || '');
                            var extraBubble = document.createElement('div');
                            extraBubble.className = 'msg-bubble';
                            extraBubble.textContent = parsed.bubbles[bi];
                            var extraAv = document.createElement('div');
                            extraAv.className = 'msg-avatar';
                            if (currentCharacter.avatar) {
                                extraAv.innerHTML = '<img src="' + currentCharacter.avatar + '" alt="">';
                            } else {
                                extraAv.innerHTML = USER_SVG;
                            }
                            extraRow.appendChild(extraAv);
                            extraRow.appendChild(extraBubble);
                            _pendingExtras.push(extraRow);
                        }
                    } else {
                        // 只有思维链/旁白没正文：直接挂 extras 并 return，主 row 丢弃
                        _pendingExtras.forEach(function (el) { chatMessages.appendChild(el); });
                        return;
                    }
                } else {
                    bubble.textContent = rawText;
                }
            }

            // 译文小字（AI 翻译结果落库后随消息一起渲染）
            if (msg.translation) {
                const trEl = document.createElement('div');
                trEl.className = 'msg-translation';
                trEl.textContent = String(msg.translation);
                bubble.appendChild(trEl);
            }

            if (isError) {
                // 黑白灰规范：系统提示为浅灰底深灰字
                bubble.style.backgroundColor = '#F2F2F7';
                bubble.style.color = '#666666';
            }

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            if (isSent) {
                const myAvatar = getMyAvatar();
                if (myAvatar) {
                    avatar.innerHTML = `<img src="${myAvatar}" alt="">`;
                } else {
                    avatar.innerHTML = USER_SVG;
                }
            } else if (isError) {
                avatar.textContent = '!';
                avatar.style.backgroundColor = '#E5E5EA';
                avatar.style.color = '#666666';
            } else {
                if (currentCharacter.avatar) {
                    avatar.innerHTML = `<img src="${currentCharacter.avatar}" alt="">`;
                } else {
                    avatar.innerHTML = USER_SVG;
                }
            }

            // 群聊：AI 成员回复在气泡上方显示成员名
            if (isGroupChat && !isSent && !isError && msg.name) {
                const nameTag = document.createElement('div');
                nameTag.className = 'msg-sender';
                nameTag.textContent = msg.name;
                row.appendChild(nameTag);
            }

            if (isSent) {
                row.appendChild(bubble);
                row.appendChild(avatar);
            } else {
                row.appendChild(avatar);
                row.appendChild(bubble);
            }

            chatMessages.appendChild(row);
            // AI 消息的思维链块/旁白块/额外气泡：主 row 之后追加，保证正确渲染顺序
            if (typeof _pendingExtras !== 'undefined') {
                _pendingExtras.forEach(function (el) { chatMessages.appendChild(el); });
            }
        }

        function renderAllMessages() {
            chatMessages.innerHTML = `<div class="message-time">Just now</div>`;
            const list = loadMessages();
            // 老数据补齐稳定 id 与时间戳：只新增字段，不迁移、不改变原有结构
            let midAdded = false;
            list.forEach(function (m) { if (m && (!m.mid || !m.time)) { ensureMid(m); midAdded = true; } });
            if (midAdded) saveMessages(list);
            // 清理历史残留：此前真实定位调用产生的超时/失败错误消息，一次性从记录中移除
            const cleaned = list.filter(m => {
                const t = String((m && (m.text || m.content)) || '');
                return !(t.indexOf('定位失败') !== -1 || t.indexOf('Timeout expired') !== -1);
            });
            if (cleaned.length !== list.length) saveMessages(cleaned);
            cleaned.forEach(function (m, i) { appendMessageToDOM(m, i); });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ================= 搜索页跳转定位：读取 URL 的 hl=<序号>，滚动并闪烁提示 =================
        function highlightMessageFromUrl() {
            const hl = parseInt(new URLSearchParams(window.location.search).get('hl'), 10);
            if (isNaN(hl) || hl < 0) return;
            const target = chatMessages.querySelector('.msg-row[data-idx="' + hl + '"] .msg-bubble');
            if (!target) return;
            // 等渲染布局完成后滚动到视口中部
            setTimeout(function () {
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                target.classList.add('hl-flash');
                setTimeout(function () { target.classList.remove('hl-flash'); }, 1900);
            }, 120);
            // 消费后清掉定位参数，避免刷新重复闪烁
            try {
                const url = new URL(window.location.href);
                url.searchParams.delete('hl');
                window.history.replaceState(null, '', url.toString());
            } catch (e) {}
        }

        // ================= 读取 API 配置（纯 localStorage，不再编辑） =================
        const API_STORAGE_KEY = 'api_settings';

        function getAiConfig() {
            try {
                const raw = localStorage.getItem(API_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed) return parsed;
                }
            } catch (e) {}
            return {};
        }

        function sendMessage() {
            sendMsg();
        }

        // ---- AI 主动通话标记：从回复文本中剥离 [发起语音通话] ----
        const VOICE_CALL_MARKER = '[发起语音通话]';
        function extractVoiceCallMarker(raw) {
            const text = String(raw || '');
            const idx = text.indexOf(VOICE_CALL_MARKER);
            if (idx === -1) return { text: text, wantCall: false };
            // 移除标记，并清理遗留的行尾空白与多余空行
            const cleaned = (text.slice(0, idx) + text.slice(idx + VOICE_CALL_MARKER.length))
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\s+$/, '');
            return { text: cleaned, wantCall: true };
        }
        // 命中标记：在 AI 侧（左侧）插入一张黑底白字「发起语音通话」卡，并写入聊天记录
        // historyList 是 sendMsg 内的局部变量，由调用方传入
        function insertIncomingCallCard(historyList) {
            const cardMsg = {
                role: 'assistant', type: 'call',
                call: { type: 'voice', title: '发起语音通话', text: '', theme: 'dark' },
                time: Date.now()
            };
            historyList.push(cardMsg);
            saveMessages(historyList);
            appendMessageToDOM(cardMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        // 自动来电：仅当该角色独立开关 chat_auto_call_<roleId> 为 'true' 时，延迟 1.5s 进入来电页
        // 关闭（false/null/脏值）时只保留卡片，绝不跳转
        function maybeAutoIncomingCall() {
            let enabled = false;
            try {
                enabled = localStorage.getItem('chat_auto_call_' + aliasRoleId) === 'true';
            } catch (e) { enabled = false; }
            if (!enabled) return;
            setTimeout(function () {
                window.location.href = '../call/call-ui.html?roleId=' + encodeURIComponent(aliasRoleId) + '&type=incoming';
            }, 1500);
        }

        // ---- AI 虚拟图片标记：从回复文本中剥离 [图片:描述]（前端渲染灰底占位图，不接受任何图片链接/代码） ----
        const VIMG_MARKER_REGEX = /\[图片[:：]([^\]]{1,80})\]/g;
        function extractVImageMarkers(raw) {
            const text = String(raw || '');
            const images = [];
            let m;
            VIMG_MARKER_REGEX.lastIndex = 0;
            while ((m = VIMG_MARKER_REGEX.exec(text)) !== null) {
                const desc = String(m[1] || '').trim();
                if (desc) images.push(desc);
            }
            const cleaned = text.replace(VIMG_MARKER_REGEX, '')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\s+$/, '');
            return { text: cleaned, images: images };
        }

        // ---- AI 心声标记：从回复文本中剥离 [心声:内容]（前端渲染浅灰心声卡，与正常台词区分） ----
        const HEART_MARKER_REGEX = /\[心声[:：]([^\]]{1,200})\]/g;
        function extractHeartMarkers(raw) {
            const text = String(raw || '');
            const hearts = [];
            let m;
            HEART_MARKER_REGEX.lastIndex = 0;
            while ((m = HEART_MARKER_REGEX.exec(text)) !== null) {
                const say = String(m[1] || '').trim();
                if (say) hearts.push(say);
            }
            const cleaned = text.replace(HEART_MARKER_REGEX, '')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/\s+$/, '');
            return { text: cleaned, hearts: hearts };
        }

        // 虚拟图片落库：role=assistant + type=image（无 img 走占位图渲染），text 让 AI 后续也能"记得"发过图
        function insertVImageCards(historyList, descs) {
            (descs || []).forEach(function (d) {
                const card = { role: 'assistant', type: 'image', desc: d, text: '[图片] ' + d, time: Date.now() };
                historyList.push(card);
                saveMessages(historyList);
                appendMessageToDOM(card);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 心声卡日期格式化：2026年6月28日 14:30（iOS 备忘录风格）
        function formatHeartTime(ts) {
            var d = new Date(ts || Date.now());
            var y = d.getFullYear();
            var mo = d.getMonth() + 1;
            var da = d.getDate();
            var hh = d.getHours();
            var mm = d.getMinutes();
            return y + '年' + mo + '月' + da + '日 ' + (hh < 10 ? '0' + hh : hh) + ':' + (mm < 10 ? '0' + mm : mm);
        }

        // 心声落库：role=assistant + type=heart（text 即心声内容，会进入 AI 上下文）
        function insertHeartCards(historyList, texts) {
            (texts || []).forEach(function (t) {
                // 心声不再自动弹到聊天流里，存到 localStorage 供点头像查看
                try {
                    var key = 'latest_heart_' + currentRoleId;
                    localStorage.setItem(key, t);
                } catch (e) {}
            });
        }

        // ---- AI 主动赠送标记：从回复文本中剥离 [红包:金额:留言] / [转账:金额:留言] ----
        const PAY_MARKER_REGEX = /\[(红包|转账):(\d+(?:\.\d{1,2})?):([^\]]*)\]/g;
        function extractPayMarkers(raw) {
            const text = String(raw || '');
            const items = [];
            let m;

                .replace(/[ \t]+\n/g, '\n')

        // ---- 自动记忆标记：[记住:xxx] 从 AI 回复中剥离，存进 user_memory ----
        const MEM_MARKER_REGEX = /\[记住:([^\]]+)\]/g;

        // 命中红包/转账标记：在 AI 侧插入对应卡片并落库，role='assistant' 可被用户领取

        // ===== AI 回复清洗：只做标点/空白收口，不删任何正文内容 =====
        // 之前按文字内容删的规则（动作描写/烂俗比喻/爹味/AI 废话）已全部撤回
        // 只保留：多空格压缩、行首行尾空白、连续标点合并、句首句尾残迹清理
        function applyAICleanup(text) {
            if (!text) return text;
            var out = String(text);
            // 1) 空白整理
            out = out.replace(/[ \t]+\n/g, '\n')
                     .replace(/\n[ \t]+/g, '\n')
                     .replace(/[ \t]{2,}/g, ' ')
                     .trim();
            // 2) 连续句号/问号/感叹号/逗号压成一个
            out = out.replace(/([。！？])\1+/g, '$1')
                     .replace(/，{2,}/g, '，');
            // 3) 逗号紧跟句末标点 / 句末标点紧跟逗号 → 去掉多余的逗号
            out = out.replace(/，([。！？])/g, '$1')
                     .replace(/([。！？])，/g, '$1');
            // 4) 句首句尾残留标点（只清逗号/句号/顿号，保留 ？！…）
            out = out.replace(/^[ \t，。、]+/, '')
                     .replace(/[ \t，、]+$/, '')
                     .trim();
            // 5) 用户在设置页自定义的规则（enabled:true 才跑）——保留入口，但不再硬编码删内容
            try {
                var userRules = JSON.parse(localStorage.getItem('regex_rules') || '[]');
                if (Array.isArray(userRules)) {
                    userRules.forEach(function (r) {
                        if (!r || !r.enabled || !r.pattern) return;
                        try { out = out.replace(new RegExp(r.pattern, 'g'), r.replacement || ''); } catch (e) {}
                    });
                }
            } catch (e) {}
            // 5b) 用户规则删完内容后可能留下 "。，。，" 这种句子边界标点残迹
            // 只清理：连续重复标点、逗号紧跟句号/句号紧跟逗号的组合；正常内部逗号不动
            out = out.replace(/([。！？])\1+/g, '$1')          // 。。。 → 。
                     .replace(/，{2,}/g, '，')                 // ，，， → ，
                     .replace(/，([。！？])/g, '$1')           // ，。 → 。
                     .replace(/([。！？])，/g, '$1')           // 。， → 。
                     .replace(/([。！？])([。！？])+/g, '$1');  // 。？。？ → 第一个
            // 6) 末尾如果是中文且无标点，补一个句号
            if (out && /[\u4e00-\u9fa5]$/.test(out)) {
                out += '。';
            }
            // 7) 兜底：末尾连续标点只留一个
            out = out.replace(/([。！？])\1+$/, '$1');
            return out;
        }


        // API 调用记录 — 委托 PhoneStorage
        var _storage = window.PhoneStorage;

        // ====== 权重分层记忆系统 ======
        // 半衰期（天）：key=关键事件/anniversary=纪念日约1年，plot=线上剧情约3周，detail=生活细节/preference=互动偏好约2个月
        const MEM_HALF_LIFE = { key: 365, anniversary: 365, plot: 21, detail: 60, preference: 60 };
        const MEM_CAT_BASE = { key: 1.0, anniversary: 1.0, plot: 0.45, detail: 0.7, preference: 0.7 };

        function loadWeightMemories(roleId) {
            if (_storage) return _storage.getMemories(roleId);
            try {
                const raw = localStorage.getItem('chat_memories_' + roleId);
                const arr = raw ? JSON.parse(raw) : [];
                return Array.isArray(arr) ? arr : [];
            } catch (e) { return []; }
        }
        function saveWeightMemories(roleId, arr) {
            arr = trimMemoriesByWeight(arr, 300);   // M1：存储上限 300 条，按权重淘汰尾部
            if (_storage) { _storage.saveMemories(roleId, arr); return; }
            try { localStorage.setItem('chat_memories_' + roleId, JSON.stringify(arr)); } catch (e) {}
        }
        function memoryWeight(m) {
            const days = (Date.now() - (m.createdAt || Date.now())) / 86400000;
            const half = MEM_HALF_LIFE[m.category] || 60;
            const base = MEM_CAT_BASE[m.category] || 0.6;
            let imp = Number(m.importance);
            if (isNaN(imp)) imp = 3;
            imp = Math.max(1, Math.min(5, imp)) / 5;
            return imp * base * Math.pow(2, -days / half);
        }
        // M1：记忆存储上限 —— 超过 max 条时按权重淘汰最不重要的；fixed（钉住）永不淘汰
        function trimMemoriesByWeight(arr, max) {
            arr = (Array.isArray(arr) ? arr : []).filter(Boolean);
            if (arr.length <= max) return arr;
            var pinned = arr.filter(function (m) { return m.status === 'fixed'; });
            var rest = arr.filter(function (m) { return m.status !== 'fixed'; });
            var budget = Math.max(0, max - pinned.length);
            rest = rest.map(function (m) { return { m: m, w: memoryWeight(m) }; })
                .sort(function (a, b) { return b.w - a.w; })
                .slice(0, budget)
                .map(function (x) { return x.m; });
            return pinned.concat(rest);
        }
        // 构造注入文本：fixed 永远钉住注入 / confirmed 按权重分两层 / pending 不注入
        function buildWeightedMemoryText(roleId, fallbackText) {
            const mems = loadWeightMemories(roleId);
            const oldText = (fallbackText || '').trim();
            const oldValid = oldText && oldText !== '暂无记忆';
            if (!mems.length) return oldValid ? oldText : '暂无记忆';
            const fixed = mems.filter(function (m) { return m.status === 'fixed'; });
            const confirmed = mems.filter(function (m) { return !m.status || m.status === 'confirmed'; });
            const lines = [];
            if (fixed.length) {
                lines.push('【你一直记得的事】（钉住的记忆，绝对不会忘，可自然提及）');
                fixed.forEach(function (m) { lines.push('· ' + m.content); });
            }
            const weighted = confirmed.map(function (m) {
                return { content: m.content, weight: memoryWeight(m) };
            }).filter(function (m) { return m.content && m.weight > 0.12; });
            weighted.sort(function (a, b) { return b.weight - a.weight; });
            const clear = weighted.filter(function (m) { return m.weight >= 0.5; });
            const vague = weighted.filter(function (m) { return m.weight < 0.5; });
            if (clear.length) {
                lines.push('【你清晰记得的事】（可以自然地提及）');
                clear.forEach(function (m) { lines.push('· ' + m.content); });
            }
            if (vague.length) {
                lines.push('【你隐约记得的事】（只有当对方主动提起相关话题时，你才回忆起来；平时不要主动提起）');
                vague.forEach(function (m) { lines.push('· ' + m.content); });
            }
            if (oldValid) lines.push('【过往长期记忆】' + oldText);
            return lines.length ? lines.join('\n') : '暂无记忆';
        }

        // ================= R6：HTTP 状态码 → 友好提示（原始细节进 api-logs 供排查） =================
        var friendlyHttpError = window.friendlyHttpError = function (status, detail) {
            var map = {
                400: '请求格式有误（可能是参数错误或上下文超长）',
                401: 'API Key 错误或已失效，请到【设置 → API 设置】检查',
                403: '没有访问权限（Key 被禁用或无此模型权限）',
                404: 'API 地址或模型名不存在，请检查 Base URL 与模型设置',
                413: '请求内容过长，请精简人设/世界书或减少记忆条数',
                429: '请求太频繁或额度已用尽，请稍后再试',
                500: '服务器繁忙，请稍后再试',
                502: '服务器繁忙（网关错误），请稍后再试',
                503: '服务暂不可用（可能过载或维护），请稍后再试',
                504: '服务器响应超时，请稍后再试'
            };
            var tip = map[status] || ('请求失败（HTTP ' + status + '）');
            detail = String(detail || '').trim();
            return detail ? (tip + '｜' + detail.slice(0, 120)) : tip;
        };

        // ================= 非流式单次 AI 调用（翻译等短任务复用，含 15 秒超时与埋点） =================
        async function callAiNonStream(systemPrompt, userPrompt) {
            const cfg = getAiConfig();
            const apiKey = (cfg.apiKey || '').trim();
            const baseUrl = (cfg.baseUrl || 'https://api.openai.com/v1').trim().replace(/\/+$/, '');
            const apiModel = (cfg.model || 'gpt-3.5-turbo').trim();
            if (!apiKey) {
                if (typeof showToast === 'function') showToast('请先到【设置页 → API 设置】配置 API Key');
                return null;
            }
            const start = Date.now();
            const controller = new AbortController();
            const timeoutId = setTimeout(function () { controller.abort(); }, 15000);
            try {
                const resp = await fetch(baseUrl + '/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                    signal: controller.signal,
                    body: JSON.stringify({
                        model: apiModel,
                        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }],
                        temperature: 0.3,
                        stream: false
                    })
                });
                clearTimeout(timeoutId);
                if (!resp.ok) {
                    let raw = '';
                    try { raw = await resp.text(); } catch (e) {}
                    let detail = raw;
                    try { detail = (JSON.parse(raw).error && JSON.parse(raw).error.message) || raw; } catch (e) {}
                    logApiCall(apiModel, 'error', start, friendlyHttpError(resp.status, detail));
                    return null;
                }
                const data = await resp.json();
                let out = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
                out = String(out || '').trim();
                if (!out) { logApiCall(apiModel, 'error', start, '空响应'); return null; }
                logApiCall(apiModel, 'success', start, '');
                return out;
            } catch (e) {
                clearTimeout(timeoutId);
                const em = (e && e.name === 'AbortError') ? '请求超时（15秒）' : ('连接失败：' + ((e && e.message) || ''));
                logApiCall(apiModel, 'error', start, em);
                return null;
            }
        }

        // ================= AI 翻译：结果写入 msg.translation 落库并就地追加小字 =================
        const TRANSLATE_SYSTEM = '[任务]\n你是翻译引擎，只做翻译，不做其他任何事。\n' +

        // R3 防重入锁：AI 回复期间（含流式）忽略重复发送，防止并发请求交错写坏聊天记录
        let aiSending = false;

        async function sendMsg(opts) {

            // 阈值按中文 ≈0.6~1 token/字 估算；最坏组合 ~30k 字，适配主流 32k+ 上下文模型。要调就改这里。
            var CTX_CAP = {

                if (max > 0) {

            let rolePersona;

            // 用户资料（myProfile 里可能有：nickname/age/hobbies/likes/dislikes/about/sign）
