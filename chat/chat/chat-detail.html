            // 打字机气泡引用（首个 delta 到达时复用现有气泡结构创建）
            let streamBubble = null;
            let fullText = '';
            let streamEnded = false;    // 流已终结（完成/中断）：用于叫停延迟渲染
            let paintScheduled = false;

            // R4 渲染节流：delta 只累计文本；正则清洗 + DOM 写入 + 滚动合并到每帧最多一次
            function scheduleStreamPaint() {
                if (paintScheduled || streamEnded) return;
                paintScheduled = true;
                requestAnimationFrame(function () {
                    paintScheduled = false;
                    if (!streamEnded) paintStream();
                });
            }
            function paintStream() {
                if (!fullText) return;
                // 首个增量：移除"正在输入..."，复用现有气泡结构创建 AI 气泡
                if (!streamBubble) {
                    const loadingEl = document.getElementById(statusId);
                    if (loadingEl) loadingEl.remove();
                    appendMessageToDOM({ role: 'assistant', text: fullText, name: groupReplyPick ? groupReplyPick.name : undefined });
                    if (typeof SoundSystem !== 'undefined') SoundSystem.play('receive', currentRoleId || '');
                    const lastRow = chatMessages.lastElementChild;
                    streamBubble = lastRow ? lastRow.querySelector('.msg-bubble') : null;
                }
                if (streamBubble) {
                    // 流式实时显示：临时隐藏 think/narratage 标签块（含未闭合的），只展示正文
                    var tmpText = extractVoiceCallMarker(fullText).text;
                    tmpText = tmpText.replace(/<think>[\s\S]*?<\/think>/gi, '')
                        .replace(/<narratage>[\s\S]*?<\/narratage>/gi, '')
                        .replace(/<think>[\s\S]*$/gi, '')   // 未闭合的 <think> 开标签
                        .replace(/<narratage>[\s\S]*$/gi, '')
                        .replace(/\n{3,}/g, '\n\n').trim();
                    streamBubble.textContent = tmpText;
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // 高级参数（API 设置多方案升级）：maxTokens/topP 仅在明确设置时发送，留空 = 用服务商默认
            const apiReqExtra = {};
            const maxTok = Number(config.maxTokens);
            if (maxTok > 0) apiReqExtra.max_tokens = Math.floor(maxTok);
            const topPVal = Number(config.topP);
            if (topPVal > 0 && topPVal < 1) apiReqExtra.top_p = topPVal;

            aiSending = true;   // R3：进入请求阶段，到流式结束由 finally 统一解锁（此前无 await，不存在并发窗口）

            try {
                const response = await fetch(`${baseUrl}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    signal: controller.signal,
                    body: JSON.stringify(Object.assign({
                        model: apiModel,
                        messages: apiMessages,
                        temperature: config.temperature != null ? config.temperature : 0.7,
                        stream: true
                    }, apiReqExtra))
                });

                // HTTP 层错误（401/404/500 等）：读文本提取详情后直接报错，不进入流解析
                if (!response.ok || !response.body) {
                    clearAllTimers();
                    const loadingEl = document.getElementById(statusId);
                    if (loadingEl) loadingEl.remove();

                    const bodyText = await response.text().catch(() => '');
                    let detail = '';
                    try {
                        const parsed = JSON.parse(bodyText);
                        detail = parsed.error?.message || bodyText;
                    } catch {
                        detail = bodyText;
                    }
                    const errText = friendlyHttpError(response.status, detail || response.statusText);
                    const errorMsg = { role: 'system_error', isError: true, text: errText, time: Date.now() };
                    historyList.push(errorMsg);
                    saveMessages(historyList);
                    appendMessageToDOM(errorMsg);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    logApiCall(apiModel, 'error', apiCallStart, errText);
                    // 恢复 header 名字
                    if (chatTitleEl) chatTitleEl.textContent = originalTitleText;
                    return;
                }

                // SSE 流式读取
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';

                // 响应头已到达：解除连接超时，切换为「无数据看门狗 + 120s 总上限」
                enterStreamMode();

                // 处理一行 SSE 数据（主循环与收尾残留共用）
                var processSseLine = function (rawLine) {
                    const line = rawLine.trim();
                    // 过滤空行与 SSE 心跳（: 开头的注释行）
                    if (!line || line.startsWith(':')) return;
                    if (line.indexOf('data:') !== 0) return;

                    const payload = line.slice(5).trim();
                    if (payload === '[DONE]') {
                        streamEnded = true;
                        return;
                    }

                    let json;
                    try {
                        json = JSON.parse(payload);
                    } catch (e) {
                        return;   // 碎片/非 JSON，忽略
                    }

                    // 部分网关会在流内返回错误对象
                    if (json.error) {
                        throw new Error(json.error.message || JSON.stringify(json.error));
                    }

                    const delta = json.choices
                        && json.choices[0]
                        && json.choices[0].delta
                        && json.choices[0].delta.content;

                    if (delta) {
                        fullText += delta;
                        scheduleStreamPaint();   // R4：正则与 DOM 写入合并到帧
                    }
                };

                while (!streamEnded) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    armWatchdog();   // R1：收到新数据，重置 30s 无数据看门狗
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';   // 最后一段可能不完整，留到下一轮

                    for (const rawLine of lines) {
                        processSseLine(rawLine);
                        if (streamEnded) break;
                    }
                }

                clearAllTimers();

                // R5：残留 buffer 收尾——服务器最后一条 data 行可能不带换行，不补处理会静默丢字
                if (buffer) {
                    buffer.split('\n').forEach(processSseLine);
                    buffer = '';
                }
                streamEnded = true;
                paintStream();   // 兜底：把最后一段增量刷上屏（后续分支会整体重渲染）

                // 流内一直没出现 loading 移除（零 delta 兜底）
                const loadingEl2 = document.getElementById(statusId);
                if (loadingEl2) loadingEl2.remove();

                if (!fullText) {
                    const errText = '未能获取到有效的模型回复（流式响应为空）';
                    const errorMsg = { role: 'system_error', isError: true, text: errText, time: Date.now() };
                    historyList.push(errorMsg);
                    saveMessages(historyList);
                    appendMessageToDOM(errorMsg);
                    // 恢复 header 名字
                    if (chatTitleEl) chatTitleEl.textContent = originalTitleText;
                } else {
                    // 落盘前剥离主动通话标记：气泡展示与聊天记录均不保留标记，避免污染后续上下文
                    const parsedCall = extractVoiceCallMarker(fullText);
                    fullText = parsedCall.text;
                    // 剥离红包/转账标记 [红包:金额:留言] / [转账:金额:留言]
                    const parsedPay = extractPayMarkers(fullText);
                    fullText = parsedPay.text;
                    // 剥离自动记忆标记 [记住:xxx]，并存进 user_memory
                    const parsedMem = extractMemoryMarkers(fullText);
                    fullText = parsedMem.text;
                    if (parsedMem.memories.length) saveUserMemories(parsedMem.memories);
                    // 剥离心声标记 [心声:内容] 与虚拟图片标记 [图片:描述]
                    const parsedHeart = extractHeartMarkers(fullText);
                    fullText = parsedHeart.text;
                    const parsedImg = extractVImageMarkers(fullText);
                    fullText = parsedImg.text;
                    // AI 回复清洗：保护 think/narratage 标签
                    fullText = cleanupAiReply(fullText);
                    if (fullText) {
                        // 落库（保留 think/narratage 标签供 parseReplyContent 解析）
                        const aiMsg = { role: 'assistant', text: fullText, time: Date.now(), name: groupReplyPick ? groupReplyPick.name : undefined };
                        historyList.push(aiMsg);
                        saveMessages(historyList);
                        // 删掉流式期间的临时气泡（它只显示了剥离标签后的原始文本）
                        if (streamBubble) {
                            var tempRow = streamBubble.closest('.msg-row');
                            if (tempRow) tempRow.remove();
                        }
                        // 整体重新渲染：让新消息走 parseReplyContent → 思维链块 + 旁白块 + 多气泡
                        renderAllMessages();
                        // 恢复 header 名字
                        if (chatTitleEl) chatTitleEl.textContent = originalTitleText;
                    } else if ((parsedCall.wantCall || parsedPay.items.length || parsedHeart.hearts.length || parsedImg.images.length) && streamBubble) {
                        // 模型只输出了标记：移除空白气泡、不落文本（来电卡/红包卡仍会插入）
                        const onlyRow = streamBubble.closest('.msg-row');
                        if (onlyRow) onlyRow.remove();
                        // 恢复 header 名字（避免只输出标记时页头卡在“对方正在输入…”）
                        if (chatTitleEl) chatTitleEl.textContent = originalTitleText;
                    }
                    if (parsedCall.wantCall) {
                        // AI 侧插入黑底「发起语音通话」卡并落库；是否拨号由 chat_auto_call 开关决定
                        insertIncomingCallCard(historyList);
                        maybeAutoIncomingCall();
                    }
                    if (parsedPay.items.length) {
                        // AI 侧插入红包/转账卡片并落库，role='assistant' 可被用户点击领取
                        insertPayCards(historyList, parsedPay.items);
                    }
                    if (parsedHeart.hearts.length) {
                        insertHeartCards(historyList, parsedHeart.hearts);
                    }
                    if (parsedImg.images.length) {
                        insertVImageCards(historyList, parsedImg.images);
                    }
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
                logApiCall(apiModel, 'success', apiCallStart);

            } catch (error) {
                clearAllTimers();
                streamEnded = true;   // 中断后叫停延迟渲染，避免往已移除的气泡上写
                const loadingEl = document.getElementById(statusId);
                if (loadingEl) loadingEl.remove();

                // 已吐出部分内容后中断：保留已生成文字并落库，不伪装成错误台词
                if (fullText) {
                    // 中断前已收到通话标记：同样剥离并触发呼出
                    const parsedCall = extractVoiceCallMarker(fullText);
                    fullText = parsedCall.text;
                    // 中断前已收到红包/转账标记：同样剥离并生成卡片
                    const parsedPay = extractPayMarkers(fullText);
                    fullText = parsedPay.text;
                    // 中断前已收到记忆标记：同样剥离并存进 user_memory
                    const parsedMem = extractMemoryMarkers(fullText);
                    fullText = parsedMem.text;
                    if (parsedMem.memories.length) saveUserMemories(parsedMem.memories);
                    // 中断前已收到心声/虚拟图片标记：同样剥离并生成卡片
                    const parsedHeart = extractHeartMarkers(fullText);
                    fullText = parsedHeart.text;
                    const parsedImg = extractVImageMarkers(fullText);
                    fullText = parsedImg.text;
                    // AI 回复清洗（与正常分支同一套规则，保护标签）
                    fullText = cleanupAiReply(fullText);
                    if (fullText) {
                        const aiMsg = { role: 'assistant', text: fullText, time: Date.now(), name: groupReplyPick ? groupReplyPick.name : undefined };
                        historyList.push(aiMsg);
                        saveMessages(historyList);
                        // 删掉流式临时气泡，整体 re-render 让 think/narratage 生效
                        if (streamBubble) {
                            var tRow = streamBubble.closest('.msg-row');
                            if (tRow) tRow.remove();
                        }
                        renderAllMessages();
                        // 恢复 header 名字
                        if (chatTitleEl) chatTitleEl.textContent = originalTitleText;
                    }
                    const tipText = error.name === 'AbortError'
                        ? (abortReason === 'total'
                            ? '回复较长已截断（120 秒上限），以上为已收到的内容'
                            : '连接中断（' + (abortReason === 'watchdog' ? '30 秒未收到新内容' : '连接超时') + '），以上为已收到的回复')
                        : `连接中断：${error.message || '网络错误'}`;
                    const tipMsg = { role: 'system_error', isError: true, text: tipText, time: Date.now() };
                    historyList.push(tipMsg);
                    saveMessages(historyList);
                    appendMessageToDOM(tipMsg);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    if (parsedCall.wantCall) {
                        insertIncomingCallCard(historyList);
                        maybeAutoIncomingCall();
                    }
                    if (parsedPay.items.length) {
                        insertPayCards(historyList, parsedPay.items);
                    }
                    if (parsedHeart.hearts.length) {
                        insertHeartCards(historyList, parsedHeart.hearts);
                    }
                    if (parsedImg.images.length) {
                        insertVImageCards(historyList, parsedImg.images);
                    }
                    logApiCall(apiModel, 'error', apiCallStart, tipText);
                    return;
                }

                let errorText = '';
                if (error.name === 'AbortError') {
                    errorText = abortReason === 'watchdog'
                        ? '连接中断（30 秒未收到新内容），请检查网络后重试。'
                        : (abortReason === 'total'
                            ? '回复超时（120 秒上限），未收到有效内容。'
                            : '请求超时（15秒未响应），请检查网络或 API 地址。');
                } else {
                    errorText = `连接失败: ${error.message || '请检查 API 设置是否正确（可能是跨域或地址不正确）'}`;
                }

                const errorMsg = { role: 'system_error', isError: true, text: errorText, time: Date.now() };
                historyList.push(errorMsg);
                saveMessages(historyList);
                appendMessageToDOM(errorMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                logApiCall(apiModel, 'error', apiCallStart, errorText);
                // 恢复 header 名字
                if (chatTitleEl) chatTitleEl.textContent = originalTitleText;
            } finally {
                aiSending = false;   // R3：所有出口统一解锁
            }
        }

        // 暴露给 chat-extras.js：重玩/重新生成
        window.sendMsg = sendMsg;
        window.regenerateReply = function(direction, mid) {
            if (aiSending) { if (typeof showToast === 'function') showToast('TA 正在回复中，稍等一下'); return; }
            if (isBlocked(aliasRoleId)) {
                if (typeof showToast === 'function') showToast('你已把 TA 拉黑，无法重玩或改写');
                return;
            }
            var list = loadMessages();
            var targetIdx = -1;
            if (mid) {
                for (var k = 0; k < list.length; k++) {
                    if (ensureMid(list[k]) === mid) { targetIdx = k; break; }
                }
            } else {
                // 从后往前找最后一条 AI 消息
                for (var i = list.length - 1; i >= 0; i--) {
                    var m = list[i];
                    if (m.role === 'received' || m.role === 'assistant') { targetIdx = i; break; }
                }
            }
            if (targetIdx === -1) {
                if (typeof showToast === 'function') showToast(mid ? '这条消息已不存在' : '还没有 AI 回复可以重玩');
                return;
            }
            list.splice(targetIdx, 1);
            saveMessages(list);
            // 清空聊天区重新渲染
            chatMessages.innerHTML = '';
            list.forEach(function(m) { appendMessageToDOM(m); });
            chatMessages.scrollTop = chatMessages.scrollHeight;
            // 触发重新生成
            sendMsg({ isRegenerate: true, regenDirection: direction || '' });
        };

        // 改写指定的某条 AI 消息（由消息操作面板调用）
        window.openRegenForMid = function(mid) {
            window.__regenMid = mid;
            if (typeof window.openRegen === 'function') window.openRegen(mid);
        };

        // ================= 消息多选（长按进入） =================
        var selectingMode = false;
        var selectedTimes = new Set();
        var pressTimer = null;

        function enterSelection(msgTime) {
            selectingMode = true;
            selectedTimes = new Set();
            if (msgTime) selectedTimes.add(msgTime);
            chatMessages.classList.add('selecting');
            document.getElementById('selectBar').classList.add('show');
            // 给所有消息行插入勾选圈
            chatMessages.querySelectorAll('.msg-row').forEach(function (row) {
                if (row.querySelector('.msg-select-check')) return;
                var c = document.createElement('div');
                c.className = 'msg-select-check';
                row.insertBefore(c, row.firstChild);
            });
            updateSelectionUI();
        }

        function exitSelection() {
            selectingMode = false;
            selectedTimes = new Set();
            chatMessages.classList.remove('selecting');
            var bar = document.getElementById('selectBar');
            if (bar) bar.classList.remove('show');
            chatMessages.querySelectorAll('.msg-row').forEach(function (row) {
                var c = row.querySelector('.msg-select-check');
                if (c) c.remove();
                row.classList.remove('ghost');
            });
        }

        function updateSelectionUI() {
            document.getElementById('selectCount').textContent = '已选 ' + selectedTimes.size + ' 条';
            chatMessages.querySelectorAll('.msg-row').forEach(function (row) {
                var t = row.dataset.time;
                var c = row.querySelector('.msg-select-check');
                if (!t || !c) return;
                var on = selectedTimes.has(t);
                c.classList.toggle('checked', on);
                row.classList.toggle('ghost', on);
            });
        }

        function toggleSelectRow(row) {
            var t = row.dataset.time;
            if (!t) return;
            if (selectedTimes.has(t)) selectedTimes.delete(t);
            else selectedTimes.add(t);
            updateSelectionUI();
        }

        // ================= 消息操作面板（长按弹出；多选收进面板，原多选逻辑保持不变） =================
        var MSG_ICON_SELECT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12.5l2.5 2.5 5-5.5"/></svg>';

        function sheetItemHTML(act, label, icon, danger) {
            return '<button class="msg-sheet-item' + (danger ? ' danger' : '') + '" type="button" data-act="' + act + '">' + icon + '<span>' + label + '</span></button>';

        // 取消息的可读文本（非文本消息给等价占位文案）
        function plainTextOf(msg) {
            if (!msg) return '';
            // 心声带标签再复制/转发，避免对方看不出这是"心里话"
            if (msg.type === 'heart') return '[心声] ' + String(msg.text || '');
            var t = String((msg.text || msg.content) || '').trim();
            if (t) return t;
            if (msg.type === 'redpacket') return '[红包] ' + (msg.message || '恭喜发财，大吉大利');
            if (msg.type === 'transfer') return '[转账] ' + (msg.amount != null ? '¥' + msg.amount : '');
            if (msg.type === 'voice') return '[语音]' + (msg.text ? ' ' + msg.text : '');
            if (msg.type === 'image') return '[图片]' + (msg.desc ? ' ' + msg.desc : '');
            if (msg.type === 'location') return '[位置] ' + ((msg.location && msg.location.label) || '');
            if (msg.type === 'card') return '[名片] ' + ((msg.card && msg.card.name) || '');
            if (msg.type === 'sticker') return '[表情] ' + (msg.desc || '');
            if (msg.type === 'call') return '[通话]';
            return '[消息]';
        }

        // 菜单项按消息类型动态生成，内容不变
        function buildMsgMenuHTML(msg) {
            var isAi = msg.role === 'received' || msg.role === 'assistant';
            var hasText = !!String((msg.text || msg.content) || '').trim();
            var html = sheetItemHTML('select', '多选', MSG_ICON_SELECT, false);
            if (hasText) html += sheetItemHTML('copy', '复制文本', MSG_ICON_COPY, false);
            html += sheetItemHTML('forward', '转发给…', MSG_ICON_FORWARD, false);
            html += sheetItemHTML('quote', '引用回复', MSG_ICON_QUOTE, false);
            if (hasText) html += sheetItemHTML('translate', 'AI 翻译', MSG_ICON_TRANSLATE, false);
            if (isAi) html += sheetItemHTML('rewrite', '改写这条回复', MSG_ICON_REWRITE, false);
            if (hasText) html += sheetItemHTML('edit', '编辑内容', MSG_ICON_EDIT, false);

        // 锚定定位：气泡上方放得下就向上弹，否则向下；左右与上下都钳制在手机屏内
        function positionMsgMenu(mid) {
            var row = chatMessages.querySelector('.msg-row[data-mid="' + mid + '"]');
            var host = document.querySelector('.phone-mockup') || document.body;
            if (!row || !msgSheetList || !host) { msgSheetList.style.visibility = ''; return; }
            var hostRect = host.getBoundingClientRect();
            var rowRect = row.getBoundingClientRect();
            var mw = msgSheetList.offsetWidth;
            var mh = msgSheetList.offsetHeight;
            var gap = 10;
            var above = (rowRect.top - hostRect.top) > (mh + gap + 10);
            var top = above
                ? (rowRect.top - hostRect.top - mh - gap)
                : (rowRect.bottom - hostRect.top + gap);
            var isSent = row.classList.contains('sent');
            var left = isSent ? (rowRect.right - hostRect.left - mw) : (rowRect.left - hostRect.left);
            left = Math.max(8, Math.min(left, hostRect.width - mw - 8));
            top = Math.max(8, Math.min(top, hostRect.height - mh - 8));
            msgSheetList.style.top = Math.round(top) + 'px';
            msgSheetList.style.left = Math.round(left) + 'px';
            msgSheetList.classList.remove('above', 'below');
            msgSheetList.classList.add(above ? 'above' : 'below');
            // 小三角对准气泡中心
            var bubbleEl2 = row.querySelector('.msg-bubble');
            var bRect = bubbleEl2 ? bubbleEl2.getBoundingClientRect() : rowRect;
            var ax = (bRect.left + bRect.width / 2) - (hostRect.left + left) - 5;
            ax = Math.max(14, Math.min(ax, mw - 24));
            msgSheetList.style.setProperty('--arrow-x', Math.round(ax) + 'px');
            msgSheetList.style.visibility = '';
        }

        // ---------- 复制消息文本 ----------
        function copyMessageText(msg) {
            var txt = plainTextOf(msg);
            if (!txt) return;
            function ok() { if (typeof showToast === 'function') showToast('已复制'); }
            function fallback() {
                try {
                    var ta = document.createElement('textarea');
                    ta.value = txt;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    ok();
                } catch (e) {
                    if (typeof showToast === 'function') showToast('复制失败');
                }
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).then(ok).catch(fallback);
            } else {
                fallback();
            }
        }

        // 只携带白名单字段，避免把本地状态（mid/status/translation/isError）带过去引发二次余额逻辑
        function forwardMessage(msg, targetId, targetName) {
            var key = 'chat_history_' + targetId;
            var arr = [];
            try { arr = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { arr = []; }
            if (!Array.isArray(arr)) arr = [];
            var fwd = {
                role: 'user',
                time: Date.now(),
                forwarded: true,
                forwardFrom: { id: String(aliasRoleId), name: roleDisplayName },
                text: plainTextOf(msg)
            };
            if (msg.type === 'image' && msg.img) { fwd.type = 'image'; fwd.img = msg.img; fwd.desc = msg.desc || ''; }
            else if (msg.type === 'voice') { fwd.type = 'voice'; fwd.duration = msg.duration || 3; }
            else if (msg.type === 'location' && msg.location) { fwd.type = 'location'; fwd.location = msg.location; }
            else if (msg.type === 'card' && msg.card) { fwd.type = 'card'; fwd.card = msg.card; }
            else if (msg.type === 'sticker' && msg.img) { fwd.type = 'sticker'; fwd.img = msg.img; fwd.desc = msg.desc || ''; }
            arr.push(fwd);
            try {
                localStorage.setItem(key, JSON.stringify(arr));
            } catch (e) {
                if (typeof showToast === 'function') showToast('转发失败：本地存储空间不足');
                return;
            }
            if (typeof showToast === 'function') showToast('已转发给 ' + targetName);
        }

                if (vi >= vbars.length) {

                vi++;

        // ========== 红包/转账卡片工具 ==========
        // HTML 转义：防止留言等用户输入破坏卡片结构
        function escHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

        // ========== 钱包余额 workData：安全读写 ==========
        // 结构非法 / 余额非有限数字时一律回落 { balance: 1000 }，绝不把脏数据带进计算
        const WORK_DATA_KEY = 'workData';
        function getWorkData() {
            let wd = null;
            try {
                const raw = localStorage.getItem(WORK_DATA_KEY);
                if (raw) wd = JSON.parse(raw);
            } catch (e) {}
            if (!wd || typeof wd !== 'object' || Array.isArray(wd)) {
                wd = { balance: 1000 };
            }
            if (typeof wd.balance !== 'number' || !isFinite(wd.balance)) {
                wd.balance = 1000;
            }
            // 交易明细：history 缺失或非法时补空数组（老数据自动兼容）
            if (!Array.isArray(wd.history)) wd.history = [];
            return wd;
        }
        function saveWorkData(wd) {
            try {
                localStorage.setItem(WORK_DATA_KEY, JSON.stringify(wd));
                return true;
            } catch (e) {
                showToast('保存失败：本地存储空间不足');

        // 红包/转账卡片点击：拆红包 / 收款（防重复领取，金额强转数字防字符串拼接）
        function handlePayCardClick(event) {
            const cardEl = event && event.currentTarget;
            if (!cardEl) return;
            const indexStr = cardEl.getAttribute('data-index');
            if (indexStr === '' || indexStr == null) return;
            const index = parseInt(indexStr, 10);
            if (isNaN(index) || index < 0) return;

            // 每次点击都从 localStorage 重读最新消息：双击时第二次读到的已是最新状态，天然防重复刷钱
            const list = loadMessages();
            const msg = list[index];
            if (!msg || (msg.type !== 'redpacket' && msg.type !== 'transfer')) return;
            const isRed = msg.type === 'redpacket';

            // 角色判断（修复资金漏洞）：只有对方(assistant)发来的才能领取；
            // 自己(user/sent)发出的只提示等待对方，不加余额、不改状态
            if (msg.role !== 'assistant') {
                showToast('这是你发出的' + (isRed ? '红包' : '转账') + '，等待对方领取哦');
                return;
            }

            // 状态校验：已领取/已收款直接提示并 return
            if (isRed && msg.status === 'opened') {
                showToast('你已经领取过这个红包啦');
                return;
            }
            if (!isRed && msg.status === 'received') {
                showToast('已经收过款啦');
                return;
            }

            // 金额：Number 强转数字，杜绝字符串拼接（1000 + '100' 绝不会变成 '1000100'）
            const amountNum = Number(msg.amount);
            if (!isFinite(amountNum) || amountNum <= 0) {
                showToast('金额数据异常');
                return;
            }

            // 1. 改状态并保存回聊天历史
            msg.status = isRed ? 'opened' : 'received';

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var rid = params.get('id') || params.get('roleId') || '';
  if (!rid) return;

  var HOUR = 3600000;
  var overlay = document.getElementById('sumOverlay');
  var sumSub = document.getElementById('sumSub');
  var btnConfirm = document.getElementById('sumConfirm');
  var btnDismiss = document.getElementById('sumDismiss');
  // M3：非阻塞提示（showToast 为主脚本的全局函数；异常时兜底 alert）
  function sumToast(msg) {
    if (typeof showToast === 'function') showToast(msg, 2600);
    else alert(msg);
  }

  function getHistoryCount() {
    try {
      var raw = localStorage.getItem('chat_history_' + rid);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.length : 0;
    } catch (e) { return 0; }
  }
  function getInterval() {
    var n = parseInt(localStorage.getItem('chat_summary_interval_' + rid), 10);
    if (isNaN(n) || n < 1) n = 20;
    return Math.min(n, 200);
  }
  function autoEnabled() {
    return localStorage.getItem('chat_summary_auto_' + rid) !== '0';
  }
  function lastSummaryAt() {
    var t = parseInt(localStorage.getItem('chat_last_summary_' + rid), 10);
    return isNaN(t) ? 0 : t;
  }

  function checkAutoSummary() {
    if (!autoEnabled()) return;
    if (overlay.style.display !== 'none') return;
    var count = getHistoryCount();
    var interval = getInterval();
    if (count < interval) return;
    var now = Date.now();
    if (now - lastSummaryAt() < 8 * HOUR) return;
    sumSub.textContent = '已经聊了 ' + count + ' 条内容，AI 会自动提取值得记住的事存入长期记忆。';
    overlay.style.display = 'flex';
  }

  function snooze() {
    try { localStorage.setItem('chat_last_summary_' + rid, String(Date.now())); } catch (e) {}
    overlay.style.display = 'none';
  }

  async function doSummarize() {
    btnConfirm.disabled = true;
    btnConfirm.textContent = '总结中...';
    try {
      var config = {};
      try { config = JSON.parse(localStorage.getItem('api_settings') || '{}'); } catch (e) {}
      var apiKey = (config.apiKey || '').trim();
      var baseUrl = (config.baseUrl || 'https://api.openai.com/v1').trim().replace(/\/+$/, '');
      var apiModel = (config.model || 'gpt-3.5-turbo').trim();
      if (!apiKey) { sumToast('请先到设置页配置 API Key'); overlay.style.display = 'none'; return; }

      var history = [];
      try {
        var raw = localStorage.getItem('chat_history_' + rid);
        history = raw ? JSON.parse(raw) : [];
      } catch (e) {}
      history = Array.isArray(history) ? history.slice(-60) : [];
      if (!history.length) { overlay.style.display = 'none'; return; }

      var transcript = history.map(function (m) {
        var who = (m.role === 'sent' || m.role === 'user') ? '用户' : '角色';
        return who + '：' + (m.text || m.content || '');
      }).join('\n');
      // M3：总结输入字符预算 4000 字，超长从头部截断（保留最近内容），不切代理对
      var MAX_TRANSCRIPT_CHARS = 4000;
      if (transcript.length > MAX_TRANSCRIPT_CHARS) {
        var cut = transcript.length - MAX_TRANSCRIPT_CHARS;
        if (transcript.charCodeAt(cut) >= 0xD800 && transcript.charCodeAt(cut) <= 0xDBFF) cut += 1;
        transcript = '…（更早内容已省略）\n' + transcript.slice(cut);
      }

      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 20000);
      var resp = await fetch(baseUrl + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        signal: controller.signal,
        body: JSON.stringify({
          model: apiModel,
          temperature: 0.3,
          stream: false,
          messages: [
            { role: 'system', content: '你是记忆整理助手。阅读聊天记录，提取值得角色长期记住的事。每条记忆输出一个 JSON 对象：{"content":"简短陈述","category":"key|plot|detail|anniversary|preference","importance":1到5的整数}。category：key=关键事件/关系状态，plot=线上聊天剧情互动，detail=生活细节，anniversary=纪念日/重要日期/约定，preference=互动偏好/喜好习惯。importance：关键事件5，重要4，一般3。只输出 JSON 数组，不要解释；没有值得记住的事就输出 []。' },
            { role: 'user', content: '聊天记录：\n' + transcript }
          ]
        })
      });
      clearTimeout(timer);
      if (!resp.ok) { sumToast(friendlyHttpError(resp.status, '')); overlay.style.display = 'none'; return; }
      var data = await resp.json();
      var text = data && data.choices && data.choices[0] && data.choices[0].message
        ? (data.choices[0].message.content || '').trim() : '';
      var jsonMatch = text.match(/\[[\s\S]*\]/);
      var items = jsonMatch ? JSON.parse(jsonMatch[0]) : [];
      if (!Array.isArray(items)) items = [];

      var existing = [];
      try {
        var rawEx = localStorage.getItem('chat_memories_' + rid);
        existing = rawEx ? JSON.parse(rawEx) : [];
        if (!Array.isArray(existing)) existing = [];
      } catch (e) {}
      var now = Date.now();
      var autoConfirmed = 0, pending = 0;
      items.forEach(function (it) {
        if (!it || !it.content) return;
        var dup = existing.some(function (e) { return e.content === it.content; });
        if (dup) return;
        var imp = Math.max(1, Math.min(5, parseInt(it.importance, 10) || 3));
        // 高重要性(>=4)自动确认，其余进待确认草稿
        var status = imp >= 4 ? 'confirmed' : 'pending';
        if (status === 'confirmed') autoConfirmed++; else pending++;
        existing.push({
          content: String(it.content).slice(0, 120),
          category: (it.category === 'key' || it.category === 'plot' || it.category === 'detail' || it.category === 'anniversary' || it.category === 'preference') ? it.category : 'detail',
          importance: imp,
          status: status,
          createdAt: now
        });
      });
      // M1：统一走 saveWeightMemories（双写 phone_data_v2 + 按权重裁剪到 300 条，fixed 不淘汰）
      try { saveWeightMemories(rid, existing); } catch (e) {}
      try { localStorage.setItem('chat_last_summary_' + rid, String(now)); } catch (e) {}
      overlay.style.display = 'none';
      var msg = '已总结：' + autoConfirmed + ' 条自动确认';
      if (pending > 0) msg += '，' + pending + ' 条待确认';
      btnConfirm.textContent = msg;
      setTimeout(function () { overlay.style.display = 'none'; }, 1200);
    } catch (err) {
      sumToast('总结失败：' + (err.name === 'AbortError' ? '请求超时' : '网络错误'));
      overlay.style.display = 'none';
    } finally {
      btnConfirm.disabled = false;
      btnConfirm.textContent = '立即总结';
    }
  }

  btnDismiss.addEventListener('click', snooze);
  btnConfirm.addEventListener('click', doSummarize);

  // 页面加载后延迟检测
  setTimeout(checkAutoSummary, 1500);
})();
</script>
