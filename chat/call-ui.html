<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>语音通话</title>
<script src="../js/font-loader.js"></script>
<script src="../js/native-feel.js"></script>
<script src="../js/sound-system.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background-color: #F8F8F8;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    color: #2C2C2E;
    user-select: none;
    overflow: hidden;
  }

  /* 主舞台容器：占满整个视口，保留 8px 极窄外边距 */
  .space-stage {
    height: 100vh;
    overflow-y: auto;
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    scrollbar-width: none;
    background: #F8F8F8;
  }
  .space-stage::-webkit-scrollbar { display: none; }

  /* 贯通一体的大板块容器（纯白基底） */
  .profile-main-container {
    position: relative;
    width: 100%;
    flex: 1;
    background: #FFFFFF;
    border-radius: 28px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 16px;
  }

  /* 左上角返回按键 */
  .cover-nav-btn {
    position: relative; z-index: 10; width: 24px; height: 24px; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto;
    margin-bottom: 4px;
  }
  .cover-nav-btn svg { width: 18px; height: 18px; stroke: #2C2C2E; stroke-width: 2.2; filter: drop-shadow(0 1px 2px rgba(255,255,255,0.8)); }

  /* 内衬聊天板块 */
  .inner-content-panel {
    position: relative; z-index: 10; flex: 1; background: #FAFAFC; border-radius: 20px; padding: 20px 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
    overflow: hidden;
  }

  /* ==========================================
     状态一：精致纯白长方形通话小白卡
  ========================================== */
  #cardStateView {
    position: absolute;
    width: 210px;
    padding: 24px 16px 20px 16px;
    background: linear-gradient(180deg, #FFFFFF 0%, #F4F4F6 100%);
    border-radius: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.03);
    border: 1px solid rgba(230, 230, 235, 0.8);
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* 头像灵动扩散波浪 */
  .avatar-ripple-container {
    position: relative; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
  }
  .ripple-ring {
    position: absolute; width: 100%; height: 100%; border-radius: 50%; background: rgba(220, 220, 228, 0.4);
    animation: rippleExpand 2.4s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
  }
  .ripple-ring:nth-child(2) { animation-delay: 0.8s; }
  .ripple-ring:nth-child(3) { animation-delay: 1.6s; }
  @keyframes rippleExpand {
    0% { transform: scale(0.85); opacity: 0.8; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .call-portrait-avatar {
    position: relative; z-index: 2; width: 56px; height: 56px;
    background: linear-gradient(135deg, #ECECF0 0%, #DCDCE0 100%);
    color: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 1rem; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,0.08); border: 2.5px solid #FFFFFF;
    overflow: hidden;
  }
  .call-portrait-avatar img,
  .fullscreen-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-fallback { width: 28px; height: 28px; }

  .call-card-meta { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; margin-bottom: 14px; }
  .call-card-title { font-size: 0.813rem; font-weight: 700; color: #2C2C2E; letter-spacing: -0.2px; }
  .call-card-subtitle { font-size: 0.625rem; color: #8E8E93; font-weight: 500; letter-spacing: 0.2px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .audio-wave-box { display: flex; align-items: center; gap: 3px; height: 14px; margin-bottom: 18px; }
  .wave-bar {
    width: 2.5px; height: 100%; background: #A1A1A6; border-radius: 2px;
    animation: waveJump 1.2s infinite ease-in-out alternate;
  }
  .wave-bar:nth-child(1) { animation-delay: 0.1s; }
  .wave-bar:nth-child(2) { animation-delay: 0.4s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { animation-delay: 0.5s; }
  @keyframes waveJump {
    0% { height: 4px; opacity: 0.4; }
    100% { height: 14px; opacity: 1; background: #2C2C2E; }
  }

  .call-card-actions { display: flex; width: 100%; justify-content: center; gap: 10px; }
  .action-btn-pill {
    flex: 1; height: 34px; border-radius: 17px; font-size: 0.688rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; letter-spacing: -0.1px;
  }
  .action-btn-pill.decline { background: #EBEBEF; color: #FF3B30; }
  .action-btn-pill.accept { background: #2C2C2E; color: #FFFFFF; box-shadow: 0 4px 10px rgba(0,0,0,0.12); }
  /* 呼出态：白卡仅剩一个「取消」按钮，居中略放大 */
  .action-btn-single {
    flex: none !important;
    width: 60% !important;
    margin: 0 auto !important;
    height: 36px;
    border-radius: 18px;
  }
  /* 形态切换：来电显示「拒绝/接听」，呼出显示「取消」 */
  body.mode-outgoing #btnReject,
  body.mode-outgoing #btnAccept { display: none; }
  body.mode-incoming #btnCardHangup { display: none; }


  /* ==========================================
     状态二：点击接听后无缝展开的高级全屏通话态
  ========================================== */
  #fullStateView {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, #242426 0%, #1A1A1C 100%);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 28px 20px 32px 20px;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.95);
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .call-top-bar { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .call-back-btn {
    width: 30px; height: 30px; background: rgba(255,255,255,0.08); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(10px);
  }
  .call-back-btn svg { width: 15px; height: 15px; stroke: #FFFFFF; stroke-width: 2.2; }
  .call-encryption-tag {
    font-size: 0.594rem; color: rgba(255,255,255,0.4); letter-spacing: 0.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .call-encryption-tag svg { width: 10px; height: 10px; stroke: rgba(255,255,255,0.4); }

  .call-center-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: -10px; }
  .fs-ripple-box { position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; }
  .fs-ripple {
    position: absolute; width: 100%; height: 100%; border-radius: 50%; background: rgba(255, 255, 255, 0.06);
    animation: fsRippleExpand 3s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
  }
  .fs-ripple:nth-child(2) { animation-delay: 1s; }
  .fs-ripple:nth-child(3) { animation-delay: 2s; }
  @keyframes fsRippleExpand {
    0% { transform: scale(0.9); opacity: 0.8; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  .fullscreen-avatar {
    position: relative; z-index: 2; width: 72px; height: 72px;
    background: linear-gradient(135deg, #3A3A3C 0%, #2C2C2E 100%);
    color: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 1.375rem; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.15);
    overflow: hidden;
  }

  .fullscreen-meta { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .fullscreen-name { font-size: 1.125rem; font-weight: 700; color: #FFFFFF; letter-spacing: -0.3px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fullscreen-timer { font-size: 0.688rem; color: rgba(255,255,255,0.5); font-weight: 500; font-variant-numeric: tabular-nums; }

  .call-bottom-controls { display: flex; align-items: center; justify-content: space-around; width: 100%; padding: 0 8px; }
  .control-icon-btn {
    width: 48px; height: 48px; background: rgba(255,255,255,0.08); border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(10px);
  }
  .control-icon-btn svg { width: 18px; height: 18px; stroke: #FFFFFF; stroke-width: 1.8; }
  .control-icon-btn.hangup { background: #FF3B30; box-shadow: 0 8px 24px rgba(255, 59, 48, 0.4); }
  .control-icon-btn.hangup svg { stroke: #FFFFFF; stroke-width: 2.2; }


  /* 激活展开状态控制类 */
  .inner-content-panel.active #cardStateView {
    opacity: 0;
    transform: scale(0.9);
    pointer-events: none;
  }
  .inner-content-panel.active #fullStateView {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
</style>
<link rel="stylesheet" href="../css/mobile-fit.css">
</head>
<body>

  <!-- 主舞台滚动区 -->
  <div class="space-stage">

    <!-- 贯通一体大板块 -->
    <div class="profile-main-container">

      <!-- 返回按键 -->
      <div class="cover-nav-btn" id="btnTopBack" aria-label="返回" role="button">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>

      <!-- 内衬板块容器（通过 toggleActive 切换两套形态） -->
      <div class="inner-content-panel" id="panelContainer">

        <!-- 形态一：精巧纯白竖向卡片 -->
        <div id="cardStateView">
          <div class="avatar-ripple-container">
            <div class="ripple-ring"></div>
            <div class="ripple-ring"></div>
            <div class="ripple-ring"></div>
            <div class="call-portrait-avatar" id="cardAvatar"></div>
          </div>

          <div class="call-card-meta">
            <span class="call-card-title" id="cardTitle">正在呼叫...</span>
            <span class="call-card-subtitle" id="cardSubtitle">联系人</span>
          </div>

          <div class="audio-wave-box">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
          </div>

          <div class="call-card-actions">
            <!-- 来电态：拒绝（浅灰底红字）/ 接听（纯黑底白字） -->
            <button class="action-btn-pill decline" id="btnReject" type="button">拒绝</button>
            <button class="action-btn-pill accept" id="btnAccept" type="button">接听</button>
            <!-- 呼出态：仅保留居中「取消」按钮 -->
            <button class="action-btn-pill decline action-btn-single" id="btnCardHangup" type="button">取消</button>
          </div>
        </div>

        <!-- 形态二：接听后无缝展开的高级全屏通话态 -->
        <div id="fullStateView">
          <div class="call-top-bar">
            <!-- 点击收起返回白卡形态 -->
            <div class="call-back-btn" id="btnMinimize" role="button" title="收起卡片">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </div>
            <span class="call-encryption-tag">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              端到端加密通话
            </span>
          </div>

          <div class="call-center-stage">
            <div class="fs-ripple-box">
              <div class="fs-ripple"></div>
              <div class="fs-ripple"></div>
              <div class="fs-ripple"></div>
              <div class="fullscreen-avatar" id="fullAvatar"></div>
            </div>
            <div class="fullscreen-meta">
              <span class="fullscreen-name" id="fullName">联系人</span>
              <span class="fullscreen-timer" id="callTimer">00:00</span>
            </div>
          </div>

          <div class="call-bottom-controls">
            <button class="control-icon-btn" type="button" title="静音">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button class="control-icon-btn" type="button" title="扬声器">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </button>
            <!-- 挂断返回 -->
            <button class="control-icon-btn hangup" id="btnFullHangup" type="button" title="挂断">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 3.41l1.53-1.53a4 4 0 0 1 4.12-.94 13.56 13.56 0 0 0 4.16 1.08 4 4 0 0 1 3.59 4v3.13a4 4 0 0 1-4.38 4 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A4 4 0 0 1 4.11 2h3.13a4 4 0 0 1 4 3.59 13.56 13.56 0 0 0 1.08 4.16 4 4 0 0 1-.94 4.12l-1.53 1.53z"/></svg>
            </button>
          </div>
        </div>

      </div>

    </div>

  </div>

<script>
  // ================= URL 参数：roleId（兼容 id 兜底）、type（incoming 来电 / 默认 outgoing 呼出） =================
  var urlParams = new URLSearchParams(window.location.search);
  var roleId = urlParams.get('roleId') || urlParams.get('id') || '';
  var callType = urlParams.get('type') === 'incoming' ? 'incoming' : 'outgoing';
  document.body.classList.add(callType === 'incoming' ? 'mode-incoming' : 'mode-outgoing');

  if (callType === 'incoming' && typeof SoundSystem !== 'undefined') SoundSystem.play('call');

  function readJSON(key) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  // 项目真实键为 ai_custom_characters；characters 仅作兼容兜底
  var roleList = readJSON('ai_custom_characters');
  if (!Array.isArray(roleList)) roleList = readJSON('characters');
  if (!Array.isArray(roleList)) roleList = [];

  var role = null;
  for (var i = 0; i < roleList.length; i++) {
    if (roleList[i] && roleList[i].id === roleId) { role = roleList[i]; break; }
  }

  var roleName = (role && role.name) ? role.name : '未知联系人';
  var roleAvatar = (role && role.avatar) ? role.avatar : '';

  // 我自己的资料（呼出态白卡头像用我的头像）
  var myProfile = readJSON('myProfile') || {};
  var myAvatar = myProfile.avatar || '';

  // 无头像时的默认灰色细线条小人 SVG
  var FALLBACK_SVG = '<svg class="avatar-fallback" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

  function avatarHTML(src) {
    return src
      ? '<img src="' + src + '" alt="">'
      : FALLBACK_SVG;
  }

  // ================= 真实数据绑定（按来电/呼出形态区分） =================
  var cardTitleEl = document.getElementById('cardTitle');
  var cardSubtitleEl = document.getElementById('cardSubtitle');
  if (callType === 'incoming') {
    // 来电：白卡显示对方头像与名字，副标题「邀请你语音通话」
    document.getElementById('cardAvatar').innerHTML = avatarHTML(roleAvatar);
    cardTitleEl.textContent = roleName;
    cardSubtitleEl.textContent = '邀请你语音通话';
  } else {
    // 呼出：白卡显示我的头像，标题「正在呼叫...」，副标题为对方名字
    document.getElementById('cardAvatar').innerHTML = avatarHTML(myAvatar);
    cardTitleEl.textContent = '正在呼叫...';
    cardSubtitleEl.textContent = roleName;
  }
  // 全屏（接通态）始终显示对方角色头像与名字
  document.getElementById('fullAvatar').innerHTML = avatarHTML(roleAvatar);
  document.getElementById('fullName').textContent = roleName;
  document.title = roleName + ' · 语音通话';

  // ================= 通话计时 =================
  var timerInterval = null;
  var seconds = 0;
  var connected = false; // 是否已接通（决定回聊天页卡片显示时长还是「已取消」）

  // 仅呼出态：5 秒内未点「取消」则模拟对方自动接通；来电态必须等用户点「接听」
  var ringingTimer = null;
  if (callType === 'outgoing') {
    ringingTimer = setTimeout(function () {
      ringingTimer = null;
      handleAccept();
    }, 5000);
  }

  function updateTimer() {
    var mins = Math.floor(seconds / 60);
    var secs = seconds % 60;
    document.getElementById('callTimer').textContent =
      (mins < 10 ? '0' + mins : '' + mins) + ':' + (secs < 10 ? '0' + secs : '' + secs);
  }

  // 接通后的展开逻辑（白卡放大过渡 + 计时器），逻辑与动画保持原样
  // 来电态由「接听」按钮触发；呼出态由 5 秒自动接通触发，也可手动 window.simulateAccept()
  function handleAccept() {
    if (ringingTimer) { clearTimeout(ringingTimer); ringingTimer = null; }
    connected = true;
    document.getElementById('panelContainer').classList.add('active');
    seconds = 0;
    updateTimer();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(function () {
      seconds++;
      updateTimer();
    }, 1000);
  }
  window.simulateAccept = handleAccept;

  // ================= 退出：写通话结果后，挂断 / 收起 / 顶部返回均回聊天页 =================
  function goBack() {
    if (ringingTimer) { clearTimeout(ringingTimer); ringingTimer = null; }
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    // 与 call.html 相同的契约：聊天页 chat-extras.js 据此插入一张通话卡（不发 AI 指令）
    if (roleId) {
      try {
        sessionStorage.setItem('call_result_' + roleId, JSON.stringify({
          type: 'voice',
          connected: connected,
          duration: connected ? seconds : 0
        }));
      } catch (e) {}
    }
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'chat.html';
    }
  }

  document.getElementById('btnMinimize').addEventListener('click', goBack);
  document.getElementById('btnCardHangup').addEventListener('click', goBack);
  document.getElementById('btnFullHangup').addEventListener('click', goBack);
  document.getElementById('btnTopBack').addEventListener('click', goBack);
  // 来电态：接听进入全屏通话；拒绝直接退回上一页
  document.getElementById('btnAccept').addEventListener('click', handleAccept);
  document.getElementById('btnReject').addEventListener('click', goBack);
</script>
<script src="../js/statusbar-control.js"></script>
</body>
</html>
