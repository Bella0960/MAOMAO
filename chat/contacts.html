<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>通讯录</title>
<script src="js/font-loader.js"></script>
<script src="js/native-feel.js"></script>
<script src="js/phone/phone_storage.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background-color: #D6D6D6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
    color: #111111;
    user-select: none;
  }

  .phone-mockup {
    position: relative;
    width: min(390px, calc(100vw - 24px));
    height: min(844px, calc(100vh - 24px));
    min-height: 0;
    background-color: #FFFFFF;
    border-radius: 45px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
    overflow: hidden;
    border: 8px solid #ffffff;
    display: flex;
    flex-direction: column;
  }

  .status-bar {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 14px 28px;
    font-size: 0.875rem; font-weight: 600;
    color: #111111;
    z-index: 50;
    pointer-events: none;
  }

  /* mobile fullscreen: no rounded shell */
  .top-nav {
    flex: 0 0 auto;
    padding: 52px 14px 6px 14px;
    background: #FFFFFF;
    border-bottom: 0.5px solid rgba(0,0,0,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .top-nav-title {
    font-size: 16px;
    font-weight: 500;
    color: #111111;
    letter-spacing: -0.3px;
  }

  /* mobile fullscreen: no rounded shell */
  .search-wrap {
    padding: 6px 14px 8px 14px;
    background: #FFFFFF;
  }
  .search-box {
    background: #F0F0F0;
    border-radius: 6px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    height: 30px;
  }
  .search-box svg { width: 13px; height: 13px; stroke: #999; margin-right: 5px; flex-shrink: 0; }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: #111111;
    font-family: inherit;
  }
  .search-box input::placeholder { color: #AAA; }

  /* mobile fullscreen: no rounded shell */
  .contact-stage {
    flex: 1;
    overflow-y: auto;
    background: #FAFAFA;
    padding-bottom: 110px;
    scrollbar-width: none;
  }
  .contact-stage::-webkit-scrollbar { display: none; }

  /* mobile fullscreen: no rounded shell */
  .contact-section-title {
    padding: 8px 14px 3px 14px;
    font-size: 12px;
    color: #AAA;
    font-weight: 400;
    letter-spacing: 0.3px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    padding: 9px 14px;
    background: #FFFFFF;
    border-bottom: 0.5px solid rgba(0,0,0,0.04);
    cursor: pointer;
    transition: background 0.12s;
  }
  .contact-item:active { background: #F0F0F0; }

  .contact-item:last-child { border-bottom: none; }

  .contact-avatar {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    overflow: hidden;
    background: #EDEDED;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
    font-weight: 500;
    color: #999;
  }
  .contact-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .contact-avatar svg { width: 22px; height: 22px; stroke: #999; }

  .contact-info {
    flex: 1;
    margin-left: 10px;
    min-width: 0;
  }
  .contact-name {
    font-size: 14px;
    font-weight: 500;
    color: #111111;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* mobile fullscreen: no rounded shell */
  .empty-state {
    text-align: center;
    padding: 60px 40px;
    color: #AAA;
  }
  .empty-state svg { width: 40px; height: 40px; stroke: #DDD; margin-bottom: 14px; }
  .empty-state .empty-text { font-size: 13px; line-height: 1.6; }

  /* mobile fullscreen: no rounded shell */
  .quick-entry-list {
    background: #FFFFFF;
    margin-bottom: 6px;
  }
  .quick-entry {
    display: flex;
    align-items: center;
    padding: 9px 14px;
    border-bottom: 0.5px solid rgba(0,0,0,0.04);
    cursor: pointer;
  }
  .quick-entry:active { background: #F0F0F0; }
  .quick-entry:last-child { border-bottom: none; }
  .quick-entry-icon {
    width: 28px; height: 28px;
    border-radius: 5px;
    background: #111111;
    display: flex; align-items: center; justify-content: center;
    margin-right: 10px;
  }
  .quick-entry-icon svg { width: 16px; height: 16px; stroke: #FFFFFF; fill: none; stroke-width: 2; }
  .quick-entry-label { font-size: 13px; color: #111111; letter-spacing: -0.2px; }
  .quick-entry-arrow { margin-left: auto; color: #CCC; }
  .quick-entry-arrow svg { width: 11px; height: 11px; stroke: #CCC; }

  /* mobile fullscreen: no rounded shell */


  /* mobile fullscreen: no rounded shell */
  @media (max-width: 480px) {
    html, body {
      background: #FFFFFF !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-height: 100vh !important;
      align-items: stretch !important;
      overflow: hidden !important;
    }
    .phone-mockup {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      margin: 0 !important;
    }
  }
</style>
</head>
<body>

  <div class="phone-mockup">
    <div class="status-bar"><span>4:41</span></div>

    <!-- 顶部 -->
    <div class="top-nav">
      <span class="top-nav-title">通讯录</span>
      <span style="width:28px;"></span>
    </div>

    <!-- 搜索框 -->
    <div class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索" />
      </div>
    </div>

    <!-- 列表区 -->
    <div class="contact-stage" id="contactStage">

      <!-- 快捷入口 -->
      <div class="quick-entry-list">
        <div class="quick-entry" id="goManageRole">
          <div class="quick-entry-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="8.5" cy="7" r="4"/>
              <line x1="20" y1="8" x2="20" y2="14"/>
              <line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
          </div>
          <span class="quick-entry-label">添加 AI 角色 / 人设</span>
          <span class="quick-entry-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </span>
        </div>
      </div>

      <div class="contact-section-title">我的角色</div>
      <div id="contactList"></div>

    </div>

  </div>

  <script src="js/nav.js"></script>
  <script>
  /* mobile fullscreen: no rounded shell */
    var CHARACTERS_KEY = 'ai_custom_characters';
    var _storage = window.PhoneStorage;

    function loadCharacters() {
      if (_storage) return _storage.getCharacters();
      try {
        var raw = localStorage.getItem(CHARACTERS_KEY);
        if (!raw) return [];
        var arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    function avatarFallback(name) {
      var ch = (name || '角').charAt(0);
      return '<div class="contact-avatar">' + escapeHtml(ch) + '</div>';
    }

    function renderList(filter) {
      var list = document.getElementById('contactList');
      var roles = loadCharacters();

      if (filter) {
        var f = filter.toLowerCase().trim();
        if (f) {
          roles = roles.filter(function (r) {
            return (r.name || '').toLowerCase().indexOf(f) !== -1;
          });
        }
      }

      if (roles.length === 0) {
        list.innerHTML =
          '<div class="empty-state">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>' +
              '<circle cx="9" cy="7" r="4"/>' +
              '<path d="M23 21v-2a4 4 0 0 0-3-3.87"/>' +
              '<path d="M16 3.13a4 4 0 0 1 0 7.75"/>' +
            '</svg>' +
            '<div class="empty-text">还没有角色<br>点击上方"添加 AI 角色"开始创建</div>' +
          '</div>';
        return;
      }

      var html = roles.map(function (role) {
        var name = role.name || '角色';
        var avatar = role.avatar
          ? '<div class="contact-avatar"><img src="' + escapeHtml(role.avatar) + '" alt=""></div>'
          : avatarFallback(name);
        return '' +
          '<div class="contact-item" data-id="' + escapeHtml(role.id) + '">' +
            avatar +
            '<div class="contact-info">' +
              '<div class="contact-name">' + escapeHtml(name) + '</div>' +
            '</div>' +
          '</div>';
      }).join('');

      list.innerHTML = html;

      // 点击 → 进入聊天详情
      list.querySelectorAll('.contact-item').forEach(function (el) {
        el.addEventListener('click', function () {
          var id = el.getAttribute('data-id');
          if (id) {
            window.location.href = 'chat-detail.html?id=' + encodeURIComponent(id);
          }
        });
      });
    }

  /* mobile fullscreen: no rounded shell */
    document.getElementById('searchInput').addEventListener('input', function (e) {
      renderList(e.target.value);
    });

  /* mobile fullscreen: no rounded shell */
    document.getElementById('goManageRole').addEventListener('click', function () {
      window.location.href = 'characters.html?from=contacts';
    });

  /* mobile fullscreen: no rounded shell */
    renderList();
  </script>
  <script src="js/statusbar-control.js"></script>
</body>
</html>
