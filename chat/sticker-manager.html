<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>表情包库</title>
<script src="js/native-feel.js"></script>
<script src="js/statusbar-control.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        background-color: #E5E5E5;
        display: flex; justify-content: center; align-items: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        color: #111; user-select: none;
    }
    .phone-mockup {
        position: relative;
        width: min(390px, calc(100vw - 24px));
        height: min(844px, calc(100vh - 24px));
        background: #FFF; border-radius: 45px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        overflow: hidden; border: 1px solid rgba(0,0,0,0.06);
        display: flex; flex-direction: column;
    }
    .status-bar { position: absolute; top: 0; width: 100%; padding: 14px 28px; font-size: 0.875rem; font-weight: 600; z-index: 50; pointer-events: none; }
    .topbar {
        display: flex; align-items: flex-end; gap: 14px;
        padding: calc(56px + env(safe-area-inset-top,0px)) 22px 16px;
    }
    .back-btn {
        width: 30px; height: 30px; border-radius: 50%; border: none;
        background: #F4F4F6; display: flex; align-items: center; justify-content: center;
        color: #111; text-decoration: none; flex-shrink: 0;
    }
    .back-btn:active { background: #B0B0B5; }
    .back-btn svg { width: 14px; height: 14px; }
    .topbar-title { flex: 1; font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
    .topbar-add {
        width: 30px; height: 30px; border-radius: 50%; border: none;
        background: #F4F4F6; display: flex; align-items: center; justify-content: center;
        cursor: pointer; flex-shrink: 0;
    }
    .topbar-add:active { background: #B0B0B5; }
    .topbar-add svg { width: 14px; height: 14px; }

    .stage {
        flex: 1; overflow-y: auto;
        padding: 4px 16px 24px;
        display: flex; flex-direction: column; gap: 10px;
        scrollbar-width: none;
    }
    .stage::-webkit-scrollbar { display: none; }

    /* 库列表 */
    .lib-row {
        background: #F8F8FA; border-radius: 20px;
        padding: 14px 16px; display: flex; align-items: center; gap: 12px;
        cursor: pointer;
    }
    .lib-row:active { background: #EFEFF2; }
    .lib-icon {
        width: 44px; height: 44px; border-radius: 12px;
        background: #E5E5EA; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }
    .lib-icon img { width: 100%; height: 100%; object-fit: cover; }
    .lib-body { flex: 1; min-width: 0; }
    .lib-name { font-size: 0.938rem; font-weight: 700; }
    .lib-count { font-size: 0.75rem; color: #8E8E93; margin-top: 2px; }
    .lib-del {
        width: 30px; height: 30px; border-radius: 50%; border: none;
        background: #FFF; cursor: pointer; color: #666;
        display: flex; align-items: center; justify-content: center;
    }
    .lib-del:active { background: #E5E5EA; }
    .lib-del svg { width: 13px; height: 13px; }

    /* 库内网格 */
    .sticker-grid {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .sticker-cell {
        background: #F8F8FA; border-radius: 16px;
        padding: 10px; display: flex; flex-direction: column; gap: 6px;
        position: relative;
    }
    .sticker-img {
        width: 100%; aspect-ratio: 1; border-radius: 10px;
        object-fit: cover; background: #E5E5EA;
    }
    .sticker-desc {
        font-size: 0.65rem; color: #666; line-height: 1.3;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .sticker-del {
        position: absolute; top: 4px; right: 4px;
        width: 20px; height: 20px; border-radius: 50%;
        background: rgba(0,0,0,0.55); color: #FFF; border: none;
        font-size: 12px; line-height: 1; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
    }
    .upload-cell {
        border: 1.5px dashed #D1D1D6; border-radius: 16px;
        aspect-ratio: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 4px;
        cursor: pointer; color: #999; font-size: 0.75rem;
    }
    .upload-cell:active { background: #F0F0F0; }

    /* 弹层 */
    .overlay {
        position: absolute; inset: 0; z-index: 200;
        background: rgba(0,0,0,0.32);
        opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .overlay.is-show { opacity: 1; pointer-events: auto; }
    .sheet {
        position: absolute; left: 0; right: 0; bottom: 0;
        background: #FFF; border-radius: 24px 24px 0 0;
        padding: 8px 18px 26px;
        transform: translateY(100%); transition: transform 0.28s ease;
        max-height: 80%; overflow-y: auto; scrollbar-width: none;
    }
    .overlay.is-show .sheet { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: #E5E5EA; margin: 6px auto 14px; }
    .sheet-title { font-size: 1rem; font-weight: 800; margin-bottom: 14px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.7rem; color: #8E8E93; font-weight: 600; margin-bottom: 6px; }
    .field input {
        width: 100%; padding: 10px 12px;
        background: #F2F2F7; border: none; border-radius: 10px;
        font-size: 0.875rem; color: #111; font-family: inherit; outline: none;
    }
    .save-btn {
        width: 100%; margin-top: 8px; height: 44px;
        background: #111; color: #FFF; border: none; border-radius: 999px;
        font-size: 0.875rem; font-weight: 600; cursor: pointer;
    }
    .preview-img { width: 100%; max-width: 160px; border-radius: 12px; margin-bottom: 8px; display: block; }
</style>
<link rel="stylesheet" href="css/mobile-fit.css">
</head>
<body>
    <div class="phone-mockup">
        <div class="status-bar"><span>09:41</span></div>
        <header class="topbar">
            <a class="back-btn" href="javascript:history.back()" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
            <h1 class="topbar-title" id="topTitle">Stickers</h1>
            <button class="topbar-add" id="addBtn" aria-label="新建"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </header>
        <main class="stage" id="stage"></main>

        <!-- 新建库弹层 -->
        <div class="overlay" id="libOverlay">
            <div class="sheet">
                <div class="sheet-handle"></div>
                <div class="sheet-title">新建表情包库</div>
                <div class="field"><label>库名称</label><input id="libNameInput" maxlength="20" placeholder="如：可爱小狗"></div>
                <button class="save-btn" id="libSaveBtn">创建</button>
            </div>
        </div>

        <!-- 上传方式选择弹层 -->
        <div class="overlay" id="uploadMenuOverlay">
            <div class="sheet">
                <div class="sheet-handle"></div>
                <div class="sheet-title">添加表情</div>
                <div class="sound-option" id="pickLocalBtn"><span class="so-name">从相册选择（可多选）</span><span class="so-check">›</span></div>
                <div class="sound-option" id="pickUrlBtn"><span class="so-name">粘贴 URL 导入</span><span class="so-check">›</span></div>
            </div>
        </div>

        <!-- URL 导入弹层 -->
        <div class="overlay" id="urlOverlay">
            <div class="sheet">
                <div class="sheet-handle"></div>
                <div class="sheet-title">URL 导入</div>
                <img class="preview-img" id="urlPreview" style="display:none">
                <div class="field"><label>图片 URL</label><input id="urlInput" placeholder="https://..."></div>
                <div class="field"><label>描述词</label><input id="urlDescInput" maxlength="50" placeholder='如：开心地摇尾巴'></div>
                <button class="save-btn" id="urlSaveBtn">导入</button>
            </div>
        </div>

        <!-- 批量导入：多张图依次填描述词 -->
        <div class="overlay" id="batchOverlay">
            <div class="sheet">
                <div class="sheet-handle"></div>
                <div class="sheet-title" id="batchTitle">批量导入 1/1</div>
                <img class="preview-img" id="batchPreview">
                <div class="field"><label>描述词</label><input id="batchDescInput" maxlength="50" placeholder='如：开心地摇尾巴'></div>
                <button class="save-btn" id="batchNextBtn">下一张</button>
            </div>
        </div>

        <input type="file" id="stickerFileInput" accept="image/*" multiple hidden>
    </div>

<script>
(function () {
    var LIB_KEY = 'sticker_libraries';
    var currentLibId = null; // null = 库列表视图；否则 = 库内视图
    var pendingImg = '';

    function getLibs() {
        try { var a = JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
    }
    function saveLibs(a) { try { localStorage.setItem(LIB_KEY, JSON.stringify(a)); } catch (e) {} }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

    /* 压缩图片 */
    function compress(file, cb) {
        var reader = new FileReader();
        reader.onload = function (ev) {
            var img = new Image();
            img.onload = function () {
                var c = document.createElement('canvas');
                var max = 400, w = img.width, h = img.height;
                if (w > h) { h = h * max / w; w = max; } else { w = w * max / h; h = max; }
                c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h);
                cb(c.toDataURL('image/jpeg', 0.75));
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }

    /* 渲染：库列表 or 库内 */
    function render() {
        var stage = document.getElementById('stage');
        var libs = getLibs();
        document.getElementById('addBtn').style.display = '';

        if (!currentLibId) {
            // 库列表
            document.getElementById('topTitle').textContent = 'Stickers';
            document.getElementById('backBtn').style.display = '';
            stage.innerHTML = '';
            if (!libs.length) {
                stage.innerHTML = '<div style="text-align:center;color:#B0B0B5;font-size:0.875rem;padding:60px 20px;">还没有表情包库<br>点右上角 + 新建一个</div>';
                return;
            }
            libs.forEach(function (lib) {
                var row = document.createElement('div');
                row.className = 'lib-row';
                var cover = lib.stickers && lib.stickers[0] ? '<img src="' + lib.stickers[0].img + '">' : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#CCC" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><circle cx="15" cy="9" r="1.5"/><path d="M8 15c1 1 2 1.5 4 1.5s3-.5 4-1.5"/></svg>';
                row.innerHTML =
                    '<div class="lib-icon">' + cover + '</div>' +
                    '<div class="lib-body"><div class="lib-name">' + esc(lib.name) + '</div><div class="lib-count">' + (lib.stickers ? lib.stickers.length : 0) + ' 个表情</div></div>' +
                    '<button class="lib-del" title="删除库"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>';
                row.addEventListener('click', function (e) {
                    if (e.target.closest('.lib-del')) {
                        if (confirm('删除库「' + lib.name + '」？')) {
                            saveLibs(libs.filter(function (l) { return l.id !== lib.id; }));
                            render();
                        }
                        return;
                    }
                    currentLibId = lib.id;
                    render();
                });
                stage.appendChild(row);
            });
        } else {
            // 库内
            var lib = libs.find(function (l) { return String(l.id) === String(currentLibId); });
            if (!lib) { currentLibId = null; render(); return; }
            document.getElementById('topTitle').textContent = lib.name;
            document.getElementById('backBtn').style.display = '';
            stage.innerHTML = '';
            var grid = document.createElement('div');
            grid.className = 'sticker-grid';

            (lib.stickers || []).forEach(function (s) {
                var cell = document.createElement('div');
                cell.className = 'sticker-cell';
                cell.innerHTML =
                    '<button class="sticker-del" title="删除">✕</button>' +
                    '<img class="sticker-img" src="' + s.img + '">' +
                    '<div class="sticker-desc">' + esc(s.desc) + '</div>';
                cell.querySelector('.sticker-del').addEventListener('click', function () {
                    if (confirm('删除这个表情？')) {
                        lib.stickers = lib.stickers.filter(function (x) { return x.id !== s.id; });
                        saveLibs(libs);
                        render();
                    }
                });
                grid.appendChild(cell);
            });

            var up = document.createElement('div');
            up.className = 'upload-cell';
            up.innerHTML = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="13" r="4"/><path d="M11 1h2"/></svg><span>上传</span>';
            up.addEventListener('click', function () { document.getElementById('stickerFileInput').click(); });
            grid.appendChild(up);
            stage.appendChild(grid);
        }
    }

    /* 新建库 */
    document.getElementById('addBtn').addEventListener('click', function () {
        if (currentLibId) {
            // 库内视图：addBtn = 上传表情
            document.getElementById('stickerFileInput').click();
            return;
        }
        document.getElementById('libOverlay').classList.add('is-show');
        document.getElementById('libNameInput').value = '';
        setTimeout(function(){ document.getElementById('libNameInput').focus(); }, 300);
    });
    document.getElementById('libSaveBtn').addEventListener('click', function () {
        var name = document.getElementById('libNameInput').value.trim();
        if (!name) return;
        var libs = getLibs();
        libs.push({ id: 'lib_' + Date.now(), name: name, stickers: [] });
        saveLibs(libs);
        document.getElementById('libOverlay').classList.remove('is-show');
        currentLibId = libs[libs.length-1].id;
        render();
    });
    document.getElementById('libOverlay').addEventListener('click', function (e) {
        if (e.target === this) this.classList.remove('is-show');
    });

    /* 上传表情 */
    var batchQueue = [];
    var batchIdx = 0;

    document.getElementById('addBtn').addEventListener('click', function () {
        if (currentLibId) {
            // 库内视图：弹上传方式选择
            document.getElementById('uploadMenuOverlay').classList.add('is-show');
            return;
        }
        document.getElementById('libOverlay').classList.add('is-show');
        document.getElementById('libNameInput').value = '';
        setTimeout(function(){ document.getElementById('libNameInput').focus(); }, 300);
    });

    /* 上传方式菜单 */
    document.getElementById('uploadMenuOverlay').addEventListener('click', function (e) {
        if (e.target === this || e.target.closest('#pickLocalBtn')) {
            if (e.target.closest('#pickLocalBtn')) {
                this.classList.remove('is-show');
                document.getElementById('stickerFileInput').click();
            } else {
                this.classList.remove('is-show');
            }
        }
        if (e.target.closest('#pickUrlBtn')) {
            this.classList.remove('is-show');
            document.getElementById('urlPreview').style.display = 'none';
            document.getElementById('urlInput').value = '';
            document.getElementById('urlDescInput').value = '';
            document.getElementById('urlOverlay').classList.add('is-show');
        }
    });

    /* URL 导入：预览 */
    document.getElementById('urlInput').addEventListener('change', function () {
        var url = this.value.trim();
        if (!url) return;
        var p = document.getElementById('urlPreview');
        p.src = url; p.style.display = 'block';
        p.onerror = function () { p.style.display = 'none'; alert('图片加载失败，检查 URL'); };
    });
    document.getElementById('urlSaveBtn').addEventListener('click', function () {
        var url = document.getElementById('urlInput').value.trim();
        var desc = document.getElementById('urlDescInput').value.trim();
        if (!url || !desc) return;
        var libs = getLibs();
        var lib = libs.find(function (l) { return String(l.id) === String(currentLibId); });
        if (!lib) return;
        if (!lib.stickers) lib.stickers = [];
        lib.stickers.push({ id: 's_' + Date.now(), img: url, desc: desc });
        saveLibs(libs);
        document.getElementById('urlOverlay').classList.remove('is-show');
        render();
    });
    document.getElementById('urlOverlay').addEventListener('click', function (e) {
        if (e.target === this) this.classList.remove('is-show');
    });

    /* 本地多选：批量压缩 + 依次写描述词 */
    document.getElementById('stickerFileInput').addEventListener('change', function (e) {
        var files = Array.prototype.slice.call(e.target.files || []).filter(function (f) { return f.type.indexOf('image/') === 0; });
        if (!files.length) return;
        var promises = files.map(function (f) {
            return new Promise(function (resolve) {
                compress(f, function (dataUrl) { resolve(dataUrl); });
            });
        });
        Promise.all(promises).then(function (dataUrls) {
            batchQueue = dataUrls;
            batchIdx = 0;
            showBatchItem();
        });
        e.target.value = '';
    });

    function showBatchItem() {
        if (batchIdx >= batchQueue.length) {
            document.getElementById('batchOverlay').classList.remove('is-show');
            batchQueue = [];
            render();
            return;
        }
        document.getElementById('batchTitle').textContent = '批量导入 ' + (batchIdx + 1) + '/' + batchQueue.length;
        document.getElementById('batchPreview').src = batchQueue[batchIdx];
        document.getElementById('batchPreview').style.display = 'block';
        document.getElementById('batchDescInput').value = '';
        document.getElementById('batchNextBtn').textContent = batchIdx === batchQueue.length - 1 ? '完成' : '下一张';
        document.getElementById('batchOverlay').classList.add('is-show');
        setTimeout(function(){ document.getElementById('batchDescInput').focus(); }, 300);
    }
    document.getElementById('batchNextBtn').addEventListener('click', function () {
        var desc = document.getElementById('batchDescInput').value.trim();
        if (!desc) return;
        var libs = getLibs();
        var lib = libs.find(function (l) { return String(l.id) === String(currentLibId); });
        if (lib) {
            if (!lib.stickers) lib.stickers = [];
            lib.stickers.push({ id: 's_' + Date.now() + '_' + batchIdx, img: batchQueue[batchIdx], desc: desc });
            saveLibs(libs);
        }
        batchIdx++;
        showBatchItem();
    });
    document.getElementById('batchOverlay').addEventListener('click', function (e) {
        if (e.target === this) { this.classList.remove('is-show'); batchQueue = []; }
    });

    document.getElementById('backBtn').addEventListener('click', function () {
        currentLibId = null;
        render();
    });

    render();
})();
</script>
</body>
</html>
