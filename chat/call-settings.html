<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>通话设置 · 小手机</title>
<script src="../js/font-loader.js"></script>
<script src="../js/native-feel.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: #e5e5e5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #111111;
  }

  /* 项目统一手机外壳 */
  .phone-mockup {
    position: relative;
    width: min(390px, calc(100vw - 24px));
    height: min(844px, calc(100vh - 24px));
    background-color: #F7F7F9;
    border-radius: 45px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    overflow: hidden;
    border: 8px solid #ffffff;
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    position: absolute;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 14px 28px;
    font-size: 0.875rem;
    font-weight: 600;
    color: #000;
    z-index: 50;
    pointer-events: none !important;
  }
  .floating-nav { display: none !important; }

  /* 可滚动内容区：底部预留 40px 留白，无全局导航 */
  .cs-stage {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 40px 16px;
    display: flex;
    flex-direction: column;
    scrollbar-width: none;
    background: #F7F7F9;
  }
  .cs-stage::-webkit-scrollbar { display: none; }

  /* ===== 顶部：左返回 / 中标题 / 右占位 ===== */
  .cs-topbar {
    position: relative;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 -16px;
    padding: calc(50px + env(safe-area-inset-top, 0px)) 16px 12px 16px;
  }
  .cs-top-left,
  .cs-top-right {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .cs-top-left { justify-content: flex-start; }
  .cs-top-right { justify-content: flex-end; }
  .cs-circle-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: #F2F2F7;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s ease, background-color 0.2s ease;
  }
  .cs-circle-btn:active { transform: scale(0.94); }
  .cs-circle-btn svg { width: 16px; height: 16px; stroke: #333333; }
  .cs-title {
    flex: 1;
    text-align: center;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: #111111;
  }

  /* ===== 分组标题（与对话设置页一致） ===== */
  .section-label {
    margin: 14px 4px 8px;
    font-size: 0.625rem;
    font-weight: 600;
    color: #8E8E93;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .section-label:first-of-type { margin-top: 4px; }

  /* ===== 白底卡片列表 ===== */
  .settings-list {
    background: #FFFFFF;
    border-radius: 16px;
    overflow: hidden;
  }
  .set-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid #F2F2F7;
  }
  .set-row:last-child { border-bottom: none; }
  .set-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #F2F2F7;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .set-icon svg { width: 14px; height: 14px; stroke: #333333; }
  .set-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .set-title { font-size: 0.844rem; font-weight: 600; color: #111111; }
  .set-sub { font-size: 0.656rem; color: #8E8E93; }

  /* iOS 风开关 */
  .ios-switch {
    position: relative;
    display: inline-block;
    width: 38px;
    height: 23px;
    flex-shrink: 0;
  }
  .ios-switch input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }
  .ios-switch .switch-track {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: #E5E5EA;
    transition: background 0.2s ease;
    pointer-events: none;
  }
  .ios-switch .switch-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 2px 5px rgba(0,0,0,0.18);
    transition: transform 0.2s ease;
    pointer-events: none;
  }
  .ios-switch input:checked + .switch-track { background: #111111; }
  .ios-switch input:checked + .switch-track + .switch-thumb { transform: translateX(15px); }

  /* 分段选择控件（浅灰轨道 + 白色选中段） */
  .segmented {
    display: flex;
    background: #F2F2F7;
    border-radius: 9px;
    padding: 2px;
    flex-shrink: 0;
  }
  .segmented button {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.719rem;
    font-weight: 500;
    color: #333333;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
  }
  .segmented button.is-active {
    background: #FFFFFF;
    color: #111111;
    font-weight: 700;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
</style>
<link rel="stylesheet" href="../css/mobile-fit.css">
</head>
<body>

  <div class="phone-mockup">

    <!-- 状态栏 -->
    <div class="status-bar"><span>4:41</span></div>

    <main class="cs-stage">

      <!-- 顶部导航 -->
      <div class="cs-topbar">
        <div class="cs-top-left">
          <button class="cs-circle-btn" type="button" aria-label="返回" id="btnBack">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
        </div>
        <span class="cs-title">通话设置</span>
        <div class="cs-top-right"></div>
      </div>

      <!-- 通话偏好 -->
      <div class="section-label">通话偏好</div>
      <div class="settings-list">
        <div class="set-row">
          <span class="set-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </span>
          <span class="set-body">
            <span class="set-title">默认通话方式</span>
            <span class="set-sub">发起通话时默认使用的类型</span>
          </span>
          <span class="segmented" data-key="call_default_type">
            <button type="button" data-value="voice">语音</button>
            <button type="button" data-value="video">视频</button>
          </span>
        </div>
        <div class="set-row">
          <span class="set-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4V8z"/></svg>
          </span>
          <span class="set-body">
            <span class="set-title">视频默认背景</span>
            <span class="set-sub" id="videoBgSub">纯净灰</span>
          </span>
          <span class="segmented" data-key="call_video_bg">
            <button type="button" data-value="plain">浅灰</button>
            <button type="button" data-value="gradient">渐变</button>
            <button type="button" data-value="blur">虚化</button>
          </span>
        </div>
      </div>

      <!-- 提醒 -->
      <div class="section-label">提醒</div>
      <div class="settings-list">
        <div class="set-row">
          <span class="set-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </span>
          <span class="set-body">
            <span class="set-title">来电铃声</span>
            <span class="set-sub">对方发起通话时播放提示音</span>
          </span>
          <span class="ios-switch">
            <input type="checkbox" data-key="call_ringtone" aria-label="来电铃声">
            <span class="switch-track"></span>
            <span class="switch-thumb"></span>
          </span>
        </div>
        <div class="set-row">
          <span class="set-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.8 4A10.5 10.5 0 1 0 20 18"/><path d="M22 2l-5.2 5.2"/></svg>
          </span>
          <span class="set-body">
            <span class="set-title">免打扰</span>
            <span class="set-sub">开启后来电不响铃、不弹提醒</span>
          </span>
          <span class="ios-switch">
            <input type="checkbox" data-key="call_dnd" aria-label="免打扰">
            <span class="switch-track"></span>
            <span class="switch-thumb"></span>
          </span>
        </div>
      </div>

      <!-- AI 互动 -->
      <div class="section-label">AI 互动</div>
      <div class="settings-list">
        <div class="set-row">
          <span class="set-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 0-4 4v1a4 4 0 0 0-4 4v3a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4v-3a4 4 0 0 0-4-4V6a4 4 0 0 0-4-4z"/><path d="M9 18v2"/><path d="M15 18v2"/></svg>
          </span>
          <span class="set-body">
            <span class="set-title">允许 AI 主动发起通话</span>
            <span class="set-sub">对话中 AI 可根据剧情主动来电</span>
          </span>
          <span class="ios-switch">
            <input type="checkbox" data-key="call_ai_initiate" aria-label="允许 AI 主动发起通话">
            <span class="switch-track"></span>
            <span class="switch-thumb"></span>
          </span>
        </div>
      </div>

    </main>

  </div>

<script>
  // 返回上一页；无历史时兜底回聊天列表
  document.getElementById('btnBack').addEventListener('click', function () {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'chat.html';
    }
  });

  // ================= 全局通话设置（localStorage，无 roleId） =================
  var DEFAULTS = {
    call_default_type: 'voice',   // voice | video
    call_video_bg: 'plain',       // plain | gradient | blur
    call_ringtone: true,          // bool
    call_dnd: false,             // bool
    call_ai_initiate: false      // bool
  };
  var VIDEO_BG_LABELS = { plain: '纯净灰', gradient: '柔和渐变', blur: '虚化氛围' };

  function readStr(key) {
    var v = localStorage.getItem(key);
    if (v == null || v === '') return DEFAULTS[key];
    return v;
  }
  function readBool(key) {
    return localStorage.getItem(key) === 'true'; // 未设置/false 均为关，布尔键默认值在回填阶段处理
  }
  function defaultBool(key) {
    return DEFAULTS[key] === true;
  }

  // 回填分段控件
  document.querySelectorAll('.segmented').forEach(function (seg) {
    var key = seg.getAttribute('data-key');
    var current = readStr(key);
    seg.querySelectorAll('button').forEach(function (btn) {
      if (btn.getAttribute('data-value') === current) btn.classList.add('is-active');
    });
    seg.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('button[data-value]') : null;
      if (!btn || !seg.contains(btn)) return;
      var value = btn.getAttribute('data-value');
      try {
        localStorage.setItem(key, value);
      } catch (err) { return; }
      seg.querySelectorAll('button').forEach(function (b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      if (key === 'call_video_bg') {
        var sub = document.getElementById('videoBgSub');
        if (sub) sub.textContent = VIDEO_BG_LABELS[value] || '纯净灰';
      }
    });
  });

  // 回填开关（布尔键：无记录时使用默认值）
  document.querySelectorAll('.ios-switch input[type="checkbox"]').forEach(function (input) {
    var key = input.getAttribute('data-key');
    var raw = localStorage.getItem(key);
    input.checked = (raw == null) ? defaultBool(key) : (raw === 'true');
    input.addEventListener('change', function () {
      try {
        localStorage.setItem(key, input.checked);
      } catch (err) {}
    });
  });
</script>
<script src="../js/statusbar-control.js"></script>
</body>
</html>
