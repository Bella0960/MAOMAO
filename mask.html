<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>设定管理</title>
<script src="native-feel.js"></script>
<script src="statusbar-control.js"></script>
<script src="mask.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        background-color: #E5E5E5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
        color: #111;
        user-select: none;
    }
    .phone-mockup {
        position: relative;
        width: min(390px, calc(100vw - 24px));
        height: min(844px, calc(100vh - 24px));
        background: #FFFFFF;
        border-radius: 45px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        overflow: hidden;
        border: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
    }
    .status-bar {
        position: absolute; top: 0; width: 100%;
        padding: 14px 28px; font-size: 0.875rem; font-weight: 600; z-index: 50; pointer-events: none;
    }
    .topbar {
        position: relative;
        display: flex; align-items: flex-end; gap: 14px;
        padding: calc(56px + env(safe-area-inset-top,0px)) 22px 16px;
    }
    .back-btn {
        width: 30px; height: 30px; border-radius: 50%; border: none;
        background: #F4F4F6; display: flex; align-items: center; justify-content: center;
        color: #111; text-decoration: none; flex-shrink: 0;
    }
    .back-btn:active { background: #B0B0B5; }
    .back-btn svg { width: 14px; height: 14px; }
    .topbar-title { flex: 1; font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
    .topbar-add {
        width: 30px; height: 30px; border-radius: 50%; border: none;
        background: #F4F4F6; display: flex; align-items: center; justify-content: center;
        cursor: pointer; flex-shrink: 0;
    }
    .topbar-add:active { background: #B0B0B5; }
    .topbar-add svg { width: 14px; height: 14px; }

    .stage {
        flex: 1; overflow-y: auto;
        padding: 4px 16px 24px;
        display: flex; flex-direction: column; gap: 10px;
        scrollbar-width: none;
    }
    .stage::-webkit-scrollbar { display: none; }

    .mask-row {
        background: #F8F8FA;
        border-radius: 20px;
        padding: 14px 16px;
        display: flex; align-items: center; gap: 12px;
        flex-shrink: 0;
    }
    .mask-avatar {
        width: 46px; height: 46px; border-radius: 50%;
        background: #E5E5EA; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; font-size: 18px; color: #999;
    }
    .mask-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .mask-body { flex: 1; min-width: 0; }
    .mask-name { font-size: 0.938rem; font-weight: 700; color: #111; }
    .mask-nick { font-size: 0.75rem; color: #8E8E93; margin-top: 2px; }
    .mask-check { color: #111; font-size: 18px; width: 22px; text-align: center; }
    .mask-check.off { color: #E5E5EA; }
    .mask-actions { display: flex; gap: 6px; }
    .mask-edit, .mask-del {
        width: 30px; height: 30px; border-radius: 50%; border: none;
        background: #FFFFFF; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        color: #666;
    }
    .mask-del:disabled { opacity: 0.3; cursor: default; }
    .mask-edit:active, .mask-del:active { background: #E5E5EA; }
    .mask-edit svg, .mask-del svg { width: 13px; height: 13px; }

    /* 弹层 */
    .overlay {
        position: absolute; inset: 0; z-index: 200;
        background: rgba(0,0,0,0.32);
        opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .overlay.is-show { opacity: 1; pointer-events: auto; }
    .sheet {
        position: absolute; left: 0; right: 0; bottom: 0;
        background: #FFFFFF; border-radius: 24px 24px 0 0;
        padding: 8px 18px 26px;
        transform: translateY(100%); transition: transform 0.28s ease;
        max-height: 88%; overflow-y: auto; scrollbar-width: none;
    }
    .overlay.is-show .sheet { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: #E5E5EA; margin: 6px auto 14px; }
    .sheet-title { font-size: 1rem; font-weight: 800; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .sheet-close { border: none; background: none; color: #999; cursor: pointer; font-size: 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.7rem; color: #8E8E93; font-weight: 600; margin-bottom: 6px; }
    .field input, .field textarea {
        width: 100%; padding: 10px 12px;
        background: #F2F2F7; border: none; border-radius: 10px;
        font-size: 0.875rem; color: #111; font-family: inherit; outline: none;
    }
    .field textarea { min-height: 80px; resize: none; }
    .avatar-pick {
        width: 60px; height: 60px; border-radius: 50%;
        background: #F2F2F7; display: flex; align-items: center; justify-content: center;
        cursor: pointer; overflow: hidden;
    }
    .avatar-pick img { width: 100%; height: 100%; object-fit: cover; }
    .save-btn {
        width: 100%; margin-top: 8px; height: 44px;
        background: #111; color: #FFF; border: none; border-radius: 999px;
        font-size: 0.875rem; font-weight: 600; cursor: pointer;
    }
    .save-btn:active { opacity: 0.85; }
</style>
<link rel="stylesheet" href="mobile-fit.css">
</head>
<body>
    <div class="phone-mockup">
        <div class="status-bar"><span>09:41</span></div>
        <header class="topbar">
            <a class="back-btn" href="edit-profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
            <h1 class="topbar-title">Mask</h1>
            <button class="topbar-add" id="addBtn" aria-label="新建设定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </header>
        <main class="stage" id="stage"></main>

        <div class="overlay" id="editOverlay">
            <div class="sheet">
                <div class="sheet-handle"></div>
                <div class="sheet-title"><span id="editTitle">新建设定</span><button class="sheet-close" id="editClose">✕</button></div>
                <div class="field">
                    <label>头像</label>
                    <div class="avatar-pick" id="avatarPick"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#999" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
                    <input type="file" id="avatarInput" accept="image/*" hidden>
                </div>
                <div class="field"><label>设定名称（仅自己可见）</label><input id="f-name" maxlength="20" placeholder="如：日常小桃"></div>
                <div class="field"><label>显示昵称（AI 看到的）</label><input id="f-nickname" maxlength="20" placeholder="TA 怎么称呼你"></div>
                <div class="field"><label>人设描述（告诉 AI 你是谁）</label><textarea id="f-persona" maxlength="500" placeholder="你是谁、性格、背景……"></textarea></div>
                <button class="save-btn" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

<script>
(function () {
    MaskSystem.ensureDefault();
    var stage = document.getElementById('stage');
    var overlay = document.getElementById('editOverlay');
    var editingId = null;
    var pendingAvatar = '';

    function render() {
        var masks = MaskSystem.getMasks();
        var activeId = MaskSystem.getActiveMask() ? MaskSystem.getActiveMask().id : '';
        stage.innerHTML = '';
        masks.forEach(function (m) {
            var row = document.createElement('div');
            row.className = 'mask-row';
            var isActive = String(m.id) === String(activeId);
            row.innerHTML =
                '<div class="mask-avatar">' + (m.avatar ? '<img src="' + m.avatar + '">' : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#CCC" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>') + '</div>' +
                '<div class="mask-body"><div class="mask-name">' + esc(m.name) + '</div><div class="mask-nick">' + esc(m.nickname) + '</div></div>' +
                '<div class="mask-check' + (isActive ? '' : ' off') + '">' + (isActive ? '✓' : '○') + '</div>' +
                '<div class="mask-actions">' +
                  '<button class="mask-edit" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>' +
                  '<button class="mask-del" title="删除"' + (masks.length <= 1 ? ' disabled' : '') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>' +
                '</div>';
            // 点击行切换
            row.addEventListener('click', function (e) {
                if (e.target.closest('.mask-edit') || e.target.closest('.mask-del')) return;
                if (!isActive) {
                    MaskSystem.applyMask(m.id);
                    render();
                }
            });
            row.querySelector('.mask-edit').addEventListener('click', function (e) {
                e.stopPropagation();
                openEdit(m);
            });
            row.querySelector('.mask-del').addEventListener('click', function (e) {
                e.stopPropagation();
                if (masks.length <= 1) return;
                if (confirm('删除设定「' + m.name + '」？')) {
                    MaskSystem.removeMask(m.id);
                    render();
                }
            });
            stage.appendChild(row);
        });
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
        });
    }

    function openEdit(m) {
        editingId = m ? m.id : null;
        pendingAvatar = m ? m.avatar : '';
        document.getElementById('editTitle').textContent = m ? '编辑设定' : '新建设定';
        document.getElementById('f-name').value = m ? m.name : '';
        document.getElementById('f-nickname').value = m ? m.nickname : '';
        document.getElementById('f-persona').value = m ? m.persona : '';
        renderAvatarPick();
        overlay.classList.add('is-show');
    }
    function renderAvatarPick() {
        var p = document.getElementById('avatarPick');
        p.innerHTML = pendingAvatar ? '<img src="' + pendingAvatar + '">' : '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#999" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
    }
    function closeEdit() { overlay.classList.remove('is-show'); }

    document.getElementById('addBtn').addEventListener('click', function () { openEdit(null); });
    document.getElementById('editClose').addEventListener('click', closeEdit);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeEdit(); });
    document.getElementById('avatarPick').addEventListener('click', function () {
        document.getElementById('avatarInput').click();
    });
    document.getElementById('avatarInput').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
            // 压缩
            var img = new Image();
            img.onload = function () {
                var c = document.createElement('canvas');
                var max = 200;
                var w = img.width, h = img.height;
                if (w > h) { h = h * max / w; w = max; } else { w = w * max / h; h = max; }
                c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h);
                pendingAvatar = c.toDataURL('image/jpeg', 0.7);
                renderAvatarPick();
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('saveBtn').addEventListener('click', function () {
        var name = document.getElementById('f-name').value.trim() || '未命名';
        var nickname = document.getElementById('f-nickname').value.trim() || name;
        var persona = document.getElementById('f-persona').value.trim() || '一个普通用户';
        var masks = MaskSystem.getMasks();
        if (editingId) {
            for (var i = 0; i < masks.length; i++) {
                if (String(masks[i].id) === String(editingId)) {
                    masks[i].name = name;
                    masks[i].nickname = nickname;
                    masks[i].persona = persona;
                    masks[i].avatar = pendingAvatar;
                    break;
                }
            }
        } else {
            masks.push({ id: 'mask_' + Date.now(), name: name, nickname: nickname, persona: persona, avatar: pendingAvatar });
        }
        MaskSystem.saveMasks(masks);
        // 编辑当前在用的，同步到 myProfile
        var active = MaskSystem.getActiveMask();
        if (active && String(active.id) === String(editingId || (masks[masks.length-1].id))) {
            MaskSystem.applyMask(active.id);
        }
        closeEdit();
        render();
    });

    render();
})();
</script>
</body>
</html>
