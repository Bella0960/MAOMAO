<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>聊天美化 · 小手机</title>
<script src="../js/font-loader.js"></script>
<script src="../js/native-feel.js"></script>
<link rel="stylesheet" href="../css/mobile-fit.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    background: #e5e5e5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .phone {
    width: min(390px, calc(100vw - 24px));
    height: min(844px, calc(100vh - 24px));
    background: #FFFFFF;
    border-radius: 45px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
  }
  .status-bar { padding: 14px 28px; font-size: 0.875rem; font-weight: 600; color: #000; }
  .header { display: flex; align-items: center; gap: 12px; padding: 8px 20px 16px; }
  .back-btn {
    width: 32px; height: 32px; border-radius: 50%; background: #F4F4F6;
    border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .back-btn svg { width: 16px; height: 16px; stroke: #111; }
  .title { font-size: 24px; font-weight: 800; color: #111; letter-spacing: -0.3px; }
  .content { flex: 1; overflow-y: auto; padding: 0 18px 120px; }

  /* 顶部工具条 */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 16px;
  }
  .circle-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: #F4F4F6; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .circle-btn svg { width: 16px; height: 16px; stroke: #111; }
  .circle-btn:active { background: #E5E5EA; }
  .copy-btn {
    background: #F4F4F6;
    border: none;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #111;
    cursor: pointer;
  }
  .copy-btn:active { background: #E5E5EA; }

  /* 目标选择胶囊 */
  .target-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    padding: 8px 14px; border-radius: 999px; background: #F4F4F6;
    font-size: 0.75rem; color: #666; cursor: pointer;
    border: 1.5px solid transparent; transition: all 0.15s;
  }
  .pill.on { background: #111; color: #fff; }

  .preset-list { display: flex; flex-direction: column; gap: 10px; }
  .preset-item {
    background: #F8F8FA;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.15s;
  }
  .preset-item.active { border-color: #111; background: #fff; }
  .preset-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #E5E5EA; flex-shrink: 0;
  }
  .preset-item.active .preset-dot { background: #111; }
  .preset-info { flex: 1; min-width: 0; }
  .preset-name { font-size: 0.938rem; font-weight: 600; color: #111; }
  .preset-meta { font-size: 0.625rem; color: #B0B0B5; margin-top: 3px; }
  .preset-del {
    width: 28px; height: 28px; border-radius: 50%; background: transparent;
    border: none; color: #C7C7CC; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .preset-del:active { color: #FF3B30; }
  .empty { text-align: center; padding: 60px 20px; color: #C7C7CC; font-size: 0.875rem; line-height: 1.6; }

  .edit-view { display: none; }
  .edit-view.show { display: block; }
  .list-view.hide { display: none; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.75rem; color: #999; margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; background: #F8F8FA; border: none; border-radius: 12px;
    padding: 12px 14px; font-size: 0.875rem; color: #111; font-family: inherit; outline: none;
    appearance: none; -webkit-appearance: none;
  }
  .field textarea { min-height: 200px; font-family: "SF Mono", Menlo, monospace; font-size: 0.75rem; line-height: 1.6; resize: none; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .footer {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(20px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, #fff 60%, rgba(255,255,255,0));
    display: flex; gap: 10px;
  }
  .btn { flex: 1; height: 46px; border: none; border-radius: 999px; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #111; color: #fff; }
  .btn-secondary { background: #F4F4F6; color: #111; }
  .toast {
    position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%);
    background: rgba(17,17,17,0.88); color: #fff; font-size: 0.813rem;
    padding: 10px 18px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
  }
  .toast.show { opacity: 1; }

  /* MAOMAO Editorial Beauty — refinement */
.field-hint{margin-top:8px;color:#858585;font-size:11px;line-height:1.7;letter-spacing:.01em;max-width:34em}
.copy-btn{white-space:nowrap}
  body{background:#e9e9e9;color:#151515}
  .phone{border-radius:30px;box-shadow:0 18px 60px rgba(0,0,0,.10);border:1px solid #d6d6d6;position:relative}
  .status-bar{font-size:11px;letter-spacing:.12em;font-weight:500;padding:17px 25px 12px}
  .header{align-items:flex-start;gap:13px;padding:7px 22px 20px;border-bottom:1px solid #e8e8e8}
  .back-btn{background:transparent;border-radius:0;width:25px;height:32px;border-right:1px solid #dedede;padding-right:10px;flex:0 0 25px}
  .title{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:30px;letter-spacing:-.055em;line-height:1}
  .title:after{content:"INTERFACE CUSTOMIZATION";display:block;font-family:Arial,sans-serif;font-size:8px;letter-spacing:.19em;color:#888;margin-top:9px;font-weight:500}
  .content{padding:18px 22px 125px}
  .toolbar{justify-content:space-between;gap:14px;margin-bottom:23px;border-bottom:1px solid #dedede;padding-bottom:13px}
  .circle-btn{background:transparent;border-radius:0;width:30px;height:28px;border-bottom:1px solid #222}
  .circle-btn:active,.copy-btn:active{background:transparent;color:#777}
  .copy-btn{background:transparent;border-radius:0;padding:8px 0;border-bottom:1px solid #222;font-family:Georgia,serif;font-style:italic;font-size:14px;font-weight:400}
  .preset-list{gap:0}
  .preset-item{position:relative;background:transparent;border:0;border-top:1px solid #dedede;border-radius:0;padding:17px 4px 17px 2px;gap:13px;transition:padding .2s ease}
  .preset-item:last-child{border-bottom:1px solid #dedede}
  .preset-item.active{background:transparent;border-color:#bdbdbd;padding-left:9px}
  .preset-item.active:before{content:"";position:absolute;left:0;top:19px;bottom:19px;width:2px;background:#111}
  .preset-dot{width:4px;height:4px;border-radius:0;background:#bdbdbd;transform:rotate(45deg)}
  .preset-item.active .preset-dot{background:#111}
  .preset-name{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:400;letter-spacing:-.02em}
  .preset-meta{font-family:Arial,sans-serif;font-size:9px;letter-spacing:.09em;color:#898989;margin-top:6px;text-transform:uppercase}
  .preset-del{border-radius:0;width:28px;height:28px;font-size:20px;color:#999}
  .empty{padding:52px 8px;text-align:left;font-family:Georgia,serif;font-size:19px;line-height:1.7;color:#555}
  .empty:before{content:"NO PRESETS / 00";display:block;font:9px Arial,sans-serif;letter-spacing:.17em;color:#999;margin-bottom:12px}
  .field{margin-bottom:23px}
  .field label{font-size:9px;letter-spacing:.16em;color:#777;margin-bottom:9px;text-transform:uppercase}
  .field input,.field textarea,.field select{background:#f7f7f7;border:0;border-bottom:1px solid #cfcfcf;border-radius:0;padding:13px 10px;font-size:13px}
  .field input:focus,.field textarea:focus,.field select:focus{border-bottom-color:#111;box-shadow:0 1px 0 #111}
  .field textarea{min-height:235px;border:1px solid #dedede;line-height:1.75;font-size:11px}
  .target-pills{gap:0 15px;border-bottom:1px solid #dedede}
  .pill{background:transparent;border:0;border-radius:0;padding:9px 0 10px;font-size:11px;color:#888;position:relative}
  .pill.on{background:transparent;color:#111}
  .pill.on:after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:#111}
  .footer{position:absolute;background:linear-gradient(to top,#fff 76%,rgba(255,255,255,0));padding:20px 23px calc(21px + env(safe-area-inset-bottom));gap:24px;align-items:center}
  .btn{flex:0 0 auto;height:auto;min-height:34px;border-radius:0;font-family:Georgia,"Times New Roman",serif;font-size:15px;font-style:italic;font-weight:400;background:transparent;color:#111;position:relative;padding:4px 0 8px}
  .btn:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:currentColor;transition:transform .22s ease;transform-origin:left}
  .btn:active{background:transparent;opacity:.55}
  .btn-primary,.btn-secondary{background:transparent;color:#111}
  .toast{border-radius:0;background:#171717;padding:10px 16px;font-size:11px;letter-spacing:.04em}
  @media(max-width:420px){.phone{width:100vw;height:100dvh;border-radius:0;border:0}body{background:#fff}}

</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>4:41</span></div>
  <div class="header">
    <button class="back-btn" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="title">聊天美化</div>
  </div>
  <div class="content">
    <div class="list-view" id="listView">
      <div class="toolbar">
        <button class="circle-btn" onclick="document.getElementById('importFile').click()" title="导入CSS文件">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button class="copy-btn" onclick="copyRef()">复制当前 CSS</button>
      </div>
      <input type="file" id="importFile" accept=".css,.txt" style="display:none;">
      <div class="preset-list" id="presetList"></div>
    </div>
    <div class="edit-view" id="editView">
      <div class="field">
        <label>名字</label>
        <input type="text" id="presetName" placeholder="给这个美化起个名" maxlength="20">
      </div>
      <div class="field">
        <label>用在哪</label>
        <div class="target-pills" id="targetPills">
          <div class="pill on" data-target="all">聊天全局</div>
        </div>
      </div>
      <div class="field">
        <label>CSS</label>
        <textarea id="presetCss" placeholder=".chat-slim-card { border-radius: 10px; }"></textarea>\n        <div class="field-hint">聊天全局会同时作用于聊天列表和聊天详情；角色专属只作用于该角色的聊天详情。点击正在使用的预设可停用。保存前会检查括号、引号和空内容。</div>
      </div>
    </div>
  </div>
  <div class="footer">
    <button class="btn btn-secondary" id="btnLeft" onclick="leftAction()">新建</button>
    <button class="btn btn-primary" id="btnRight" onclick="savePreset()">保存</button>
  </div>
  <div class="toast" id="toast">已保存</div>
</div>
<script>
var LIST_KEY = 'beauty_presets';
var ACTIVE_KEY = 'beauty_active';
var editingIndex = -1;

function getPresets(){
  try {
    var value = JSON.parse(localStorage.getItem(LIST_KEY) || '[]');
    return Array.isArray(value) ? value.filter(function(p){ return p && typeof p === 'object'; }) : [];
  } catch(e){ return []; }
}
function setPresets(p){ localStorage.setItem(LIST_KEY, JSON.stringify(p)); }
function getActive(){ try { var a = JSON.parse(localStorage.getItem(ACTIVE_KEY)||'{}'); return a && typeof a === 'object' && !Array.isArray(a) ? a : {}; } catch(e){ return {}; } }
function setActive(o){ localStorage.setItem(ACTIVE_KEY, JSON.stringify(o)); }

function loadRoleOptions(){
  var box = document.getElementById('targetPills');
  var roles = [];
  try { roles = JSON.parse(localStorage.getItem('ai_custom_characters')||'[]'); } catch(e){}
  if (!Array.isArray(roles)) roles = [];
  roles.forEach(function(r){
    var p = document.createElement('div');
    p.className = 'pill';
    p.dataset.target = r.id;
    p.textContent = r.name;
    box.appendChild(p);
  });
  // 胶囊点击
  box.addEventListener('click', function(e){
    var pill = e.target.closest('.pill');
    if (!pill) return;
    box.querySelectorAll('.pill').forEach(function(x){ x.classList.remove('on'); });
    pill.classList.add('on');
  });
}
function getCurrentTarget(){
  var on = document.querySelector('#targetPills .pill.on');
  return on ? on.dataset.target : 'all';
}
function setCurrentTarget(t){
  document.querySelectorAll('#targetPills .pill').forEach(function(x){
    x.classList.toggle('on', x.dataset.target === t);
  });
}

function targetLabel(t){
  if (t === 'all') return '聊天全局';
  try {
    var roles = JSON.parse(localStorage.getItem('ai_custom_characters') || '[]');
    var r = Array.isArray(roles) && roles.find(function(x){ return x.id === t; });
    return r ? r.name : '角色已不存在';
  } catch(e){ return '角色已不存在'; }
}

function renderList(){
  var list = getPresets();
  var active = getActive();
  var box = document.getElementById('presetList');
  if (!list.length) {
    box.innerHTML = '<div class="empty">还没有美化预设<br>点下面"新建"开始</div>';
    return;
  }
  box.innerHTML = list.map(function(p, i){
    var isActive = (active[p.target] === p.name);
    return '<div class="preset-item '+(isActive?'active':'')+'" onclick="usePreset('+i+')">'+
      '<div class="preset-dot"></div>'+
      '<div class="preset-info">'+
        '<div class="preset-name">'+esc(p.name)+'</div>'+
        '<div class="preset-meta">'+targetLabel(p.target)+(isActive?' · 使用中':'')+'</div>'+
      '</div>'+
      '<button class="preset-del" onclick="delPreset(event,'+i+')">×</button>'+
    '</div>';
  }).join('');
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function usePreset(i){
  var list = getPresets();
  var p = list[i];
  if (!p) return;
  var active = getActive();
  if (active[p.target] === p.name) {
    delete active[p.target];
    setActive(active);
    showToast('已停用这个美化预设');
  } else {
    active[p.target] = p.name;
    setActive(active);
    showToast('已启用 · 聊天列表与聊天页面下次打开时生效');
  }
  renderList();
}
function delPreset(e, i){
  e.stopPropagation();
  var list = getPresets();
  var p = list[i];
  if (p && p.target === 'all' && p.name === '微信清爽版') localStorage.setItem('beauty_wechat_preset_dismissed', '1');
  list.splice(i,1);
  setPresets(list);
  var active = getActive();
  if (active[p.target] === p.name) delete active[p.target];
  setActive(active);
  renderList();
}

function showEdit(idx){
  editingIndex = idx;
  document.getElementById('listView').classList.add('hide');
  document.getElementById('editView').classList.add('show');
  document.getElementById('btnLeft').textContent = '取消';
  if (idx >= 0) {
    var list = getPresets();
    document.getElementById('presetName').value = list[idx].name;
    setCurrentTarget(list[idx].target);
    document.getElementById('presetCss').value = list[idx].css;
  } else {
    document.getElementById('presetName').value = '';
    document.getElementById('presetCss').value = '';
    setCurrentTarget('all');
  }
}
function showList(){
  editingIndex = -1;
  document.getElementById('listView').classList.remove('hide');
  document.getElementById('editView').classList.remove('show');
  document.getElementById('btnLeft').textContent = '新建';
  renderList();
}
function leftAction(){
  if (document.getElementById('editView').classList.contains('show')) showList();
  else showEdit(-1);
}
function goBack(){
  if (document.getElementById('editView').classList.contains('show')) showList();
  else history.back();
}
function validatePresetCSS(css){
  if (!css || !css.trim()) return 'CSS 内容是空的，先粘贴或导入样式。';
  var stack = [], quote = '', escaped = false, comment = false;
  for (var i = 0; i < css.length; i++) {
    var ch = css[i], next = css[i + 1];
    if (comment) {
      if (ch === '*' && next === '/') { comment = false; i++; }
      continue;
    }
    if (quote) {
      if (escaped) { escaped = false; continue; }
      if (ch === '\\') { escaped = true; continue; }
      if (ch === quote) quote = '';
      continue;
    }
    if (ch === '/' && next === '*') { comment = true; i++; continue; }
    if (ch === '"' || ch === "'") { quote = ch; continue; }
    if (ch === '{' || ch === '(' || ch === '[') stack.push({ch:ch, index:i});
    if (ch === '}' || ch === ')' || ch === ']') {
      var top = stack.pop();
      var expected = ch === '}' ? '{' : ch === ')' ? '(' : '[';
      if (!top || top.ch !== expected) return 'CSS 括号不匹配，请检查第 ' + (i + 1) + ' 个字符附近。';
    }
  }
  if (comment) return 'CSS 注释没有结束，请补上 */。';
  if (quote) return 'CSS 字符串没有闭合，请检查引号。';
  if (stack.length) return 'CSS 括号没有闭合，请检查第 ' + (stack[stack.length - 1].index + 1) + ' 个字符附近。';
  return '';
}
function savePreset(){
  var name = document.getElementById('presetName').value.trim();
  var css = document.getElementById('presetCss').value;
  var target = getCurrentTarget();
  if (!name) { showToast('请先填写预设名称'); return; }
  var cssError = validatePresetCSS(css);
  if (cssError) { showToast(cssError); return; }

  var list = getPresets();
  var previous = editingIndex >= 0 ? list[editingIndex] : null;
  var duplicate = list.some(function(p, index){
    return index !== editingIndex && p.target === target && p.name.trim() === name;
  });
  if (duplicate) { showToast('这个作用范围里已有同名预设，请换个名字'); return; }

  if (editingIndex >= 0 && !previous) { showToast('预设不存在，已取消保存'); showList(); return; }
  if (editingIndex >= 0) list[editingIndex] = { name: name, css: css, target: target };
  else list.push({ name: name, css: css, target: target });
  setPresets(list);

  // 仅当原预设已启用时才同步改名；改作用范围则解除旧范围启用状态。
  var active = getActive();
  if (previous && active[previous.target] === previous.name) {
    if (previous.target === target) active[target] = name;
    else delete active[previous.target];
    setActive(active);
  }
  showToast('已保存预设 · 保存不会自动启用');
  setTimeout(function(){ showList(); }, 350);
}

function copyRef(){
  var list = getPresets();
  var active = getActive();
  var current = list.find(function(p){ return p && p.target === 'all' && p.name === active.all; });
  if (!current) current = list.find(function(p){ return p && p.target === 'all' && p.name === '微信清爽版'; });
  if (!current || typeof current.css !== 'string' || !current.css.trim()) {
    showToast('当前没有可复制的 CSS');
    return;
  }
  var text = current.css;
  function copied(){ showToast('已复制当前 CSS'); }
  function fallbackCopy(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); copied(); }
    catch(e) { showToast('复制失败，请进入编辑页手动复制'); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(copied).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1500);
}

function ensureWechatPreset(){
  var list = getPresets();
  var name = '微信清爽版';
  var existing = list.find(function(p){ return p && p.target === 'all' && p.name === name; });
  var dismissed = localStorage.getItem('beauty_wechat_preset_dismissed') === '1';
  if (existing && existing.builtIn === true && Number(existing.version || 1) < 2) {

// 导入 CSS 文件：读取内容 → 跳到新建编辑页自动填好
document.getElementById('importFile').addEventListener('change', function(e){
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    showEdit(-1);
    document.getElementById('presetCss').value = ev.target.result;
    document.getElementById('presetName').value = file.name.replace(/\.(css|txt)$/,'');
    showToast('已导入，起个名字保存');
  };
  reader.readAsText(file);
  e.target.value = '';
});
