<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发表动态</title>
    <script src="font-loader.js"></script>
    <script src="native-feel.js"></script>
    <script src="js/phone/phone_storage.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            color: #111;
        }

        /* 手机外壳（桌面预览时显示） */
        .phone-mockup {
            position: relative;
            width: min(390px, calc(100vw - 24px));
            height: min(844px, calc(100vh - 24px));
            min-height: 0;
            background-color: #F7F7F9;
            border-radius: 45px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 8px solid #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* 真机（≤480px）时外壳会被 mobile-fit.css 自动解除，全屏铺满 */

        /* ===== 顶部导航栏 ===== */
        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #FFFFFF;
            border-bottom: 1px solid #E5E5EA;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
        }
        .nav-btn {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 0.938rem;
            color: #333;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .nav-btn:active { background: #F2F2F7; }
        .nav-btn.publish {
            background: #1C1C1E;
            color: #FFFFFF;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.813rem;
        }
        .nav-btn.publish:disabled {
            background: #C7C7CC;
            cursor: default;
        }

        /* ===== 主滚动区 ===== */
        .main-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 40px;
        }

        /* ===== 文本输入区 ===== */
        .text-area {
            width: 100%;
            min-height: 180px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            line-height: 1.6;
            color: #111;
            font-family: inherit;
            resize: none;
            padding: 4px 0;
        }
        .text-area::placeholder { color: #B0B0B5; }
        .char-count {
            text-align: right;
            font-size: 0.688rem;
            color: #B0B0B5;
            margin-top: 4px;
        }

        /* ===== 图片九宫格 ===== */
        .image-grid {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .grid-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            overflow: hidden;
            background: #E5E5EA;
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .grid-item .img-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            z-index: 2;
        }
        .grid-item .img-remove svg {
            width: 12px;
            height: 12px;
            stroke: #fff;
            stroke-width: 2.5;
            fill: none;
        }
        .grid-add {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            border: 1px dashed #D1D1D6;
            background: #FFFFFF;
            color: #B0B0B5;
            font-size: 0.688rem;
        }
        .grid-add svg {
            width: 24px;
            height: 24px;
            stroke: #B0B0B5;
            fill: none;
            stroke-width: 1.5;
        }

        /* ===== 设置组 ===== */
        .setting-group {
            margin-top: 20px;
            background: #FFFFFF;
            border-radius: 12px;
            overflow: hidden;
        }
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #F2F2F7;
            cursor: pointer;
        }
        .setting-row:last-child { border-bottom: none; }
        .setting-row:active { background: #F7F7F9; }
        .setting-label {
            font-size: 0.875rem;
            color: #111;
        }
        .setting-value {
            font-size: 0.813rem;
            color: #999;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .setting-value svg {
            width: 14px;
            height: 14px;
            stroke: #C7C7CC;
            fill: none;
            stroke-width: 2;
        }

        /* ===== 弹出的选项列表（不是抽屉！是页面级 sheet） ===== */
        .option-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            top: auto;
            z-index: 200;
            background: #FFFFFF;
            border-radius: 16px 16px 0 0;
            transform: translateY(100%);
            transition: transform 0.25s ease;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }
        .option-sheet.show { transform: translateY(0); }
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 199;
            display: none;
        }
        .sheet-backdrop.show { display: block; }

        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #F2F2F7;
            flex-shrink: 0;
        }
        .sheet-title {
            font-size: 0.938rem;
            font-weight: 600;
            color: #111;
        }
        .sheet-close {
            background: none;
            border: none;
            font-size: 0.875rem;
            color: #999;
            cursor: pointer;
            padding: 4px 8px;
        }
        .sheet-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            cursor: pointer;
            font-size: 0.875rem;
            color: #111;
        }
        .option-item:active { background: #F7F7F9; }
        .option-item.active .check-icon {
            stroke: #1C1C1E;
            opacity: 1;
        }
        .check-icon {
            width: 18px;
            height: 18px;
            stroke: #1C1C1E;
            fill: none;
            stroke-width: 2.5;
            opacity: 0;
        }
        .mention-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            cursor: pointer;
        }
        .mention-option:active { background: #F7F7F9; }
        .mention-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            overflow: hidden;
            background: #E5E5EA;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mention-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .mention-avatar svg { width: 18px; height: 18px; }
        .mention-name {
            flex: 1;
            font-size: 0.875rem;
            color: #111;
        }
        .mention-option .check-icon { opacity: 0.3; }
        .mention-option.active .check-icon { opacity: 1; }

        .empty-hint {
            text-align: center;
            padding: 30px 16px;
            color: #B0B0B5;
            font-size: 0.813rem;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(28,28,30,0.9);
            color: #fff;
            font-size: 0.813rem;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .toast.show { opacity: 1; }
    </style>
<link rel="stylesheet" href="mobile-fit.css">
</head>
<body>
<div class="phone-mockup">

    <!-- 顶部导航栏 -->
    <div class="nav-bar">
        <button class="nav-btn" id="btnCancel" type="button">取消</button>
        <button class="nav-btn publish" id="btnPublish" type="button">发表</button>
    </div>

    <!-- 主滚动区 -->
    <div class="main-scroll">
        <!-- 文本输入 -->
        <textarea class="text-area" id="contentInput" maxlength="500" placeholder="这一刻的想法…"></textarea>
        <div class="char-count"><span id="charNum">0</span>/500</div>

        <!-- 图片九宫格 -->
        <div class="image-grid" id="imageGrid"></div>

        <!-- 设置组 -->
        <div class="setting-group">
            <div class="setting-row" id="rowVisibility">
                <span class="setting-label">可见范围</span>
                <span class="setting-value">
                    <span id="permValue">公开</span>
                    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                </span>
            </div>
            <div class="setting-row" id="rowMentions">
                <span class="setting-label">提醒谁看</span>
                <span class="setting-value">
                    <span id="mentionValue">不提醒</span>
                    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                </span>
            </div>
        </div>
    </div>

    <!-- 可见范围 sheet -->
    <div class="sheet-backdrop" id="permBackdrop"></div>
    <div class="option-sheet" id="permSheet">
        <div class="sheet-header">
            <span class="sheet-title">可见范围</span>
            <button class="sheet-close" id="permClose" type="button">关闭</button>
        </div>
        <div class="sheet-body" id="permBody"></div>
    </div>

    <!-- @好友 sheet -->
    <div class="sheet-backdrop" id="mentionBackdrop"></div>
    <div class="option-sheet" id="mentionSheet">
        <div class="sheet-header">
            <span class="sheet-title">提醒谁看</span>
            <button class="sheet-close" id="mentionClose" type="button">完成</button>
        </div>
        <div class="sheet-body" id="mentionBody"></div>
    </div>

</div><!-- /.phone-mockup -->

    <input type="file" id="imageInput" accept="image/*" multiple style="display:none;">
    <div class="toast" id="toast"></div>

    <script src="statusbar-control.js"></script>
    <script>
        /* ========== 状态 ========== */
        var pendingImages = [];     // 图片 dataURL 数组（最多 9 张）
        var currentPerm = 'public';
        var mentionsList = [];

        /* ========== 工具函数 ========== */
        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        var _storage = window.PhoneStorage;

        function getCharacterList() {
            return _storage ? _storage.getCharacters() : (function(){ try { var raw = localStorage.getItem('ai_custom_characters'); if (raw) { var arr = JSON.parse(raw); if (Array.isArray(arr)) return arr; } } catch(e) {} return []; })();
        }

        function getMyInfo() {
            if (_storage) { var p = _storage.getMyProfile(); if (p) return { id: p.id || 'me', name: p.nickname || '我', avatar: p.avatar || '' }; }
            try {
                var raw = localStorage.getItem('myProfile');
                if (raw) { var p = JSON.parse(raw) || {}; return { id: p.id || 'me', name: p.nickname || '我', avatar: p.avatar || '' }; }
            } catch (e) {}
            return { id: 'me', name: '我', avatar: '' };
        }

        function getApiConfig() {
            return _storage ? _storage.getApiConfig() : (function(){ try { var raw = localStorage.getItem('api_settings'); if (raw) { var parsed = JSON.parse(raw); if (parsed) return parsed; } } catch(e) {} return {}; })();
        }

        function logApiCall(model, status, startTime, errorMsg) {
            if (_storage) { _storage.pushApiLog({ model: model || 'unknown', status: status, errorMsg: (status === 'error' && errorMsg) ? String(errorMsg).slice(0, 200) : '' }); return; }
            try {
                var logs = JSON.parse(localStorage.getItem('api_call_logs') || '[]');
                var entry = { id: Date.now().toString(36), time: Date.now(), model: model || 'unknown', status: status, duration: Date.now() - startTime, errorMsg: (status === 'error' && errorMsg) ? String(errorMsg).slice(0, 200) : '' };
                logs.unshift(entry);
                while (logs.length > 50) logs.pop();
                localStorage.setItem('api_call_logs', JSON.stringify(logs));
            } catch (e) {}
        }

        function showToast(text) {
            var el = document.getElementById('toast');
            el.textContent = text;
            el.classList.add('show');
            setTimeout(function () { el.classList.remove('show'); }, 1500);
        }

        function pushNotification(n) {
            if (_storage) { _storage.pushMomentsNotification(n); return; }
            try { var arr = JSON.parse(localStorage.getItem('moments_notifications') || '[]'); arr.unshift(n); while (arr.length > 100) arr.pop(); localStorage.setItem('moments_notifications', JSON.stringify(arr)); } catch (e) {}
        }

        /* ========== Canvas 压缩 ========== */
        function compressImage(file, cb) {
            var reader = new FileReader();
            reader.onload = function (ev) {
                var img = new Image();
                img.onload = function () {
                    try {
                        var maxW = 600;
                        var scale = Math.min(1, maxW / img.width);
                        var canvas = document.createElement('canvas');
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        cb(canvas.toDataURL('image/jpeg', 0.7));
                    } catch (err) { alert('图片处理失败'); cb(''); }
                };
                img.onerror = function () { alert('图片读取失败'); cb(''); };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        /* ========== 图片九宫格渲染 ========== */
        var imageGrid = document.getElementById('imageGrid');

        function renderGrid() {
            var html = '';
            for (var i = 0; i < pendingImages.length; i++) {
                html += '<div class="grid-item">' +
                    '<img src="' + pendingImages[i] + '" alt="">' +
                    '<button class="img-remove" data-idx="' + i + '" type="button" aria-label="删除">' +
                        '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
                    '</button>' +
                '</div>';
            }
            if (pendingImages.length < 9) {
                html += '<div class="grid-item grid-add" id="gridAdd">' +
                    '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
                    '<span>添加图片</span>' +
                '</div>';
            }
            imageGrid.innerHTML = html;

            // 绑定删除
            var removes = imageGrid.querySelectorAll('.img-remove');
            removes.forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var idx = parseInt(btn.getAttribute('data-idx'), 10);
                    pendingImages.splice(idx, 1);
                    renderGrid();
                });
            });
            // 绑定添加
            var addBtn = document.getElementById('gridAdd');
            if (addBtn) {
                addBtn.addEventListener('click', function () {
                    document.getElementById('imageInput').click();
                });
            }
        }

        document.getElementById('imageInput').addEventListener('change', function (e) {
            var files = Array.from(e.target.files || []);
            if (!files.length) return;
            files.forEach(function (file) {
                if (pendingImages.length >= 9) return;
                compressImage(file, function (dataUrl) {
                    if (!dataUrl) return;
                    pendingImages.push(dataUrl);
                    renderGrid();
                });
            });
            e.target.value = '';
        });

        /* ========== 文本字数 ========== */
        var contentInput = document.getElementById('contentInput');
        var charNum = document.getElementById('charNum');
        contentInput.addEventListener('input', function () {
            charNum.textContent = contentInput.value.length;
        });

        /* ========== 可见范围 sheet ========== */
        var PERM_OPTIONS = [
            { key: 'public',   label: '公开' },
            { key: 'friends',  label: '好友可见' },
            { key: 'private',  label: '仅自己可见' },
            { key: 'custom',   label: '选部分好友可见' }
        ];

        var permSheet = document.getElementById('permSheet');
        var permBackdrop = document.getElementById('permBackdrop');

        function openPermSheet() {
            var body = document.getElementById('permBody');
            body.innerHTML = PERM_OPTIONS.map(function (o) {
                var active = o.key === currentPerm ? ' active' : '';
                return '<div class="option-item' + active + '" data-perm="' + o.key + '">' +
                    '<span>' + o.label + '</span>' +
                    '<svg class="check-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' +
                '</div>';
            }).join('');
            permBackdrop.classList.add('show');
            permSheet.classList.add('show');
        }
        function closePermSheet() {
            permBackdrop.classList.remove('show');
            permSheet.classList.remove('show');
        }

        document.getElementById('rowVisibility').addEventListener('click', openPermSheet);
        document.getElementById('permClose').addEventListener('click', closePermSheet);
        permBackdrop.addEventListener('click', closePermSheet);
        document.getElementById('permBody').addEventListener('click', function (e) {
            var item = e.target.closest('.option-item');
            if (!item) return;
            currentPerm = item.getAttribute('data-perm');
            var label = PERM_OPTIONS.find(function (o) { return o.key === currentPerm; });
            document.getElementById('permValue').textContent = label ? label.label : '公开';
            closePermSheet();
        });

        /* ========== @好友 sheet ========== */
        var mentionSheet = document.getElementById('mentionSheet');
        var mentionBackdrop = document.getElementById('mentionBackdrop');

        function openMentionSheet() {
            var characters = getCharacterList();
            var body = document.getElementById('mentionBody');
            if (!characters.length) {
                body.innerHTML = '<div class="empty-hint">还没有 AI 角色，快去联系人里添加吧</div>';
            } else {
                body.innerHTML = characters.map(function (c) {
                    var active = mentionsList.indexOf(String(c.id)) !== -1 ? ' active' : '';
                    var avatarImg = c.avatar
                        ? '<img src="' + c.avatar + '" alt="">'
                        : '<svg viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
                    return '<div class="mention-option' + active + '" data-cid="' + escapeHtml(String(c.id)) + '">' +
                        '<div class="mention-avatar">' + avatarImg + '</div>' +
                        '<span class="mention-name">@' + escapeHtml(c.name || '') + '</span>' +
                        '<svg class="check-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' +
                    '</div>';
                }).join('');
            }
            mentionBackdrop.classList.add('show');
            mentionSheet.classList.add('show');
        }
        function closeMentionSheet() {
            mentionBackdrop.classList.remove('show');
            mentionSheet.classList.remove('show');
            updateMentionValue();
        }
        function updateMentionValue() {
            var characters = getCharacterList();
            if (!mentionsList.length) {
                document.getElementById('mentionValue').textContent = '不提醒';
                return;
            }
            var names = [];
            mentionsList.forEach(function (mid) {
                for (var i = 0; i < characters.length; i++) {
                    if (String(characters[i].id) === String(mid)) { names.push(characters[i].name); break; }
                }
            });
            var label = names.length > 2 ? names.slice(0, 2).join('、') + ' 等' : names.join('、');
            document.getElementById('mentionValue').textContent = label;
        }

        document.getElementById('rowMentions').addEventListener('click', openMentionSheet);
        document.getElementById('mentionClose').addEventListener('click', closeMentionSheet);
        mentionBackdrop.addEventListener('click', closeMentionSheet);
        document.getElementById('mentionBody').addEventListener('click', function (e) {
            var opt = e.target.closest('.mention-option');
            if (!opt) return;
            var cid = opt.getAttribute('data-cid');
            var idx = mentionsList.indexOf(cid);
            if (idx !== -1) mentionsList.splice(idx, 1); else mentionsList.push(cid);
            openMentionSheet(); // 重新渲染
        });

        /* ========== 取消 ========== */
        document.getElementById('btnCancel').addEventListener('click', function () {
            history.back();
        });

        /* ========== 发表 ========== */
        document.getElementById('btnPublish').addEventListener('click', function () {
            var text = contentInput.value.trim();
            if (!text && !pendingImages.length) {
                showToast('说点什么或选张图片吧');
                return;
            }

            var me = getMyInfo();
            var myId = me.id;
            var post = {
                id: 'm_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                authorId: myId,
                author: me.name || '我',
                avatar: me.avatar || '',
                content: text,
                image: pendingImages[0] || '',  // 多图先只存第一张（后续可扩展多图数组）
                images: pendingImages.slice(),  // 多图数组
                time: Date.now(),
                likes: 0,
                liked: false,
                comments: 0,
                commentList: [],
                visibility: currentPerm,
                visibleTo: [],
                mentions: mentionsList.slice()
            };
            if (currentPerm === 'custom') {
                post.visibleTo = mentionsList.slice(); // 选部分好友时 visibleTo 同 mentions
            }

            // 存
            var list = _storage ? _storage.getMoments() : (function(){ try { return JSON.parse(localStorage.getItem('moments') || '[]'); } catch (e) { return []; } })();
            list.unshift(post);
            try {
                if (_storage) { _storage.saveMoments(list); }
                else { localStorage.setItem('moments', JSON.stringify(list)); }
            } catch (err) {
                alert('存储空间不足，请压缩图片');
                return;
            }

            // 通知
            pushNotification({
                type: 'new_post',
                actorId: myId,
                actorName: me.name || '我',
                actorAvatar: me.avatar || '',
                postId: post.id,
                postContent: text || '[图片动态]',
                text: '发布了一条新动态',
                time: Date.now()
            });

            showToast('发表成功');
            setTimeout(function () {
                // 如果有 @好友，触发 AI 回复
                if (post.mentions && post.mentions.length) {
                    triggerMentionsReply(post);
                }
                location.href = 'moments.html';
            }, 500);
        });

        /* ========== @好友触发 AI 回复 ========== */
        function triggerMentionsReply(post) {
            var characters = getCharacterList();
            if (!characters.length) return;
            var config = getApiConfig();
            var apiKey = (config.apiKey || '').trim();
            if (!apiKey) return;

            var baseUrl = (config.baseUrl || 'https://api.openai.com/v1').trim().replace(/\/+$/, '');
            var model = (config.model || 'gpt-3.5-turbo').trim();
            var content = post.content || '[图片动态]';

            post.mentions.forEach(function (cid) {
                var role = null;
                for (var i = 0; i < characters.length; i++) {
                    if (String(characters[i].id) === String(cid)) { role = characters[i]; break; }
                }
                if (!role) return;

                var persona = (role.persona || role.prompt || '一个善解人意的AI角色').trim();
                var tone = (role.tone || '').trim();
                var systemPrompt = '你是' + (role.name || '一个角色') + '。角色设定：' + persona +
                    (tone ? '。说话语气：' + tone : '') +
                    '。现在有人在社交空间动态里 @ 了你，你需要以第一人称在那条动态下面评论回复。';
                var userPrompt = '动态内容：' + content +
                    '\n请写一条你对这条动态的评论回复，口语化、自然真实，20~50 字。' +
                    '只输出评论正文本身，不要加引号或解释。';

                var start = Date.now();
                var controller = new AbortController();
                var timeoutId = setTimeout(function () { controller.abort(); }, 15000);

                fetch(baseUrl + '/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    signal: controller.signal,
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ],
                        temperature: config.temperature != null ? config.temperature : 0.8,
                        stream: false
                    })
                }).then(function (response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                }).then(function (data) {
                    var text = (((data || {}).choices || [])[0] || {}).message
                        ? data.choices[0].message.content : '';
                    text = String(text || '').replace(/^["""]+|["""]+$/g, '').replace(/^评论[:：]\s*/, '').trim();
                    if (!text) throw new Error('返回为空');
                    if (text.length > 120) text = text.slice(0, 120);

                    var list = _storage ? _storage.getMoments() : (function(){ try { return JSON.parse(localStorage.getItem('moments') || '[]'); } catch (e) { return []; } })();
                    var target = null;
                    for (var j = 0; j < list.length; j++) {
                        if (String(list[j].id) === String(post.id)) { target = list[j]; break; }
                    }
                    if (!target) return;
                    if (!Array.isArray(target.commentList)) target.commentList = [];
                    if (!Array.isArray(target.comments)) target.comments = [];
                    var entry = {
                        name: role.name || '匿名',
                        author: role.name || '匿名',
                        avatar: role.avatar || '',
                        text: text,
                        time: Date.now(),
                        timestamp: Date.now(),
                        byAI: true
                    };
                    target.commentList.push(entry);
                    target.comments.push(entry);
                    try { if (_storage) { _storage.saveMoments(list); } else { localStorage.setItem('moments', JSON.stringify(list)); } } catch (e) {}

                    pushNotification({
                        type: 'mention_reply',
                        actorId: String(role.id || ''),
                        actorName: role.name || 'AI角色',
                        actorAvatar: role.avatar || '',
                        postId: post.id,
                        postContent: content,
                        text: '回复了你的动态：' + text.slice(0, 40),
                        time: Date.now()
                    });

                    logApiCall(model, 'success', start);
                }).catch(function (err) {
                    logApiCall(model, 'error', start, (err && err.message) ? err.message : '');
                }).finally(function () {
                    clearTimeout(timeoutId);
                });
            });
        }

        /* ========== 初始化 ========== */
        renderGrid();
        updateMentionValue();
    </script>
</body>
</html>
