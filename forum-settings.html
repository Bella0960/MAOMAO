<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>论坛设置</title>
<script src="font-loader.js"></script>
<script src="native-feel.js"></script>
<link rel="stylesheet" href="mobile-fit.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
    background: #F7F7F9; color: #111;
    min-height: 100vh; max-width: 390px; margin: 0 auto;
    padding-bottom: 40px;
  }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    position: sticky; top: 0; background: #fff; z-index: 10;
    border-bottom: 1px solid #F0F0F0;
  }
  .back-btn {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .title { font-size: 1rem; font-weight: 700; flex: 1; text-align: center; margin-right: 32px; }
  .save-btn { font-size: 0.875rem; font-weight: 700; color: #111; cursor: pointer; }
  .section { padding: 20px 16px 8px; font-size: 0.75rem; color: #999; font-weight: 700; }
  .card {
    margin: 0 16px; background: #fff; border-radius: 14px;
    padding: 16px;
  }
  .input-row { margin-bottom: 16px; }
  .input-row label { display: block; font-size: 0.75rem; color: #666; margin-bottom: 6px; }
  .input-row input, .input-row textarea {
    width: 100%; border: 1px solid #ECECEF; border-radius: 10px;
    padding: 10px 12px; font-size: 0.875rem; outline: none;
    font-family: inherit; background: #FAFAFA;
  }
  .input-row textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt-chip {
    padding: 6px 14px; border-radius: 999px;
    background: #F4F4F6; font-size: 0.813rem; cursor: pointer;
  }
  .opt-chip.active { background: #111; color: #fff; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="back-btn" onclick="location.href='forum.html'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="title">论坛设置</div>
    <div class="save-btn" onclick="save()">保存</div>
  </div>

  <div class="section">基本信息</div>
  <div class="card">
    <div class="input-row">
      <label>论坛名称</label>
      <input type="text" id="forumName" placeholder="比如：吃瓜前线">
    </div>
    <div class="input-row">
      <label>论坛主题</label>
      <div class="opts" id="themeOpts">
        <div class="opt-chip" data-id="xiuxian">修仙界</div>
        <div class="opt-chip" data-id="reality">现代都市</div>
        <div class="opt-chip" data-id="bagua">八卦吃瓜</div>
        <div class="opt-chip" data-id="academy">校园</div>
        <div class="opt-chip" data-id="future">赛博朋克</div>
      </div>
    </div>
  </div>

  <div class="section">论坛世界书（网友设定）</div>
  <div class="card">
    <div class="input-row" style="margin-bottom:0">
      <textarea id="forumWorld" placeholder="写清楚这个论坛里都是什么人，他们会聊什么话题。比如：这是一个八卦论坛，网友们天天讨论娱乐圈的瓜，谁出轨了谁塌房了，语气都是吃瓜群众的样子..."></textarea>
    </div>
  </div>

<script>
  function loadConfig() {
    try { return JSON.parse(localStorage.getItem('forum_config') || '{}'); }
    catch(e) { return {}; }
  }
  function saveConfig(c) { localStorage.setItem('forum_config', JSON.stringify(c)); }

  let theme = 'reality';
  function render() {
    const cfg = loadConfig();
    document.getElementById('forumName').value = cfg.name || '';
    document.getElementById('forumWorld').value = cfg.world || '';
    theme = cfg.theme || 'reality';
    document.querySelectorAll('.opt-chip').forEach(chip => {
      chip.classList.toggle('active', chip.dataset.id === theme);
    });
  }

  document.querySelectorAll('.opt-chip').forEach(chip => {
    chip.onclick = () => {
      theme = chip.dataset.id;
      document.querySelectorAll('.opt-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    };
  });

  function save() {
    saveConfig({
      name: document.getElementById('forumName').value.trim() || '我的论坛',
      theme: theme,
      world: document.getElementById('forumWorld').value.trim()
    });
    location.href = 'forum.html';
  }

  render();
</script>
</body>
</html>
