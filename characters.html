<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色管理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #DCDCDC;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
            color: #222222;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .phone-mockup {
            position: relative;
            width: min(390px, calc(100vw - 24px));
            height: min(844px, calc(100vh - 24px));
            background-color: #EBEBEB;
            border-radius: 45px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
            overflow: hidden;
            border: 8px solid #ffffff;
            display: flex;
            flex-direction: column;
        }
        .status-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 14px 28px;
            font-size: 14px;
            font-weight: 600;
            color: #000;
            z-index: 50;
            pointer-events: none;
        }
        /* Header：极简标题区（透明底、无分割线） */
        .header {
            padding: 50px 16px 12px 16px;
            background-color: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* 编辑视图 header 与表单背景衔接 */
        #editorView .header {
            background-color: #F8F9FA;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            color: #666666;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }
        .back-link .arrow { font-size: 24px; line-height: 14px; }
        .header-title {
            font-size: 17px;
            font-weight: 800;
            color: #111111;
            letter-spacing: -0.4px;
        }
        /* “+ 添加”黑色小药丸按钮（原样保留新稿规格） */
        .btn-header {
            background: #111111;
            color: #FFFFFF;
            font-size: 9.5px;
            font-weight: 600;
            border: none;
            padding: 5px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        }
        .btn-header:active { transform: scale(0.95); }
        .btn-header svg { display: block; }
        /* 角色列表视图 */
        .view-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 列表容器（对应新稿 .role-stage） */
        .role-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 24px !important;
            display: flex;
            flex-direction: column;
            gap: 6px; /* 极紧凑缝隙 */
            scrollbar-width: none;
        }
        .role-list::-webkit-scrollbar { display: none; }

        /* 极致纤细紧凑的细长条卡片 (Slim Bar) */
        .role-slim-bar {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 8px 10px; /* 紧凑内边距 */
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.015);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .role-slim-bar:active {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(0.985);
        }
        .role-slim-bar.active-role {
            background: rgba(255, 255, 255, 0.95);
        }

        .bar-left {
            display: flex;
            align-items: center;
            gap: 9px;
            overflow: hidden;
            flex: 1;
        }

        /* 精致小巧头像（img 或占位 div 共用同一规格） */
        .slim-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #F0F0F0 0%, #E2E2E2 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.9);
            flex-shrink: 0;
            object-fit: cover;
        }

        .slim-meta {
            display: flex;
            flex-direction: column;
            gap: 1px;
            overflow: hidden;
        }

        .slim-name-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .slim-name {
            font-size: 12px;
            font-weight: 700;
            color: #111111;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .slim-tag {
            font-size: 8px;
            font-weight: 600;
            color: #777777;
            background: rgba(0, 0, 0, 0.04);
            padding: 1px 4px;
            border-radius: 4px;
            font-family: monospace;
            flex-shrink: 0;
        }

        .slim-desc {
            font-size: 9.5px;
            color: #888888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 右侧极简操作项 */
        .bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 9px;
            font-weight: 600;
            color: #666666;
            font-family: monospace;
            flex-shrink: 0;
        }

        .bar-right .act-opt {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: #666666;
            cursor: pointer;
            transition: color 0.15s;
        }

        .bar-right .act-opt.del {
            color: #B55555;
        }

        .empty-tip { text-align: center; color: #999999; font-size: 11px; padding: 30px 0; }

        /* 编辑页面表单视图 */
        .editor-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scrollbar-width: none;
            background-color: #F8F9FA;
        }
        .editor-container::-webkit-scrollbar { display: none; }

        /* 头像上传区 */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 0 0;
        }
        .avatar-bubble-wrapper {
            position: relative;
            cursor: pointer;
            width: 80px;
            height: 80px;
        }
        .editor-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 600;
            font-size: 30px;
            transition: transform 0.15s ease;
            user-select: none;
            object-fit: cover;
        }
        .avatar-bubble-wrapper:active .editor-avatar {
            transform: scale(0.96);
        }
        .avatar-badge-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 26px;
            height: 26px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            font-size: 12px;
            color: #555;
            border: 1.5px solid #F8F9FA;
        }

        /* 表单组 */
        .editor-field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field-label {
            font-size: 12px;
            font-weight: 400;
            color: #888;
            padding-left: 2px;
        }

        /* 统一输入框 */
        .form-input {
            width: 100%;
            height: 44px;
            background-color: #F2F2F7;
            border: none;
            border-radius: 12px;
            padding: 0 14px;
            font-size: 15px;
            color: #1C1C1E;
            outline: none;
            font-family: inherit;
            transition: box-shadow 0.15s ease;
        }
        .form-input:focus {
            box-shadow: 0 0 0 1.5px #333333;
            background-color: #fff;
        }

        /* 统一文本框 */
        .form-textarea {
            width: 100%;
            min-height: 120px;
            background-color: #F2F2F7;
            border: none;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            line-height: 1.6;
            color: #1C1C1E;
            outline: none;
            font-family: inherit;
            resize: none;
            transition: box-shadow 0.15s ease;
        }
        .form-textarea.tone {
            min-height: 100px;
        }
        .form-textarea:focus {
            box-shadow: 0 0 0 1.5px #333333;
            background-color: #fff;
        }
        .form-textarea::placeholder {
            color: #C0C0C8;
            font-size: 13px;
        }

        /* 底部固定保存按钮 */
        .btn-save-fixed {
            height: 48px;
            background-color: #1C1C1E;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: auto;
            transition: opacity 0.15s ease;
        }
        .btn-save-fixed:active {
            opacity: 0.85;
        }

        /* 取消按钮 */
        .btn-header-cancel {
            color: #6B7280;
            font-size: 14px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            padding: 4px 6px;
            display: inline-flex;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        /* 本页不需要任何底部导航栏：隐藏 nav.js 注入的全站悬浮导航（仅本页 CSS，不改 nav.js） */
        .floating-nav {
            display: none !important;
        }

        /* body 禁止选中文本，但编辑表单内恢复正常文本选择 */
        .editor-container,
        .editor-container input,
        .editor-container textarea {
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>
<body>
    <div class="phone-mockup">
        <div class="status-bar"><span>09:41</span></div>
        
        <!-- 角色列表界面 -->
        <div class="view-section" id="listView">
            <header class="header">
                <a class="back-link" href="index.html" aria-label="返回主屏幕">
                    <span class="arrow">‹</span>
                    <span>返回</span>
                </a>
                <h1 class="header-title">角色管理</h1>
                <button class="btn-header" id="btnAddRole" type="button"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg><span>添加</span></button>
            </header>
            <main class="role-list" id="roleListContainer"></main>
        </div>

        <!-- 角色卡编辑/新增界面 -->
        <div class="view-section hidden" id="editorView">
            <header class="header">
                <button class="btn-header-cancel" id="btnCancelEdit" type="button" aria-label="取消并返回">
                    <span style="font-size: 20px; line-height: 14px; margin-right: 2px;">‹</span>
                    <span>取消</span>
                </button>
                <h1 class="header-title" id="editorTitle">角色卡</h1>
                <span style="width: 48px;"></span>
            </header>
            <main class="editor-container">
                <input type="hidden" id="editRoleId" value="">

                <!-- 1. 头像上传区 -->
                <div class="avatar-section">
                    <div class="avatar-bubble-wrapper" id="avatarBubbleWrapper" title="点击上传头像">
                        <div class="editor-avatar" id="editAvatarPreview">角</div>
                        <div class="avatar-badge-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
                    </div>
                    <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
                </div>

                <!-- 2. 姓名 -->
                <div class="editor-field-group">
                    <label class="field-label" for="editRoleName">姓名</label>
                    <input class="form-input" id="editRoleName" type="text" placeholder="输入角色名字" maxlength="30" />
                </div>

                <!-- 3. 人设设定 -->
                <div class="editor-field-group">
                    <label class="field-label" for="editRolePersona">人设设定</label>
                    <textarea
                        class="form-textarea"
                        id="editRolePersona"
                        placeholder="请详细描述TA的身份、性格、背景等"
                    ></textarea>
                </div>

                <!-- 4. 聊天语气 -->
                <div class="editor-field-group">
                    <label class="field-label" for="editRoleTone">聊天语气</label>
                    <textarea
                        class="form-textarea tone"
                        id="editRoleTone"
                        placeholder="例如：说话简短、经常使用句号、高冷、偶尔傲娇"
                    ></textarea>
                </div>

                <!-- 5. 保存按钮 -->
                <button class="btn-save-fixed" id="btnSaveRole" type="button">保存设定</button>
            </main>
        </div>
    </div>
    <script src="characters-manager.js"></script>
    <script src="nav.js"></script>
</body>
</html>
