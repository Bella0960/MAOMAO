.field-label{display:block;font-size:10px;color:#999;letter-spacing:.06em;margin:13px 0 7px}.field-input,.field-select{width:100%;border:1px solid #e8e8e8;background:#fafafa;border-radius:10px;padding:11px 12px;font-size:11px;outline:none;color:#333}.field-textarea{width:100%;min-height:118px;border:1px solid #e8e8e8;background:#fafafa;border-radius:10px;padding:12px;font-size:12px;line-height:1.8;resize:vertical;outline:none;color:#333}.sheet-actions{display:flex;gap:8px;margin-top:17px;padding-top:13px;border-top:1px solid #eee}.sheet-actions .dark-button{flex:1}.detail-overlay{position:absolute;inset:0;z-index:15;display:none;flex-direction:column;background:#fff;animation:fadeIn .18s ease}.detail-overlay.show{display:flex}.detail-scroll{flex:1;min-height:0;overflow:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.detail-scroll::-webkit-scrollbar{display:none}.detail-head{position:absolute;top:42px;left:18px;right:18px;z-index:4;display:flex;justify-content:space-between;align-items:center}.detail-head .icon-button{background:rgba(255,255,255,.82);backdrop-filter:blur(12px)}.detail-scene .art-scene{height:300px;border-radius:0}.detail-content{padding:20px 22px 28px}.detail-kicker{font-size:8px;letter-spacing:.18em;color:#999}.detail-title{font-size:33px;letter-spacing:-.07em;margin:9px 0 7px;font-weight:740}.detail-subtitle{font-size:11px;color:#888;line-height:1.8}.detail-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:19px 0 22px}.metric{background:#f6f6f6;border-radius:10px;padding:11px 9px}.metric span{display:block;color:#aaa;font-size:8px;margin-bottom:5px}.metric strong{display:block;color:#333;font-size:11px;font-weight:650}.story-title{font-size:13px;font-weight:700;letter-spacing:-.03em;margin:0 0 9px}.story-text{font-size:11px;line-height:2;color:#666;margin:0;white-space:pre-line}.route-box{margin-top:19px;padding:14px;border:1px solid #ececec;border-radius:13px}.route-box .route-label{font-size:8px;letter-spacing:.14em;color:#aaa}.route-box p{font-size:10px;line-height:1.8;color:#555;margin:7px 0 0}.detail-actions{position:relative;display:flex;gap:8px;padding:13px 20px calc(13px + env(safe-area-inset-bottom,0px));border-top:1px solid #eee;background:rgba(255,255,255,.91);backdrop-filter:blur(20px)}.detail-actions button{height:44px}.detail-actions .light-button{width:47px;padding:0}.detail-actions .dark-button{flex:1}

    <div class="top-actions"><button class="icon-button" id="randomBtn" aria-label="随机探索" title="随机探索"><svg viewBox="0 0 24 24"><path d="M3 7h3c5 0 7 10 12 10h3M17 13l4 4-4 4M3 17h3c2 0 3.5-2 5-4M17 3l4 4-4 4M14 7h4"/></svg></button><button class="icon-button" id="moreBtn" aria-label="更多选项" title="更多"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>

    <button class="tab" data-view="collection"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg><span>收藏</span></button>
    <button class="tab" data-view="notes"><svg viewBox="0 0 24 24"><path d="M5 3.5h14a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V5A1.5 1.5 0 0 1 5 3.5Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>手札</span></button>
  </nav>

  <section class="detail-overlay" id="detailOverlay" aria-label="目的地详情">

  <div class="overlay" id="bookingOverlay" role="dialog" aria-modal="true" aria-labelledby="bookingTitle">

      <div id="bookingPlaceName" style="font-size:12px;font-weight:650;margin-bottom:3px"></div><div style="font-size:9px;color:#999;line-height:1.7">这是一张虚构世界的旅行票根，不涉及现实交通、酒店或付款。</div>
      <label class="field-label" for="bookingDate">想从哪一天出发？</label><input class="field-input" type="date" id="bookingDate">
      <label class="field-label" for="bookingMemo">这次想带走什么心情？（选填）</label><input class="field-input" id="bookingMemo" maxlength="90" placeholder="例如：去一个没有闹钟的地方">
      <div class="sheet-actions"><button class="light-button" id="cancelBooking">再想一想</button><button class="dark-button" id="confirmBooking">生成我的旅行票根 ↗</button></div>
    </section>
  </div>

  <div class="overlay" id="noteOverlay" role="dialog" aria-modal="true" aria-labelledby="noteHeading">
    <section class="sheet"><div class="grabber"></div><div class="sheet-head"><div><div class="sheet-title" id="noteHeading">写一张旅行手札</div><div class="sheet-sub">POSTCARDS FROM SOMEWHERE ELSE</div></div><button class="plain-close" id="closeNote">关闭</button></div>
      <label class="field-label" for="noteDate">日期</label><input class="field-input" type="date" id="noteDate">
      <label class="field-label" for="notePlace">来自哪里</label><select class="field-select" id="notePlace"></select>
      <label class="field-label" for="noteTitle">给这一页起个名字</label><input class="field-input" id="noteTitle" maxlength="70" placeholder="写给雾里的自己">
      <label class="field-label" for="noteContent">留下这次旅行</label><textarea class="field-textarea" id="noteContent" maxlength="8000" placeholder="你看见了什么？又把什么留在了那里？"></textarea>
      <div class="sheet-actions"><button class="light-button" id="deleteNote" hidden>删除手札</button><button class="light-button" id="cancelNote">取消</button><button class="dark-button" id="saveNote">收藏这段记忆</button></div>
    </section>
  </div>

  <div class="overlay" id="menuOverlay" role="dialog" aria-modal="true" aria-label="旅行资料管理">
    <section class="sheet"><div class="grabber"></div><div class="sheet-head"><div><div class="sheet-title">我的旅行资料</div><div class="sheet-sub">YOUR LITTLE ARCHIVE</div></div><button class="plain-close" id="closeMenu">关闭</button></div>
      <button class="menu-row" id="exportData"><span><strong>导出旅行备份</strong><small>收藏、票根、探索记录与旅行手札</small></span><span>↓</span></button>
      <button class="menu-row" id="importData"><span><strong>导入旅行备份</strong><small>与当前本地资料合并</small></span><span>↑</span></button><input type="file" accept="application/json,.json" id="importFile" hidden>
      <button class="menu-row" id="clearTravelSearch"><span><strong>清除搜索内容</strong><small>回到全部目的地</small></span><span>↺</span></button>
      <p style="font-size:9px;line-height:1.8;color:#999;padding:7px 11px 0">触梦旅行中的地点、预约与票根均为虚构互动内容。资料保存在当前浏览器本地，不会主动上传。</p>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<style>

<script>
(function(){
'use strict';
var STORE_KEY='maomao_dream_travel_v1';
var destinations=[
{id:'moon-sea',code:'001',name:'月光海',category:'静谧海域',tagline:'潮汐会替你保管秘密。',desc:'一片只在午夜涨潮的银色海湾。',duration:'一晚',season:'月圆之夜',distance:'梦境东岸',mood:'安静',art:'scene-moon',icon:'◯',story:'这里没有白昼。海面收集了许多无人认领的月光，偶尔也会把远方寄来的梦推上岸。\\n\\n当地人说，只要在潮水退去时把一个秘密写在纸上，第二天醒来，你就会记得它真正的名字。',route:'沿着没有路牌的海岸向北走，在第三盏熄灭的灯之后下坡。若听见远处有钟声，不必寻找钟楼，那是海正在换气。',gift:'月汐玻璃片'},
{id:'cloud-train',code:'002',name:'云端列车',category:'漂浮交通',tagline:'下一站，尚未发生的事。',desc:'列车穿过云层，也经过尚未抵达的明天。',duration:'三站',season:'风很轻的日子',distance:'高空环线',mood:'好奇',art:'scene-cloud',icon:'↗',story:'这趟列车没有固定终点。车窗外会经过一些你曾经想象过、却没能去到的地方。每当列车减速，窗外就会出现一座只属于某个乘客的车站。\\n\\n请留意车票背面的空白。它会在你愿意出发时，慢慢浮现下一站的名字。',route:'从云层边缘的白色站台登车。选一张没有标注到站时间的车票，把它交给戴灰手套的检票员。',gift:'漂浮车票'},
{id:'night-garden',code:'003',name:'永夜花园',category:'夜行植物园',tagline:'这里的花不需要天亮。',desc:'银色枝叶在黑夜里缓慢生长。',duration:'半日',season:'每一个深夜',distance:'沉默森林内侧',mood:'疗愈',art:'scene-garden',icon:'✳',story:'永夜花园里没有太阳，也没有凋谢这件事。植物会把来访者没说出口的话，收进叶脉最深的地方，再用细小的光回应。\\n\\n花园的守门人不问你从哪里来，只会递给你一只空花盆。你可以把不想继续携带的烦恼，埋在里面。',route:'找到长着两片银叶的黑色小门。沿石径一直向前，经过第七棵树后，记得回头看一次。',gift:'夜光种子'},
{id:'time-inn',code:'004',name:'时间旅馆',category:'时间缝隙',tagline:'每个房间都住着另一种可能。',desc:'入住一晚，可以和某个平行时刻擦肩。',duration:'一晚',season:'雨落下之前',distance:'时针背面',mood:'神秘',art:'scene-hotel',icon:'⌁',story:'旅馆一共十三层，但电梯按钮只显示十二个数字。前台从不登记姓名，只会问你：今晚想暂住在哪一种时间里？\\n\\n有人在这里找回了忘记的夏天，也有人只想坐在窗边，安静地看一场从未发生的雨。退房时请把房卡放在桌上，不需要带走任何东西。',route:'在旧钟表店后门敲三下。接待员会递给你一把没有钥匙齿的钥匙，那就是你的房间。',gift:'无刻度房卡'},
{id:'glass-desert',code:'005',name:'玻璃沙漠',category:'折光旷野',tagline:'所有迷路，都会折射成方向。',desc:'沙丘像被磨砂过的玻璃，藏着微弱回声。',duration:'两日',season:'雾散的清晨',distance:'地图留白处',mood:'辽阔',art:'scene-desert',icon:'◇',story:'这里的沙粒透明而轻，风吹过时会发出极低的和声。沙漠中央有一座不提供水的驿站，只提供可以反复翻阅的旧地图。\\n\\n旅人常在地图上发现一条此前没有的路。那条路不会通往某个固定地点，只会通向你当下最需要抵达的地方。',route:'找到地面上最暗的一道折光，沿它向西。不要追逐远处的绿洲，真正的入口藏在脚边的浅浅凹痕里。',gift:'折光石'},
{id:'mist-city',code:'006',name:'雾中书城',category:'迷雾街区',tagline:'每一本书，都在等它的读者。',desc:'街道由未完成的故事连成，转角总有新章节。',duration:'三章',season:'雾气漫上窗时',distance:'旧梦北部',mood:'奇遇',art:'scene-city',icon:'▤',story:'雾中书城的楼宇没有门牌，只有书名。街上没有店员，书页会在你停下时自行翻动，选中一段适合现在的文字。\\n\\n如果你在某本书的末页看见自己的名字，不必惊讶。那只是这个世界温柔地提醒你：接下来几页，还可以由你来写。',route:'先走进一条看起来没有尽头的窄巷。听见翻页声时停下，靠左手边第二扇窗，轻轻说出你正在寻找的故事。',gift:'雾纹书签'}
];
var data=loadData(),view='explore',searchQuery='',activePlaceId=null,bookingPlaceId=null,editingNoteId=null;
var $=function(id){return document.getElementById(id)};
var main=$('mainView'),scroller=$('scroller');
function freshData(){return {favorites:[],visited:[],bookings:[],notes:[],souvenirs:[]}}
function loadData(){try{var d=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');if(!d||typeof d!=='object')return freshData();return {favorites:Array.isArray(d.favorites)?d.favorites:[],visited:Array.isArray(d.visited)?d.visited:[],bookings:Array.isArray(d.bookings)?d.bookings:[],notes:Array.isArray(d.notes)?d.notes:[],souvenirs:Array.isArray(d.souvenirs)?d.souvenirs:[]}}catch(e){return freshData()}}
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(data));return true}catch(e){toast('本机存储空间不足，暂时无法保存');return false}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dateKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function plusDays(num){var d=new Date();d.setDate(d.getDate()+num);return dateKey(d)}
function prettyDate(key){if(!key)return '';var p=String(key).split('-');return p[0]+' / '+p[1]+' / '+p[2]}
function findPlace(id){return destinations.find(function(p){return p.id===id})||destinations[0]}
function has(list,id){return list.indexOf(id)!==-1}
function toast(msg){var el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(function(){el.classList.remove('show')},2300)}
function iconSvg(name){var map={search:'<circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.5 4.5"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/>',pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>'};return '<svg viewBox="0 0 24 24">'+(map[name]||'')+'</svg>'}
function artHTML(p,feature){return '<div class="art-scene '+p.art+'"><span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>'+(p.id==='cloud-train'?'<span class="train-line"></span>':'')+(p.id==='time-inn'?'<span class="hotel-windows"></span>':'')+(p.id==='moon-sea'?'<span class="terrain"></span>':'')+'<span class="art-code">DREAM / '+p.code+'</span><span class="scene-caption">'+esc(p.distance.toUpperCase())+'</span></div>'}
function renderPlaceCard(p){
var saved=has(data.favorites,p.id);
return '<article class="destination-card"><button class="open-destination" data-detail="'+p.id+'"><div class="card-art">'+artHTML(p,false)+'<span class="place-label">'+p.code+' / '+esc(p.category.toUpperCase())+'</span></div><div class="place-category">'+esc(p.category)+'</div><div class="place-name">'+esc(p.name)+'</div><div class="place-desc">'+esc(p.desc)+'</div><div class="place-foot"><span>'+esc(p.duration)+' · '+esc(p.mood)+'</span><strong>探索 '+iconSvg('arrow')+'</strong></div></button><button class="card-fav '+(saved?'saved':'')+'" data-favorite="'+p.id+'" aria-label="'+(saved?'取消收藏':'收藏目的地')+'">'+(saved?'★':'☆')+'</button></article>'
}
function progressPercent(){return Math.round((data.visited.length/destinations.length)*100)}
function renderExplore(){
var filtered=destinations.filter(function(p){return [p.name,p.category,p.tagline,p.desc,p.distance,p.story].join(' ').toLowerCase().indexOf(searchQuery.toLowerCase())!==-1});
var featured=destinations[0];
return '<section class="hero"><div class="eyebrow">A JOURNEY BEYOND REALITY</div><h1>触梦旅行<span style="font-weight:320;color:#aaa">。</span></h1><p>不是地图上的远方。<br>而是另一个世界，正在等你抵达。</p><div class="hero-aside"><strong>'+String(data.visited.length).padStart(2,'0')+' / '+destinations.length+'</strong><span>已抵达目的地</span></div></section>'+
'<div class="search-line">'+iconSvg('search')+'<input id="placeSearch" type="search" value="'+esc(searchQuery)+'" placeholder="寻找海岛、时间缝隙或一座城市" aria-label="搜索目的地">'+(searchQuery?'<button class="plain-close" id="clearPlaceSearch">清除</button>':'')+'</div>'+
'<button class="feature-card" data-detail="'+featured.id+'" style="display:block;width:100%;padding:0;text-align:left;border:0;cursor:pointer"><div>'+artHTML(featured,true)+'</div><div class="feature-top"><span>FEATURED DESTINATION / '+featured.code+'</span><span class="outline-chip">本日推荐 ↗</span></div><div class="feature-overlay"><div class="feature-kicker">A PLACE OUTSIDE OF TIME</div><div class="feature-title">'+esc(featured.name)+'</div><div class="feature-desc">'+esc(featured.tagline)+'</div></div><span class="feature-action">'+iconSvg('arrow')+'</span></button>'+
'<div class="progress-strip"><div class="progress-copy"><div class="label">YOUR DREAM PASSPORT</div><strong>每次出发，都会留下印记</strong><div class="progress-bar"><div class="progress-fill" style="width:'+progressPercent()+'%"></div></div></div><div class="progress-number">'+progressPercent()+'%</div></div>'+
'<div class="prompt-strip"><div class="prompt-mark">“</div><div class="prompt-body"><div class="prompt-label">A NOTE FROM THE OTHER SIDE</div><p>'+esc(['你不一定要去很远的地方，才能遇见新的自己。','未知不是空白，它只是还没有被写下名字。','有些目的地，只有在你准备好时才会出现。','把现实暂时放在口袋里，去别处呼吸一下。'][new Date().getDate()%4])+'</p></div></div>'+
'<div class="section-head"><h2>'+(searchQuery?'搜索结果':'目的地档案')+'</h2><span class="section-meta">'+filtered.length+' WORLDS FOUND</span></div>'+
(filtered.length?'<div class="destination-grid">'+filtered.map(renderPlaceCard).join('')+'</div>':'<div class="empty-state"><div class="empty-mark">404 / DREAM</div><h3>还没有找到这个地方</h3><p>换个关键词，或许下一次转弯就会遇见。</p><button class="light-button" id="clearPlaceSearchEmpty">清除搜索</button></div>');
}
function renderTrips(){
var list=data.bookings.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'')});
var upcoming=list.filter(function(x){return x.status!=='arrived'});
var done=list.filter(function(x){return x.status==='arrived'});
return '<section class="page-hero"><div class="eyebrow">YOUR FICTIONAL ITINERARY</div><h1>旅程档案<span style="font-weight:320;color:#aaa">。</span></h1><p>每一张票根，都是你与另一个世界约定好的见面。</p></section>'+
'<div class="progress-strip"><div class="progress-copy"><div class="label">DREAM PASSPORT</div><strong>已收集 '+data.souvenirs.length+' 枚旅行纪念</strong><div class="progress-bar"><div class="progress-fill" style="width:'+progressPercent()+'%"></div></div></div><div class="progress-number">'+String(data.visited.length).padStart(2,'0')+'<span style="font-size:10px;color:#aaa"> / '+destinations.length+'</span></div></div>'+
'<div class="section-head"><h2>即将出发</h2><span class="section-meta">'+upcoming.length+' TICKETS</span></div>'+
(upcoming.length?'<div class="ticket-list">'+upcoming.map(renderTicket).join('')+'</div>':'<div class="empty-state"><div class="empty-mark">NEXT / 001</div><h3>还没有安排的旅程</h3><p>挑选一个想去的幻想目的地，给未来留一张票。</p><button class="dark-button" data-goto="explore">去看看目的地 ↗</button></div>')+
(done.length?'<div class="section-head" style="margin-top:25px"><h2>已经抵达</h2><span class="section-meta">'+done.length+' ARRIVED</span></div><div class="ticket-list">'+done.map(renderTicket).join('')+'</div>':'');
}
function renderTicket(t){
var p=findPlace(t.placeId),done=t.status==='arrived';
return '<article class="ticket"><div class="ticket-top"><div class="ticket-art">'+artHTML(p,false)+'</div><div><div class="ticket-label">DREAM TICKET / '+esc(p.code)+'</div><div class="ticket-title">'+esc(p.name)+'</div><div class="ticket-meta">'+esc(prettyDate(t.date))+'<br>'+esc(t.memo||p.tagline)+'</div><div class="ticket-code">'+esc(t.code||'TD-'+String(t.id).slice(-6).toUpperCase())+'</div></div></div><div class="ticket-bottom"><span class="status-pill '+(done?'done':'')+'">'+(done?'已抵达 · 纪念已收录':'待出发 · 虚构行程')+'</span><div class="ticket-actions">'+(done?'<button data-detail="'+p.id+'">重访地点 ↗</button>':'<button data-cancel-ticket="'+t.id+'">取消</button><button data-arrive="'+t.id+'">确认抵达 ↗</button>')+'</div></div></article>'
}
function renderCollection(){
var favorites=destinations.filter(function(p){return has(data.favorites,p.id)});
var visited=destinations.filter(function(p){return has(data.visited,p.id)});
var souvenirs=data.souvenirs.slice().reverse();
return '<section class="page-hero"><div class="eyebrow">COLLECT LITTLE IMPOSSIBILITIES</div><h1>梦境收藏<span style="font-weight:320;color:#aaa">。</span></h1><p>世界走过你，也在你身上留下一点回声。</p></section>'+
'<section class="collection-section"><div class="collection-head"><h2>收藏的目的地</h2><span>'+favorites.length+' SAVED</span></div>'+(favorites.length?'<div class="destination-grid">'+favorites.map(renderPlaceCard).join('')+'</div>':'<div class="empty-state"><div class="empty-mark">☆</div><h3>把想去的地方先收起来</h3><p>在目的地卡片上点星星，它们就会住进这里。</p><button class="light-button" data-goto="explore">发现一个地方</button></div>')+'</section>'+
'<section class="collection-section"><div class="collection-head"><h2>护照印记</h2><span>'+visited.length+' / '+destinations.length+' WORLDS</span></div>'+(visited.length?'<div class="destination-grid">'+visited.map(function(p){return renderPlaceCard(p)}).join('')+'</div>':'<div class="empty-state"><div class="empty-mark">01 / 06</div><h3>你的护照还很新</h3><p>完成一次幻想旅程，就会得到一枚属于这个世界的印记。</p></div>')+'</section>'+
'<section class="collection-section"><div class="collection-head"><h2>旅行纪念品</h2><span>'+souvenirs.length+' COLLECTED</span></div>'+(souvenirs.length?'<div class="souvenir-grid">'+souvenirs.map(function(s){var p=findPlace(s.placeId);return '<div class="souvenir"><div class="souvenir-stamp">'+esc(p.icon)+'</div><div class="souvenir-name">'+esc(s.name||p.gift)+'</div><div class="souvenir-caption">'+esc(p.name)+' · '+esc((s.date||'').replace(/-/g,'.'))+'</div></div>'}).join('')+'</div>':'<div class="empty-state"><div class="empty-mark">◇</div><h3>还没捡到纪念品</h3><p>每次确认抵达，都会收下这个世界的一份小礼物。</p></div>')+'</section>';
}
function renderNotes(){
var list=data.notes.slice().sort(function(a,b){return (b.updatedAt||b.date||'').localeCompare(a.updatedAt||a.date||'')});
return '<section class="page-hero"><div class="eyebrow">POSTCARDS FROM SOMEWHERE ELSE</div><h1>旅行手札<span style="font-weight:320;color:#aaa">。</span></h1><p>写给另一个世界，也写给后来会想起它的自己。</p></section>'+
'<div class="section-head"><h2>留在路上的文字</h2><span class="section-meta">'+list.length+' NOTES</span></div>'+
(list.length?'<div class="note-list">'+list.map(renderNote).join('')+'</div>':'<div class="empty-state"><div class="empty-mark">Dear, somewhere.</div><h3>还没有寄出的明信片</h3><p>记录一段旅程、一种心情，或者一件只发生在梦里的小事。</p><button class="dark-button" id="emptyNewNote">写第一张手札 ↗</button></div>');
}
function renderNote(n){var p=n.placeId&&findPlace(n.placeId);return '<article class="note-card"><div class="note-head"><div><div class="note-date">'+esc(prettyDate(n.date))+' · TRAVEL NOTE</div><div class="note-title">'+esc(n.title||'无题手札')+'</div></div>'+(p?'<span class="note-place">'+esc(p.name)+'</span>':'<span class="note-place">自由记录</span>')+'</div><div class="note-text">'+esc(n.content||'')+'</div><div class="note-actions"><button data-edit-note="'+n.id+'">编辑</button><button data-delete-note="'+n.id+'">删除</button></div></article>'}
function render(){
document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.view===view)});
main.innerHTML=view==='trips'?renderTrips():view==='collection'?renderCollection():view==='notes'?renderNotes():renderExplore();
if(view==='explore'){
var input=$('placeSearch');
if(input)input.addEventListener('input',function(){var pos=input.selectionStart;searchQuery=input.value;var y=scroller.scrollTop;main.innerHTML=renderExplore();scroller.scrollTop=y;var next=$('placeSearch');if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch(e){}}});
var clear=$('clearPlaceSearch');if(clear)clear.addEventListener('click',function(){searchQuery='';render()});
var clearEmpty=$('clearPlaceSearchEmpty');if(clearEmpty)clearEmpty.addEventListener('click',function(){searchQuery='';render()});
}
var newNote=$('emptyNewNote');if(newNote)newNote.addEventListener('click',function(){openNote()});
scroller.scrollTop=0;
}
function setView(v){view=v;render()}
function openDetail(id){
var p=findPlace(id);activePlaceId=p.id;
$('detailScroll').innerHTML='<div class="detail-scene">'+artHTML(p,true)+'</div><div class="detail-head"><button class="icon-button" id="closeDetail" aria-label="返回"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button class="icon-button" id="detailTopFavorite" aria-label="收藏目的地">'+(has(data.favorites,p.id)?'★':'☆')+'</button></div><div class="detail-content"><div class="detail-kicker">DESTINATION / '+p.code+' · '+esc(p.category.toUpperCase())+'</div><h1 class="detail-title">'+esc(p.name)+'</h1><div class="detail-subtitle">'+esc(p.tagline)+'<br>'+esc(p.desc)+'</div><div class="detail-metrics"><div class="metric"><span>建議停留</span><strong>'+esc(p.duration)+'</strong></div><div class="metric"><span>適合時刻</span><strong>'+esc(p.season)+'</strong></div><div class="metric"><span>夢境方向</span><strong>'+esc(p.distance)+'</strong></div></div><h2 class="story-title">这里的故事 / A SMALL LEGEND</h2><p class="story-text">'+esc(p.story)+'</p><div class="route-box"><div class="route-label">A WAY TO ARRIVE · 虚构路线</div><p>'+esc(p.route)+'</p></div><div class="route-box"><div class="route-label">A LITTLE SOUVENIR · 可能带走的纪念</div><p>'+esc(p.gift)+'。确认抵达后，这件小小纪念就会收入你的梦境护照。</p></div></div>';
$('detailOverlay').classList.add('show');document.body.style.overflow='hidden';
$('closeDetail').addEventListener('click',closeDetail);
$('detailTopFavorite').addEventListener('click',function(){toggleFavorite(p.id);$('detailTopFavorite').textContent=has(data.favorites,p.id)?'★':'☆';$('detailFavorite').textContent=has(data.favorites,p.id)?'★':'☆'});
$('detailFavorite').textContent=has(data.favorites,p.id)?'★':'☆';
$('detailPlan').onclick=function(){openBooking(p.id)};
}
function closeDetail(){$('detailOverlay').classList.remove('show');document.body.style.overflow=''}
function toggleFavorite(id){
var i=data.favorites.indexOf(id);if(i<0){data.favorites.push(id);toast('已收进梦境收藏')}else{data.favorites.splice(i,1);toast('已从收藏中移除')}
persist();render();
if(activePlaceId){$('detailFavorite').textContent=has(data.favorites,activePlaceId)?'★':'☆';var topFav=$('detailTopFavorite');if(topFav)topFav.textContent=has(data.favorites,activePlaceId)?'★':'☆'}
}
function openBooking(id){
bookingPlaceId=id||activePlaceId;var p=findPlace(bookingPlaceId);
$('bookingPlaceName').textContent=p.name+' · '+p.tagline;$('bookingDate').value=plusDays(1);$('bookingMemo').value='';
$('bookingOverlay').classList.add('show');
}
function closeBooking(){$('bookingOverlay').classList.remove('show')}
function confirmBooking(){
var date=$('bookingDate').value||plusDays(1),memo=$('bookingMemo').value.trim();
var ticket={id:'t_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),placeId:bookingPlaceId,date:date,memo:memo,status:'planned',createdAt:new Date().toISOString(),code:'TD-'+Math.random().toString(36).slice(2,8).toUpperCase()};
data.bookings.push(ticket);
if(!persist()){data.bookings.pop();return}
closeBooking();closeDetail();view='trips';render();toast('旅行票根已生成 · 这是一次幻想旅程');
}
function arriveTicket(id){
var t=data.bookings.find(function(x){return x.id===id});if(!t)return;
if(t.status==='arrived'){toast('这段旅程已经收录');return}
t.status='arrived';t.arrivedAt=new Date().toISOString();
if(!has(data.visited,t.placeId))data.visited.push(t.placeId);
var p=findPlace(t.placeId);
if(!data.souvenirs.some(function(s){return s.placeId===p.id}))data.souvenirs.push({id:'s_'+Date.now().toString(36),placeId:p.id,name:p.gift,date:t.date});
if(persist()){render();toast('抵达成功 · '+p.gift+' 已加入收藏')}
}
function cancelTicket(id){
if(!confirm('确定取消这张虚构旅行票根吗？'))return;
data.bookings=data.bookings.filter(function(t){return t.id!==id});persist();render();toast('票根已取消');
}
function openNote(id){
editingNoteId=id||null;var n=id?data.notes.find(function(x){return x.id===id}):null;
$('noteHeading').textContent=n?'编辑旅行手札':'写一张旅行手札';
$('noteDate').value=n?n.date:dateKey();
$('notePlace').innerHTML='<option value="">自由记录</option>'+destinations.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('');
$('notePlace').value=n?(n.placeId||''):'';
$('noteTitle').value=n?(n.title||''):'';
$('noteContent').value=n?(n.content||''):'';
$('deleteNote').hidden=!n;
$('noteOverlay').classList.add('show');
}
function closeNote(){$('noteOverlay').classList.remove('show')}
function saveNote(){
var title=$('noteTitle').value.trim(),content=$('noteContent').value.trim();
if(!title&&!content){toast('先写下一点内容吧');$('noteContent').focus();return}
var old=editingNoteId?data.notes.find(function(x){return x.id===editingNoteId}):null;
var n=old||{id:'n_'+Date.now().toString(36),createdAt:new Date().toISOString()};
n.date=$('noteDate').value||dateKey();n.placeId=$('notePlace').value;n.title=title;n.content=content;n.updatedAt=new Date().toISOString();
if(!old)data.notes.push(n);
if(persist()){closeNote();view='notes';render();toast(old?'手札已更新':'旅行手札已保存')}
}
function deleteNote(id){
if(!confirm('确定删除这张旅行手札吗？'))return;
data.notes=data.notes.filter(function(n){return n.id!==id});persist();render();toast('手札已删除');
}
function exportBackup(){
var payload={app:'MAOMAO Touch Dream Travel',version:1,exportedAt:new Date().toISOString(),data:data};
var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob);
var a=document.createElement('a');a.href=url;a.download='touch-dream-travel-'+dateKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1400);$('menuOverlay').classList.remove('show');toast('旅行资料备份已生成');
}
function importBackup(file){
if(!file)return;
var r=new FileReader();
r.onload=function(){try{var v=JSON.parse(r.result),incoming=v.data||v;if(!incoming||!Array.isArray(incoming.favorites)||!Array.isArray(incoming.bookings)||!Array.isArray(incoming.notes))throw new Error('bad');
if(!confirm('导入资料会与当前资料合并，重复票根和手札将自动跳过。继续吗？'))return;
incoming.favorites.forEach(function(id){if(destinations.some(function(p){return p.id===id})&&!has(data.favorites,id))data.favorites.push(id)});
incoming.visited=(incoming.visited||[]).filter(function(id){return destinations.some(function(p){return p.id===id})}).forEach(function(id){if(!has(data.visited,id))data.visited.push(id)});
incoming.bookings.forEach(function(t){if(t&&t.id&&!data.bookings.some(function(x){return x.id===t.id}))data.bookings.push(t)});
incoming.notes.forEach(function(n){if(n&&n.id&&!data.notes.some(function(x){return x.id===n.id}))data.notes.push(n)});
incoming.souvenirs=(incoming.souvenirs||[]).forEach? (incoming.souvenirs||[]).forEach(function(s){if(s&&s.id&&!data.souvenirs.some(function(x){return x.id===s.id}))data.souvenirs.push(s)}):null;
if(persist()){setView('explore');$('menuOverlay').classList.remove('show');toast('旅行资料已合并导入')}
}catch(e){toast('文件格式不正确，请选择触梦旅行备份文件')}}
;r.onerror=function(){toast('读取备份失败')};r.readAsText(file);
}
main.addEventListener('click',function(e){
var fav=e.target.closest('[data-favorite]');if(fav){e.stopPropagation();toggleFavorite(fav.dataset.favorite);return}
var detail=e.target.closest('[data-detail]');if(detail){openDetail(detail.dataset.detail);return}
var nav=e.target.closest('[data-goto]');if(nav){setView(nav.dataset.goto);return}
var arrive=e.target.closest('[data-arrive]');if(arrive){arriveTicket(arrive.dataset.arrive);return}
var cancel=e.target.closest('[data-cancel-ticket]');if(cancel){cancelTicket(cancel.dataset.cancelTicket);return}
var edit=e.target.closest('[data-edit-note]');if(edit){openNote(edit.dataset.editNote);return}
var del=e.target.closest('[data-delete-note]');if(del){deleteNote(del.dataset.deleteNote);return}
});
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.view)})});
$('backHome').addEventListener('click',function(){location.href='index.html'});
$('randomBtn').addEventListener('click',function(){var options=destinations.filter(function(p){return p.id!==activePlaceId});var p=options[Math.floor(Math.random()*options.length)];openDetail(p.id)});
$('moreBtn').addEventListener('click',function(){$('menuOverlay').classList.add('show')});
$('closeMenu').addEventListener('click',function(){$('menuOverlay').classList.remove('show')});
$('menuOverlay').addEventListener('click',function(e){if(e.target===$('menuOverlay'))$('menuOverlay').classList.remove('show')});
$('exportData').addEventListener('click',exportBackup);
$('importData').addEventListener('click',function(){$('importFile').click()});
$('importFile').addEventListener('change',function(){importBackup(this.files&&this.files[0]);this.value=''});
$('clearTravelSearch').addEventListener('click',function(){searchQuery='';$('menuOverlay').classList.remove('show');setView('explore');toast('已清除搜索')});
$('closeBooking').addEventListener('click',closeBooking);$('cancelBooking').addEventListener('click',closeBooking);
$('bookingOverlay').addEventListener('click',function(e){if(e.target===$('bookingOverlay'))closeBooking()});
$('confirmBooking').addEventListener('click',confirmBooking);
$('newNoteBtn').addEventListener('click',function(){openNote()});
$('closeNote').addEventListener('click',closeNote);$('cancelNote').addEventListener('click',closeNote);
$('noteOverlay').addEventListener('click',function(e){if(e.target===$('noteOverlay'))closeNote()});
$('saveNote').addEventListener('click',saveNote);
$('deleteNote').addEventListener('click',function(){if(editingNoteId)deleteNote(editingNoteId);closeNote()});
function updateTime(){var d=new Date();$('statusTime').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}
updateTime();setInterval(updateTime,30000);render();
})();
</script>
</body>
</html>
