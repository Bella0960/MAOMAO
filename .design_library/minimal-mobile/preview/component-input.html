<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Input</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-surface); color: var(--color-text); font-family: var(--font-body); }
.row { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2); }
.label { width: 92px; flex-shrink: 0; font: var(--type-eyebrow); color: var(--color-text-muted); }
.divider { border: 0; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.field { display: flex; flex-direction: column; gap: var(--space-2); flex: 1; min-width: 120px; }
.field-label { font: var(--type-caption); color: var(--color-text-muted); white-space: nowrap; }
.input { width: 100%; height: var(--size-input-height); padding: 0 var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); font: var(--type-body); outline: none; transition: border-color var(--duration-fast), box-shadow var(--duration-fast); }
.input::placeholder { color: var(--color-text-muted); }
.input:hover { border-color: var(--color-border-strong); }
.input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--lumen-blue-100); }
.input-error { border-color: var(--color-danger); }
.input:disabled { background: var(--color-surface-dim); color: var(--color-text-disabled); border-color: var(--color-border); cursor: not-allowed; }
.input:disabled::placeholder { color: var(--color-text-disabled); }
.helper { font: var(--type-caption); color: var(--color-danger); white-space: nowrap; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row" data-evidence-sample="default"><span class="label">默认</span><div class="field"><input class="input" type="text" placeholder="请输入"></div></div>
<div class="row" data-evidence-sample="with-label"><span class="label">带标签</span><div class="field"><span class="field-label">昵称</span><input class="input" type="text" placeholder="请输入昵称"></div></div>
<hr class="divider">
<div class="row" data-evidence-sample="error"><span class="label">错误</span><div class="field"><input class="input input-error" type="text" value="138000" placeholder="请输入手机号"><span class="helper">手机号格式不正确</span></div></div>
<div class="row" data-evidence-sample="disabled"><span class="label">禁用</span><div class="field"><input class="input" type="text" placeholder="已停用" disabled></div></div>
</body>
</html>
