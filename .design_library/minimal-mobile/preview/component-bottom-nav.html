<!DOCTYPE html>

<meta charset="UTF-8">
<title>BottomNav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-text); }
.row { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2); }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-muted); }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
/* @component-css-start */
.bnav { display: flex; flex: 1; min-width: 0; height: var(--size-tab-bar-height); background: var(--color-surface); border-top: 1px solid var(--color-border); }
.btab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); min-width: 0; color: var(--color-text-muted); text-decoration: none; cursor: pointer; transition: background var(--duration-fast) var(--easing-standard); }
.btab:hover { background: var(--lumen-state-hover); }
.btab.on { color: var(--color-primary); }
.bicon { position: relative; width: var(--size-icon-lg); height: var(--size-icon-lg); flex-shrink: 0; }
.ticn { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btxt { font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-body); line-height: var(--line-height-eyebrow); white-space: nowrap; }
.bbadge { position: absolute; top: calc(-1 * var(--space-1)); right: calc(-1 * var(--space-2)); min-width: var(--size-icon-sm); height: var(--size-icon-sm); padding: 0 var(--space-1); border-radius: var(--radius-full); background: var(--color-danger); color: var(--color-text-inverse); font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); line-height: var(--size-icon-sm); text-align: center; box-sizing: border-box; }
/* @component-css-end */
</style>
</head>
<body>
