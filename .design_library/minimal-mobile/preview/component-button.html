<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button · Lumen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-background); color: var(--color-text); font-family: var(--font-family-base); }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-2); }
.label { flex-shrink: 0; width: 92px; font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); border: none; cursor: pointer; border-radius: var(--radius-full); padding: 0 var(--space-5); font-family: var(--font-family-base); font-size: var(--font-size-body); font-weight: 500; white-space: nowrap; transition: background var(--duration-fast), opacity var(--duration-fast), filter var(--duration-fast); }
.btn:active { opacity: .85; }
.btn:disabled { cursor: not-allowed; color: var(--lumen-text-disabled); }
.btn-md { height: var(--size-button-height-md); min-width: var(--size-button-height-md); }
.btn-lg { height: var(--size-button-height-lg); min-width: var(--size-button-height-lg); }
.btn-primary { background: var(--color-primary); color: var(--color-primary-foreground); }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-primary:disabled { background: var(--color-surface-dim); }
.btn-secondary { background: var(--lumen-blue-50); color: var(--lumen-blue-700); }
.btn-secondary:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; color: var(--color-text); }
.btn-ghost:hover { background: var(--lumen-state-hover); }
.btn-block { flex: 1 1 auto; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">主要</span><button class="btn btn-md btn-primary" data-evidence-sample="primary-md">开始使用</button><button class="btn btn-md btn-primary" data-evidence-sample="primary-md" disabled>开始使用</button></div>
<div class="row"><span class="label">次要</span><button class="btn btn-md btn-secondary" data-evidence-sample="secondary-md">发现</button></div>
<div class="row"><span class="label">文字</span><button class="btn btn-md btn-ghost" data-evidence-sample="ghost-md">消息</button></div>
<hr class="divider">
<div class="row"><span class="label">全宽</span><button class="btn btn-lg btn-primary btn-block" data-evidence-sample="primary-lg-block">开始使用</button></div>
</body>
</html>
