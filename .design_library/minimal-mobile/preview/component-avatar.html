<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-text); }
.row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { flex: 0 0 92px; font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .08em; }
.divider { width: 100%; border: none; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; }
/* @component-css-start */
/* Component definitions — extracted to components.css */
.avatar { position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: var(--radius-full); background: var(--lumen-blue-50); color: var(--lumen-blue-700); font-weight: var(--font-weight-h4); line-height: 1; white-space: nowrap; }
.avatar-md { width: var(--size-avatar-md); height: var(--size-avatar-md); font-size: var(--font-size-h4); }
.avatar-lg { width: var(--size-avatar-lg); height: var(--size-avatar-lg); font-size: var(--font-size-h2); }
.avatar-dot { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: var(--radius-full); background: var(--color-success); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">列表头像</span><span class="avatar avatar-md" data-evidence-sample="md-image">林</span><span class="avatar avatar-md" data-evidence-sample="md-image">陈</span><span class="avatar avatar-md" data-evidence-sample="md-image">苏</span></div>
<hr class="divider">
<div class="row"><span class="label">资料回退</span><span class="avatar avatar-lg" data-evidence-sample="lg-initials">林</span></div>
<div class="row"><span class="label">在线状态</span><span class="avatar avatar-md" data-evidence-sample="md-online">林<span class="avatar-dot"></span></span><span class="avatar avatar-md" data-evidence-sample="md-online">苏<span class="avatar-dot"></span></span></div>
</body>
</html>
