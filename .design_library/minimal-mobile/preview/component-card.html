<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-text); }
.row { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-2); }
.label { flex-shrink: 0; width: 92px; font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); letter-spacing: 0.08em; color: var(--color-text-muted); }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-4) 0; }
/* @component-css-start */
.card { flex: 1; min-width: 0; max-width: 344px; overflow: hidden; background: var(--color-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); }
.card-pad { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.card-title { margin: 0; font: var(--type-h4); font-weight: var(--font-weight-h4); color: var(--color-text); }
.card-body { margin: 0; font: var(--type-body); color: var(--color-text-muted); overflow-wrap: break-word; }
.card-cover { aspect-ratio: 16 / 9; background: var(--color-surface-dim); }
.card-meta { display: flex; align-items: center; gap: var(--space-2); font: var(--type-caption); color: var(--color-text-muted); }
.card-avatar { flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: var(--size-avatar-md); height: var(--size-avatar-md); border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-primary-foreground); font-size: var(--font-size-caption); font-weight: var(--font-weight-h4); }
.card-meta-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-value { font: var(--type-h2); font-weight: var(--font-weight-h2); color: var(--color-text); }
.card-caption { font: var(--type-caption); color: var(--color-text-muted); }
.card-tap { cursor: pointer; transition: filter var(--duration-fast) var(--easing-standard); }
.card-tap:hover { filter: brightness(0.97); }
.card-tap:active { filter: brightness(0.94); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">基础卡片</span><div class="card"><div class="card-pad"><h3 class="card-title">开始使用</h3><p class="card-body">在首页浏览为你精选的内容，随时发现新灵感。</p></div></div></div>
<div class="row"><span class="label">数据卡片</span><div class="card"><div class="card-pad"><div class="card-value">12,480</div><div class="card-caption">消息</div></div></div></div>
<hr class="divider">
<div class="row"><span class="label">媒体卡片</span><div class="card"><div class="card-cover"></div><div class="card-pad"><h3 class="card-title">发现</h3><div class="card-meta"><span class="card-avatar">L</span><span class="card-meta-text">Lumen 官方 · 3 小时前</span></div></div></div></div>
<div class="row"><span class="label">可点按卡片</span><div class="card card-tap"><div class="card-pad"><h3 class="card-title">我的收藏</h3><p class="card-body">轻点查看已保存的内容。</p></div></div></div>
</body>
</html>
